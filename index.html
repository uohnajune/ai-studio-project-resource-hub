oup ROC-AUC and calibration; performance within 0.05 AUC across major subgroups or explicitly document gaps; at least three quantified disparity findings with confidence intervals.",data_link:"https://optn.transplant.hrsa.gov/data/view-data-reports/national-data/",sep:'Weeks 1–2 (Scoping): Define use cases ("Which patients are at highest risk?", "What factors drive longer waits?"); create problem framing doc.',oct:"Weeks 3–5 (Data Prep): Clean and merge datasets; handle missing values; feature engineering (wait time duration, medical urgency scores, regional indicators). Weeks 6–8 (Modeling): Build baseline models; evaluate ROC-AUC (classification) and Concordance index (survival models); compare simple vs. advanced models.",nov:"Weeks 9–10 (Evaluation & Insights): Interpret models using SHAP; identify key drivers (blood type mismatch delays, regional disparities); validate findings against domain knowledge. Weeks 11–12 (Deliverables): GitHub repo (clean, reproducible pipeline); Jupyter notebooks; business-focused insight report; model card (data, intended use, limitations); optional Streamlit dashboard.",bottleneck:"Complex survival analysis techniques, such as Cox Proportional Hazards or DeepSurv, are highly specialized statistical domains that fall outside the standard introductory machine learning curriculum, requiring students to rapidly adapt to time-to-event metrics.",recommendation:"Provide starter Colab/Jupyter notebooks (EDA; Cox PH with scikit-survival; evaluation with C-index, Brier, time-dependent AUC), fairness metric templates (subgroup AUC/calibration and disparity reporting), and a glossary of survival terms; clearly mark DeepSurv/competing-risks/causal analyses as stretch-only.",summary:"Complex survival analysis techniques fall outside standard introductory machine learning curricula, requiring students to quickly adapt to specialized time-to-event metrics. To support learning, teams should be provided with starter notebooks, fairness templates, and a survival terms glossary focused on baseline Cox proportional hazards models. Advanced methods like DeepSurv or causal analysis should be clearly designated as stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of modeling candidate survival and waiting-list outcomes under right-censoring constraints to optimize organ allocation insights. Identify stakeholders (OPTN, surgeons, ethics boards) and target users. Map operational workflows to support waitlist triage and policy evaluation using anonymized candidate rosters and diagnostic logs while preventing automated ranking risks.

2.  Ingest Data Sources: Securely ingest anonymized organ transplant candidate rosters, clinical diagnostic logs, donor matching metrics, and historical waitlist outcome tables. Establish robust data ingestion pipelines to handle heterogeneous medical inputs, verify schema consistency across source files, and structure tabular data for downstream preprocessing and analytical pipelines.

3.  Verify Outcome Records: Validate all historical waitlist outcome records across candidate datasets. Standardize key target categories by explicitly mapping candidate statuses to transplantation events, removal due to death or illness severity, or active waitlist status. Ensure data integrity before applying censoring transformations.

4.  Handle Right-Censoring: Identify and address right-censorship within the candidate dataset. Implement specific filtering and labeling procedures to ensure active waitlist candidates at the time of data export are properly coded as right-censored cases to prevent parameter estimation biases in survival models.

5.  Profile Clinical Features: Conduct exploratory feature profiling on candidate clinical indicators, including MELD scores, patient age, blood type, and panel reactive antibody levels. Identify correlation skews, distribution anomalies, and feature relationships to guide feature engineering and continuous variable scaling.

6.  Data Validation Rules: Establish strict programmatic data validation rules to clean incoming candidate records. Ensure clinical measurements, diagnostic lab values, and recorded waitlist durations fall within physiologically plausible ranges, flagging or imputing extreme outliers and corrupted clinical entries.

7.  Baseline Model Construction: Freeze a standard baseline logistic regression model predicting candidate survival at a fixed 1-year waitlist duration. Ignore right-censoring initially to establish a benchmark for predictive discrimination, setting baseline metrics before introducing complex survival modeling architectures.

8.  Survival Modeling Upgrade: Upgrade the core modeling pipeline from standard classification models to specialized time-to-event survival models. Implement models such as Cox Proportional Hazards or Random Survival Forests using lifelines or scikit-survival libraries to handle censored waitlist durations appropriately.

9.  Critical Evaluation Gate: Evaluate survival models using Harrell's Concordance Index (C-index) and Brier scores to measure discrimination power and calibration accuracy. Verify that time-dependent metric calculations appropriately account for right-censored patient data across key prediction timeframes before model sign-off.

10. SHAP Equity Audit: Perform post-hoc interpretability audits on survival prediction outputs using SHAP values. Identify global key drivers and evaluate feature importance across demographic subgroups to uncover potential systemic biases or clinical inequities across candidate populations.

11. Synthetic Stress-Testing: Stress-test trained survival models by evaluating predictions on synthetic, high-severity clinical scenarios. Verify that model-generated survival curves decay monotonically over time and respond logically to acute variations in clinical risk factors.

12. Model Tuning & Partitioning: Perform hyperparameter optimization, feature selection, and regularization tuning strictly within the designated training partition. Prevent baseline outcome leakage by isolating target metrics and validation sets completely during intermediate tuning iterations.

13. Out-of-Sample Validation: Evaluate candidate waitlist outcome predictions exactly once using the finalized model on an isolated, held-out validation partition. Compute final C-index, AUC, and calibration scores to benchmark overall model generalization on unseen patient data.

14. Deliverables & Documentation: Deliver a comprehensive, equity-focused transplant waitlist insight report detailing key drivers and policy implications. Package executable, fully reproducible survival analysis Jupyter notebooks alongside a detailed Model Card documenting data inputs, limitations, and operational scope boundaries.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of modeling candidate survival and waiting-list outcomes under right-censoring constraints to optimize organ allocation insights. Identify stakeholders (OPTN, surgeons, ethics boards) and target users. Map operational workflows to support waitlist triage and policy evaluation"},{num:2,title:"Ingest Data Sources",desc:"Securely ingest anonymized organ transplant candidate rosters, clinical diagnostic logs, donor matching metrics, and historical waitlist outcome tables. Establish robust data ingestion pipelines to handle heterogeneous medical inputs, verify schema consistency across source files, and structure tabu"},{num:3,title:"Verify Outcome Records",desc:"Validate all historical waitlist outcome records across candidate datasets. Standardize key target categories by explicitly mapping candidate statuses to transplantation events, removal due to death or illness severity, or active waitlist status. Ensure data integrity before applying censoring trans"},{num:4,title:"Handle Right-Censoring",desc:"Identify and address right-censorship within the candidate dataset. Implement specific filtering and labeling procedures to ensure active waitlist candidates at the time of data export are properly coded as right-censored cases to prevent parameter estimation biases in survival models."},{num:5,title:"Profile Clinical Features",desc:"Conduct exploratory feature profiling on candidate clinical indicators, including MELD scores, patient age, blood type, and panel reactive antibody levels. Identify correlation skews, distribution anomalies, and feature relationships to guide feature engineering and continuous variable scaling."},{num:6,title:"Data Validation Rules",desc:"Establish strict programmatic data validation rules to clean incoming candidate records. Ensure clinical measurements, diagnostic lab values, and recorded waitlist durations fall within physiologically plausible ranges, flagging or imputing extreme outliers and corrupted clinical entries."},{num:7,title:"Baseline Model Construction",desc:"Freeze a standard baseline logistic regression model predicting candidate survival at a fixed 1-year waitlist duration. Ignore right-censoring initially to establish a benchmark for predictive discrimination, setting baseline metrics before introducing complex survival modeling architectures."},{num:8,title:"Survival Modeling Upgrade",desc:"Upgrade the core modeling pipeline from standard classification models to specialized time-to-event survival models. Implement models such as Cox Proportional Hazards or Random Survival Forests using lifelines or scikit-survival libraries to handle censored waitlist durations appropriately."},{num:9,title:"Critical Evaluation Gate",desc:"Evaluate survival models using Harrell's Concordance Index (C-index) and Brier scores to measure discrimination power and calibration accuracy. Verify that time-dependent metric calculations appropriately account for right-censored patient data across key prediction timeframes before model sign-off."},{num:10,title:"SHAP Equity Audit",desc:"Perform post-hoc interpretability audits on survival prediction outputs using SHAP values. Identify global key drivers and evaluate feature importance across demographic subgroups to uncover potential systemic biases or clinical inequities across candidate populations."},{num:11,title:"Synthetic Stress-Testing",desc:"Stress-test trained survival models by evaluating predictions on synthetic, high-severity clinical scenarios. Verify that model-generated survival curves decay monotonically over time and respond logically to acute variations in clinical risk factors."},{num:12,title:"Model Tuning & Partitioning",desc:"Perform hyperparameter optimization, feature selection, and regularization tuning strictly within the designated training partition. Prevent baseline outcome leakage by isolating target metrics and validation sets completely during intermediate tuning iterations."},{num:13,title:"Out-of-Sample Validation",desc:"Evaluate candidate waitlist outcome predictions exactly once using the finalized model on an isolated, held-out validation partition. Compute final C-index, AUC, and calibration scores to benchmark overall model generalization on unseen patient data."},{num:14,title:"Deliverables & Documentation",desc:"Deliver a comprehensive, equity-focused transplant waitlist insight report detailing key drivers and policy implications. Package executable, fully reproducible survival analysis Jupyter notebooks alongside a detailed Model Card documenting data inputs, limitations, and operational scope boundaries."}]},{id:"1030",title:"AI-Driven Resource Allocation to Reduce Restrictive Practices",org:"Not stated in source submission",advisor:"Caroline Bell",ml_type:"Classification, Rec Sys, CV, DL, Transfer Learning",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Recommend proactive interventions to schools at high risk of seclusion incidents.",metrics:"Actionability Score, Precision-Recall.",data_link:"https://catalog.data.gov/dataset/civil-rights-data-collection-crdc",sep:'Feature Engineering for Solutions: Merge seclusion data with environmental factors (on-site behavior specialist, average teacher experience); create "Resource Gap" score for every school.',oct:"Prescriptive Modeling: Build a Random Forest or XGBoost model to rank environmental factors correlated with seclusion reduction; begin building a recommender system that matches school risk profiles with peer intervention strategies.",nov:'Outcome Simulation: Create "What-If" simulator (e.g., predicting seclusion risk drop if adding behavior-certified aide); build the Policy Recommendation Dashboard (schools ranked by risk with top 3 suggested interventions); evaluate model using Precision-Recall to avoid recommending expensive unnecessary interventions.',bottleneck:'Data cleaning/integration of CRDC with school resource datasets; engineering the "Resource Gap" feature; designing the peer-based recommender; implementing the What-If simulator and Policy Recommendation Dashboard; calibrating Precision-Recall thresholds and the Actionability Score.',recommendation:"Keep the LLM Intervention Drafter as an optional stretch. Focus first on the core pipeline (RF/XGBoost risk model, peer-based recommender, What-If simulator, Policy Recommendation Dashboard) and, if time remains, add the Cost-Benefit Analysis stretch.",summary:"Integrating Civil Rights Data Collection datasets and engineering custom resource gap features create significant data cleaning and calibration bottlenecks. To address this, teams should prioritize completing the core analytical pipeline, including the risk model, peer-based recommender, What-If simulator, and Policy Recommendation Dashboard. Complex generative elements like the LLM Intervention Drafter and Cost-Benefit Analysis should be kept strictly as optional stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of optimizing equitable public resource allocations to schools with historical civil rights deficits. Key stakeholders include school districts and civil rights officers, with grant directors as primary target users. Inputs comprise CRDC and regional funding datasets, generating ranked resource deficit priority indices. Scope focuses on predictive planning while mitigating risks of reinforcing historical funding inequities.
2.  Data Ingestion & Integration: Ingest the official Department of Education Civil Rights Data Collection (CRDC) school logs, local municipal funding spreadsheets, and detailed student demographic tables into a centralized processing workspace. Establish automated data pipelines to reliably ingest all source files while checking for complete file transfers, proper encoding formats, and initial schema structural integrity prior to downstream processing.
3.  Entity Resolution & Matching: Verify that National Center for Education Statistics (NCES) school identification numbers are accurately matched and joined cleanly across all multi-year federal and local spreadsheets. Resolve key formatting discrepancies, missing identifiers, and duplicate records to construct a unified relational master dataset that maintains historical continuity across varying reporting periods and distinct jurisdictional sources.
4.  Column Standardization & Normalization: Perform a comprehensive data audit across all dataset columns to ensure that diverse school-level resource indicators are fully standardized and mathematically normalized for fair cross-school comparison. Correct variations in reporting units, scale discrepancies, and accounting definitions across districts, enabling valid apples-to-apples evaluation of historical resource distributions and current programmatic equity needs.
5.  Exploratory Profiling & Outlier Detection: Profile key feature variables, such as student-to-teacher ratios, average counselor counts, and available extracurricular offerings, to uncover distribution shapes and identify high-variance outliers. Document extreme values, anomalous data distributions, and missing metrics across institutions to determine appropriate data transformations and prevent erroneous data points from skewing subsequent allocation algorithms.
6.  Data Validation & Integrity Assertions: Implement strict automated data validation assertions and integrity checks ensuring that critical variables, including total funding values and student enrollment numbers, contain strictly positive, non-zero entries. Flag and quarantine invalid data records, negative financial quantities, or missing values early in the processing pipeline to prevent mathematical errors in downstream recommendation engines.
7.  Baseline Allocator Development: Construct and freeze a rule-based baseline allocation model that distributes hypothetical funding and educational resources strictly as a linear function of overall student body size, intentionally ignoring civil rights metrics. This baseline serves as a controlled reference point for quantitatively measuring performance improvements and equity enhancements delivered by downstream algorithmic frameworks.
8.  Algorithmic System Upgrade: Upgrade the core allocation system by implementing a Multi-Attribute Utility Theory (MAUT) model or a collaborative-filtering neighborhood recommendation architecture. Design the algorithm to evaluate multidimensional deficit metrics, balance competing resource requirements across institutions, and match specific high-need schools with tailored intervention packages derived from peer profiles demonstrating successful outcomes.
9.  Subgroup Balance & Performance Evaluation: Rigorously evaluate recommendation system performance by running automated subgroup balance audits across demographic and regional cohorts. Verify that recommended schools align closely with target resource deficit profiles and operational needs, confirming that generated funding priorities effectively target documented gaps rather than arbitrary structural or administrative features of input datasets.
10. Critical Equity Audit Gate: Programmatically verify through strict statistical testing that allocation recommendations do not systematically under-resource schools serving high proportions of protected student groups. Establish mandatory pass-fail thresholds to ensure algorithmic fairness, bias mitigation, and equitable outcome distributions before advancing the model past this critical programmatic evaluation checkpoint.
11. Scope Control & Stretch Goal Isolation: Verify that advanced generative or conversational Large Language Model (LLM) grant-drafting components are maintained strictly as optional stretch goals. Ensure these generative modules are only developed, integrated, and tested after the primary resource allocation engine, scoring algorithms, and core data processing pipelines are fully stabilized, `,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of optimizing equitable public resource allocations to schools with historical civil rights deficits. Key stakeholders include school districts and civil rights officers, with grant directors as primary target users. Inputs comprise CRDC and regional funding datasets, generat"},{num:2,title:"Data Ingestion & Integration",desc:"Ingest the official Department of Education Civil Rights Data Collection (CRDC) school logs, local municipal funding spreadsheets, and detailed student demographic tables into a centralized processing workspace. Establish automated data pipelines to reliably ingest all source files while checking fo"},{num:3,title:"Entity Resolution & Matching",desc:"Verify that National Center for Education Statistics (NCES) school identification numbers are accurately matched and joined cleanly across all multi-year federal and local spreadsheets. Resolve key formatting discrepancies, missing identifiers, and duplicate records to construct a unified relational"},{num:4,title:"Column Standardization & Normalization",desc:"Perform a comprehensive data audit across all dataset columns to ensure that diverse school-level resource indicators are fully standardized and mathematically normalized for fair cross-school comparison. Correct variations in reporting units, scale discrepancies, and accounting definitions across d"},{num:5,title:"Exploratory Profiling & Outlier Detection",desc:"Profile key feature variables, such as student-to-teacher ratios, average counselor counts, and available extracurricular offerings, to uncover distribution shapes and identify high-variance outliers. Document extreme values, anomalous data distributions, and missing metrics across institutions to d"},{num:6,title:"Data Validation & Integrity Assertions",desc:"Implement strict automated data validation assertions and integrity checks ensuring that critical variables, including total funding values and student enrollment numbers, contain strictly positive, non-zero entries. Flag and quarantine invalid data records, negative financial quantities, or missing"},{num:7,title:"Baseline Allocator Development",desc:"Construct and freeze a rule-based baseline allocation model that distributes hypothetical funding and educational resources strictly as a linear function of overall student body size, intentionally ignoring civil rights metrics. This baseline serves as a controlled reference point for quantitatively"},{num:8,title:"Algorithmic System Upgrade",desc:"Upgrade the core allocation system by implementing a Multi-Attribute Utility Theory (MAUT) model or a collaborative-filtering neighborhood recommendation architecture. Design the algorithm to evaluate multidimensional deficit metrics, balance competing resource requirements across institutions, and "},{num:9,title:"Subgroup Balance & Performance Evaluation",desc:"Rigorously evaluate recommendation system performance by running automated subgroup balance audits across demographic and regional cohorts. Verify that recommended schools align closely with target resource deficit profiles and operational needs, confirming that generated funding priorities effectiv"},{num:10,title:"Critical Equity Audit Gate",desc:"Programmatically verify through strict statistical testing that allocation recommendations do not systematically under-resource schools serving high proportions of protected student groups. Establish mandatory pass-fail thresholds to ensure algorithmic fairness, bias mitigation, and equitable outcom"},{num:11,title:"Scope Control & Stretch Goal Isolation",desc:"Verify that advanced generative or conversational Large Language Model (LLM) grant-drafting components are maintained strictly as optional stretch goals. Ensure these generative modules are only developed, integrated, and tested after the primary resource allocation engine, scoring algorithms, and c"},{num:12,title:"Model Tuning & Leakage Prevention",desc:"Perform hyperparameter tuning, feature weight adjustments, and similarity threshold optimization strictly within isolated training cross-validation folds. Enforce rigorous data separation protocols to completely prevent data leakage from out-of-sample validation partitions, ensuring that model param"},{num:13,title:"Out-of-Sample Final Validation",desc:"Execute the finalized resource recommendation model exactly once against the frozen, held-out out-of-sample school validation partition. Measure operational impact, equity metrics, and allocation accuracy against pre-established benchmark criteria to obtain an unbiased, definitive evaluation of real"},{num:14,title:"Deliverables & Reporting Package",desc:"Package and deliver the complete operational software solution, featuring the prioritized school funding allocator engine, an interactive Streamlit-based county resource mapping application, and a comprehensive equity validation report. Include end-to-end documentation, model maintenance guidelines,"}]},{id:"1031",title:"Best-Shot: Job Search Intelligence Assistant",org:"Other",advisor:"Aleksandar Cakic",ml_type:"Classification, Regression, Rec Sys, NLP, DL, LLMs",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Rank LinkedIn jobs by competitiveness and flag ghost postings via conversational assistant.",metrics:"Accuracy, precision, recall, F1, beat baseline on combined fit score.",data_link:"Kaggle LinkedIn postings (2023–2024) and O*NET",sep:"Ingest and join the public Kaggle LinkedIn job postings (2023–2024) with O*NET occupational/skills data; fix messy fields (locations, missing salaries, duplicates/reposts); perform thorough exploratory data analysis (EDA); deliver a clean, analysis-ready dataset and an exploration notebook.",oct:"Train and compare supervised ML models (e.g., tree ensembles, gradient boosting, lightweight neural networks) to rank job competitiveness and detect ghost/low-quality postings; evaluate and document results; conduct subgroup fairness checks across occupational categories.",nov:"Build the conversational assistant around the trained models using the coaching knowledge base; produce a working notebook prototype (no web UI required) that explains results in a coach’s voice; complete final model evaluation and error analysis; assemble a polished GitHub repo and a presentable demo.",bottleneck:"The dataset consists of messy LinkedIn job postings requiring significant cleaning, and formal documentation does not currently exist. Combining classic ML ranking with an LLM conversational UI on uncleaned data can overwhelm the students' preprocessing capacities.",recommendation:"The Challenge Advisor must create and share a formal data dictionary prior to the kickoff. Furthermore, providing a partially cleaned sample of the dataset will accelerate the team past early data friction and directly into the core ranking and modeling phases.",summary:"Working with uncleaned LinkedIn job postings without formal documentation risks overwhelming students with data preprocessing before reaching core modeling. To prevent this friction, the Challenge Advisor should provide a formal data dictionary and a partially cleaned dataset sample prior to kickoff, allowing the team to quickly transition into developing the ranking models and conversational UI.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of semantically matching applicant resumes to online job postings while filtering out non-actionable "ghost listings" for Aleksandar Cakic. Identify stakeholders, target users, operational workflows, and candidate screening decisions. Inputs include raw resumes, scraped LinkedIn descriptions, and O\\*NET dictionaries, yielding match scores and listing viability classifications while maintaining strict non-automated application scope boundaries.
2.  Data Ingestion & Setup: Ingest raw candidate resumes, unstructured web-scraped LinkedIn job postings, and O\\*NET career taxonomy reference dictionaries into the unified development workspace. Ensure all incoming raw files and relational databases are loaded properly with valid character encodings, schemas, and structural integrity checks ready for downstream cleaning and text normalization tasks.
3.  Text Normalization & Preprocessing: Clean and normalize all ingested job postings by applying regular expressions to remove persistent HTML tags, formatting noise, Unicode artifacts, and corporate boilerplate language. Standardize text structure to ensure reliable down-stream tokenization, feature engineering, and high-quality semantic vector embedding generation across all scraped listings.
4.  Resume Schema Extraction: Extract structured user skills, verified years of professional experience, and target career roles from raw resume documents. Parse and map these fields systematically into a standardized, validated JSON schema to support automated downstream candidate-to-job matching and detailed feature alignment.
5.  O*NET Taxonomy Crosswalk: Crosswalk all incoming job titles and unstructured descriptions to standardized O*NET occupation codes. Establish a robust, clean taxonomy mapping across the dataset by Week 3 to ensure standardized occupational alignment and consistent skill categorization throughout the project pipeline.
6.  Data Validation Assertions: Write comprehensive data validation assertions and automated unit tests to ensure extracted job metadata conforms to realistic limits. Verify that numerical features, including required years of experience, compensation packages, and salary ranges, remain strictly within logical, predefined domain boundaries across the entire dataset.
7.  Baseline Keyword Matching: Freeze an initial keyword-matching baseline model that calculates simple resume-to-job overlap scores based on shared skill counts. Use this initial deterministic model to benchmark performance before implementing advanced deep-learning semantic representations and transformer-based sentence encoders.
8.  Semantic Matcher Upgrade: Upgrade the system by training bi-directional semantic similarity matchers using pre-trained sentence transformer embeddings, such as MPNet. Capture subtle contextual relationships between candidate profiles and job descriptions that simple keyword-matching approaches fail to detect.
9.  Gold-Standard Validation: Validate recommendation outputs against a manually annotated, gold-standard validation dataset containing 200 ground-truth resume-job relevance labels. Ensure ground-truth annotations accurately capture real-world candidate fit, skill alignment, and recruiter screening criteria across various industries.
10. Evaluation Metric Calculation: Evaluate recommendation quality using Normalized Discounted Cumulative Gain (NDCG) and Mean Reciprocal Rank (MRR) metrics. Systematically measure ranking precision, top-k relevance accuracy, and candidate alignment against established industry baseline standards.
11. 🛑 CRITICAL DATA GATE - REFUSAL BOUNDARY GATE: Implement an automated quality gate verifying that the matching engine correctly identifies, flags, or refuses scraped "ghost postings" and job descriptions lacking actionable requirements, preventing unviable listings from reaching job seekers.
12. Hyperparameter & Threshold Tuning: Tune embedding match thresholds, similarity scoring parameters, and model hyperparameter layers strictly within the designated validation partition. Prevent data leakage and ensure model optimizations generalize effectively to unseen candidate testing sets.
13. Final Out-of-Sample Evaluation: Evaluate overall resume-job matching accuracy and model performance exactly once on the frozen, out-of-sample candidate validation partition, ensuring unbiased statistical reporting for final model deployment.
14. System Deliverables & Reporting: Deliver a fully functional interactive semantic job matcher dashboard, a runnable embedding pipeline script, and a comprehensive technical report detailing recommendation performance, architecture decisions, and evaluation metrics.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:'Define the problem of semantically matching applicant resumes to online job postings while filtering out non-actionable "ghost listings" for Aleksandar Cakic. Identify stakeholders, target users, operational workflows, and candidate screening decisions. Inputs include raw resumes, scraped LinkedIn d'},{num:2,title:"Data Ingestion & Setup",desc:"Ingest raw candidate resumes, unstructured web-scraped LinkedIn job postings, and O\\*NET career taxonomy reference dictionaries into the unified development workspace. Ensure all incoming raw files and relational databases are loaded properly with valid character encodings, schemas, and structural i"},{num:3,title:"Text Normalization & Preprocessing",desc:"Clean and normalize all ingested job postings by applying regular expressions to remove persistent HTML tags, formatting noise, Unicode artifacts, and corporate boilerplate language. Standardize text structure to ensure reliable down-stream tokenization, feature engineering, and high-quality semanti"},{num:4,title:"Resume Schema Extraction",desc:"Extract structured user skills, verified years of professional experience, and target career roles from raw resume documents. Parse and map these fields systematically into a standardized, validated JSON schema to support automated downstream candidate-to-job matching and detailed feature alignment."},{num:5,title:"O*NET Taxonomy Crosswalk",desc:"Crosswalk all incoming job titles and unstructured descriptions to standardized O*NET occupation codes. Establish a robust, clean taxonomy mapping across the dataset by Week 3 to ensure standardized occupational alignment and consistent skill categorization throughout the project pipeline."},{num:6,title:"Data Validation Assertions",desc:"Write comprehensive data validation assertions and automated unit tests to ensure extracted job metadata conforms to realistic limits. Verify that numerical features, including required years of experience, compensation packages, and salary ranges, remain strictly within logical, predefined domain b"},{num:7,title:"Baseline Keyword Matching",desc:"Freeze an initial keyword-matching baseline model that calculates simple resume-to-job overlap scores based on shared skill counts. Use this initial deterministic model to benchmark performance before implementing advanced deep-learning semantic representations and transformer-based sentence encoder"},{num:8,title:"Semantic Matcher Upgrade",desc:"Upgrade the system by training bi-directional semantic similarity matchers using pre-trained sentence transformer embeddings, such as MPNet. Capture subtle contextual relationships between candidate profiles and job descriptions that simple keyword-matching approaches fail to detect."},{num:9,title:"Gold-Standard Validation",desc:"Validate recommendation outputs against a manually annotated, gold-standard validation dataset containing 200 ground-truth resume-job relevance labels. Ensure ground-truth annotations accurately capture real-world candidate fit, skill alignment, and recruiter screening criteria across various indust"},{num:10,title:"Evaluation Metric Calculation",desc:"Evaluate recommendation quality using Normalized Discounted Cumulative Gain (NDCG) and Mean Reciprocal Rank (MRR) metrics. Systematically measure ranking precision, top-k relevance accuracy, and candidate alignment against established industry baseline standards."},{num:11,title:"🛑 CRITICAL DATA GATE - REFUSAL BOUNDARY GATE",desc:'Implement an automated quality gate verifying that the matching engine correctly identifies, flags, or refuses scraped "ghost postings" and job descriptions lacking actionable requirements, preventing unviable listings from reaching job seekers.'},{num:12,title:"Hyperparameter & Threshold Tuning",desc:"Tune embedding match thresholds, similarity scoring parameters, and model hyperparameter layers strictly within the designated validation partition. Prevent data leakage and ensure model optimizations generalize effectively to unseen candidate testing sets."},{num:13,title:"Final Out-of-Sample Evaluation",desc:"Evaluate overall resume-job matching accuracy and model performance exactly once on the frozen, out-of-sample candidate validation partition, ensuring unbiased statistical reporting for final model deployment."},{num:14,title:"System Deliverables & Reporting",desc:"Deliver a fully functional interactive semantic job matcher dashboard, a runnable embedding pipeline script, and a comprehensive technical report detailing recommendation performance, architecture decisions, and evaluation metrics."}]},{id:"1032",title:"Discussion Intelligence Toolkit",org:"Ind. / Tom Mathews",advisor:"Tom Mathews",ml_type:"Classification, Regression, Clustering, NLP, DL",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Build pip-installable Python tool to parse online threads into structured insight reports.",metrics:"Discourse-act: macro F1 (plus per-class F1 and confusion matrix). Quality scoring: MAE and Spearman correlation. Clustering: silhouette score plus sampled cluster-coherence review. Retrieval: accuracy/recall on hand-written thread questions. LLM synthesis: claim coverage, evidence-link accuracy, and hallucination rate measured against a small human-reviewed held-out set.",data_link:"Pushshift Reddit dumps; ConvoKit datasets (Coarse Discourse, CGA-CMV)",sep:"Set up data ingestion for discussion corpora (e.g., ConvoKit CGA-CMV threads); conduct EDA on discourse structures; implement simple baselines (majority and TF‑IDF + logistic regression) and an initial evaluation harness; then train baseline transformer classifiers (fine-tuned DistilBERT or similar) for discourse-act tagging (question, answer, agreement, disagreement, announcement).",oct:"Implement regression models for argument quality scoring using a fine-tuned regression head; execute embedding-based clustering to map discussion sub-themes and perspective discovery.",nov:"Stand up a retrieval-augmented generation (RAG) synthesis module to generate structured summary reports linking key claims back to source utterances; package the entire pipeline into a clean, pip-installable Python library with pluggable connectors.",bottleneck:"Packaging an end-to-end ML architecture (NLP classification, embedding clustering, and RAG synthesis) into a formal, pip-installable Python library introduces software engineering paradigms—like dependency management and package structuring—that are non-standard for data science curriculums.",recommendation:"Provide a starter repo scaffold using uv with pyproject.toml and uv.lock, a src/ package layout with __init__.py, basic tests/, and example connectors. Include an evaluation-harness template and a simple retrieval + LLM summarization template to reduce engineering overhead for students.",summary:"Packaging an end-to-end ML pipeline into a formal, pip-installable Python package introduces non-standard software engineering overhead, such as complex dependency management and project structuring. To lower this barrier, advisors should provide a pre-configured starter repository complete with package scaffolding, tests, and standard templates for evaluation and RAG synthesis. This support allows students to focus on core data science tasks without being overwhelmed by software design patterns.",checklist_raw:`1.  Understand the Business & Problem: Define the core task of parsing online discussion threads into structured insight reports using NLP and RAG. Identify target users, decision workflows, risks, and learning objectives. Select metrics like macro F1, MAE, silhouette score, and claim coverage. Inspect project\\_definition.md and project\\_metadata.json to ensure alignment.

2.  Version & Verify Assets: Inventory datasets (Pushshift Reddit, ConvoKit CGA-CMV), APIs, schemas, credentials, and starter scaffolds (pyproject.toml). Record versions, licenses, authority, and hashes. Confirm file accessibility and set up preflight checks with fallbacks. Inspect source\\_inventory.csv to verify that every asset has documented ownership and validation records.

3.  Acquire, Sample, & Profile Data: Define the unit of analysis, features, IDs, and thread structure across discussion corpora. Establish a reproducible sampling strategy if data exceeds memory or runtime limits. Prevent data leakage during filtering or aggregation. Freeze raw snapshots and inspect loading scripts to confirm mapping clarity.

4.  Perform Exploratory Data Analysis (EDA): Inspect discussion structure, thread depth, text length, missingness, duplicate records, and parsing artifacts. Visualize key distributions and document data-quality risks. Inspect EDA notebooks and visual outputs to establish actionable cleaning, chunking, and modeling strategies before initiating downstream processing.

5.  Clean, Parse, & Normalize Data: Implement deterministic text parsing and cleaning to preserve stable thread IDs and provenance. Normalize formatting artifacts, address missing values, and handle domain-specific boundary cases. Manually audit representative output chunks. Freeze the processed corpus and inspect code\\_approach.md and processed\\_chunks.json for validation diagnostics.

6.  Design Annotation & Gold Benchmark: Define label taxonomies for discourse-act tagging, argument quality scoring, and RAG synthesis. Draft annotation guidelines featuring boundary cases and pilot testing. Measure inter-annotator agreement and audit class balance. Freeze isolated development and test benchmarks. Inspect ground\\_truth\\_qa.json and annotation guidelines to verify gold label integrity.

7.  Build Transparent Baseline: Implement simple baseline models (majority class, TF-IDF + Logistic Regression) alongside an initial evaluation harness for discourse-act tagging. Train solely on development splits and evaluate using macro F1 and confusion matrices. Inspect code\\_approach.md and run\\_summary.json to ensure reproducible floor benchmarks before adding complex architectures.

8.  Upgrade Core Methods: Incorporate fine-tuned transformer classifiers, regression heads for argument quality, and embedding-based clustering to address baseline errors. Maintain frozen data splits and evaluate uplift using MAE, Spearman correlation, and silhouette scores. Reject unnecessary complexity. Inspect advanced modeling scripts to justify performance gains over simpler baselines.

9.  Implement RAG & Retrieval Gates: Deploy a RAG module to generate structured summary reports linked to source utterances. Evaluate retrieval recall on thread queries and LLM synthesis on claim coverage, evidence accuracy, and hallucination rates. Inspect evaluation reports to ensure human-reviewed retrieval benchmarks and grounded citations are enforced.

10. Audit & Vet End-to-End System: Trace summary outputs back to raw source utterances and categorize failures across parsing, classification, clustering, and generation stages. Test system resilience against malformed inputs, API timeouts, and rate limits. Inspect code\\_approach.md and error logs to confirm proper error attribution and mitigation protocols.

11. Tune Development Data & Final Evaluation: Optimize prompts, retrieval depth, and hyperparameters strictly within the development set. Freeze the final pipeline before running a single evaluation pass on the untouched test benchmark. Inspect the final results report to verify that all reported metrics, confidence bounds, and predictions are fully reproducible.

12. Evaluate Stretch Goals: Implement optional extensions (Hacker News, Discord exports, podcast transcripts) only after the primary pipeline is verified. Measure performance, latency, cost, and failure modes against the frozen baseline. Inspect project\\_definition.md and stretch implementation scripts to confirm that added complexity provides clear, measured value.

13. Package for Reproducibility: Build a clean, pip-installable Python package using uv and pyproject.toml. Document environment configs, data manifests, failure taxonomies, and model limitations. Inspect validation\\_report.md and run\\_summary.json to ensure external reviewers can fully reproduce the end-to-end pipeline and verify all reported outcomes.`,gates:[{num:1,title:"Understand the Business & Problem",desc:"Define the core task of parsing online discussion threads into structured insight reports using NLP and RAG. Identify target users, decision workflows, risks, and learning objectives. Select metrics like macro F1, MAE, silhouette score, and claim coverage. Inspect project\\_definition.md and project\\"},{num:2,title:"Version & Verify Assets",desc:"Inventory datasets (Pushshift Reddit, ConvoKit CGA-CMV), APIs, schemas, credentials, and starter scaffolds (pyproject.toml). Record versions, licenses, authority, and hashes. Confirm file accessibility and set up preflight checks with fallbacks. Inspect source\\_inventory.csv to verify that every ass"},{num:3,title:"Acquire, Sample, & Profile Data",desc:"Define the unit of analysis, features, IDs, and thread structure across discussion corpora. Establish a reproducible sampling strategy if data exceeds memory or runtime limits. Prevent data leakage during filtering or aggregation. Freeze raw snapshots and inspect loading scripts to confirm mapping c"},{num:4,title:"Perform Exploratory Data Analysis (EDA)",desc:"Inspect discussion structure, thread depth, text length, missingness, duplicate records, and parsing artifacts. Visualize key distributions and document data-quality risks. Inspect EDA notebooks and visual outputs to establish actionable cleaning, chunking, and modeling strategies before initiating "},{num:5,title:"Clean, Parse, & Normalize Data",desc:"Implement deterministic text parsing and cleaning to preserve stable thread IDs and provenance. Normalize formatting artifacts, address missing values, and handle domain-specific boundary cases. Manually audit representative output chunks. Freeze the processed corpus and inspect code\\_approach.md an"},{num:6,title:"Design Annotation & Gold Benchmark",desc:"Define label taxonomies for discourse-act tagging, argument quality scoring, and RAG synthesis. Draft annotation guidelines featuring boundary cases and pilot testing. Measure inter-annotator agreement and audit class balance. Freeze isolated development and test benchmarks. Inspect ground\\_truth\\_q"},{num:7,title:"Build Transparent Baseline",desc:"Implement simple baseline models (majority class, TF-IDF + Logistic Regression) alongside an initial evaluation harness for discourse-act tagging. Train solely on development splits and evaluate using macro F1 and confusion matrices. Inspect code\\_approach.md and run\\_summary.json to ensure reproduc"},{num:8,title:"Upgrade Core Methods",desc:"Incorporate fine-tuned transformer classifiers, regression heads for argument quality, and embedding-based clustering to address baseline errors. Maintain frozen data splits and evaluate uplift using MAE, Spearman correlation, and silhouette scores. Reject unnecessary complexity. Inspect advanced mo"},{num:9,title:"Implement RAG & Retrieval Gates",desc:"Deploy a RAG module to generate structured summary reports linked to source utterances. Evaluate retrieval recall on thread queries and LLM synthesis on claim coverage, evidence accuracy, and hallucination rates. Inspect evaluation reports to ensure human-reviewed retrieval benchmarks and grounded c"},{num:10,title:"Audit & Vet End-to-End System",desc:"Trace summary outputs back to raw source utterances and categorize failures across parsing, classification, clustering, and generation stages. Test system resilience against malformed inputs, API timeouts, and rate limits. Inspect code\\_approach.md and error logs to confirm proper error attribution "},{num:11,title:"Tune Development Data & Final Evaluation",desc:"Optimize prompts, retrieval depth, and hyperparameters strictly within the development set. Freeze the final pipeline before running a single evaluation pass on the untouched test benchmark. Inspect the final results report to verify that all reported metrics, confidence bounds, and predictions are "},{num:12,title:"Evaluate Stretch Goals",desc:"Implement optional extensions (Hacker News, Discord exports, podcast transcripts) only after the primary pipeline is verified. Measure performance, latency, cost, and failure modes against the frozen baseline. Inspect project\\_definition.md and stretch implementation scripts to confirm that added co"},{num:13,title:"Package for Reproducibility",desc:"Build a clean, pip-installable Python package using uv and pyproject.toml. Document environment configs, data manifests, failure taxonomies, and model limitations. Inspect validation\\_report.md and run\\_summary.json to ensure external reviewers can fully reproduce the end-to-end pipeline and verify "}]},{id:"1035",title:"Multi-Document Deal Comparison & Consistency Agent",org:"PIMCO",advisor:"Simon Fan",ml_type:"Agentic AI, RAG, LLMs",evaluation:"Minor edits needed",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Identify inconsistencies between multiple document vintages using separate vector stores.",metrics:"Qualitative evaluation criteria: correctness of per-dimension classification (Same / Different / Missing / Conflicting) and clarity of materiality rationales (Critical / Notable / Minor); usefulness and readability of visual diff summaries; completeness and citation support in the auto-generated PDF report.",data_link:"SEC EDGAR",sep:"Standardize semantic chunking protocols, maintain document identity per chunk, set up parallel FAISS vector indexes for each document vintage (e.g., Series 2024 vs. Series 2025 prospectuses), and create a YAML-defined list of comparison dimensions: collateral, credit enhancement, waterfall, servicer, legal terms, risk factors.",oct:"Build comparative reasoning LLM orchestration that simultaneously retrieves relevant chunks from both document vector stores per YAML dimension and outputs per-dimension classifications (Same / Different / Missing / Conflicting) with plain-English explanations and materiality scoring (Critical / Notable / Minor).",nov:"Implement an interactive comparison dashboard displaying side-by-side visual diffs and per-dimension tables, materiality-scored summaries, and an exportable auto-generated PDF report containing side-by-side tables per dimension, a narrative summary, and citations to the relevant excerpts from both documents.",bottleneck:"Synchronous retrieval across multiple distinct FAISS vector stores to compare document vintages requires advanced handling of indexing and embedding spaces. Inconsistencies in chunking strategies between the documents will lead to misaligned comparisons and hallucinated differences.",recommendation:"Advise students to meticulously standardize their semantic chunking parameters across both documents before querying, ensuring the LLM receives perfectly parallel context windows for accurate materiality scoring.",summary:"Synchronous retrieval across distinct FAISS vector stores can lead to misaligned comparisons and hallucinated differences if document chunking strategies are inconsistent. To prevent these errors when comparing document vintages, teams must meticulously standardize their semantic chunking parameters across all documents before querying. This ensures the LLM receives perfectly parallel context windows, enabling accurate comparative analysis and materiality scoring.",checklist_raw:`1.  Understand the business and project problem — Define the problem of identifying inconsistencies across SEC EDGAR document vintages (e.g., Series 2024 vs. 2025). Translate business needs into a RAG agent using separate vector stores to retrieve evidence. Define outputs like classifications, materiality scores, visual diffs, and PDF reports. Select task-aligned success metrics and establish clear student learning objectives.

2.  Version and verify the environment, sources, and assets — Catalog SEC EDGAR documents, YAML comparison schemas, APIs, credentials, and compute resources. Record exact filenames, versions, hashes, licenses, and access paths. Separate operational data from evaluation labels. Lock Python, library, and runtime environments with explicit preflight checks to guarantee asset accountability.

3.  Acquire, sample, and profile the data — Define the analysis unit, target features, and document metadata for SEC EDGAR prospectuses. Implement a reproducible sampling strategy if data exceeds memory or API limits. Prevent data leakage during filtering or aggregation, and freeze a raw data snapshot before processing to maintain pipeline provenance.

4.  Perform exploratory data analysis (EDA) — Examine SEC EDGAR document structures, missing values, duplicates, and text length distributions. Identify potential extraction artifacts, page-layout anomalies, and formatting issues. Document visual patterns and risk factors to directly inform downstream cleaning, parsing, and chunking strategies without making unsubstantiated causal claims.

5.  Clean, parse, normalize, and validate the data — Implement deterministic parsing to clean text while retaining structural metadata and stable section IDs. Meticulously standardize semantic chunking parameters across all document vintages to avoid misaligned comparisons. Audit sample outputs and freeze the validated text corpus once data diagnostic checks pass.

6.  Design annotation and build the gold benchmark — Define comparison taxonomies (Same, Different, Missing, Conflicting) and evidence guidelines for human-reviewed evaluation sets. Create clear annotation rules, pilot the rubric, and measure agreement. Freeze isolated development and test benchmarks before model tuning to ensure unbiased evaluation.

7.  Build the transparent baseline — Construct a simple lexical or semantic retrieval baseline using parallel local FAISS indexes and a lightweight embedding model. Fit preprocessing strictly on training data and measure baseline performance against the gold benchmark to establish a clear quantitative floor for complex methods.

8.  Upgrade the core method only after the baseline — Introduce advanced LLM orchestration for comparative reasoning to resolve specific baseline error patterns. Keep data splits, labels, and metrics frozen. Evaluate cost, latency, and performance uplift against the baseline, rejecting added architectural complexity that yields no measurable improvement.

9.  Add project-specific advanced gates — Implement rigorous retrieval evaluation measuring Hit@K, Recall@K, and Precision@K alongside groundedness and generation quality checks. Ensure parallel context windows across vintages to enable reliable materiality scoring and structured comparison reporting.

10. Validate, audit, and vet the end-to-end system — Trace generated classifications, materiality scores, and visual diffs directly back to source document chunks. Categorize pipeline failures into parsing, retrieval, or generation errors. Test system resilience against API timeouts and edge cases while enforcing human review for critical outputs.

11. Tune only on development data and run the final evaluation once — Optimize chunk sizes, retrieval depth, and prompts strictly on development splits. Lock the final pipeline configuration before executing a single evaluation pass against the untouched test benchmark, ensuring all reported metrics are fully reproducible.

12. Attempt stretch or agentic extensions only after the core works — Gate complex extensions, such as multi-vintage comparisons or interactive dashboards, until the non-agentic RAG baseline is validated. Compare agentic extensions against the frozen core to evaluate cost, latency, and benefit tradeoffs while maintaining a fallback path.

13. Close with reproducibility and responsible reporting — Archive data manifests, annotation schemas, code scripts, prompts, and environment parameters. Document failure modes, deployment readiness, and operational limitations. Package final deliverables, including PDF generation scripts and dashboard code, ensuring third-party reproducibility from scratch.`,gates:[{num:1,title:"Understand the business and project problem — Define the problem of identifying inconsistencies across SEC EDGAR documen",desc:""},{num:2,title:"Version and verify the environment, sources, and assets — Catalog SEC EDGAR documents, YAML comparison schemas, APIs, cr",desc:""},{num:3,title:"Acquire, sample, and profile the data — Define the analysis unit, target features, and document metadata for SEC EDGAR p",desc:""},{num:4,title:"Perform exploratory data analysis (EDA) — Examine SEC EDGAR document structures, missing values, duplicates, and text le",desc:""},{num:5,title:"Clean, parse, normalize, and validate the data — Implement deterministic parsing to clean text while retaining structura",desc:""},{num:6,title:"Design annotation and build the gold benchmark — Define comparison taxonomies (Same, Different, Missing, Conflicting) an",desc:""},{num:7,title:"Build the transparent baseline — Construct a simple lexical or semantic retrieval baseline using parallel local FAISS in",desc:""},{num:8,title:"Upgrade the core method only after the baseline — Introduce advanced LLM orchestration for comparative reasoning to reso",desc:""},{num:9,title:"Add project-specific advanced gates — Implement rigorous retrieval evaluation measuring Hit@K, Recall@K, and Precision@K",desc:""},{num:10,title:"Validate, audit, and vet the end-to-end system — Trace generated classifications, materiality scores, and visual diffs d",desc:""},{num:11,title:"Tune only on development data and run the final evaluation once — Optimize chunk sizes, retrieval depth, and prompts str",desc:""},{num:12,title:"Attempt stretch or agentic extensions only after the core works — Gate complex extensions, such as multi-vintage compari",desc:""},{num:13,title:"Close with reproducibility and responsible reporting — Archive data manifests, annotation schemas, code scripts, prompts",desc:""}]},{id:"1036",title:"Sales Forecasting and Customer Segmentation for E-commerce Growth",org:"Other",advisor:"Deepti Bahel",ml_type:"Classification, Regression, Clustering, Rec Sys, Time Series",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Time Series",objective:"Forecast sales/demand and segment customers using Shopify transaction data.",metrics:"Forecasting: MAPE < 15% on a held-out period; report RMSE; assess directional accuracy; compare against naive last-week/last-year baselines. Segmentation: Silhouette score > 0.4 plus clear business interpretability and 2–3 actionable strategies per segment.",data_link:"https://www.kaggle.com/datasets/aliiihussain/shopify-sales-dataset-for-ml-and-eda",sep:"Data Exploration & Preprocessing: Conduct EDA on sales trends across time, geography, and product lines; handle missing values/outliers; engineer time-based features (seasonality, day-of-week) and RFM features (Recency, Frequency, Monetary); produce a shared cleaned feature dictionary.",oct:"Modeling: Forecasting track implements baseline moving averages → ARIMA/SARIMA → Prophet → optional LSTM; Segmentation track implements RFM-based K-Means clustering evaluated via silhouette scores and business interpretability.",nov:'Evaluation, Iteration & Integration: Formal evaluation (forecasting MAPE <15%, segmentation silhouette >0.4); profile and name actionable customer segments (e.g., "High-Value Loyalists"); build an integrated Streamlit/Gradio dashboard.',bottleneck:"Key risks: time-based train/validation/test splits and leakage prevention; limited per-product history; ARIMA/Prophet parameter tuning and holiday/seasonality handling; ensuring segmentation interpretability/actionability beyond silhouette; integrating a simple Streamlit/Gradio app; Git/GitHub workflow hygiene.",recommendation:"Maintain core scope: EDA/cleaning with time-based and RFM features; forecasting with baselines → ARIMA/SARIMA/Prophet; RFM/K-Means segmentation; formal evaluation and a basic Streamlit or Gradio dashboard. Emphasize naive baselines, rolling backtests, error analysis, and clear segment narratives with 2–3 actions each. Keep CLV/BG-NBD and cloud deployment as optional stretch if time permits.",summary:"Key risks for this project include data leakage during time-based splits, tuning seasonality parameters, and maintaining business interpretability in customer segmentation. To mitigate these bottlenecks, teams should focus on a core scope using standard time-series models and RFM/K-Means segmentation, prioritizing rolling backtests, error analysis, and actionable segment narratives.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of simultaneously forecasting store product category demand and clustering regional shopper purchasing behavior for Other (Deepti Bahel). Identify key stakeholders, target users, and operational workflows. Inputs include multi-year transaction logs and sales sheets; outputs are 30-day demand predictions and RFM classifications. Scope excludes automated purchasing or dynamic pricing to manage operational risks like over-forecasting.

2.  Ingest Data Resources: Ingest all provided multi-year customer transaction logs, regional product sales histories, and store inventory spreadsheets into the primary processing environment. Ensure all raw data sources are successfully loaded, correctly mapped, and prepared for comprehensive downstream data preparation, validation checks, and feature engineering tasks.

3.  Validate Database Parsing and Panel Alignment: Verify that unique customer identification numbers and store transaction timestamps are correctly parsed, validated, and unified into a single coherent panel database. This structure establishes proper sequential tracking and alignment across all customer activities and regional store locations.

4.  🛑 Critical Data Gate - Dual-Track Splitting Gate: Isolate the core modeling execution pipelines into two distinct processing splits. Create a strict chronological split reserved exclusively for time-series demand forecasting, along with an independent random split designated specifically for customer clustering to eliminate data leakage across tasks.

5.  Profile Outliers and Data Distributions: Programmatically profile transaction monetary values, historical customer purchase frequencies, and product categories across time to detect extreme purchase outliers. This profiling step ensures that anomalous records or corrupted transactions are identified early before model feature engineering occurs.

6.  Implement Data Validation Assertions: Write strict, programmatic data validation assertions within the preprocessing scripts. Ensure that key metrics, including overall transaction totals, unit sales, and product order quantities, are strictly non-zero and positive numbers to maintain database integrity throughout processing.

7.  Establish Naive Baseline Models: Freeze a naive seasonal persistence model to establish a simple baseline benchmark for demand forecasting tasks. Concurrently, construct a baseline customer Recency, Frequency, Monetary (RFM) segmentation matrix using median feature values to compare against future advanced modeling techniques.

8.  Train Time Series Forecasting Models: Train classical statistical and time-series models, such as ARIMA, SARIMA, and Prophet, to accurately forecast store-level product category demand over target horizons. Evaluate baseline performance and model accuracy using standard metrics including RMSE and MAE.

9.  Implement Customer RFM Segmentation: Implement K-Means clustering algorithms on standardized, scaled customer RFM features. Compute and plot Silhouette scores across varying cluster numbers to determine the optimal shopper cohorts, ensuring high intra-cluster cohesion and strong business interpretability for segment strategies.

10. Train XGBoost Regression Models: Train an XGBoost regression model utilizing engineered lag-demand features and extracted customer cohort IDs to predict localized store-level demand. Combine sequential time-series patterns with shopper behavioral insights to enhance final prediction accuracy across categories.

11. Audit Segment-Level Forecast Errors: Conduct a comprehensive audit of demand forecasting errors across different customer segments to evaluate model consistency. Identify potential systematic bias or disproportionately high variance within specific sub-cohorts to ensure equitable performance across all customer groups.

12. Tune Model Parameters on Training Split: Perform all hyperparameter optimization, model parameter tuning, and clustering algorithm adjustments strictly within designated training folds. This strict isolation prevents out-of-sample data leakage and ensures unbiased generalizability to unseen evaluation datasets.

13. Evaluate Final Models on Held-Out Test Data: Evaluate the final demand forecasting accuracy and performance exactly once using the frozen chronological time-series test partition set aside during initial data setup. Measure final success against target MAPE and RMSE metrics to confirm performance.

14. Deliver End-to-End Project Artifacts: Package and deliver a runnable Google Colab notebook containing the complete demand forecasting pipeline, a detailed cohort analysis segment matrix, and an interactive Streamlit demo dashboard showcasing predictions, customer insights, and strategic recommendations for stakeholders.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of simultaneously forecasting store product category demand and clustering regional shopper purchasing behavior for Other (Deepti Bahel). Identify key stakeholders, target users, and operational workflows. Inputs include multi-year transaction logs and sales sheets; outputs a"},{num:2,title:"Ingest Data Resources",desc:"Ingest all provided multi-year customer transaction logs, regional product sales histories, and store inventory spreadsheets into the primary processing environment. Ensure all raw data sources are successfully loaded, correctly mapped, and prepared for comprehensive downstream data preparation, val"},{num:3,title:"Validate Database Parsing and Panel Alignment",desc:"Verify that unique customer identification numbers and store transaction timestamps are correctly parsed, validated, and unified into a single coherent panel database. This structure establishes proper sequential tracking and alignment across all customer activities and regional store locations."},{num:4,title:"🛑 Critical Data Gate - Dual-Track Splitting Gate",desc:"Isolate the core modeling execution pipelines into two distinct processing splits. Create a strict chronological split reserved exclusively for time-series demand forecasting, along with an independent random split designated specifically for customer clustering to eliminate data leakage across task"},{num:5,title:"Profile Outliers and Data Distributions",desc:"Programmatically profile transaction monetary values, historical customer purchase frequencies, and product categories across time to detect extreme purchase outliers. This profiling step ensures that anomalous records or corrupted transactions are identified early before model feature engineering o"},{num:6,title:"Implement Data Validation Assertions",desc:"Write strict, programmatic data validation assertions within the preprocessing scripts. Ensure that key metrics, including overall transaction totals, unit sales, and product order quantities, are strictly non-zero and positive numbers to maintain database integrity throughout processing."},{num:7,title:"Establish Naive Baseline Models",desc:"Freeze a naive seasonal persistence model to establish a simple baseline benchmark for demand forecasting tasks. Concurrently, construct a baseline customer Recency, Frequency, Monetary (RFM) segmentation matrix using median feature values to compare against future advanced modeling techniques."},{num:8,title:"Train Time Series Forecasting Models",desc:"Train classical statistical and time-series models, such as ARIMA, SARIMA, and Prophet, to accurately forecast store-level product category demand over target horizons. Evaluate baseline performance and model accuracy using standard metrics including RMSE and MAE."},{num:9,title:"Implement Customer RFM Segmentation",desc:"Implement K-Means clustering algorithms on standardized, scaled customer RFM features. Compute and plot Silhouette scores across varying cluster numbers to determine the optimal shopper cohorts, ensuring high intra-cluster cohesion and strong business interpretability for segment strategies."},{num:10,title:"Train XGBoost Regression Models",desc:"Train an XGBoost regression model utilizing engineered lag-demand features and extracted customer cohort IDs to predict localized store-level demand. Combine sequential time-series patterns with shopper behavioral insights to enhance final prediction accuracy across categories."},{num:11,title:"Audit Segment-Level Forecast Errors",desc:"Conduct a comprehensive audit of demand forecasting errors across different customer segments to evaluate model consistency. Identify potential systematic bias or disproportionately high variance within specific sub-cohorts to ensure equitable performance across all customer groups."},{num:12,title:"Tune Model Parameters on Training Split",desc:"Perform all hyperparameter optimization, model parameter tuning, and clustering algorithm adjustments strictly within designated training folds. This strict isolation prevents out-of-sample data leakage and ensures unbiased generalizability to unseen evaluation datasets."},{num:13,title:"Evaluate Final Models on Held-Out Test Data",desc:"Evaluate the final demand forecasting accuracy and performance exactly once using the frozen chronological time-series test partition set aside during initial data setup. Measure final success against target MAPE and RMSE metrics to confirm performance."},{num:14,title:"Deliver End-to-End Project Artifacts",desc:"Package and deliver a runnable Google Colab notebook containing the complete demand forecasting pipeline, a detailed cohort analysis segment matrix, and an interactive Streamlit demo dashboard showcasing predictions, customer insights, and strategic recommendations for stakeholders."}]},{id:"1039",title:"TelcoTriage: Automated Telecom Support NLP Agent for Incident Management",org:"Other",advisor:"Toby Sheung",ml_type:"Classification, NLP, AI Agent",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Build AI agent to classify customer tweets and resolve/escalate issues.",metrics:`Model Accuracy <= 70% for classification; qualitative assessment that the agent's outputs are readable/useful ("nice looking" outputs) and provide actionable insights.`,data_link:"https://www.kaggle.com/datasets/thoughtvector/customer-support-on-twitter",sep:"Ingest and filter customer support tweet datasets; clean text, handle Twitter artifacts, and structure labeled categories.",oct:"Implement text vectorization (TF-IDF / embeddings) and train baseline multi-class classification models to categorize customer support tickets.",nov:"Build an NLP agent workflow to automate triage recommendations, summarize ticket threads, and generate actionable insight reports.",bottleneck:'The dataset requires significant NLP text cleaning. Scoping the project purely as a basic NLP classifier (predicting issue categories) is too simplistic and fails to leverage the "Agentic" workflows mentioned in the project title.',recommendation:"Provide a partially cleaned sample of the Twitter dataset to prevent early bottlenecks. Shift the architecture away from a simple classifier toward a true GenAI workflow via LangChain, enabling the system to autonomously draft response actions or summarize tickets.",summary:"The dataset requires extensive text cleaning, and building only a basic classifier fails to fulfill the project's agentic goals. To avoid initial setup delays and expand capabilities, teams should be provided with a pre-cleaned sample dataset. Additionally, the architecture should transition to a GenAI workflow using LangChain to support automated ticket summarization and response drafting.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of automating classification, triage, and routing for unstructured telecom support transcripts. Identify key stakeholders, support dispatchers, and operational workflows. Map inputs like raw transcripts and outputs like category tags and urgency ratings while setting clear scope boundaries and addressing critical SLA breach risks.
2.  Data Ingestion Architecture: Systematically ingest raw telecom support ticket transcripts, customer account logs, and historical incident category tables into the processing pipeline. Ensure all relevant data sources are securely collected and accessible for downstream preprocessing, feature extraction, and model training tasks.
3.  Text Cleaning & Anonymization: Clean and parse unstructured support ticket conversations to prepare data for model training. Apply targeted regular expressions to programmatically redact and remove sensitive customer personally identifiable information, including full names, phone numbers, and unique account identification numbers across all text logs.
4.  Class Distribution Profiling: Profile and analyze the class distributions across historical ticket categories. Document severe class imbalances and extreme long-tail incident types to establish baseline data expectations and determine necessary sampling or weighting strategies needed prior to baseline modeling.
5.  Data Validation & Preflight Checks: Construct robust data validation assertions to verify the integrity of incoming data streams. Ensure that tokenized support ticket sequence lengths, categorical priority labels, and input metadata reside strictly within specified pre-defined boundaries before feeding into downstream training pipelines.
6.  🛑 CRITICAL DATA GATE - CLASSIFICATION FLOOR GATE: Train a baseline TF-IDF vectorizer coupled with a Logistic Regression classifier to predict ticket category tags and priority levels. This establishes an empirical performance benchmark and sets the minimum quantitative accuracy floor required before attempting complex architectural enhancements.
7.  Transformer Model Fine-Tuning: Upgrade the classification pipeline by fine-tuning pre-trained language models, such as DistilBERT or RoBERTa, directly on support ticket texts. Optimize model representations to improve dynamic contextual understanding and significantly boost multi-class support issue categorization accuracy across varied customer transcripts.
8.  Metric Evaluation & Minority Class Audit: Thoroughly evaluate ticket classification performance using macro-averaged Precision, Recall, and F1-score. Ensure evaluation metrics account for underrepresented category classes to guarantee consistent routing accuracy across both high-frequency issues and rare incident types.
9.  Semantic Search & Guide Retrieval: Build a semantic search module over resolved incident wikis and technical documentation using dense sentence embeddings. Enable the system to dynamically query historical context and automatically retrieve highly relevant troubleshooting guides for identified support categories.
10. Generative Scope & Stretch Goal Verification: Enforce strict architectural boundaries by verifying that any conversational LLM response generation or automated drafting features remain strictly as stretch goals. Ensure these capabilities are only attempted after core classification and triage performance targets are fully achieved.
11. Partitioned Hyperparameter Tuning: Execute all hyperparameter tuning, including learning rate adjustments, classification loss weighting, and embedding similarity threshold optimization, strictly within the dedicated training and validation partitions to prevent data leakage into final evaluation environments.
12. Frozen Test Set Out-of-Sample Evaluation: Conduct a final, comprehensive evaluation of out-of-sample ticket triage and routing accuracy exactly once using the completely frozen incident test set. Verify system generalization, measure real-world performance metrics, and validate operational readiness against baseline standards.
13. Final Deliverables & Documentation: Deliver a fully reproducible document classification notebook, a structured ticket prioritization rule ledger, and a comprehensive technical report detailing model architecture, agent evaluation metrics, and deployment guidelines for production integration.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of automating classification, triage, and routing for unstructured telecom support transcripts. Identify key stakeholders, support dispatchers, and operational workflows. Map inputs like raw transcripts and outputs like category tags and urgency ratings while setting clear sc"},{num:2,title:"Data Ingestion Architecture",desc:"Systematically ingest raw telecom support ticket transcripts, customer account logs, and historical incident category tables into the processing pipeline. Ensure all relevant data sources are securely collected and accessible for downstream preprocessing, feature extraction, and model training tasks"},{num:3,title:"Text Cleaning & Anonymization",desc:"Clean and parse unstructured support ticket conversations to prepare data for model training. Apply targeted regular expressions to programmatically redact and remove sensitive customer personally identifiable information, including full names, phone numbers, and unique account identification number"},{num:4,title:"Class Distribution Profiling",desc:"Profile and analyze the class distributions across historical ticket categories. Document severe class imbalances and extreme long-tail incident types to establish baseline data expectations and determine necessary sampling or weighting strategies needed prior to baseline modeling."},{num:5,title:"Data Validation & Preflight Checks",desc:"Construct robust data validation assertions to verify the integrity of incoming data streams. Ensure that tokenized support ticket sequence lengths, categorical priority labels, and input metadata reside strictly within specifie
