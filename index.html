valuate control market credibility (Canada and additional candidates) using pre-period plots and trend diagnostics. Deliverable: Preferred control group and initial causal estimate.",nov:"Refine and stress-test the estimate; examine anticipation effects; run sensitivity analysis for overlapping paid media/promotional activity; translate the estimate into a stakeholder-facing business recommendation on whether to expand rollout, proceed cautiously, or run a follow-up test.",bottleneck:"Advanced causal statistical concepts, particularly Difference-in-Differences (DiD) and counterfactual analysis, are rarely covered in undergraduate computer science programs. Without proper framing, students may struggle to translate these econometric techniques into programmable Python logic.",recommendation:"The project is exceptionally well-framed for advanced causal analysis. Ensure that the synthetic market datasets are highly structured and that students are guided toward robust Python statistical libraries (like statsmodels or EconML) to effectively execute the DiD regressions.",summary:"Advanced causal statistical concepts like Difference-in-Differences are rarely covered in undergraduate computer science programs, making it challenging for students to translate these econometric techniques into code. To address this, advisors should provide highly structured synthetic datasets and guide students toward established Python statistical libraries such as statsmodels or EconML. This structured approach ensures the team can effectively execute DiD regressions to measure business impact.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of measuring causal sales lift from Scent Advisor availability for Estee Lauder. Identify key stakeholders, target users, and retail operational workflows. Inputs include market-week transaction panels and scheduler logs, while outputs deliver treatment effect coefficients and parallel trend statistics. Scope is limited to store-level retrospective analysis, avoiding customer-level predictions while mitigating risks of parallel trend violations.

3.  Verify Panel Data Structure: Verify the internal panel data structure by confirming that every dataset row strictly represents a unique store-week observation with zero duplicated records or mismatched primary keys. Ensure temporal continuity across store identifier series to maintain a clean panel balance prior to executing any pre-treatment comparisons or causal econometric workflows.

4.  Validate Store Group Classifications: Validate store group classifications by cleanly mapping treatment stores in Canada and control stores in the United States alongside their respective pre-period baseline metrics. Confirm regional cohort definitions, verify geographical consistency, and ensure control group comparability to lay an accurate foundation for subsequent Difference-in-Differences statistical evaluation.

5.  Prevent Target Data Leakage: Verify that no future post-treatment sales figures, store revenue outcomes, or customer interaction session logs leak into pre-treatment feature calculations or baseline data definitions. Enforce strict temporal cutoffs across all feature pipelines to maintain complete integrity, preventing artificial variance reduction and ensuring unbiased causal inference estimates.

6.  Calculate Baseline Scale Metrics: Calculate average pre-treatment fragrance revenues across both treatment and control regions to inspect baseline scale differences and initial store performance metrics. Document pre-rollout revenue disparities and establish baseline comparative benchmarks, allowing analysts to evaluate scale variations across geographic markets prior to conducting formal econometric trend modeling.

7.  Parallel Trends Validation Gate: Execute formal statistical tests, including pre-period placebo regressions and parallel trend lead-lag checks, to rigorously prove that the parallel trends assumption holds before running any causal estimators. Verify that pre-treatment revenue trajectories between treatment and control groups move in parallel, ensuring valid counterfactual estimation.

8.  Implement Difference-in-Differences Regression Model: Implement the core Difference-in-Differences linear regression model incorporating store and week fixed effects to isolate the true causal treatment lift attributable to Scent Advisor availability. Ensure proper specifications are defined to control for unobserved time-invariant store characteristics and common time trends across the evaluation period.

9.  Configure Cluster-Robust Standard Errors: Verify that store-level clustering of standard errors is programmatically configured in the Python regression script. Account for potential serial correlation and within-store error dependency across time periods to ensure accurate standard error estimation, prevent overstating statistical significance, and maintain realistic confidence interval boundaries.

10. Execute Historical Placebo Tests: Run placebo tests across historical periods where no Scent Advisor feature rollout actually occurred to confirm that the Difference-in-Differences estimator yields a statistically insignificant zero treatment effect. Validate model robustness against spurious correlation and temporal anomalies, reinforcing confidence in the primary causal identification strategy.

11. Conduct Sensitivity and Robustness Analyses: Conduct comprehensive sensitivity and robustness analyses by sequentially dropping major individual stores or regional clusters to verify that the causal estimate is stable and not disproportionately driven by an outlier store. Confirm consistent treatment magnitude across sub-samples to guarantee reliable decision support for leadership.

12. Freeze Model Specifications and Execute Final Regression: Freeze all model specifications, fixed effect definitions, and control covariates, then execute the final regression script exactly once against the complete panel dataset. Generate unbiased treatment effect coefficients, standard errors, and final p-values to quantify the precise financial impact of the Scent Advisor rollout.

act keys). Deliverable: Clean merged datasets, documented EDA, baseline NLP theme summary.",oct:"Modeling: Train recommendation ML (similarity / collaborative filtering) to rank top 3–5 areas from user preferences; optional area-level supervised model to enrich feature vectors; evaluate with precision@k and rank correlation; implement shared Python tool layer (recommend, area_stats, crowd_themes) for app and MCP; document feature interpretability. Deliverable: Working recommender, evaluation report, callable tool functions.",nov:"Evaluation, Agent Integration, & Containerization: Responsible AI pass (fairness memo, model card, refusal test cases for no steering/PII); wire Gemini agent + MCP server to tools only; build Streamlit newcomer UI; containerize demo (docker build / docker run); end-to-end testing with sample newcomer personas; deliver handoff README.",bottleneck:"Requiring students to wire a Gemini agent to a Model Context Protocol (MCP) server and fully Dockerize the application introduces massive DevOps and software engineering debt. Managing container dependencies and networking routing is completely outside the scope of standard ML curriculums.",recommendation:"Eliminate the requirement for students to build the MCP server and Docker containers from scratch. Provide boilerplate Dockerfiles and pre-configured MCP routing code so the fellows can focus exclusively on the core recommendation logic and responsible AI prompt engineering.",summary:"Requiring students to build an MCP server and fully Dockerize the application introduces significant DevOps debt that falls outside standard machine learning curricula. To address this, instructors should eliminate the requirement to build these components from scratch by providing boilerplate Dockerfiles and pre-configured MCP routing code. This allows students to focus their efforts entirely on core recommendation logic and responsible AI prompt engineering.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core task of recommending personalized, equitable neighborhood matches for Flow users without causing algorithmic steering. Identify key stakeholders, target users, operational search workflows, and core compliance risks while specifying scope limits around housing recommendations.
2.  Data Ingestion & Data Sources: Ingest public housing and demographic datasets, including U.S. Census Bureau ACS demographic tables, Zillow rent indices, spatial neighborhood boundaries, and regional migration flows into a unified data processing pipeline to support neighborhood matchmaking.
3.  Spatial Data Alignment & Join Verification: Programmatically verify that all spatial coordinates, geographic boundaries, and FIPS county codes are joined cleanly across source files without missing values, dropped records, or misaligned spatial boundaries.
4.  Protected Class Variable Exclusions: Audit all dataset variables and features to ensure sensitive demographic columns, such as race or national origin, are strictly removed to prevent unlawful bias and algorithmic steering in downstream recommendations.
5.  Feature Profiling & Numeric Scaling: Profile and scale continuous numeric features, including median household income, local rent averages, and commute duration estimates, to prevent feature magnitude from improperly dominating similarity distance metrics.
6.  Financial & Spatial Data Validation: Implement strict boundary assertions and validation checks across all ingested data to ensure that continuous financial and spatial values remain logically valid and mathematically feasible (e.g., verifying median rent \\> 0).
7.  Baseline Model Development: Build and freeze a baseline recommendation model utilizing standard cosine similarity calculated over scaled geographic coordinates and local median rent prices to serve as a comparative benchmark for advanced methods.
8.  Model Architecture Upgrade: Upgrade the core matching engine to leverage a multi-attribute utility model (MAUT) or collaborative filtering algorithm, effectively aligning complex user preference vectors with rich neighborhood profile embeddings.
9.  Fair-Housing Compliance Audit Gate: Implement automated risk-audits to programmatically evaluate the recommender using synthetic user prompts, ensuring the system strictly refuses to steer users or produce biased recommendations based on protected demographic attributes.
10. Model Context Protocol Integration: Integrate pre-built Model Context Protocol (MCP) server boilerplates to facilitate secure, standardized, and structured agentic tool calls when querying underlying neighborhood data repositories.
11. Robustness & Constraint Stress-Testing: Stress-test the recommendation system against edge cases and highly restrictive user constraints, such as demanding high-income amenities in low-density rural zones, to ensure standard, graceful system fallback responses.
12. Model Evaluation & Parameter Freezing: Lock all recommendation weights, feature scaling parameters, and similarity thresholds on the training split, subsequently running the performance evaluation protocol exactly once on the isolated test user set.
13. Final Project Deliverables & Documentation: Deliver a complete project portfolio containing a fully executable Google Colab notebook, an interactive Streamlit map dashboard, and a comprehensively documented fair-housing compliance card detailing system limits.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core task of recommending personalized, equitable neighborhood matches for Flow users without causing algorithmic steering. Identify key stakeholders, target users, operational search workflows, and core compliance risks while specifying scope limits around housing recommendations."},{num:2,title:"Data Ingestion & Data Sources",desc:"Ingest public housing and demographic datasets, including U.S. Census Bureau ACS demographic tables, Zillow rent indices, spatial neighborhood boundaries, and regional migration flows into a unified data processing pipeline to support neighborhood matchmaking."},{num:3,title:"Spatial Data Alignment & Join Verification",desc:"Programmatically verify that all spatial coordinates, geographic boundaries, and FIPS county codes are joined cleanly across source files without missing values, dropped records, or misaligned spatial boundaries."},{num:4,title:"Protected Class Variable Exclusions",desc:"Audit all dataset variables and features to ensure sensitive demographic columns, such as race or national origin, are strictly removed to prevent unlawful bias and algorithmic steering in downstream recommendations."},{num:5,title:"Feature Profiling & Numeric Scaling",desc:"Profile and scale continuous numeric features, including median household income, local rent averages, and commute duration estimates, to prevent feature magnitude from improperly dominating similarity distance metrics."},{num:6,title:"Financial & Spatial Data Validation",desc:"Implement strict boundary assertions and validation checks across all ingested data to ensure that continuous financial and spatial values remain logically valid and mathematically feasible (e.g., verifying median rent \\> 0)."},{num:7,title:"Baseline Model Development",desc:"Build and freeze a baseline recommendation model utilizing standard cosine similarity calculated over scaled geographic coordinates and local median rent prices to serve as a comparative benchmark for advanced methods."},{num:8,title:"Model Architecture Upgrade",desc:"Upgrade the core matching engine to leverage a multi-attribute utility model (MAUT) or collaborative filtering algorithm, effectively aligning complex user preference vectors with rich neighborhood profile embeddings."},{num:9,title:"Fair-Housing Compliance Audit Gate",desc:"Implement automated risk-audits to programmatically evaluate the recommender using synthetic user prompts, ensuring the system strictly refuses to steer users or produce biased recommendations based on protected demographic attributes."},{num:10,title:"Model Context Protocol Integration",desc:"Integrate pre-built Model Context Protocol (MCP) server boilerplates to facilitate secure, standardized, and structured agentic tool calls when querying underlying neighborhood data repositories."},{num:11,title:"Robustness & Constraint Stress-Testing",desc:"Stress-test the recommendation system against edge cases and highly restrictive user constraints, such as demanding high-income amenities in low-density rural zones, to ensure standard, graceful system fallback responses."},{num:12,title:"Model Evaluation & Parameter Freezing",desc:"Lock all recommendation weights, feature scaling parameters, and similarity thresholds on the training split, subsequently running the performance evaluation protocol exactly once on the isolated test user set."},{num:13,title:"Final Project Deliverables & Documentation",desc:"Deliver a complete project portfolio containing a fully executable Google Colab notebook, an interactive Streamlit map dashboard, and a comprehensively documented fair-housing compliance card detailing system limits."}]},{id:"1023",title:"Marsh Object Detection Model",org:"Marsh McLennan",advisor:"Kamraan Kamal",ml_type:"Classification, NLP, LLMs, Information extraction",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Extract and classify objects involved in injury incidents from hospital descriptions.",metrics:"Compare favorably to Marsh's existing model on an anonymized testing set and correctly extract and classify objects on the advisor-provided anonymized test set.",data_link:"CPSC NEISS Data",sep:"Download and explore CPSC NEISS data; finalize the model logic plan.",oct:"Produce version 1 of model; obtain initial model validation results.",nov:"Improve the model; the final version correctly extracts and classifies objects mentioned in workers' compensation accident descriptions.",bottleneck:"Processing a 1-5 GB corpus of textual hospital injury descriptions through Generative AI extraction models will quickly deplete free-tier API quotas and overwhelm Google Colab memory limits, potentially hard-blocking the students during the bulk processing phase.",recommendation:"Mandate that students aggressively sample and filter the dataset (e.g., pulling a representative 100 MB subset) prior to initiating any LLM inference. Explicitly confirm that enterprise API keys will be provided to support the heavy token loads required for extraction.",summary:"Processing large textual datasets of hospital injury descriptions using Generative AI models risks exhausting free-tier API quotas and exceeding Google Colab memory limits. To address this bottleneck, students should aggressively sample and filter the data down to a smaller representative subset before starting LLM inference. Additionally, ensuring enterprise API keys are provided will support the heavy token volume required for object extraction.",checklist_raw:`1.  Business Understanding & Scope: Define the downstream workflow relying on object extraction from hospital injury descriptions. Translate this into a single bounded technical task: extract and classify objects using CPSC NEISS data. Specify the JSON output schema, acceptable abstention rules, failure costs, and metrics like precision, recall, and cost per extraction.
2.  Environment & Source Verification: Confirm access to public CPSC NEISS Data (1-5 GB) and record version details. Verify required text-processing libraries, Generative AI API credentials, and rate limits. Ensure enterprise API keys are available to handle large token volumes, while maintaining a simple local baseline when external APIs are unreachable.
3.  Data Acquisition & Sampling: Curate a representative sample of hospital injury descriptions from CPSC NEISS Data. To prevent memory limits and API quota exhaustion in Google Colab, filter the dataset down to a manageable 100 MB subset before running LLM inference. Ensure the sample captures text variability.
4.  Textual EDA: Perform exploratory data analysis on the sampled injury descriptions. Analyze document lengths, vocabulary diversity, and challenging structures like abbreviations or misspellings. Review data quality and formatting to understand core linguistic characteristics before designing models.
5.  Data Cleaning & Vetting: Build a deterministic pipeline to normalize injury text while retaining record IDs. Validate record counts, filter duplicates, and audit representative samples against raw inputs. Verify dataset compliance with privacy requirements (PII) and service policies before freezing the evaluation manifest.
6.  Schema & Gold-Standard Annotation: Establish a strict JSON schema defining extraction target fields and object classifications. Manually annotate the curated dataset to build a gold-standard benchmark. Ensure labels accurately capture objects linked to injury incidents to enable objective evaluation.
7.  Baseline Extraction: Implement a standard rule-based or keyword-matching extraction baseline (e.g., regex or basic NLP). Map outputs to the JSON schema and document baseline precision, recall, and limitations to set a performance floor.
8.  Generative AI Pipeline: Implement the Generative AI (LLM) extraction pipeline after documenting baseline performance. Design structured prompts instructing the model to output data strictly matching the JSON target schema for object identification and classification.
9.  Evaluation & Benchmarking: Benchmark LLM extractions against the gold-standard dataset and Marsh's existing model where available. Measure field-level precision, recall, F1, cost, and latency per record, comparing performance directly against the baseline.
10. Failure Analysis & Edge Cases: Categorize failure modes including parsing errors, hallucinations, missed objects, misclassifications, and invalid JSON. Audit extracted text against source records and enforce human review when confidence is low or evidence is ambiguous.
11. Stretch Goals: After validating the core extraction pipeline, explore additional fields in the NEISS database (such as NEISS Work) as stretch goals. Reserve complex agentic workflows for optional extensions while preserving the core pipeline.
12. Reproducibility & Reporting: Package and version all code, prompts, schemas, and evaluation datasets. Document LLM limitations including cost, latency, and hallucination risks, ensuring another engineer can independently reproduce the end-to-end pipeline and evaluation.`,gates:[{num:1,title:"Business Understanding & Scope",desc:"Define the downstream workflow relying on object extraction from hospital injury descriptions. Translate this into a single bounded technical task: extract and classify objects using CPSC NEISS data. Specify the JSON output schema, acceptable abstention rules, failure costs, and metrics like precisi"},{num:2,title:"Environment & Source Verification",desc:"Confirm access to public CPSC NEISS Data (1-5 GB) and record version details. Verify required text-processing libraries, Generative AI API credentials, and rate limits. Ensure enterprise API keys are available to handle large token volumes, while maintaining a simple local baseline when external API"},{num:3,title:"Data Acquisition & Sampling",desc:"Curate a representative sample of hospital injury descriptions from CPSC NEISS Data. To prevent memory limits and API quota exhaustion in Google Colab, filter the dataset down to a manageable 100 MB subset before running LLM inference. Ensure the sample captures text variability."},{num:4,title:"Textual EDA",desc:"Perform exploratory data analysis on the sampled injury descriptions. Analyze document lengths, vocabulary diversity, and challenging structures like abbreviations or misspellings. Review data quality and formatting to understand core linguistic characteristics before designing models."},{num:5,title:"Data Cleaning & Vetting",desc:"Build a deterministic pipeline to normalize injury text while retaining record IDs. Validate record counts, filter duplicates, and audit representative samples against raw inputs. Verify dataset compliance with privacy requirements (PII) and service policies before freezing the evaluation manifest."},{num:6,title:"Schema & Gold-Standard Annotation",desc:"Establish a strict JSON schema defining extraction target fields and object classifications. Manually annotate the curated dataset to build a gold-standard benchmark. Ensure labels accurately capture objects linked to injury incidents to enable objective evaluation."},{num:7,title:"Baseline Extraction",desc:"Implement a standard rule-based or keyword-matching extraction baseline (e.g., regex or basic NLP). Map outputs to the JSON schema and document baseline precision, recall, and limitations to set a performance floor."},{num:8,title:"Generative AI Pipeline",desc:"Implement the Generative AI (LLM) extraction pipeline after documenting baseline performance. Design structured prompts instructing the model to output data strictly matching the JSON target schema for object identification and classification."},{num:9,title:"Evaluation & Benchmarking",desc:"Benchmark LLM extractions against the gold-standard dataset and Marsh's existing model where available. Measure field-level precision, recall, F1, cost, and latency per record, comparing performance directly against the baseline."},{num:10,title:"Failure Analysis & Edge Cases",desc:"Categorize failure modes including parsing errors, hallucinations, missed objects, misclassifications, and invalid JSON. Audit extracted text against source records and enforce human review when confidence is low or evidence is ambiguous."},{num:11,title:"Stretch Goals",desc:"After validating the core extraction pipeline, explore additional fields in the NEISS database (such as NEISS Work) as stretch goals. Reserve complex agentic workflows for optional extensions while preserving the core pipeline."},{num:12,title:"Reproducibility & Reporting",desc:"Package and version all code, prompts, schemas, and evaluation datasets. Document LLM limitations including cost, latency, and hallucination risks, ensuring another engineer can independently reproduce the end-to-end pipeline and evaluation."}]},{id:"1024",title:"Smarter Devices, Smaller Models: Unlocking Embedded AI Through Efficient Compression",org:"MathWorks",advisor:"Nayara Aguiar, Shanmukh Srinivas",ml_type:"Deep Learning / Neural Networks",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Deep Learning",objective:"Develop a smart appliance model optimized for embedded applications via deep learning model compression.",metrics:"Inference speed, memory footprint, accuracy trade-offs.",data_link:"https://github.com/mathworks/RollingElementBearingFaultDiagnosis-Data",sep:"Milestone 1 (September): Data understanding and preprocessing (explore dataset, apply transformations, split preprocessed data).",oct:"Milestone 2 (October): Model selection and training (select two different models to explore, train both models, and compare their performance).",nov:"Milestone 3 (November): Model compression (compress model size, evaluate compression vs. accuracy trade-offs); presentation preparation (create slides, clean up team's GitLab repository).",bottleneck:"Evaluating the exact inference speed and deep learning memory footprint tradeoffs of compressed models can be complex when strictly constrained to standard, shared Google Colab environments, where underlying hardware allocations fluctuate dynamically.",recommendation:"The project is exceptionally well-scoped. Guide students to utilize standardized profiling libraries (like torch.profiler or TensorFlow's built-in profilers) to measure relative compression tradeoffs accurately, ensuring they do not get derailed by the absolute hardware variations of the Colab free tier.",summary:"Evaluating inference speed and memory footprint trade-offs for compressed models can be difficult in shared Google Colab environments due to fluctuating hardware allocations. To address this, students should use standardized profiling libraries like torch.profiler or TensorFlow's built-in profilers to accurately measure relative performance trade-offs rather than relying on absolute execution metrics.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of deploying compressed deep learning models for bearing fault diagnosis on embedded systems for MathWorks. Key stakeholders include MathWorks engineers and maintenance managers. Workflows cover telemetry monitoring and fault diagnostics using vibration streams. Operational risks include missed bearing faults leading to equipment failure.
2.  Data Ingestion: Ingest the raw high-frequency bearing vibration sensor streams and corresponding fault classification labels provided by MathWorks. Ensure data ingestion pipelines securely load and structure the sensor data frames for downstream signal processing and baseline model preparation.
3.  Sampling Verification: Verify that sensor signal sampling rates and recording durations are uniform across all healthy and faulty bearing trials. Flag any temporal discrepancies or missing signal sequences before proceeding with feature extraction or model development.
4.  Validation Splitting: Enforce a strict stratified validation split based on bearing machine IDs to prevent data leakages between training and evaluation splits, ensuring that the model generalizes well to entirely unseen hardware machinery.
5.  Signal Cleaning: Inspect the raw signal streams for missing data or sensor dropout anomalies, applying local rolling-mean interpolations across corrupted frames to ensure continuous and clean sensor inputs for feature engineering.
6.  Feature Extraction: Extract statistical time-domain features, including root-mean-square, kurtosis, and crest factor, and compute Fast Fourier Transforms (FFT) to convert raw vibration signals into rich frequency-domain representations for diagnostic analysis.
7.  Baseline Modeling: Implement a classical supervised machine learning baseline, such as Random Forest or Support Vector Machines trained on the statistical FFT features, to establish an initial benchmark for classification accuracy.
8.  Spectrogram Conversion: Convert raw 1D vibration time-series sequences into 2D time-frequency spectrogram images using Short-Time Fourier Transforms (STFT), making the signal data suitable for computer vision and deep learning model architectures.
9.  CNN Model Training: Train a 2D Convolutional Neural Network, such as MobileNet or ResNet-18, using PyTorch or Keras to classify bearing fault types accurately from the generated STFT spectrogram images.
10. Model Compression: Apply model compression strategies, including Post-Training Quantization (PTQ) to float16 or int8 precision and magnitude-based weight pruning, to optimize the trained neural network for resource-constrained target devices.
11. Hardware Profiling Gate: Use standardized profiling tools, such as PyTorch's torch.profiler or local system monitors, to programmatically measure compressed model size, CPU inference latency, and peak RAM consumption against initial target requirements.
12. Trade-Off Evaluation: Measure model performance head-to-head across uncompressed, pruned, and quantized models to evaluate trade-offs between memory footprint reduction, execution speedup, and predictive accuracy on validation data.
13. Final Test Evaluation: Perform final hyperparameter tuning and learning-rate optimizations strictly on the training partition, then execute the model evaluation exactly once on the frozen, unseen test split to ensure unbiased metrics.
14. Final Project Delivery: Deliver a fully runnable Google Colab compression pipeline, exportable ONNX model files ready for embedded deployment, and a comprehensive model card detailing final model size, speed, and classification accuracy metrics.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of deploying compressed deep learning models for bearing fault diagnosis on embedded systems for MathWorks. Key stakeholders include MathWorks engineers and maintenance managers. Workflows cover telemetry monitoring and fault diagnostics using vibration streams. Operational risks "},{num:2,title:"Data Ingestion",desc:"Ingest the raw high-frequency bearing vibration sensor streams and corresponding fault classification labels provided by MathWorks. Ensure data ingestion pipelines securely load and structure the sensor data frames for downstream signal processing and baseline model preparation."},{num:3,title:"Sampling Verification",desc:"Verify that sensor signal sampling rates and recording durations are uniform across all healthy and faulty bearing trials. Flag any temporal discrepancies or missing signal sequences before proceeding with feature extraction or model development."},{num:4,title:"Validation Splitting",desc:"Enforce a strict stratified validation split based on bearing machine IDs to prevent data leakages between training and evaluation splits, ensuring that the model generalizes well to entirely unseen hardware machinery."},{num:5,title:"Signal Cleaning",desc:"Inspect the raw signal streams for missing data or sensor dropout anomalies, applying local rolling-mean interpolations across corrupted frames to ensure continuous and clean sensor inputs for feature engineering."},{num:6,title:"Feature Extraction",desc:"Extract statistical time-domain features, including root-mean-square, kurtosis, and crest factor, and compute Fast Fourier Transforms (FFT) to convert raw vibration signals into rich frequency-domain representations for diagnostic analysis."},{num:7,title:"Baseline Modeling",desc:"Implement a classical supervised machine learning baseline, such as Random Forest or Support Vector Machines trained on the statistical FFT features, to establish an initial benchmark for classification accuracy."},{num:8,title:"Spectrogram Conversion",desc:"Convert raw 1D vibration time-series sequences into 2D time-frequency spectrogram images using Short-Time Fourier Transforms (STFT), making the signal data suitable for computer vision and deep learning model architectures."},{num:9,title:"CNN Model Training",desc:"Train a 2D Convolutional Neural Network, such as MobileNet or ResNet-18, using PyTorch or Keras to classify bearing fault types accurately from the generated STFT spectrogram images."},{num:10,title:"Model Compression",desc:"Apply model compression strategies, including Post-Training Quantization (PTQ) to float16 or int8 precision and magnitude-based weight pruning, to optimize the trained neural network for resource-constrained target devices."},{num:11,title:"Hardware Profiling Gate",desc:"Use standardized profiling tools, such as PyTorch's torch.profiler or local system monitors, to programmatically measure compressed model size, CPU inference latency, and peak RAM consumption against initial target requirements."},{num:12,title:"Trade-Off Evaluation",desc:"Measure model performance head-to-head across uncompressed, pruned, and quantized models to evaluate trade-offs between memory footprint reduction, execution speedup, and predictive accuracy on validation data."},{num:13,title:"Final Test Evaluation",desc:"Perform final hyperparameter tuning and learning-rate optimizations strictly on the training partition, then execute the model evaluation exactly once on the frozen, unseen test split to ensure unbiased metrics."},{num:14,title:"Final Project Delivery",desc:"Deliver a fully runnable Google Colab compression pipeline, exportable ONNX model files ready for embedded deployment, and a comprehensive model card detailing final model size, speed, and classification accuracy metrics."}]},{id:"1025",title:"CufflessAI: An Educational Blood Pressure Estimation",org:"Microsoft",advisor:"Wee Hyong Tok, Fatima Rafiqui",ml_type:"Regression, Time Series, Classification (stretch goal)",evaluation:"Minor edits needed",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Time Series",objective:"Estimate blood pressure from pulse-signal features (PPG, ECG) for educational ML purposes.",metrics:"Report Mean Absolute Error (MAE) and Root Mean Squared Error (RMSE) separately for both systolic (SBP) and diastolic (DBP) blood pressure.",data_link:"https://archive.ics.uci.edu/dataset/340/cuff%2Bless%2Bblood%2Bpressure%2Bestimation",sep:"M1 (September): Data understanding, preprocessing, and baseline modeling. Deliverable: reproducible notebook that loads the dataset, applies starter signal-processing (e.g., bandpass, basic artifact handling), and computes a naïve baseline regression.",oct:"M2 (October): Model training and evaluation. Deliverable: train at least two regression models and compare them to the naïve baseline; produce a model comparison table and basic feature-importance/interpretability, and report MAE/RMSE for both SBP and DBP.",nov:"M3 (November): Final prototype and technical report required; deliverables: final reproducible notebook, model comparison table, evaluation metrics (MAE and RMSE for SBP and DBP), and a short presentation/demo. Optional stretch deliverable: a working demo app that visualizes sample waveforms and shows an educational BP estimate.",bottleneck:"Processing raw physiological signals (PPG, ECG waveforms) requires specific domain knowledge in digital signal processing (e.g., applying bandpass filters to remove motion artifacts and baseline wander) before standard regression models can effectively learn from the data.",recommendation:"Ensure the provided dataset documentation clearly outlines standard physiological filtering techniques, or provide starter code for the signal processing pipeline. This allows students to focus on the core regression modeling and educational UI deployment rather than advanced signal engineering.",summary:"Processing raw physiological signals like PPG and ECG waveforms requires specific digital signal processing domain knowledge to filter out motion artifacts and baseline wander. To mitigate this issue, teams should be provided with clear documentation on standard physiological filtering methods or pre-built starter code for the signal processing pipeline. This allows students to concentrate on core regression modeling and UI deployment rather than getting bogged down in complex signal engineering.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of non-invasively estimating continuous systolic and diastolic blood pressure using high-frequency physiological waveforms for Microsoft. Identify key stakeholders, target users, and continuous monitoring workflows. Inputs include raw PPG and ECG signals, while outputs provide predicted continuous BP values (mmHg). The scope remains strictly bounded to educational research rather than medical diagnostic use cases.
2.  Raw Waveform Ingestion: Ingest high-frequency photoplethysmogram (PPG) and electrocardiogram (ECG) time-series data paired directly with continuous invasive blood pressure target labels. Ensure the data ingestion pipeline handles large time-series files efficiently, verifying file integrity and correct channel mapping across all records to prepare the dataset for downstream signal processing and modeling tasks.
3.  Signal Alignment & Synchronization: Verify that the sampling frequencies of the PPG, ECG, and continuous blood pressure signals are fully aligned and synchronized. Check for potential clock drifts, missing frames, or time offsets across all channels to ensure precise temporal alignment before extracting physiological features or training sequence models.
4.  Patient-Level Validation Splitting: Enforce a strict patient-level validation split that completely isolates individual patient records into either training or testing partitions. This prevents multi-record patient leakage across splits, ensuring that the model evaluates real-world generalization performance on previously unseen individuals rather than memorizing patient-specific baseline features.
5.  Critical Data Gate - Physiological Filtering: Build an automated, deterministic signal cleaning pipeline in Python as a critical gate. Apply a bandpass filter (0.5 to 8 Hz) to raw PPG signals to remove motion artifacts and respiratory drift, ensuring signal quality meets quality standards prior to model ingestion.
6.  Landmark Point & Feature Extraction: Identify and extract key physiological landmark points from the preprocessed waveforms. Calculate the Pulse Transit Time (PTT) between ECG R-peaks and corresponding PPG systolic peaks to establish structured time-domain features for predicting blood pressure trends.
7.  Landmark Verification & Assertions: Programmatically write automated assertions to validate that extracted landmark coordinates and calculated Pulse Transit Time (PTT) values fall within physiologically feasible human limits. Filter out unphysical outliers or erroneous peak detections prior to passing the features into downstream models.
8.  Baseline Linear Model Construction: Freeze a simple, deterministic linear regression baseline model that predicts systolic and diastolic blood pressure levels using solely extracted PTT features. Establish baseline performance metrics to measure future deep learning architectural improvements against.
9.  Deep Sequence Architecture Modeling: Upgrade the modeling framework from linear baselines to deep sequence architectures, such as 1D CNNs or LSTMs. Train these models directly on preprocessed PPG and ECG waveform arrays to automatically learn complex spatial and temporal representations.
10. AAMI Standard Tolerance Validation: Benchmark predicted continuous blood pressure values directly against the Association for the Advancement of Medical Instrumentation (AAMI) standard tolerances. Ensure model performance is rigorously evaluated using mean error metrics within 5 mmHg requirements across test cohorts.
11. Residual Error & Bias Analysis: Construct detailed regression error residual maps across distinct patient subgroups. Evaluate model performance across low, average, and high baseline BP cohorts to identify potential systematic biases or loss of predictive accuracy in extreme physiological ranges.
12. Hyperparameter Tuning Partitioning: Conduct all hyperparameter optimization, dropout selection, and network architecture tuning strictly within the designated development dataset partition. Prevent data leakage and test set overfitting by keeping the final evaluation data untouched throughout all training iterations.
13. Out-of-Sample Final Pipeline Evaluation: Freeze the entire sequence pipeline and feature engineering workflow. Execute the final model evaluation exactly once on the isolated out-of-sample patient partition to record definitive performance metrics.
14. Artifact Deliverables & Documentation: Deliver a fully reproducible sequence processing notebook, a model card evaluating performance against standard AAMI criteria, and an interactive visualization dashboard displaying sample pulse waveforms alongside educational BP estimations.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of non-invasively estimating continuous systolic and diastolic blood pressure using high-frequency physiological waveforms for Microsoft. Identify key stakeholders, target users, and continuous monitoring workflows. Inputs include raw PPG and ECG signals, while outputs provid"},{num:2,title:"Raw Waveform Ingestion",desc:"Ingest high-frequency photoplethysmogram (PPG) and electrocardiogram (ECG) time-series data paired directly with continuous invasive blood pressure target labels. Ensure the data ingestion pipeline handles large time-series files efficiently, verifying file integrity and correct channel mapping acro"},{num:3,title:"Signal Alignment & Synchronization",desc:"Verify that the sampling frequencies of the PPG, ECG, and continuous blood pressure signals are fully aligned and synchronized. Check for potential clock drifts, missing frames, or time offsets across all channels to ensure precise temporal alignment before extracting physiological features or train"},{num:4,title:"Patient-Level Validation Splitting",desc:"Enforce a strict patient-level validation split that completely isolates individual patient records into either training or testing partitions. This prevents multi-record patient leakage across splits, ensuring that the model evaluates real-world generalization performance on previously unseen indiv"},{num:5,title:"Critical Data Gate - Physiological Filtering",desc:"Build an automated, deterministic signal cleaning pipeline in Python as a critical gate. Apply a bandpass filter (0.5 to 8 Hz) to raw PPG signals to remove motion artifacts and respiratory drift, ensuring signal quality meets quality standards prior to model ingestion."},{num:6,title:"Landmark Point & Feature Extraction",desc:"Identify and extract key physiological landmark points from the preprocessed waveforms. Calculate the Pulse Transit Time (PTT) between ECG R-peaks and corresponding PPG systolic peaks to establish structured time-domain features for predicting blood pressure trends."},{num:7,title:"Landmark Verification & Assertions",desc:"Programmatically write automated assertions to validate that extracted landmark coordinates and calculated Pulse Transit Time (PTT) values fall within physiologically feasible human limits. Filter out unphysical outliers or erroneous peak detections prior to passing the features into downstream mode"},{num:8,title:"Baseline Linear Model Construction",desc:"Freeze a simple, deterministic linear regression baseline model that predicts systolic and diastolic blood pressure levels using solely extracted PTT features. Establish baseline performance metrics to measure future deep learning architectural improvements against."},{num:9,title:"Deep Sequence Architecture Modeling",desc:"Upgrade the modeling framework from linear baselines to deep sequence architectures, such as 1D CNNs or LSTMs. Train these models directly on preprocessed PPG and ECG waveform arrays to automatically learn complex spatial and temporal representations."},{num:10,title:"AAMI Standard Tolerance Validation",desc:"Benchmark predicted continuous blood pressure values directly against the Association for the Advancement of Medical Instrumentation (AAMI) standard tolerances. Ensure model performance is rigorously evaluated using mean error metrics within 5 mmHg requirements across test cohorts."},{num:11,title:"Residual Error & Bias Analysis",desc:"Construct detailed regression error residual maps across distinct patient subgroups. Evaluate model performance across low, average, and high baseline BP cohorts to identify potential systematic biases or loss of predictive accuracy in extreme physiological ranges."},{num:12,title:"Hyperparameter Tuning Partitioning",desc:"Conduct all hyperparameter optimization, dropout selection, and network architecture tuning strictly within the designated development dataset partition. Prevent data leakage and test set overfitting by keeping the final evaluation data untouched throughout all training iterations."},{num:13,title:"Out-of-Sample Final Pipeline Evaluation",desc:"Freeze the entire sequence pipeline and feature engineering workflow. Execute the final model evaluation exactly once on the isolated out-of-sample patient partition to record definitive performance metrics."},{num:14,title:"Artifact Deliverables & Documentation",desc:"Deliver a fully reproducible sequence processing notebook, a model card evaluating performance against standard AAMI criteria, and an interactive visualization dashboard displaying sample pulse waveforms alongside educational BP estimations."}]},{id:"1026",title:"GitHub Repo Trust Signals",org:"Microsoft",advisor:"David Koleczek",ml_type:"Unsupervised, Graph/Network Analysis, Anomaly Detection, Heuristics",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Build a repo-level trust score to identify high-quality vs malicious code using graph analysis.",metrics:"Predictive power (target ~0.7 AUC), user-friendly score.",data_link:"https://github.com/hehao98/StarScout/tree/main/data; https://www.gharchive.org/; https://docs.github.com/en/rest?apiVersion=2026-03-10",sep:"Complete exploratory data analysis using provided datasets and public APIs (dataset inventory, schema understanding, initial EDA on labeled suspicious vs. baseline repos, literature review on Six Million (Suspected) Fake Stars, candidate list of 5+ trust signals).",oct:"First working signal and evaluation harness (cleaned offline dataset and evaluation split ready, implement at least one trust signal, run evaluation holdout set and test on live repos, analyze initial results).",nov:"Working prototype with multiple trust signals (~5 signals) that can be run against a live repository.",bottleneck:"The gharchive dataset is flagged as >= 10 GB and is highly unformatted. Attempting to load, clean, and process this payload natively within a free-tier Google Colab instance will trigger immediate Out-Of-Memory (OOM) fatal crashes, preventing any graph analysis.",recommendation:"Mandate an offline payload alternative. The Challenge Advisor must query the backend and provide a pre-filtered, standardized, and sampled CSV matrix (strictly <= 1 GB) prior to the kickoff to stabilize the data ingestion loop.",summary:"Processing the unformatted, 10 GB+ gharchive dataset directly in Google Colab risks triggering fatal memory crashes that halt graph analysis. To resolve this ingestion bottleneck, the Challenge Advisor must provide a pre-filtered and standardized CSV dataset under 1 GB prior to kickoff. Securing this offline alternative stabilizes the pipeline so the team can effectively develop repo-level trust scores.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of detecting fake developer star-bursts and anomalous trust signals in open-source GitHub repositories for Microsoft. Identify key stakeholders, target users, and security workflows. Inputs include GHArchive event logs and StarScout activity datasets; outputs are anomaly risk scores and categorical Trust Grades (1-5). Scope focus is restricted to security risk indexing, excluding automated repository bans.

2.  Data Ingestion Protocol: Ingest the complete suite of GHArchive event datasets, repository metadata sheets, and StarScout anomalous activity labeling logs. Establish structured connections and pipeline ingestion scripts to read raw repository activity logs, target repository metadata, and existing trust benchmark annotations seamlessly across all available data partitions for downstream feature extraction.

3.  Critical Data Gate - Data Ingestion Limit Gate: Programmatically subsample and filter the massive GHArchive JSON databases down to a structured record payload strictly under 1 GB. This step guarantees that all subsequent processing, parsing, and graph feature transformations execute smoothly and stably within free-tier Google Colab memory constraints without risking fatal runtime memory crashes.

4.  Log Cleaning & Payload Parsing: Parse and clean raw, unstructured JSON payload event logs. Standardize and normalize key entity fields across all records, including unique usernames, event timestamps, action types, and target repository strings to prepare consistent, clean data formats for structural graph construction and behavioral analysis.

5.  Feature Table Construction: Build a comprehensive repository-level feature table calculating critical behavioral metrics. Derive key risk indicators including actor-to-star ratios, repository creation dates, user account age distributions, event spikes, and peak star-velocity bursts to capture dynamic activity anomalies across open-source project histories.

6.  Data Validation & Assertion Checks: Write automated data validation assertions to enforce logical integrity across all constructed feature columns. Ensure that derived user account ages, follower counts, star events, and action frequencies fall within realistic parameters, systematically flagging and eliminating corrupted or malformed data records.

7.  Rule-Based Baseline Definition: Freeze a deterministic, rule-based anomaly baseline to serve as an initial benchmark. Define hard heuristics that automatically flag suspicious projects, such as repositories where over 80% of stars originate from user accounts created within the preceding 48-hour window.

8.  Unsupervised Model Training: Train unsupervised anomaly detection models, including Isolation Forests, Local Outlier Factors (LOF), and PyOD Autoencoders, on the scaled feature tables. Learn complex, non-linear representations of repository engagement patterns to identify hidden coordinate attacks and artificial engagement networks effectively.

9.  Model Scoring & Validation: Validate model predictions against the StarScout gold-standard labels to evaluate performance quantitatively. Compute evaluation metrics, including precision-recall curves and ROC-AUC scores, to measure how reliably the unsupervised models distinguish real organic growth from synthetic star manipulation.

10. False-Positive Rate Auditing: Audit and analyze false-positive rates across top-scoring repositories to prevent system misclassifications. Ensure that legitimate, highly viral open-source projects experiencing natural rapid growth are not mistakenly penalized or labeled as suspicious by the anomaly detection algorithms.

11. Trust Grade Mapping: Map model anomaly scoring thresholds directly into an intuitive, user-friendly 1-to-5 repository 'Trust Grade' system. This structured rating format translates complex multi-dimensional risk vectors into readable, actionable insights for developers, security auditors, and software procurement managers.

12. Hyperparameter & Contamination Tuning: Fine-tune model parameters, hyperparameter settings, and contamination thresholds strictly within the designated training partition. Restricting calibration to training splits prevents data leakage and ensures that the model generalizes well to unseen repository activity patterns.

13. Out-of-Sample Evaluation Gate: Evaluate final out-of-sample anomaly detection accuracy exactly once on the frozen StarScout test set. Record final AUC and precision-recall metrics to establish unbiased performance results without iterative overfitting to the evaluation split.

14. Deliverable Packaging & Archiving: Finalize and deliver a fully reproducible end-to-end anomaly detection notebook, a structured repository risk matrix, and a comprehensive technical report detailing discovered fake-star patterns, system architecture, and operational recommendations for ongoing monitoring.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of detecting fake developer star-bursts and anomalous trust signals in open-source GitHub repositories for Microsoft. Identify key stakeholders, target users, and security workflows. Inputs include GHArchive event logs and StarScout activity datasets; outputs are anomaly risk scor"},{num:2,title:"Data Ingestion Protocol",desc:"Ingest the complete suite of GHArchive event datasets, repository metadata sheets, and StarScout anomalous activity labeling logs. Establish structured connections and pipeline ingestion scripts to read raw repository activity logs, target repository metadata, and existing trust benchmark annotation"},{num:3,title:"Critical Data Gate - Data Ingestion Limit Gate",desc:"Programmatically subsample and filter the massive GHArchive JSON databases down to a structured record payload strictly under 1 GB. This step guarantees that all subsequent processing, parsing, and graph feature transformations execute smoothly and stably within free-tier Google Colab memory constra"},{num:4,title:"Log Cleaning & Payload Parsing",desc:"Parse and clean raw, unstructured JSON payload event logs. Standardize and normalize key entity fields across all records, including unique usernames, event timestamps, action types, and target repository strings to prepare consistent, clean data formats for structural graph construction and behavio"},{num:5,title:"Feature Table Construction",desc:"Build a comprehensive repository-level feature table calculating critical behavioral metrics. Derive key risk indicators including actor-to-star ratios, repository creation dates, user account age distributions, event spikes, and peak star-velocity bursts to capture dynamic activity anomalies across"},{num:6,title:"Data Validation & Assertion Checks",desc:"Write automated data validation assertions to enforce logical integrity across all constructed feature columns. Ensure that derived user account ages, follower counts, star events, and action frequencies fall within realistic parameters, systematically flagging and eliminating corrupted or malformed"},{num:7,title:"Rule-Based Baseline Definition",desc:"Freeze a deterministic, rule-based anomaly baseline to serve as an initial benchmark. Define hard heuristics that automatically flag suspicious projects, such as repositories where over 80% of stars originate from user accounts created within the preceding 48-hour window."},{num:8,title:"Unsupervised Model Training",desc:"Train unsupervised anomaly detection models, including Isolation Forests, Local Outlier Factors (LOF), and PyOD Autoencoders, on the scaled feature tables. Learn complex, non-linear representations of repository engagement patterns to identify hidden coordinate attacks and artificial engagement netw"},{num:9,title:"Model Scoring & Validation",desc:"Validate model predictions against the StarScout gold-standard labels to evaluate performance quantitatively. Compute evaluation metrics, including precision-recall curves and ROC-AUC scores, to measure how reliably the unsupervised models distinguish real organic growth from synthetic star manipula"},{num:10,title:"False-Positive Rate Auditing",desc:"Audit and analyze false-positive rates across top-scoring repositories to prevent system misclassifications. Ensure that legitimate, highly viral open-source projects experiencing natural rapid growth are not mistakenly penalized or labeled as suspicious by the anomaly detection algorithms."},{num:11,title:"Trust Grade Mapping",desc:"Map model anomaly scoring thresholds directly into an intuitive, user-friendly 1-to-5 repository 'Trust Grade' system. This structured rating format translates complex multi-dimensional risk vectors into readable, actionable insights for developers, security auditors, and software procurement manage"},{num:12,title:"Hyperparameter & Contamination Tuning",desc:"Fine-tune model parameters, hyperparameter settings, and contamination thresholds strictly within the designated training partition. Restricting calibration to training splits prevents data leakage and ensures that the model generalizes well to unseen repository activity patterns."},{num:13,title:"Out-of-Sample Evaluation Gate",desc:"Evaluate final out-of-sample anomaly detection accuracy exactly once on the frozen StarScout test set. Record final AUC and precision-recall metrics to establish unbiased performance results without iterative overfitting to the evaluation split."},{num:14,title:"Deliverable Packaging & Archiving",desc:"Finalize and deliver a fully reproducible end-to-end anomaly detection notebook, a structured repository risk matrix, and a comprehensive technical report detailing discovered fake-star patterns, system architecture, and operational recommendations for ongoing monitoring."}]},{id:"1027",title:"Native Garden Design using AI",org:"Microsoft",advisor:"Aarti Dwivedi",ml_type:"Time Series Analysis",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Time Series",objective:"Forecast 7-day water level in a groundwater well using LSTM.",metrics:"Prediction within 30% of the ground truth (submission also mentions 20%; confirm final threshold with advisor).",data_link:"Zenodo",sep:"September (EDA Focus): Load database, visualize temporal trends, use rolling statistics to detect trends and seasonality, plot autocorrelation and partial autocorrelation, impute missing values using interpolation.",oct:"October: Learn fundamentals of LSTM; start training LSTM on main dataset; identify 10 features most relevant to target water level.",nov:"November: Continue experimenting with model and produce visualizations.",bottleneck:"Key bottlenecks: handling a 1–5 GB time-series dataset (I/O and memory limits), missing data imputation, correct time-series cross-validation (walk‑forward), preventing data leakage, and training/stabilizing LSTM models. Learning debt: implementing baselines (persistence, ARIMA/Prophet), scaling/normalization, sequence windowing, and, if attempted, handling multivariate features and dataset merges.",recommendation:"Require baseline models (persistence and at least one classical method such as ARIMA or Prophet) and mandatory walk‑forward cross‑validation; compare LSTM results to these baselines. Optionally extend to multivariate covariates from GROW or public climate data and/or a simple inference dashboard only if data availability and project timeline permit.",summary:"Handling large time-series datasets presents key risks around memory limits, data leakage, and stabilizing LSTM training. To address this, teams must establish classical baselines like persistence or ARIMA alongside mandatory walk-forward cross-validation before evaluating complex models. Advanced multivariate features and dashboard deployments should be treated strictly as optional stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting localized groundwater level fluctuations to guide ecological garden designs for Microsoft. Identify stakeholders, target users, operational workflows, and key decisions. Specify inputs like well telemetry logs, outputs such as 30-day hydration trends, scope boundaries, and operational risks like drought-related plant die-offs.
2.  Data Ingestion: Ingest and combine all relevant regional data sources into a centralized pipeline. This includes groundwater well telemetry logs, USGS soil moisture tables, regional meteorological histories, and comprehensive native plant species catalogs necessary for downstream ecological modeling.
3.  Spatial-Temporal Index Alignment: Verify and align spatial and temporal indexes across all ingested datasets. Ensure that geographic coordinates, timestamps, and observational frequencies match cleanly between groundwater well telemetry, USGS soil moisture records, and regional meteorological measurement grids.
4.  Chronological Train/Test Split: Enforce a strict chronological train and test split across the dataset. Isolate the final full year of USGS data to prevent time-series lookahead leakage during training, ensuring reliable out-of-sample model evaluation.
5.  Missing Data Imputation: Inspect the ingested time-series dataset for missing groundwater level records. Apply localized spatial-interpolation imputation methods to fill data gaps while maintaining temporal sequence continuity required for sequential model training.
6.  Exploratory Lag Analysis: Plot historical groundwater level fluctuations alongside regional precipitation anomalies. Analyze recharge delay times, seasonal trends, and soil absorption constraints to establish informative lag features for predictive modeling.
7.  Physical Constraint Assertions: Write and execute explicit boundary assertions within the data pipeline. Validate that imputed and processed groundwater depths, moisture indices, and environmental values strictly adhere to realistic physical soil and hydrological constraints.
8.  Classical Baseline Modeling: Construct and freeze a classical time-series baseline model, such as ARIMA or Prophet. Generate initial forecasts for well hydration levels 30 days into the future to establish quantitative performance benchmarks.
9.  Deep Learning Sequence Modeling: Upgrade the forecasting pipeline by training sequence-based deep learning models, such as LSTMs or GRUs. Utilize calculated lag sensor features to capture complex non-linear patterns and improve multi-step hydration prediction accuracy.
10. Walk-Forward Cross-Validation Gate: Implement a mandatory walk-forward temporal cross-validation protocol. Evaluate model stability over expanding time horizons to verify that future lookahead data is strictly excluded during historical prediction training.
11. Baseline Parity Verification: Compare deep learning model outputs against frozen classical baselines. Verify that the advanced sequence model achieves a statistically significant reduction in Root Mean Squared Error (RMSE) across key test scenarios.
12. Hyperparameter & Window Tuning: Perform systematic hyperparameter tuning for neural network architectures, learning rates, and lag window sizes. Conduct all optimization experiments strictly within the designated training split to avoid validation data leakage.
13. Final Out-of-Sample Evaluation: Evaluate the finalized, hyperparameter-locked time-series forecasting model exactly once. Test performance against the completely isolated out-of-sample validation year to record unbiased final accuracy metrics.
14. Deliverables & Documentation: Deliver a complete project package including a runnable Google Colab time-series forecasting pipeline, interactive native plant recommendation mapping notebooks, and a detailed model card documenting system limitations and operational parameters.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of predicting localized groundwater level fluctuations to guide ecological garden designs for Microsoft. Identify stakeholders, target users, operational workflows, and key decisions. Specify inputs like well telemetry logs, outputs such as 30-day hydration trends, scope boun"},{num:2,title:"Data Ingestion",desc:"Ingest and combine all relevant regional data sources into a centralized pipeline. This includes groundwater well telemetry logs, USGS soil moisture tables, regional meteorological histories, and comprehensive native plant species catalogs necessary for downstream ecological modeling."},{num:3,title:"Spatial-Temporal Index Alignment",desc:"Verify and align spatial and temporal indexes across all ingested datasets. Ensure that geographic coordinates, timestamps, and observational frequencies match cleanly between groundwater well telemetry, USGS soil moisture records, and regional meteorological measurement grids."},{num:4,title:"Chronological Train/Test Split",desc:"Enforce a strict chronological train and test split across the dataset. Isolate the final full year of USGS data to prevent time-series lookahead leakage during training, ensuring reliable out-of-sample model evaluation."},{num:5,title:"Missing Data Imputation",desc:"Inspect the ingested time-series dataset for missing groundwater level records. Apply localized spatial-interpolation imputation methods to fill data gaps while maintaining temporal sequence continuity required for sequential model training."},{num:6,title:"Exploratory Lag Analysis",desc:"Plot historical groundwater level fluctuations alongside regional precipi Test performance against the completely isolated out-of-sample validation year to record unbiased final accuracy metrics."},{num:14,title:"Deliverables & Documentation",desc:"Deliver a complete project package including a runnable Google Colab time-series forecasting pipeline, interactive native plant recommendation mapping notebooks, and a detailed model card documenting system limitations and operational parameters."}]},{id:"1028",title:"Forecasting risk of harmful algal blooms in coastal marine ecosystems.",org:"Oregon State University",advisor:"Jack Buckner",ml_type:"Classification, Regression, Time Series, Geo",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"Time Series",objective:"Forecast HAB events using oceanographic/satellite data and regression models.",metrics:"Unbiased out-of-sample predictive skill.",data_link:"Copernicus Marine Services",sep:"Month 1 (Feature Engineering & EDA): Work with geospatial/temporal data; use data visualization methods to identify key spatial and temporal relationships; select features and model structures leveraging these patterns.",oct:"Month 2 (Model Training & Validation): Train and validate model predicting HAB events; design validation protocols to handle spatial and temporal autocorrelation to avoid data leakage; produce unbiased estimates of out-of-sample skill.",nov:"Month 3 (Model Deployment): Deploy model for forecasting by coupling with ocean condition forecasts from Copernicus Marine Services (CMS/ESA) and NOAA; deploy model to a map-based web interface displaying HAB risk forecasts.",bottleneck:"Geo-spatial modeling carries a massive risk of spatial and temporal data leakage during validation. Additionally, querying the Copernicus Marine Services APIs to align high-resolution remote sensing data is a complex data engineering task that can stall early ML prototyping.",recommendation:"Strongly accept the advisor's offer to provide a pre-processed, user-friendly dataset of the remote sensing variables. This completely bypasses the API data engineering hurdles and allows students to focus squarely on unbiased validation techniques and regression modeling.",summary:"Geo-spatial modeling poses a high risk of spatial and temporal data leakage during validation, while querying live remote sensing APIs creates heavy data engineering friction. To mitigate these issues, teams should utilize the advisor-provided pre-processed dataset to bypass API hurdles. This approach allows students to focus directly on robust, leakage-free validation techniques and regression modeling.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of predicting localized harmful algal bloom events to protect coastal ecosystems for Oregon State University. Identify stakeholders like fisheries and safety officers. Inputs include temperature, salinity, and wind data; outputs are risk scores. Scope focuses on hazard mapping while considering economic and public health risks.

2.  Data Ingestion Gate: Ingest coastal water temperature logs, oceanographic salinity indicators, regional wind velocities, and historical algal bloom occurrence records into a centralized pipeline. Ensure all incoming environmental datasets are formatted correctly and made accessible for downstream processing, feature engineering, and model training.

3.  Geospatial Coordination Verification: Verify that marine coordinate grids are joined cleanly with meteorological station feeds without dropped geographic coordinates. Confirm spatial alignment across diverse data sources to maintain data integrity, preventing misaligned spatial mapping during subsequent modeling stages.

4.  Spatial Cross-Validation Enforcement: Enforce a spatial-block cross-validation split by separating monitoring stations geographically into distinct train/test splits. This crucial step prevents spatial autocorrelation leakage and ensures that the model demonstrates genuine predictive performance on unseen coastal locations.

5.  Sensor Telemetry Inspection & Imputation: Inspect the raw marine sensor logs for missing telemetry lines and implement local rolling-mean interpolations over missing data frames. Cleaning these data gaps maintains signal continuity across spatial and temporal sequences without introducing artificial statistical noise.

6.  Exploratory Anomaly Analysis: Plot algal bloom densities against sea-surface temperature anomalies to identify critical environmental thresholds that precede rapid bloom development. Document key bivariate relationships and non-linear patterns to guide effective feature engineering efforts.

7.  Data Constraint Validation Assertions: Write strict data validation assertions ensuring incoming oceanographic metrics, such as temperature and salinity readings, remain strictly within physical domain constraints (e.g., salinity \\>= 0). Automatically flag or reject anomalous sensor readings before model ingestion.

8.  Naive Persistence Baseline Establishment: Freeze a standard naive persistence baseline model that predicts tomorrow's bloom risk based on the current day's risk score. This establishes a clear performance floor against which complex machine learning algorithms are objectively measured.

9.  Predictive Feature Engineering: Engineer lag features and rolling averages representing marine nutrient density and cumulative wind shear over 7-day, 14-day, and 30-day windows. Capture crucial temporal dynamics and environmental momentum driving algal growth.

10. Supervised Classification Model Training: Train supervised classifiers, such as XGBoost or Random Forest, on the processed lag feature tables to accurately predict harmful algal bloom risk levels across target coastal zones.

11. Imbalanced Classification Performance Auditing: Audit classification performance using imbalanced-learning metrics, prioritizing PR-AUC and F1-score over raw accuracy to properly account for the rarity of bloom events and avoid false confidence.

12. Architecture Complexity Gate: Verify that complex deep learning or neural network architectures are only attempted if they demonstrate a verified, statistically significant performance boost over baseline gradient boosted tree models.

13. Spatial Hyperparameter Tuning Constraints: Tune model hyperparameters and decision thresholds strictly within designated spatial training blocks. This isolation prevents test fold contamination and guarantees unbiased out-of-sample skill evaluation.

14. Isolated Out-of-Sample Evaluation: Evaluate the finalized forecasting model exactly once against the isolated spatial test blocks reserved in September to verify genuine generalization and real-world predictive utility.

15. Deliverable Packaging & Documentation: Deliver a fully reproducible forecasting notebook, interactive regional HAB risk maps, and a comprehensive model card detailing system architecture, validation metrics, and performance limits across marine stations.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of predicting localized harmful algal bloom events to protect coastal ecosystems for Oregon State University. Identify stakeholders like fisheries and safety officers. Inputs include temperature, salinity, and wind data; outputs are risk scores. Scope focuses on hazard mapping whi"},{num:2,title:"Data Ingestion Gate",desc:"Ingest coastal water temperature logs, oceanographic salinity indicators, regional wind velocities, and historical algal bloom occurrence records into a centralized pipeline. Ensure all incoming environmental datasets are formatted correctly and made accessible for downstream processing, feature eng"},{num:3,title:"Geospatial Coordination Verification",desc:"Verify that marine coordinate grids are joined cleanly with meteorological station feeds without dropped geographic coordinates. Confirm spatial alignment across diverse data sources to maintain data integrity, preventing misaligned spatial mapping during subsequent modeling stages."},{num:4,title:"Spatial Cross-Validation Enforcement",desc:"Enforce a spatial-block cross-validation split by separating monitoring stations geographically into distinct train/test splits. This crucial step prevents spatial autocorrelation leakage and ensures that the model demonstrates genuine predictive performance on unseen coastal locations."},{num:5,title:"Sensor Telemetry Inspection & Imputation",desc:"Inspect the raw marine sensor logs for missing telemetry lines and implement local rolling-mean interpolations over missing data frames. Cleaning these data gaps maintains signal continuity across spatial and temporal sequences without introducing artificial statistical noise."},{num:6,title:"Exploratory Anomaly Analysis",desc:"Plot algal bloom densities against sea-surface temperature anomalies to identify critical environmental thresholds that precede rapid bloom development. Document key bivariate relationships and non-linear patterns to guide effective feature engineering efforts."},{num:7,title:"Data Constraint Validation Assertions",desc:"Write strict data validation assertions ensuring incoming oceanographic metrics, such as temperature and salinity readings, remain strictly within physical domain constraints (e.g., salinity \\>= 0). Automatically flag or reject anomalous sensor readings before model ingestion."},{num:8,title:"Naive Persistence Baseline Establishment",desc:"Freeze a standard naive persistence baseline model that predicts tomorrow's bloom risk based on the current day's risk score. This establishes a clear performance floor against which complex machine learning algorithms are objectively measured."},{num:9,title:"Predictive Feature Engineering",desc:"Engineer lag features and rolling averages representing marine nutrient density and cumulative wind shear over 7-day, 14-day, and 30-day windows. Capture crucial temporal dynamics and environmental momentum driving algal growth."},{num:10,title:"Supervised Classification Model Training",desc:"Train supervised classifiers, such as XGBoost or Random Forest, on the processed lag feature tables to accurately predict harmful algal bloom risk levels across target coastal zones."},{num:11,title:"Imbalanced Classification Performance Auditing",desc:"Audit classification performance using imbalanced-learning metrics, prioritizing PR-AUC and F1-score over raw accuracy to properly account for the rarity of bloom events and avoid false confidence."},{num:12,title:"Architecture Complexity Gate",desc:"Verify that complex deep learning or neural network architectures are only attempted if they demonstrate a verified, statistically significant performance boost over baseline gradient boosted tree models."},{num:13,title:"Spatial Hyperparameter Tuning Constraints",desc:"Tune model hyperparameters and decision thresholds strictly within designated spatial training blocks. This isolation prevents test fold contamination and guarantees unbiased out-of-sample skill evaluation."},{num:14,title:"Isolated Out-of-Sample Evaluation",desc:"Evaluate the finalized forecasting model exactly once against the isolated spatial test blocks reserved in September to verify genuine generalization and real-world predictive utility."},{num:15,title:"Deliverable Packaging & Documentation",desc:"Deliver a fully reproducible forecasting notebook, interactive regional HAB risk maps, and a comprehensive model card detailing system architecture, validation metrics, and performance limits across marine stations."}]},{id:"1029",title:"Predicting Organ Transplant Waitlist Outcomes & Optimizing Allocation Insights",org:"Healthcare",advisor:"Deepti Bahel, Beth Parnell",ml_type:"Classification, Regression, Clustering, Time Series",evaluation:"Material corrections needed",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Predictive modeling & survival analysis",objective:"Predict which waitlisted patients are at highest risk and their expected wait times using baseline classification and Cox PH survival models; analyze allocation disparities and key drivers to improve transparency in organ allocation.",metrics:"Classification: ROC-AUC ≥ 0.78; PR-AUC ≥ 0.65; Brier score ≤ 0.18 with well-behaved calibration; top-decile lift ≥ 2.5x. Survival (Cox PH): C-index ≥ 0.72; Integrated Brier Score ≤ 0.20; report time-dependent AUC at 6, 12, and 24 months. Baseline vs. advanced: any advanced model must beat the logistic/Kaplan–Meier baseline with a bootstrap 95% CI on the metric difference excluding zero, or report the null result. Fairness: report disparity metrics across blood type, OPTN region, age band, sex, and race/ethnicity; provide subgr
