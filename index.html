e cases, rate limits, timeouts, and out-of-distribution inputs while implementing exponential backoff. Require grounded cit"},{num:11,title:"Controlled Development Tuning & Final Evaluation",desc:"Tune prompts, chunk sizes, and retrieval depth strictly on development data. Freeze the complete pipeline before opening test results. Execute the final evaluation script exactly once against the isolated test set, reporting retrieval and generation metrics separately with confidence intervals where"},{num:12,title:"Stretch Goals & Agentic Extensions",desc:"Gate agentic extensions until a non-agentic RAG baseline is frozen and validated. Pursue stretch goals—such as calibration analysis, fairness auditing, fine-tuning open models, severity scoring, or LLM-judge rubrics—only after core pipeline completion. Isolate tools, reranking, and multi-agent workf"},{num:13,title:"Responsible Reporting & Reproducibility Packaging",desc:"Build a Streamlit demo UI, conduct final evaluations, document limitations, and assemble presentation deliverables. Archive raw/processed data manifests, splits, seeds, environment configurations, prompts, and metrics in a structured GitHub repository. Distinguish execution readiness from deployment"}]},{id:"1004",title:"Predict the Supply Chain disruptions",org:"Accenture",advisor:"Ashok Shivarajan",ml_type:"Classification, Regression, Rec Sys, NLP, Time Series, DL, LLMs, Transfer Learning",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Cleaned and ready for training",difficulty:"Sweet Spot",domain:"Time Series",objective:"Build an AI system to predict supply chain disruptions and recommend mitigation actions.",metrics:"ROC-AUC, F1; RMSE, MAE; risk scoring quality (identify high-risk suppliers/routes; early warning); Business Impact; Explainability & Storytelling (executive narrative, visual dashboard); Innovation (optional scenario planning/Graph ML/simulation if attempted).",data_link:"https://www.kaggle.com/competitions/datathon-2022-upc-accenture/overview",sep:"Data cleaning/EDA, temporal feature engineering, and baseline model (e.g., logistic regression) to deliver a working ML model.",oct:"Model training and hyperparameter tuning (Random Forest, GBT) to produce a fine-tuned model; optional fairness analysis.",nov:"Robust working model able to work for real-time scenarios; final validation; visual dashboard and executive narrative; optional simple mitigation recommendations.",bottleneck:`The project's milestones are vaguely defined, requesting a "Working ML model" in month one. This skips foundational steps like exploratory data analysis, feature engineering, and handling the temporal complexities of supply chain data, creating a severe learning debt.`,recommendation:"Restructure September to focus on data cleaning, temporal feature engineering, and establishing a simple baseline with chronological validation. Keep recommended-actions optional and lightweight (heuristics or scenario planning); Graph ML/simulation only as stretch. Target a fine-tuned model in October and, by November, a robust model able to work for real-time scenarios plus a visual dashboard and executive narrative.",summary:"Vaguely defined early milestones risk skipping critical data cleaning, temporal feature engineering, and proper validation required for supply chain forecasting. To fix this, September should focus on foundational EDA, temporal feature prep, and establishing a simple chronological baseline while keeping mitigation recommendations lightweight. The team can then transition to model fine-tuning in October, ultimately delivering a real-time capable model paired with an executive dashboard by November.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of mitigating supply chain losses for Accenture. Key stakeholders include operations managers and logistics planners. Operational decisions focus on rerouting shipments and adjusting stock replenishment. Inputs cover historical tracking, weather, and transit logs, while outputs deliver disruption probabilities over a 14-day horizon to prevent costly emergency delays.

2.  Data Ingestion & Verification: Ingest the raw multi-source supply chain logs, shipment tracking tables, and carrier rate sheets provided by Accenture. Ensure all datasets are parsed cleanly, checking for missing file structures, correct column encodings, and full schema compatibility across disparate storage formats to lay a stable baseline for downstream feature engineering tasks.

3.  Timestamp Alignment & Normalization: Verify that timestamps across separate transit and storage files are parsed and unified into a single coherent timeline. Reconcile localized time zone differences across international routes, ensuring all event logs align chronologically so time-series calculations and event sequences reflect true historical progression accurately without temporal overlap.

4.  Chronological Validation Split: Enforce a strict chronological validation split by using historical pre-2026 data for training and reserved 2026 data for validation. This setup prevents future-lookahead data leakage and accurately simulates real-world deployment performance when predicting upcoming delays on unseen operational schedules.

5.  Missing Data Imputation: Inspect the proportion of missing values in key transit metrics, such as actual transit days and shipping costs. Implement robust median imputation strategies or forward-fill methods tailored to specific carrier-route groupings to replace missing attributes while maintaining realistic parameter distributions across historical logs.

6.  Temporal Exploratory Data Analysis: Plot the temporal distribution of historical supply chain disruptions to identify underlying seasonal cycles, recurring shipping bottlenecks, and extreme operational outliers. Use these insights to guide domain-specific feature extraction and identify specific time windows where disruption risks peak across primary transit corridors.

7.  Data Quality & Boundary Assertions: Write strict boundary assertions, such as confirming positive transit durations and non-zero shipping costs, to programmatically filter out malformed or corrupted records. Enforce standard schema constraints across incoming data feeds to guarantee downstream model stability and clean tabular feature arrays.

8.  Baseline Model Development: Freeze a naive seasonal persistence baseline model assuming future delays directly mirror historical averages for each carrier-route pair. Establishing this quantitative performance floor provides a benchmark to measure gains from complex machine learning architectures deployed in subsequent project phases.

9.  Feature Engineering & Lag Indicators: Engineer domain-specific temporal features, including 7-day and 14-day rolling delay averages on identical shipping routes. Integrate local meteorological indicators, seasonal trend variables, and carrier reliability metrics to capture environmental and operational factors driving unexpected supply chain bottlenecks.

10. Predictive Model Training: Train class-weighted gradient boosted decision trees, such as XGBoost or LightGBM, to predict binary disruption events on imbalanced data. Evaluate predictive quality primarily using PR-AUC and F1-score to balance sensitivity toward rare disruption events against false alarm rates.

11. Cross-Regional Calibration Audit: Audit the model's predictive performance across distinct geographical regions, trade lanes, and carrier classes to verify calibration stability. Ensure error rates and risk probabilities remain uniform across sub-populations, preventing regional performance bias in real-time operational environments.

12. Pipeline Stress-Testing: Stress-test the end-to-end data pipeline using synthetic delayed logs, corrupted input schemas, missing weather attributes, and out-of-distribution transit weights. Verify that pre-processing scripts fail gracefully, log exceptions clearly, and maintain robust inference capability under adverse runtime scenarios.

13. Hyperparameter Optimization & Test Evaluation: Perform final hyperparameter tuning and decision threshold optimization strictly within nested training folds. Once configuration is finalized, evaluate model performance exactly once on the frozen, unseen test partition to report unbiased performance metrics for production review.

14. Dashboard Delivery & Solution Deployment: Deliver a fully runnable Google Colab notebook alongside an interactive Streamlit dashboard. Display predictive disruption risk scores, SHAP feature importance visualizations, and carrier recommendation tables to support data-driven decision-`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of mitigating supply chain losses for Accenture. Key stakeholders include operations managers and logistics planners. Operational decisions focus on rerouting shipments and adjusting stock replenishment. Inputs cover historical tracking, weather, and transit logs, while outpu"},{num:2,title:"Data Ingestion & Verification",desc:"Ingest the raw multi-source supply chain logs, shipment tracking tables, and carrier rate sheets provided by Accenture. Ensure all datasets are parsed cleanly, checking for missing file structures, correct column encodings, and full schema compatibility across disparate storage formats to lay a stab"},{num:3,title:"Timestamp Alignment & Normalization",desc:"Verify that timestamps across separate transit and storage files are parsed and unified into a single coherent timeline. Reconcile localized time zone differences across international routes, ensuring all event logs align chronologically so time-series calculations and event sequences reflect true h"},{num:4,title:"Chronological Validation Split",desc:"Enforce a strict chronological validation split by using historical pre-2026 data for training and reserved 2026 data for validation. This setup prevents future-lookahead data leakage and accurately simulates real-world deployment performance when predicting upcoming delays on unseen operational sch"},{num:5,title:"Missing Data Imputation",desc:"Inspect the proportion of missing values in key transit metrics, such as actual transit days and shipping costs. Implement robust median imputation strategies or forward-fill methods tailored to specific carrier-route groupings to replace missing attributes while maintaining realistic parameter dist"},{num:6,title:"Temporal Exploratory Data Analysis",desc:"Plot the temporal distribution of historical supply chain disruptions to identify underlying seasonal cycles, recurring shipping bottlenecks, and extreme operational outliers. Use these insights to guide domain-specific feature extraction and identify specific time windows where disruption risks pea"},{num:7,title:"Data Quality & Boundary Assertions",desc:"Write strict boundary assertions, such as confirming positive transit durations and non-zero shipping costs, to programmatically filter out malformed or corrupted records. Enforce standard schema constraints across incoming data feeds to guarantee downstream model stability and clean tabular feature"},{num:8,title:"Baseline Model Development",desc:"Freeze a naive seasonal persistence baseline model assuming future delays directly mirror historical averages for each carrier-route pair. Establishing this quantitative performance floor provides a benchmark to measure gains from complex machine learning architectures deployed in subsequent project"},{num:9,title:"Feature Engineering & Lag Indicators",desc:"Engineer domain-specific temporal features, including 7-day and 14-day rolling delay averages on identical shipping routes. Integrate local meteorological indicators, seasonal trend variables, and carrier reliability metrics to capture environmental and operational factors driving unexpected supply "},{num:10,title:"Predictive Model Training",desc:"Train class-weighted gradient boosted decision trees, such as XGBoost or LightGBM, to predict binary disruption events on imbalanced data. Evaluate predictive quality primarily using PR-AUC and F1-score to balance sensitivity toward rare disruption events against false alarm rates."},{num:11,title:"Cross-Regional Calibration Audit",desc:"Audit the model's predictive performance across distinct geographical regions, trade lanes, and carrier classes to verify calibration stability. Ensure error rates and risk probabilities remain uniform across sub-populations, preventing regional performance bias in real-time operational environments"},{num:12,title:"Pipeline Stress-Testing",desc:"Stress-test the end-to-end data pipeline using synthetic delayed logs, corrupted input schemas, missing weather attributes, and out-of-distribution transit weights. Verify that pre-processing scripts fail gracefully, log exceptions clearly, and maintain robust inference capability under adverse runt"},{num:13,title:"Hyperparameter Optimization & Test Evaluation",desc:"Perform final hyperparameter tuning and decision threshold optimization strictly within nested training folds. Once configuration is finalized, evaluate model performance exactly once on the frozen, unseen test partition to report unbiased performance metrics for production review."},{num:14,title:"Dashboard Delivery & Solution Deployment",desc:"Deliver a fully runnable Google Colab notebook alongside an interactive Streamlit dashboard. Display predictive disruption risk scores, SHAP feature importance visualizations, and carrier recommendation tables to support data-driven decision-making for logistics coordinators and operations managers."}]},{id:"1008",title:"Discovering Customer Lifecycle States and Behavioral Drift for Early Churn Detection Using Explainable AI and Generative AI",org:"Amazon",advisor:"Aryyama Jana, Lakshmi Kachireddy",ml_type:"Classification, Clustering, NLP, Time Series, GenAI",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Detect early behavioral changes before churn and generate interpretable risk summaries using GenAI.",metrics:"Accuracy, precision, recall, F1, ROC-AUC, early-warning horizon; interpretability of lifecycle states; GenAI summary quality (evaluated qualitatively for accuracy, clarity, and usefulness).",data_link:"https://archive.ics.uci.edu/dataset/502/online%2Bretail%2Bii, https://www.kaggle.com/datasets/retailrocket/ecommerce-dataset",sep:"Understand business problem, explore public datasets (Online Retail II, RetailRocket), clean data, define practical churn label, and create first version of customer-time feature table (frequency, activity count, revenue, unique items, AOV, recency). Deliverable: Colab notebook converting raw data into customer behavior features.",oct:"Build baseline models (Logistic Regression, Random Forest, XGBoost) and evaluate via precision, recall, F1, ROC-AUC; engineer behavioral drift features comparing current vs. previous customer behavior (changes in frequency, revenue, activity). Deliverable: Baseline churn models and drift scoring approach.",nov:"Apply clustering (K-Means, GMM, HDBSCAN) to discover latent lifecycle states (active buyer, occasional buyer, declining, at-risk); compare the lifecycle-state and behavioral-drift approaches against the baseline; measure the early-warning detection horizon; apply SHAP/feature attribution; add a lightweight GenAI layer that converts outputs to plain-English risk summaries. Deliverable: End-to-end demo and explainable GenAI summaries.",bottleneck:"Fusing time-series behavioral drift calculations, unsupervised clustering for lifecycle states, and Generative AI summaries into a single cohesive pipeline requires strict systems orchestration. Debugging sequential dependencies between these models can quickly consume the entire timeline.",recommendation:"The project is exceptionally well-structured but heavy. Advise the team to strictly sandbox the Generative AI summarization component until the core clustering and drift detection models are fully validated and achieving their baseline performance targets.",summary:"Combining behavioral drift calculations, unsupervised clustering, and GenAI summaries into a single pipeline creates complex sequential dependencies that risk consuming the project timeline. To manage this technical debt, the team should strictly sandbox the Generative AI layer until the core clustering and drift detection models are fully validated. This ensures primary predictive performance targets are met before integrating downstream generative features.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of identifying early customer churn indicators and behavioral drift across enterprise shopper segments for Amazon. Key stakeholders include marketing managers and customer success executives. Operational workflows target proactive outreach using multi-year transaction logs, search history, and support records. Outputs comprise churn probability scores and lifecycle classifications, bounded strictly to risk indexing without automating billing or promo executions.
2.  Data Ingestion & Integration: Ingest anonymized transactional records, search history logs, and repeat-purchase datasets provided by Amazon. Establish robust data loading pipelines to efficiently process multi-year customer activity, verifying structural integrity and schema consistency across all relational tables before downstream processing.
3.  Timeline & Churn Definition Boundary: Construct a strict temporal boundary to define customer churn, such as zero purchase activity over 90 consecutive days. Enforce rigid observation and outcome windows to prevent lookahead feature leakage and ensure realistic historical simulation during model training.
4.  Identifier Cleaning & Record Parsing: Clean and standardize raw customer identifiers across disparate logs. Address missing transaction amounts, handle null records, normalize timestamp formats, and accurately log account signup dates to establish a clean, continuous customer history matrix for feature extraction.
5.  Cohort-Level RFM Feature Construction: Engineer comprehensive Recency, Frequency, and Monetary (RFM) feature tables aggregated at the customer-cohort level. Calculate summary statistics across rolling time windows, while actively detecting and analyzing extreme monetary skews or anomalous purchasing bursts within high-value accounts.
6.  Feature Scaling & Transformation: Apply log transformations and standard scaling to the constructed RFM feature set. Mitigate the impact of extreme monetary and activity outliers, ensuring balanced feature distribution shapes that prevent high-magnitude variables from distorting distance-based clustering algorithms.
7.  Unsupervised Customer Segmentation: Train K-Means and Hierarchical Clustering models on transformed feature vectors. Evaluate mathematical segment separation using Silhouette scores and Elbow method curves to programmatically determine the optimal number of latent customer clusters and lifecycle states.
8.  Temporal Cluster Stability Validation: Assess cluster consistency and structural stability across distinct temporal sign-up cohorts, such as comparing Q1 versus Q2 customer groups. Ensure identified behavioral segments remain robust over time and do not overfit to seasonal transaction anomalies.
9.  Supervised Churn Prediction Modeling: Train a supervised XGBoost classification model to forecast customer churn risk. Evaluate predictive accuracy strictly using Precision-Recall Area Under the Curve (PR-AUC) and F1-score metrics to effectively manage class imbalance inherent in customer retention datasets.
10. Drift Scoring & Segment Decay Monitoring: Implement a dedicated behavioral drift-scoring module using metrics like the Population Stability Index (PSI). Monitor feature distribution shifts and segment decay over time to flag decaying model performance and trigger timely retraining cycles.
11. Qualitative Cohort Summarization via LLM: Integrate a pre-trained LLM utilizing localized prompt templates to generate qualitative text summaries for each identified customer cohort. Translate complex mathematical cluster centroids into actionable plain-English risk descriptions for business stakeholders.
12. GenAI Layer Sandboxing & Safeguards: Verify that the Generative AI summarization component is fully sandboxed from the primary execution pipeline. Enforce strict controls to prevent recursive LLM reasoning loops, ensuring API quota limits and execution runtimes remain fully bounded during batch processing.
13. Chronological Evaluation & Backtesting: Execute a strict chronological backtest by training models on the initial 9 months of historical transaction data and evaluating predictive performance solely on the subsequent 3 months, accurately mirroring real-world deployment constraints.
14. Interactive Dashboard Packaging: Package the end-to-end analytical pipeline into an interactive Streamlit application. Visualize active customer lifecycle segments, display real-time individual churn risk alerts, and surface automated GenAI cohort summaries for marketing and retention teams.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of identifying early customer churn indicators and behavioral drift across enterprise shopper segments for Amazon. Key stakeholders include marketing managers and customer success executives. Operational workflows target proactive outreach using multi-year transaction logs, s"},{num:2,title:"Data Ingestion & Integration",desc:"Ingest anonymized transactional records, search history logs, and repeat-purchase datasets provided by Amazon. Establish robust data loading pipelines to efficiently process multi-year customer activity, verifying structural integrity and schema consistency across all relational tables before downst"},{num:3,title:"Timeline & Churn Definition Boundary",desc:"Construct a strict temporal boundary to define customer churn, such as zero purchase activity over 90 consecutive days. Enforce rigid observation and outcome windows to prevent lookahead feature leakage and ensure realistic historical simulation during model training."},{num:4,title:"Identifier Cleaning & Record Parsing",desc:"Clean and standardize raw customer identifiers across disparate logs. Address missing transaction amounts, handle null records, normalize timestamp formats, and accurately log account signup dates to establish a clean, continuous customer history matrix for feature extraction."},{num:5,title:"Cohort-Level RFM Feature Construction",desc:"Engineer comprehensive Recency, Frequency, and Monetary (RFM) feature tables aggregated at the customer-cohort level. Calculate summary statistics across rolling time windows, while actively detecting and analyzing extreme monetary skews or anomalous purchasing bursts within high-value accounts."},{num:6,title:"Feature Scaling & Transformation",desc:"Apply log transformations and standard scaling to the constructed RFM feature set. Mitigate the impact of extreme monetary and activity outliers, ensuring balanced feature distribution shapes that prevent high-magnitude variables from distorting distance-based clustering algorithms."},{num:7,title:"Unsupervised Customer Segmentation",desc:"Train K-Means and Hierarchical Clustering models on transformed feature vectors. Evaluate mathematical segment separation using Silhouette scores and Elbow method curves to programmatically determine the optimal number of latent customer clusters and lifecycle states."},{num:8,title:"Temporal Cluster Stability Validation",desc:"Assess cluster consistency and structural stability across distinct temporal sign-up cohorts, such as comparing Q1 versus Q2 customer groups. Ensure identified behavioral segments remain robust over time and do not overfit to seasonal transaction anomalies."},{num:9,title:"Supervised Churn Prediction Modeling",desc:"Train a supervised XGBoost classification model to forecast customer churn risk. Evaluate predictive accuracy strictly using Precision-Recall Area Under the Curve (PR-AUC) and F1-score metrics to effectively manage class imbalance inherent in customer retention datasets."},{num:10,title:"Drift Scoring & Segment Decay Monitoring",desc:"Implement a dedicated behavioral drift-scoring module using metrics like the Population Stability Index (PSI). Monitor feature distribution shifts and segment decay over time to flag decaying model performance and trigger timely retraining cycles."},{num:11,title:"Qualitative Cohort Summarization via LLM",desc:"Integrate a pre-trained LLM utilizing localized prompt templates to generate qualitative text summaries for each identified customer cohort. Translate complex mathematical cluster centroids into actionable plain-English risk descriptions for business stakeholders."},{num:12,title:"GenAI Layer Sandboxing & Safeguards",desc:"Verify that the Generative AI summarization component is fully sandboxed from the primary execution pipeline. Enforce strict controls to prevent recursive LLM reasoning loops, ensuring API quota limits and execution runtimes remain fully bounded during batch processing."},{num:13,title:"Chronological Evaluation & Backtesting",desc:"Execute a strict chronological backtest by training models on the initial 9 months of historical transaction data and evaluating predictive performance solely on the subsequent 3 months, accurately mirroring real-world deployment constraints."},{num:14,title:"Interactive Dashboard Packaging",desc:"Package the end-to-end analytical pipeline into an interactive Streamlit application. Visualize active customer lifecycle segments, display real-time individual churn risk alerts, and surface automated GenAI cohort summaries for marketing and retention teams."}]},{id:"1009",title:"Incrementality Modeling for Privacy-Conscious Retail Media and Data Clean Room Measurement",org:"Other",advisor:"Annamalai Annamalai",ml_type:"Classification, Causal inference, Uplift modeling / HTE",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Causal & Advanced Stats",objective:"Build an educational prototype ranking audiences by estimated incremental visit response.",metrics:"Uplift by audience decile; cumulative uplift curve; incremental visits captured in top-ranked audience groups; runtime and memory fit within Google Colab free tier (performance check).",data_link:"https://huggingface.co/datasets/criteo/criteo-uplift",sep:"Review incrementality, treatment/control experiments, and aggregate clean room measurement workflows; load reproducible stratified sample of Criteo dataset; create data dictionary; perform EDA (treatment/control balance, missing values, class imbalance, outcome rates); establish simple baselines.",oct:"Implement baseline uplift approaches (Two-Model / T-Learner and Transformed Outcome methods) using scikit-learn compatible tools; compare models for visit outcomes on held-out data using uplift metrics; treat conversion modeling as secondary.",nov:"Evaluate stability across samples and audience segments; document privacy, fairness, interpretability, and generalization limitations; select the best approach; produce reproducible notebooks, a model card, a results report, a clean room measurement note, and a final presentation.",bottleneck:'Causal inference, uplift modeling (T-learners), and heterogeneous treatment effects exist far outside standard introductory ML curriculums. Students will face a massive conceptual learning debt differentiating "incrementality" from standard supervised classification, risking severe project delays.',recommendation:"The Challenge Advisor must provide curated reading materials, explicit framework examples, and heavily scaffolded baseline code for uplift modeling during the first week. This bypasses the theoretical bottleneck and allows students to execute the Python workflows effectively.",summary:"Causal inference and uplift modeling fall outside standard ML curriculums, creating significant conceptual learning debt that risks delaying the project. To address this, the Challenge Advisor should provide curated reading materials, framework examples, and scaffolded baseline code during the first week. This support helps bypass theoretical hurdles so students can efficiently build the prototype for ranking incremental visit responses.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of measuring true causal lift for retail media advertising under strict privacy and clean-room constraints for Annamalai. Identify key stakeholders, target users, and operational workflows like budget allocation. Inputs include multi-channel campaign logs and transaction metrics, while outputs deliver causal treatment lift estimates. Scope is restricted to offline cohort-level causal inference to avoid DSP bidding risks and parallel trend overestimation.
2.  Multi-Channel Data Ingestion: Ingest all requisite data sources, including multi-channel retail media campaign tables, individual user-level ad impression records, and post-campaign product conversion history files. Verify data integrity, schema consistency, and proper temporal alignment across all ingested tables to ensure seamless downstream modeling and accurate treatment tracking across targeted customer segments.
3.  Cohort Profiling & Segmentation: Profile and segment the target consumer cohort across key behavioral and demographic attributes. Systematically analyze baseline characteristics to check for underlying differences between exposed and unexposed consumer groups, establishing a clear understanding of initial cohort distributions before applying propensity adjustments or causal modeling frameworks.
4.  Propensity Score Calculation: Calculate individual propensity scores for every user within the dataset using a binary Logistic Regression classifier. Model the precise probability of ad exposure based on observed baseline covariates to effectively quantify selection bias and prepare the consumer population for balanced treatment assignment comparisons in subsequent evaluation stages.
5.  Covariate Balancing via Matching or Weighting: Apply Propensity Score Matching (PSM) or Inverse Probability of Treatment Weighting (IPTW) techniques to construct strictly balanced treatment and control groups. This matching step controls for confounding variables and minimizes baseline bias between exposed and unexposed consumer cohorts prior to estimating treatment effects.
6.  Statistical Balance Diagnostics: Conduct rigorous statistical balance tests, such as evaluating Standardized Mean Differences (SMD), across all baseline covariates. Ensure that matched treatment and control groups achieve standardized mean differences under 0.1 to statistically verify that covariate imbalance has been successfully mitigated before downstream causal estimation.
7.  Naive Baseline Establishment: Freeze a standard A/B test baseline by performing a naive comparison of mean conversion rates between exposed and unexposed consumer groups. Document this unadjusted baseline rate to serve as a clear selection bias ceiling, highlighting the exact skew present before applying advanced causal inference corrections.
8.  Meta-Learning Model Training: Train advanced meta-learning architectures, including T-Learner, S-Learner, or X-Learner models, using Gradient Boosted Trees (GBTs). Estimate both Individual Treatment Effects (ITE) and Conditional Average Treatment Effects (CATE) across heterogeneous consumer segments to isolate true incremental campaign impact.
9.  Double-Robust Estimation: Compute double-robust treatment effect estimators to mathematically guarantee unbiased causal predictions, even if either the propensity score model or the outcome estimation model is misspecified. This dual protection layer strengthens statistical reliability across complex retail media clean-room evaluation environments.
10. Causal Sensitivity & Robustness Testing: Perform comprehensive causal sensitivity analyses, including Rosenbaum's bounds and placebo treatment tests, to evaluate model vulnerability to unobserved confounders. Confirm that the estimated incremental advertising lift remains robust against potential unmeasured biases before translating findings into strategic recommendations.
11. Subgroup Analysis & Budget Optimization: Conduct targeted subgroup analyses across refined consumer cohorts to identify specific customer segments exhibiting the highest incremental conversion lift. Leverage these uplift insights to directly optimize future retail media ad-spend allocations and maximize incremental return on ad spend across active marketing channels.
12. Test Partition Execution: Lock all matching, weighting, and causal estimation parameters strictly within the development fold. Once parameters are finalized, execute the final incrementality assessment exactly once against the frozen test partition to prevent data leakage and ensure uncompromised evaluation accuracy.
13. Comprehensive Deliverables & Reporting: Finalize a comprehensive causal inference report alongside a fully runnable execution notebook. Explicitly document matched balance diagnostics, final treatment effect estimates, and cost-per-incremental-conversion metrics to deliver clear, actionable decision support for clean-room stakeholders and media plann`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of measuring true causal lift for retail media advertising under strict privacy and clean-room constraints for Annamalai. Identify key stakeholders, target users, and operational workflows like budget allocation. Inputs include multi-channel campaign logs and transaction metrics, "},{num:2,title:"Multi-Channel Data Ingestion",desc:"Ingest all requisite data sources, including multi-channel retail media campaign tables, individual user-level ad impression records, and post-campaign product conversion history files. Verify data integrity, schema consistency, and proper temporal alignment across all ingested tables to ensure seam"},{num:3,title:"Cohort Profiling & Segmentation",desc:"Profile and segment the target consumer cohort across key behavioral and demographic attributes. Systematically analyze baseline characteristics to check for underlying differences between exposed and unexposed consumer groups, establishing a clear understanding of initial cohort distributions befor"},{num:4,title:"Propensity Score Calculation",desc:"Calculate individual propensity scores for every user within the dataset using a binary Logistic Regression classifier. Model the precise probability of ad exposure based on observed baseline covariates to effectively quantify selection bias and prepare the consumer population for balanced treatment"},{num:5,title:"Covariate Balancing via Matching or Weighting",desc:"Apply Propensity Score Matching (PSM) or Inverse Probability of Treatment Weighting (IPTW) techniques to construct strictly balanced treatment and control groups. This matching step controls for confounding variables and minimizes baseline bias between exposed and unexposed consumer cohorts prior to"},{num:6,title:"Statistical Balance Diagnostics",desc:"Conduct rigorous statistical balance tests, such as evaluating Standardized Mean Differences (SMD), across all baseline covariates. Ensure that matched treatment and control groups achieve standardized mean differences under 0.1 to statistically verify that covariate imbalance has been successfully "},{num:7,title:"Naive Baseline Establishment",desc:"Freeze a standard A/B test baseline by performing a naive comparison of mean conversion rates between exposed and unexposed consumer groups. Document this unadjusted baseline rate to serve as a clear selection bias ceiling, highlighting the exact skew present before applying advanced causal inferenc"},{num:8,title:"Meta-Learning Model Training",desc:"Train advanced meta-learning architectures, including T-Learner, S-Learner, or X-Learner models, using Gradient Boosted Trees (GBTs). Estimate both Individual Treatment Effects (ITE) and Conditional Average Treatment Effects (CATE) across heterogeneous consumer segments to isolate true incremental c"},{num:9,title:"Double-Robust Estimation",desc:"Compute double-robust treatment effect estimators to mathematically guarantee unbiased causal predictions, even if either the propensity score model or the outcome estimation model is misspecified. This dual protection layer strengthens statistical reliability across complex retail media clean-room "},{num:10,title:"Causal Sensitivity & Robustness Testing",desc:"Perform comprehensive causal sensitivity analyses, including Rosenbaum's bounds and placebo treatment tests, to evaluate model vulnerability to unobserved confounders. Confirm that the estimated incremental advertising lift remains robust against potential unmeasured biases before translating findin"},{num:11,title:"Subgroup Analysis & Budget Optimization",desc:"Conduct targeted subgroup analyses across refined consumer cohorts to identify specific customer segments exhibiting the highest incremental conversion lift. Leverage these uplift insights to directly optimize future retail media ad-spend allocations and maximize incremental return on ad spend acros"},{num:12,title:"Test Partition Execution",desc:"Lock all matching, weighting, and causal estimation parameters strictly within the development fold. Once parameters are finalized, execute the final incrementality assessment exactly once against the frozen test partition to prevent data leakage and ensure uncompromised evaluation accuracy."},{num:13,title:"Comprehensive Deliverables & Reporting",desc:"Finalize a comprehensive causal inference report alongside a fully runnable execution notebook. Explicitly document matched balance diagnostics, final treatment effect estimates, and cost-per-incremental-conversion metrics to deliver clear, actionable decision support for clean-room stakeholders and"}]},{id:"1011",title:"Climate Risk Modeling for Supply Chain Resiliency",org:"Amazon Web Services",advisor:"Megan McKenzie",ml_type:"Classification, Regression, Time Series",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"Time Series",objective:"Build predictive risk model forecasting Sea Surface Temperature Anomalies to classify climate risks.",metrics:"Macro F1-Score; model interpretability (SHAP); pipeline completeness (modular, reproducible ingestion/cleaning/splitting); performance that significantly outperforms a naive/persistence baseline on held-out time-based partitions.",data_link:"https://archive.ics.uci.edu/dataset/122/el+nino",sep:"Deconstruct the business problem, initialize the coding environment, and build the structural blueprint. Deliverable: Technical scoping document mapping out individual team roles, task distributions, and initial data loading confirmations.",oct:"Clean the raw dataset and engineer robust predictive features; begin training, tuning, and evaluating machine learning architectures to predict and classify risk. Deliverable: Reproducible, modular preprocessing script outputting cleaned, scaled, and split train/validation sets.",nov:"Continue to train, tune, and evaluate machine learning architectures to predict and classify risk; finalize codebase to professional open-source standards and present solution. Deliverable: Serialized model weights/artifacts with a validation leaderboard detailing performance, a production-grade GitHub repository, and a live presentation to corporate leadership.",bottleneck:"Key risks: time-based leakage without proper train/val/test partitioning; class imbalance/rare extreme anomalies hurting Macro F1; cleaning/imputation and sensor merging across sources; failure to benchmark naive/persistence baselines; reproducibility/modularization of the pipeline; limited compute on free-tier environments.",recommendation:"Prioritize a robust, leakage-safe baseline pipeline: modular data ingestion/cleaning, time-aware validation, and comparison against a naive/persistence baseline; report Macro F1 and add SHAP interpretability. If time permits, treat a simple temporal LSTM prototype or a minimal Streamlit/Gradio dashboard as an optional stretch.",summary:"Key project risks include data leakage from improper temporal partitioning, class imbalance among extreme climate anomalies, and complex data cleaning across sources. To mitigate these issues, the team should focus on building a robust, leakage-safe pipeline featuring time-aware validation, modular data processing, and benchmarking against a persistence baseline with SHAP interpretability. Advanced temporal models or interactive dashboards should be deferred as optional stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of predicting physical asset vulnerabilities and routing bottlenecks caused by climate anomalies for AWS. Identify key stakeholders, target users, and logistics workflows. Inputs include NOAA climate grids and supply chain coordinates; outputs are localized risk indices. Scope is strictly focused on predictive scenario modeling and risk scoring rather than automated physical interventions or facility re-routings.

2.  Data Ingestion & Source Verification: Ingest global climate projection grids, NOAA historical weather datasets, and regional supply chain node location tables. Programmatically verify schema structures, spatial coordinates, and date ranges to ensure comprehensive data coverage across all critical supply chain routes and facility assets prior to downstream feature processing.

3.  Spatial-Temporal Data Mapping: Execute complex spatial-temporal joins to map historical temperature, precipitation, and extreme weather anomalies to specific supplier coordinates. Ensure geographic projections match accurately and establish continuous historical context for each asset to support downstream predictive feature modeling.

4.  Temporal Leakage Prevention Split: Enforce a strict temporal blocking split by keeping late-period climate records completely isolated for testing. This design prevents spatial-temporal data leakage, ensuring model evaluation reflects realistic future performance when predicting climate-driven disruptions across global logistics networks.

5.  Data Cleaning & Imputation Gate: Inspect and impute missing weather station entries using regional grid spatial interpolations rather than simple chronological averages. Ensure data completeness, account for localized climate conditions, and remove erroneous artifacts or sensor anomalies across historical datasets.

6.  Exploratory Climate Volatility Analysis: Plot historical climate volatility trends across node coordinates to identify high-risk nodes, such as flood-prone or drought-vulnerable suppliers. Generate descriptive statistics and geospatial visualizations to help stakeholders understand localized historical risk profiles and extreme weather patterns.

7.  Physical Data Boundary Validation: Write rigorous boundary assertions validating that physical metrics, including wind speed, precipitation, and ambient temperatures, stay within physically realistic environmental limits. Automatically flag or sanitize impossible readings to maintain pipeline stability and upstream data integrity.

8.  ARIMA Baseline Performance Benchmarking: Freeze a classical seasonal ARIMA forecasting baseline for each geographical supply chain node to establish the predictive performance floor. Compare subsequent machine learning outputs against this simple statistical benchmark to prove clear technical uplift.

9.  Climate Volatility Feature Engineering: Engineer informative lag weather features, rolling averages, and rolling standard deviations that capture localized climate volatility over 30-day and 90-day time windows. These time-series indicators provide crucial predictive signals for machine learning models.

10. Predictive Model Training & Evaluation: Train Random Forest and LightGBM regressors to predict continuous supply chain delay days based on engineered climate anomalies. Systematically evaluate model accuracy using RMSE and MAE metrics across validation folds to identify top-performing model architectures.

11. Regional & Supplier Error Auditing: Audit model error rates across distinct supplier types and geographical regions to ensure prediction consistency. Dissect localized performance discrepancies to mitigate system bias and maintain reliability across diverse, globally distributed logistics nodes.

12. Model Scope & Architecture Constraints: Verify that advanced LSTM sequence modeling is maintained strictly as a late-stage stretch goal. Ensure deep learning architectures are only attempted after tabular Gradient Boosted Tree models are fully validated, evaluated, and benchmarked against baseline standards.

13. Out-of-Sample Model Evaluation: Tune hyperparameter configurations and feature weights strictly within training folds, avoiding data leakage. Run the finalized model evaluation exactly once against the frozen, out-of-sample climate partition to obtain reliable, unbiased performance metrics.

14. Pipeline Delivery & Model Card Archiving: Deliver a fully runnable Google Colab pipeline displaying climate-risk-adjusted delay predictions and regional risk maps. Include a comprehensive Model Card documenting model performance, operational limitations, architectural decisions, and clear setup instructions.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of predicting physical asset vulnerabilities and routing bottlenecks caused by climate anomalies for AWS. Identify key stakeholders, target users, and logistics workflows. Inputs include NOAA climate grids and supply chain coordinates; outputs are localized risk indices. Scope is "},{num:2,title:"Data Ingestion & Source Verification",desc:"Ingest global climate projection grids, NOAA historical weather datasets, and regional supply chain node location tables. Programmatically verify schema structures, spatial coordinates, and date ranges to ensure comprehensive data coverage across all critical supply chain routes and facility assets "},{num:3,title:"Spatial-Temporal Data Mapping",desc:"Execute complex spatial-temporal joins to map historical temperature, precipitation, and extreme weather anomalies to specific supplier coordinates. Ensure geographic projections match accurately and establish continuous historical context for each asset to support downstream predictive feature mode"},{num:4,title:"Temporal Leakage Prevention Split",desc:"Enforce a strict temporal blocking split by keeping late-period climate records completely isolated for testing. This design prevents spatial-temporal data leakage, ensuring model evaluation reflects realistic future performance when predicting climate-driven disruptions across global logistics netw"},{num:5,title:"Data Cleaning & Imputation Gate",desc:"Inspect and impute missing weather station entries using regional grid spatial interpolations rather than simple chronological averages. Ensure data completeness, account for localized climate conditions, and remove erroneous artifacts or sensor anomalies across historical datasets."},{num:6,title:"Exploratory Climate Volatility Analysis",desc:"Plot historical climate volatility trends across node coordinates to identify high-risk nodes, such as flood-prone or drought-vulnerable suppliers. Generate descriptive statistics and geospatial visualizations to help stakeholders understand localized historical risk profiles and extreme weather pat"},{num:7,title:"Physical Data Boundary Validation",desc:"Write rigorous boundary assertions validating that physical metrics, including wind speed, precipitation, and ambient temperatures, stay within physically realistic environmental limits. Automatically flag or sanitize impossible readings to maintain pipeline stability and upstream data integrity."},{num:8,title:"ARIMA Baseline Performance Benchmarking",desc:"Freeze a classical seasonal ARIMA forecasting baseline for each geographical supply chain node to establish the predictive performance floor. Compare subsequent machine learning outputs against this simple statistical benchmark to prove clear technical uplift."},{num:9,title:"Climate Volatility Feature Engineering",desc:"Engineer informative lag weather features, rolling averages, and rolling standard deviations that capture localized climate volatility over 30-day and 90-day time windows. These time-series indicators provide crucial predictive signals for machine learning models."},{num:10,title:"Predictive Model Training & Evaluation",desc:"Train Random Forest and LightGBM regressors to predict continuous supply chain delay days based on engineered climate anomalies. Systematically evaluate model accuracy using RMSE and MAE metrics across validation folds to identify top-performing model architectures."},{num:11,title:"Regional & Supplier Error Auditing",desc:"Audit model error rates across distinct supplier types and geographical regions to ensure prediction consistency. Dissect localized performance discrepancies to mitigate system bias and maintain reliability across diverse, globally distributed logistics nodes."},{num:12,title:"Model Scope & Architecture Constraints",desc:"Verify that advanced LSTM sequence modeling is maintained strictly as a late-stage stretch goal. Ensure deep learning architectures are only attempted after tabular Gradient Boosted Tree models are fully validated, evaluated, and benchmarked against baseline standards."},{num:13,title:"Out-of-Sample Model Evaluation",desc:"Tune hyperparameter configurations and feature weights strictly within training folds, avoiding data leakage. Run the finalized model evaluation exactly once against the frozen, out-of-sample climate partition to obtain reliable, unbiased performance metrics."},{num:14,title:"Pipeline Delivery & Model Card Archiving",desc:"Deliver a fully runnable Google Colab pipeline displaying climate-risk-adjusted delay predictions and regional risk maps. Include a comprehensive Model Card documenting model performance, operational limitations, architectural decisions, and clear setup instructions."}]},{id:"1012",title:"Forecasting Harmful Algal Bloom (HAB) Risk Using Multi‑Source Water Quality and Weather Data",org:"Biointerphase",advisor:"Alyssa Long, Mia Maksin",ml_type:"Classification, Regression, Time Series, DL",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning / preprocessing",difficulty:"Sweet Spot",domain:"Time Series",objective:"Forecast risks of HABs using multi-source water quality, meteorological, and satellite data.",metrics:"RMSE, MAE, R2, accuracy, precision/recall, F1, ROC-AUC.",data_link:"Multiple (Mote Marine Lab)",sep:"Project kickoff, domain background on HABs, dataset selection, exploratory data analysis (EDA), data cleaning, feature engineering, and alignment of multi‑source datasets (water quality, weather, satellite).",oct:"Baseline model development (Random Forest, Gradient Boosting, or Neural Network where appropriate), model comparison across problem formulations (classification vs. regression), and hyperparameter tuning.",nov:"Model evaluation and validation, feature importance and interpretability analysis, iteration based on results, and synthesis of findings into actionable insights related to HAB risk drivers. Deliverables: validated baseline model(s), reproducible notebooks/workflow, and recommendations for HAB risk monitoring or early warning. (December reserved for final presentation/documentation).",bottleneck:"Aligning multiple disparate spatiotemporal datasets (water quality, weather, and satellite data) across different geographical coordinates and timestamps is highly error-prone. Students can easily introduce data leakage or spend the semester battling pandas merge conflicts rather than training models. Guardrails: enforce time-based and spatially aware train/validation/test splits; begin with a minimal, clearly defined starter schema/dataset to reduce merge errors.",recommendation:"Limit initial scope to one focal region (e.g., Sarasota Bay) and a small set of sources; adopt a minimal, clearly defined data schema and a simple, reproducible notebook structure; require baseline classification/regression models with leakage-safe, time- and space-aware splits plus feature-importance/ablation and interpretation; make 7-day forecasting or spatial mapping an optional stretch after baselines are met.",summary:"Aligning disparate spatiotemporal datasets across various coordinates and timestamps is highly error-prone and risks data leakage or merge conflicts. To mitigate this, teams should narrow their initial scope to a single focal region and adopt a minimal, clearly defined data schema with spatially and temporally aware splits. Prioritizing baseline models with leakage-safe validation ensures core predictive accuracy before expanding into short-term forecasting or spatial mapping stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting harmful algal blooms for Biointerphase. Key stakeholders include environmental agencies and fisheries, while users include marine conservation analysts. Inputs comprise estuarine water logs, satellite telemetry, and bloom records, yielding binary HAB risk probabilities and predicted chlorophyll-a trends. Operational risks include missed toxic blooms or unnecessary fishery closures.

2.  Multi-Source Ingestion: Ingest multi-source estuarine water quality logs, meteorological feeds, and satellite-derived chlorophyll-a datasets. Ensure all incoming raw data streams are properly collected and integrated into a unified storage system for efficient downstream processing and analysis across all environmental parameters.

3.  Spatiotemporal Grid Alignment: Verify that spatial coordinates and sampling timestamps are consistently aligned across disparate marine and meteorological sensor grids. Establish proper spatiotemporal indexing to ensure that weather, satellite, and water measurement data points correlate accurately across geographical locations and specific observation times.

4.  Chronological Validation Partitioning: Enforce a strict chronological validation partition by isolating later-year marine records exclusively for final model testing. This time-based split prevents data leakage from future observations into training sets, ensuring realistic assessment of the model's predictive capabilities on unseen temporal data.

5.  Missing Value Imputation: Inspect the consolidated dataset for missing values in critical water quality parameters, including salinity, dissolved oxygen, and pH levels. Apply localized spatial-interpolation imputation techniques to fill data gaps reliably without introducing artificial trends or skewing environmental measurements.

6.  Geographic Scope Restriction: Restrict the initial modeling scope to a single coastal estuary region, such as Sarasota Bay. Isolating a localized area allows the team to thoroughly verify data merging procedures, schema integrity, and baseline models before scaling operations to broader coastal zones.

7.  Data Quality Assertion Gate: Write automated data validation assertions to guarantee that physical water quality indicators remain logically consistent. Ensure constraints like pH levels between 5 and 10 and salinity values greater than or equal to zero are strictly enforced before feature pipeline execution.

8.  Baseline Persistence Modeling: Freeze a naive persistence model that predicts the next period's harmful algal bloom risk equals the current period's observed risk. This establishes a foundational performance threshold against which all subsequent complex machine learning models must be compared and evaluated.

9.  Environmental Feature Engineering: Engineer informative lag features and rolling averages capturing cumulative water temperature variations and nutrient accumulation over 7-day, 14-day, and 30-day windows. These temporal aggregations help capture extended ecological developments that precede harmful algal bloom events.

10. Supervised Classifier Training: Train supervised classification models, such as Random Forest or XGBoost, to predict binary HAB hazard thresholds. Rigorously evaluate model performance using PR-AUC and F1-score metrics to ensure balanced detection of rare hazard events.

11. Spatiotemporal Bias Auditing: Audit model precision and recall performance across distinct operational seasons and individual marine monitoring stations. Identifying localized prediction biases ensures the system maintains reliable accuracy across varying environmental conditions and geographic sub-regions.

12. Environmental Stress-Testing: Stress-test model stability by feeding extreme nutrient concentrations and water-temperature anomalies into the pipeline. This process evaluates the system's resilience, sensitivity, and response boundaries when encountering severe climate shock inputs or unexpected ecological shifts.

13. Test Set Isolation & Evaluation: Optimize classification decision thresholds and hyperparameter configurations strictly within the training folds. Once finalized, execute model evaluation exactly once on the frozen, unseen test dataset to obtain unbiased performance metrics.

14. Deliverable Packaging & Dashboarding: Deliver a fully reproducible Jupyter notebook along with a localized HAB early-warning dashboard. The final interface must clearly demonstrate real-time risk scores, primary feature importances, and historical trend analyses for operational decision support.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of predicting harmful algal blooms for Biointerphase. Key stakeholders include environmental agencies and fisheries, while users include marine conservation analysts. Inputs comprise estuarine water logs, satellite telemetry, and bloom records, yielding binary HAB risk probab"},{num:2,title:"Multi-Source Ingestion",desc:"Ingest multi-source estuarine water quality logs, meteorological feeds, and satellite-derived chlorophyll-a datasets. Ensure all incoming raw data streams are properly collected and integrated into a unified storage system for efficient downstream processing and analysis across all environmental par"},{num:3,title:"Spatiotemporal Grid Alignment",desc:"Verify that spatial coordinates and sampling timestamps are consistently aligned across disparate marine and meteorological sensor grids. Establish proper spatiotemporal indexing to ensure that weather, satellite, and water measurement data points correlate accurately across geographical locations a"},{num:4,title:"Chronological Validation Partitioning",desc:"Enforce a strict chronological validation partition by isolating later-year marine records exclusively for final model testing. This time-based split prevents data leakage from future observations into training sets, ensuring realistic assessment of the model's predictive capabilities on unseen temp"},{num:5,title:"Missing Value Imputation",desc:"Inspect the consolidated dataset for missing values in critical water quality parameters, including salinity, dissolved oxygen, and pH levels. Apply localized spatial-interpolation imputation techniques to fill data gaps reliably without introducing artificial trends or skewing environmental measure"},{num:6,title:"Geographic Scope Restriction",desc:"Restrict the initial modeling scope to a single coastal estuary region, such as Sarasota Bay. Isolating a localized area allows the team to thoroughly verify data merging procedures, schema integrity, and baseline models before scaling operations to broader coastal zones."},{num:7,title:"Data Quality Assertion Gate",desc:"Write automated data validation assertions to guarantee that physical water quality indicators remain logically consistent. Ensure constraints like pH levels between 5 and 10 and salinity values greater than or equal to zero are strictly enforced before feature pipeline execution."},{num:8,title:"Baseline Persistence Modeling",desc:"Freeze a naive persistence model that predicts the next period's harmful algal bloom risk equals the current period's observed risk. This establishes a foundational performance threshold against which all subsequent complex machine learning models must be compared and evaluated."},{num:9,title:"Environmental Feature Engineering",desc:"Engineer informative lag features and rolling averages capturing cumulative water temperature variations and nutrient accumulation over 7-day, 14-day, and 30-day windows. These temporal aggregations help capture extended ecological developments that precede harmful algal bloom events."},{num:10,title:"Supervised Classifier Training",desc:"Train supervised classification models, such as Random Forest or XGBoost, to predict binary HAB hazard thresholds. Rigorously evaluate model performance using PR-AUC and F1-score metrics to ensure balanced detection of rare hazard events."},{num:11,title:"Spatiotemporal Bias Auditing",desc:"Audit model precision and recall performance across distinct operational seasons and individual marine monitoring stations. Identifying localized prediction biases ensures the system maintains reliable accuracy across varying environmental conditions and geographic sub-regions."},{num:12,title:"Environmental Stress-Testing",desc:"Stress-test model stability by feeding extreme nutrient concentrations and water-temperature anomalies into the pipeline. This process evaluates the system's resilience, sensitivity, and response boundaries when encountering severe climate shock inputs or unexpected ecological shifts."},{num:13,title:"Test Set Isolation & Evaluation",desc:"Optimize classification decision thresholds and hyperparameter configurations strictly within the training folds. Once finalized, execute model evaluation exactly once on the frozen, unseen test dataset to obtain unbiased performance metrics."},{num:14,title:"Deliverable Packaging & Dashboarding",desc:"Deliver a fully reproducible Jupyter notebook along with a localized HAB early-warning dashboard. The final interface must clearly demonstrate real-time risk scores, primary feature importances, and historical trend analyses for operational decision support."}]},{id:"1013",title:"3D Career Paths Map from Job Postings",org:"Candogram",advisor:"Henning Seip",ml_type:"Classification, Clustering, Rec Sys, NLP",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Create an interactive 3D scatterplot to demonstrate career paths from job postings.",metrics:"Working HTML page with 3D scatter plot.",data_link:"ZIP file",sep:"Data preparation complete.",oct:"Data model complete.",nov:"Interactive 3D scatter plot complete.",bottleneck:"The project relies on a ZIP file of text data lacking formal documentation. Furthermore, using only job titles for dimensionality reduction and NLP vectorization is too simplistic for a full-semester timeline, lacking the rigor required to demonstrate competency in NLP embeddings.",recommendation:"Provide a comprehensive data dictionary immediately. To ensure sufficient difficulty, explicitly require the stretch goal—incorporating full job descriptions and requirements into the NLP embedding model (rather than just job titles)—as a mandatory core milestone.",summary:"The project relies on undocumented text data and originally limited its NLP vectorization to job titles, which lacks sufficient technical rigor for a full-semester scope. To address this, a comprehensive data dictionary must be provided immediately, and the NLP model must be expanded to process full job descriptions and requirements as a core requirement.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of mapping non-linear career trajectories and skill transitions from unstructured job postings into an interpretable visual manifold for Candogram. Identify key stakeholders, target users, operational workflows, and supported decisions. Specify inputs, 3D coordinate outputs, scope boundaries, and key operational risks such as incoherent groupings or impossible career pathways.

2.  Raw Data Ingestion: Ingest the raw NYC job postings ZIP file provided by Candogram. Ensure all unstructured text fields, job titles, salary ranges, and relevant metadata are correctly unpacked, validated, and safely loaded into the processing environment.

3.  Data Cleaning & Inspection: Inspect job posting text lengths and null field distributions across the dataset. Develop robust regex-based text processing utilities to systematically clean raw HTML boilerplate strings and standardize formatting.

4.  Evaluation Set Construction: Construct a dedicated benchmark evaluation dataset comprising 200 representative job postings. Manually annotate each sample with industry-standard ONET career category labels to serve as a reliable reference standard.

5.  Text Processing Pipeline: Develop an end-to-end text processing pipeline. Convert unstructured job descriptions into clean, tokenized keyword features, ensuring consistent stop-word removal, normalization, and structured feature extraction for downstream modeling steps.

6.  Semantic Embedding Generation: Mandate the generation of full-text job description embeddings using advanced models like SentenceTransformers or Claude API. Avoid relying solely on simple job title strings in order to capture deep contextual semantic relationships.

7.  Dimensionality Reduction: Apply non-linear dimension reduction techniques such as UMAP or t-SNE. Project the high-dimensional full-text embeddings down into a lower-dimensional 3D coordinate space optimized for visual spatial mapping.

8.  Spatial Proximity Clustering: Apply unsupervised clustering algorithms such as K-Means or HDBSCAN to group job postings based on their 3D coordinate proximity, forming coherent functional career clusters within the manifold.

9.  Cluster Coherence Evaluation: Quantitative evaluation of cluster coherence using Silhouette scores. Measure and document the empirical overlap between the generated spatial clusters and the manually annotated reference O\\*NET career categories.

10. Interactive Visual Interface: Build an interactive Plotly 3D scatterplot rendering the calculated coordinate space. Map each job posting to an interactive visual node equipped with rich, hoverable job summaries and details.

11. Career Trajectory Modeling: Implement a dynamic career path trajectory model using shortest-path graph algorithms like Dijkstra's in NetworkX. Connect the spatial clusters chronologically and logically based on career seniority levels.

12. Hyperparameter Tuning Constraints: Perform all coordinate clustering and UMAP hyperparameter tuning strictly within the designated development partition. This ensures spatial projection stability and prevents global coordinate drift across evaluation splits.

13. Out-of-Sample Stability Freeze: Freeze the finalized coordinate projection pipeline completely. Evaluate out-of-sample job embedding stability and projection accuracy exactly once using the untouched, isolated test partition to confirm generalization.

14. Deliverable Packaging & Deployment: Package and deliver a fully runnable Google Colab notebook alongside a lightweight interactive web application, such as Streamlit, to seamlessly render the finalized 3D coordinate career map.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of mapping non-linear career trajectories and skill transitions from unstructured job postings into an interpretable visual manifold for Candogram. Identify key stakeholders, target users, operational workflows, and supported decisions. Specify inputs, 3D coordinate outputs, "},{num:2,title:"Raw Data Ingestion",desc:"Ingest the raw NYC job postings ZIP file provided by Candogram. Ensure all unstructured text fields, job titles, salary ranges, and relevant metadata are correctly unpacked, validated, and safely loaded into the processing environment."},{num:3,title:"Data Cleaning & Inspection",desc:"Inspect job posting text lengths and null field distributions across the dataset. Develop robust regex-based text processing utilities to systematically clean raw HTML boilerplate strings and standardize formatting."},{num:4,title:"Evaluation Set Construction",desc:"Construct a dedicated benchmark evaluation dataset comprising 200 representative job postings. Manually annotate each sample with industry-standard ONET career category labels to serve as a reliable reference standard."},{num:5,title:"Text Processing Pipeline",desc:"Develop an end-to-end text processing pipeline. Convert unstructured job descriptions into clean, tokenized keyword features, ensuring consistent stop-word removal, normalization, and structured feature extraction for downstream modeling steps."},{num:6,title:"Semantic Embedding Generation",desc:"Mandate the generation of full-text job description embeddings using advanced models like SentenceTransformers or Claude API. Avoid relying solely on simple job title strings in order to capture deep contextual semantic relationships cation, such as Streamlit, to seamlessly render the finalized 3D coordinate career map."}]},{id:"1015",title:"AI Tool Discovery & Risk Classification",org:"Cyera",advisor:"Shubham Arya",ml_type:"Classification, Clustering, NLP, DL, LLMs",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Discover AI tools used, classify business purpose/risk, and generate governance insights.",metrics:"Accuracy, F1, semantic retrieval relevance, dashboard functionality.",data_link:"https://www.kaggle.com/datasets/devadigax/aitoolbuzz-com-16k-ai-tools-database",sep:"Problem Definition, Research, & Data Prep: Define enterprise AI governance problem; research shadow AI management; identify scope, personas, and metrics; collect/clean public AI tool datasets and SaaS metadata; generate synthetic enterprise usage data (browser logs, app records, department activity); perform EDA; define risk criteria; build baseline detection/categorization models.",oct:"Model Development & Intelligence Layer: Optimize AI tool classification using NLP and embeddings; develop governance risk scoring engine; build semantic search and vector retrieval pipeline; implement RAG-based conversational assistant; test prompts; develop backend APIs connecting models/data; begin frontend/dashboard development.",nov:"Integration, Evaluation, & Final Demo: Integrate components into a unified application; finalize dashboard visualizations and the conversational assistant; add governance summaries/reporting; evaluate accuracy, retrieval quality, usability, and bias; optimize performance; prepare the final presentation, technical documentation, and live prototype.",bottleneck:"The project requires generating synthetic enterprise usage data (browser logs and application usage records) from scratch to feed the discovery models. Tasking students with building robust synthetic data generators will drastically delay the core ML classification work.",recommendation:"The Challenge Advisor must pre-generate the synthetic usage data and provide a clear, finalized schema to the students prior to kickoff. This ensures the team has a viable, ready-to-use dataset on day one and can focus entirely on the NLP tasks.",summary:"Requiring students to generate synthetic enterprise usage data from scratch risks delaying core machine learning and classification work. To mitigate this bottleneck, the Challenge Advisor should pre-generate the synthetic dataset and provide a clear schema prior to project kickoff. This ensures the team has a ready-to-use dataset from day one to focus entirely on NLP and model development tasks.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of detecting and classifying employee usage of shadow IT and unauthorized AI tools across enterprise networks for Cyera. Identify key stakeholders (CISOs, compliance officers) and target users (security analysts). Map operational workflows such as daily security event auditing. Inputs include synthetic enterprise network logs, while outputs are normalized tool classifications and predicted security risk category tags.

2.  Ingestion of Data Resources: Ingest the full set of synthetic enterprise network logs, employee web-search queries, and initial security risk taxonomy tables provided by Cyera. Ensure all raw data feeds are accessible and verified before downstream processing, establishing a reliable data foundation for the classification and shadow IT indexing tasks.

3.  Schema Standardization & Validation: Pre-generate strict, synthetic employee web-log schemas converted to standard data types to align seamlessly with Cyera's enterprise logging environment. Validate data structures, fields, and formats prior to running ingestion scripts, guaranteeing system compatibility and preventing downstream type errors during automated text feature extraction.

4.  Log Parsing & Data Sanitization: Clean and parse the raw log payloads thoroughly, extracting critical fields such as destination URLs, web search terms, and user metadata. Sanitize special characters, remove trailing symbols, and handle missing attributes to ensure the extracted textual payload is clean, consistent, and ready for baseline tokenization and embedding workflows.

5.  Text Normalization Pipeline Construction: Build a dedicated text normalization pipeline to transform search terms and URL subdomains into standard, lowercase, tokenized sequences. Standardizing string inputs eliminates unnecessary variations, reduces vocabulary noise, and ensures consistent text processing across both rule-based regex baseline evaluations and vector embedding models.

6.  Rule-Based Baseline Model Implementation: Freeze a rule-based baseline model using exact-match regular expressions to instantly detect and flag known high-risk AI platforms and security key terms. This deterministic baseline serves as an essential, high-speed security benchmark to compare against and evaluate subsequent Machine Learning vector models.

7.  Embedding Pipeline & Semantic Similarity Integration: Upgrade the detection system by integrating a pre-trained sentence transformer model to embed normalized web log texts into high-dimensional vector representations. Compute cosine similarity against established security risk categories to capture nuanced semantic relationships and discover emerging AI tools effectively.

8.  Classification Model Development: Train and evaluate a machine learning classifier, such as Logistic Regression or Support Vector Machines, on the generated text embeddings. Predict refined risk categories like Data Leakage, Shadow IT, and Policy Violations, establishing reliable automated categorization for complex web access patterns.

9.  Performance Evaluation & Metric Validation: Rigorously evaluate the model's classification performance across all risk taxonomies using macro-averaged Precision, Recall, and F1-score metrics. Ensure balanced class accuracy and identify potential model bias across standard and rare risk categories to maintain high enterprise reliability.

10. Zero-Shot Generalization Auditing: Audit model performance explicitly on newly crawled, unlabelled, or emerging AI tool names to verify zero-shot generalization capabilities. Ensure the system accurately identifies and categorizes unseen platforms without requiring manual retraining, protecting enterprise infrastructure from novel security threats.

11. API Rate Limiting & Local Caching Setup: Implement strict rate-limiting caps and local caching mechanisms for real-time external API queries within the execution environment. This infrastructure safeguard prevents Google Colab runtime blocks, controls API consumption costs, and guarantees uninterrupted execution during batch processing runs.

12. Hyperparameter Tuning & Out-of-Sample Testing: Execute hyperparameter tuning and score-threshold calibration exclusively on the training partition. Evaluate model performance exactly once against the frozen, out-of-sample log set to ensure unbiased assessment of real-world generalization and prevent data leakage during optimization.

13. Final Asset Packaging & Dashboard Delivery: Deliver a production-ready, repeatable document-classification notebook, the compiled risk rule ledger, and an interactive executive dashboard tracking corporate AI usage trends. Provide full documentation to enable seamless integration with Cyera's security monitoring workflows.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of detecting and classifying employee usage of shadow IT and unauthorized AI tools across enterprise networks for Cyera. Identify key stakeholders (CISOs, compliance officers) and target users (security analysts). Map operational workflows such as daily security event auditin"},{num:2,title:"Ingestion of Data Resources",desc:"Ingest the full set of synthetic enterprise network logs, employee web-search queries, and initial security risk taxonomy tables provided by Cyera. Ensure all raw data feeds are accessible and verified before downstream processing, establishing a reliable data foundation for the classification and s"},{num:3,title:"Schema Standardization & Validation",desc:"Pre-generate strict, synthetic employee web-log schemas converted to standard data types to align seamlessly with Cyera's enterprise logging environment. Validate data structures, fields, and formats prior to running ingestion scripts, guaranteeing system compatibility and preventing downstream type"},{num:4,title:"Log Parsing & Data Sanitization",desc:"Clean and parse the raw log payloads thoroughly, extracting critical fields such as destination URLs, web search terms, and user metadata. Sanitize special characters, remove trailing symbols, and handle missing attributes to ensure the extracted textual payload is clean, consistent, and ready for b"},{num:5,title:"Text Normalization Pipeline Construction",desc:"Build a dedicated text normalization pipeline to transform search terms and URL subdomains into standard, lowercase, tokenized sequences. Standardizing string input
