14. Deliverables & Documentation: Deliver a fully repeatable deep learning cloud segmentation notebook, comprehensive pixel-mask visualizations, clean source code, and a detailed model card summarizing methodology, performance metrics, and operational constraints.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of detecting and masking cloud cover pixels in very-high-resolution optical satellite imagery for Ursa Space. Key stakeholders include engineering teams and geospatial analysts. Inputs consist of optical satellite scenes and multi-spectral datasets, while outputs provide bina"},{num:2,title:"Data Ingestion",desc:"Ingest the very-high-resolution optical satellite scenes, multi-spectral band datasets, and ground-truth pixel-level cloud validation masks required for model development. Ensure proper storage, file paths, and indexing across all high-resolution spatial assets to enable seamless downstream image pr"},{num:3,title:"CRITICAL DATA GATE - STAC WINDOW-READ GATE",desc:"Build an automated image processing pipeline utilizing SpatioTemporal Asset Catalog (STAC) spatial queries. Window-stream Cloud Optimized GeoTIFF (COG) image tiles in manageable memory chunks to prevent local RAM and GPU out-of-memory crashes during processing."},{num:4,title:"Spatial-Block Validation Split",desc:"Enforce a strict spatial-block validation split by isolating specific satellite orbit swaths into either training or testing sets. This prevents spatial autocorrelation leakage between adjacent image tiles, ensuring realistic performance assessment."},{num:5,title:"Image Normalization & Standardization",desc:"Standardize image dimensions across all satellite samples and normalize multi-spectral band intensities (including red, green, blue, and near-infrared bands) to uniform numerical ranges to optimize model convergence."},{num:6,title:"Data Validation Assertions",desc:"Implement automated data validation assertions within the ingestion pipeline to explicitly check and ensure that image channel counts, coordinate reference systems (CRS), spatial resolutions, and pixel band ranges remain consistent."},{num:7,title:"Classical Signal Processing Baseline",desc:"Freeze a classical signal processing baseline model using deterministic band-ratio thresholding techniques (such as Normalized Difference Snow Index - NDSI) to establish a minimum performance floor for cloud masking."},{num:8,title:"Deep Learning Model Training",desc:"Train deep learning semantic segmentation architectures, such as U-Net or FCN models equipped with ResNet backbones, using PyTorch or Keras to generate highly accurate pixel-level binary cloud masks."},{num:9,title:"Pre-trained SAM Evaluation",desc:"Apply a pre-trained Segment Anything Model (SAM) in zero-shot mode to segment satellite cloud boundaries, conducting a head-to-head performance comparison against the fully trained U-Net segmentation baseline."},{num:10,title:"Metric Evaluation",desc:"Benchmark pixel-level cloud detection performance across all implemented models using standard evaluation metrics, including Intersection over Union (IoU), F1-score (Dice coefficient), precision, recall, and overall pixel accuracy."},{num:11,title:"Memory Footprint Verification",desc:"Monitor and verify that the entire model training and evaluation pipeline operates within a total memory footprint of under 8 GB on the Google Colab GPU runtime to avoid out-of-memory crashes."},{num:12,title:"Hyperparameter Tuning Constraints",desc:"Perform all hyperparameter tuning, including learning rate adjustments, spatial data augmentations, and decision threshold updates, strictly within the designated training spatial blocks to prevent test set contamination."},{num:13,title:"Out-of-Sample Final Evaluation",desc:"Evaluate satellite cloud-masking model accuracy exactly once on the frozen, out-of-sample geographic test scenes reserved during initial data preparation to measure genuine real-world generalization performance."},{num:14,title:"Deliverables & Documentation",desc:"Deliver a fully repeatable deep learning cloud segmentation notebook, comprehensive pixel-mask visualizations, clean source code, and a detailed model card summarizing methodology, performance metrics, and operational constraints."}]},{id:"1051",title:"Online Payment Fraud Detection Using High-Dimensional Transaction Data",org:"Mastercard",advisor:"Debasmita Das",ml_type:"Classification, Time Series Analysis, Deep Learning / Neural Networks",evaluation:"Approved As Is",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML and Deep Learning",objective:"Build a binary classification model using ML and deep-learning (XGBoost, RNNs, Transformers) to predict fraudulent online payment transactions and evaluate temporal context.",metrics:"Primary: Area under the precision-recall curve (AUPRC); fraud-class recall, precision, F1-score; false-positive rate (FPR). Threshold-based: recall at a fixed review rate or recall at a fixed FPR (to assess operational review workload). Secondary: ROC-AUC. Deliverables/Outcome: reproducible preprocessing and modeling pipeline; interpretable fraud-risk output (e.g., SHAP explanations) and documentation.",data_link:"https://www.kaggle.com/c/ieee-fraud-detection/data",sep:"Data cleaning, exploratory data analysis (EDA), and baseline ML model.",oct:"Temporal feature engineering and deep learning experiments.",nov:"Final model evaluation using SHAP, prototype delivery, and documentation.",bottleneck:"High dimensional data and class imbalance require advanced preprocessing. Students may face learning debt in Transformer-based sequence modeling and temporal data leakage prevention.",recommendation:"Well-structured. Prioritize the gradient-boosted baseline before moving to complex Transformers. If time is limited, focus on a subset of variables using feature importance ranking to reduce computational load.",summary:"High-dimensional transaction data and severe class imbalance present key preprocessing challenges, alongside potential learning debt regarding temporal data leakage and Transformer-based models. To mitigate these risks, teams should prioritize establishing a solid gradient-boosted baseline before attempting complex neural architectures. If computational constraints arise, reducing feature dimensionality through feature importance ranking can further streamline development.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of detecting and classifying fraudulent credit card transactions across high-dimensional, imbalanced data logs for Mastercard. Identify key stakeholders, target users, operational workflows, and supported decisions. Inputs include transaction history logs and fraud labels, while outputs feature predicted fraud-risk probability scores and SHAP feature importance charts. The project scope covers offline auditing while managing risks of uncalibrated decline models.
2.  Data Ingestion & Source Gathering: Ingest high-dimensional credit card transaction logs, categorical merchant profiles, device metadata sheets, and historical fraud outcome flags directly provided by Mastercard. Establish baseline data structures to support subsequent feature extraction, model calibration, and exploratory analysis across all offline evaluation pipelines.
3.  Critical Data Gate - Downcasting Ingestion Gate: Build an automated Python ingestion pipeline that programmatically downcasts numeric features (mapping float64 to float32 and int64 to smaller integer types). This optimizes memory efficiency and compresses the 10 GB Kaggle dataset to fit securely within free Google Colab RAM limits without losing critical precision.
4.  Temporal Split & Leakage Prevention: Enforce a strict chronological train/test split across the dataset, keeping the final month of transaction logs completely isolated. This safeguards the modeling workflow against lookahead leakage and ensures hyperparameter tuning mirrors real-world production deployment conditions.
5.  Missing Data & Categorical Encoding Gate: Inspect transaction variables for missing device IDs and structural anomalies. Transform nominal categorical fields into sparse one-hot encoded matrices to maintain computational efficiency and prepare the tabular features for gradient-boosted decision tree algorithms.
6.  Data Quality & Assertion Validation: Write strict data validation assertions within the ingestion script to programmatically verify that all transaction amounts remain positive and timestamps are sequentially ascending, preventing upstream numerical anomalies from degrading downstream classifier performance.
7.  Baseline Classifier Initialization: Freeze a baseline logistic regression classifier that flags fraud based strictly on transaction amounts exceeding three standard deviations. This establishes a minimal performance threshold to validate subsequent, more complex machine learning models.
8.  Gradient Boosted Model Development: Train class-weighted gradient boosted decision trees (such as XGBoost or LightGBM) on the high-dimensional transaction tables to effectively handle non-linear relationships, complex feature interactions, and tabular data distributions.
9.  Imbalanced Metrics Evaluation: Evaluate fraud classification models using PR-AUC, ROC-AUC, and cost-sensitive precision-recall metrics. This specifically addresses the extreme fraud class imbalance (\\~0.1%) and measures operational review workload efficiency.
10. Model Explainability & SHAP Audit: Audit model predictions using global and local SHAP importance maps to verify that predictive features align with Mastercard's security compliance rules and business domain logic.
11. Hyperparameter Tuning & Threshold Optimization: Tune all gradient-boosted tree hyperparameters, class weights, and probability decision thresholds strictly within the transaction training folds, preventing data leakage into evaluation sets.
12. Final Out-of-Sample Evaluation: Evaluate out-of-sample transaction fraud-detection accuracy exactly once on the frozen, chronological test partition reserved during the initial setup phase to measure generalized predictive performance.
13. Deliverable Packaging & Documentation: Deliver a repeatable low-latency fraud-detection notebook, a probability calibration report, and a detailed model card documenting system architecture, performance benchmarks, operational constraints, and maintenance requirements.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of detecting and classifying fraudulent credit card transactions across high-dimensional, imbalanced data logs for Mastercard. Identify key stakeholders, target users, operational workflows, and supported decisions. Inputs include transaction history logs and fraud labels, wh"},{num:2,title:"Data Ingestion & Source Gathering",desc:"Ingest high-dimensional credit card transaction logs, categorical merchant profiles, device metadata sheets, and historical fraud outcome flags directly provided by Mastercard. Establish baseline data structures to support subsequent feature extraction, model calibration, and exploratory analysis ac"},{num:3,title:"Critical Data Gate - Downcasting Ingestion Gate",desc:"Build an automated Python ingestion pipeline that programmatically downcasts numeric features (mapping float64 to float32 and int64 to smaller integer types). This optimizes memory efficiency and compresses the 10 GB Kaggle dataset to fit securely within free Google Colab RAM limits without losing c"},{num:4,title:"Temporal Split & Leakage Prevention",desc:"Enforce a strict chronological train/test split across the dataset, keeping the final month of transaction logs completely isolated. This safeguards the modeling workflow against lookahead leakage and ensures hyperparameter tuning mirrors real-world production deployment conditions."},{num:5,title:"Missing Data & Categorical Encoding Gate",desc:"Inspect transaction variables for missing device IDs and structural anomalies. Transform nominal categorical fields into sparse one-hot encoded matrices to maintain computational efficiency and prepare the tabular generalized predictive performance."},{num:13,title:"Deliverable Packaging & Documentation",desc:"Deliver a repeatable low-latency fraud-detection notebook, a probability calibration report, and a detailed model card documenting system architecture, performance benchmarks, operational constraints, and maintenance requirements."}]},{id:"1053",title:"Predicting Job Satisfaction from Person-Job Fit",org:"Swytch",advisor:"Tim Liu, Jim Thompson",ml_type:"Classification; Deep Learning / Neural Networks",evaluation:"Approved As Is",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Predict whether someone is satisfied at work based on how well their personal work values match what their job offers by linking GSS survey data with O*NET occupational profiles.",metrics:"Working data pipeline; models predicting satisfaction reported with AUC and confidence intervals; comparison of fit-scoring methods; evaluation of improvement over background factors; a concise writeup describing effect sizes and limitations.",data_link:"https://gss.norc.org/get-the-data.html; https://www.onetcenter.org/database.html; https://www.onetcenter.org/crosswalks.html",sep:"Match survey occupation codes to O*NET taxonomies.",oct:"Build baseline models and establish benchmark metrics.",nov:"Integrate fit features, compare scoring methodologies, and implement a Keras neural network.",bottleneck:"Students may struggle with complex cross-database joining and feature engineering for 'fit' scores. Understanding Neural Network interpretability versus baseline models is critical. Also watch for class imbalance in satisfaction labels; plan to assess and address it (e.g., stratified evaluation, resampling, or class-weighting) when establishing October benchmarks.",recommendation:"Well-scoped. If Keras implementation proves time-consuming, prioritize feature engineering of 'fit' scores within baseline models. Optional LLM/API add-ons should only be pursued if the core pipeline is robust and API access/funding is available.",summary:"Students may face challenges with complex cross-database joins, feature engineering for fit scores, and handling class imbalance in satisfaction labels. To address this, teams should prioritize robust feature engineering within baseline models before attempting complex neural networks or optional LLM add-ons. Addressing label imbalance early via stratified evaluation or resampling will ensure reliable benchmark performance.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting long-term employee job satisfaction categories based on person-job fit matrices for Swytch. Identify key stakeholders, target users, and HR workflows. Use GSS demographic survey data and O\\*NET occupational fit matrices as primary inputs, targeting SHAP driver maps and job satisfaction class outputs while strictly establishing operational boundaries and risk mitigations.

2.  Data Ingestion & Integration: Ingest the General Social Survey (GSS) demographic datasets alongside user-reported job satisfaction tables and O\\*NET occupational fit matrices. Ensure all incoming raw files, schemas, and relational links are properly formatted and parsed into structured data frames ready for downstream automated processing, alignment, feature transformation, and exploratory analytical tasks.

3.  Critical Data Gate - Survey Crosswalk Gate: Build an automated data cleaning and crosswalk pipeline to merge GSS respondent identifiers and occupation categories with O\\*NET fit vectors by Week 3. This critical gate ensures foundational cross-dataset alignment across disparate taxonomies before any feature modeling or statistical analysis occurs.

4.  ID & Occupation Code Alignment Verification: Programmatically verify that unique respondent IDs and occupation codes are properly aligned across all multi-year survey iterations. Ensure that no data records are dropped, mismatched, or altered by null merges during the automated join operation.

5.  Job Satisfaction Distribution Profiling: Profile the overall statistical distributions of continuous and categorical job satisfaction scores across the entire dataset. Thoroughly document baseline variances, skewness, missingness, and underlying distributional disparities present within specific demographic cohorts to guide downstream model development.

6.  Data Validation & Assertion Checks: Implement automated data validation assertions to strictly enforce quality standards across the dataset. Verify that all key variables—including GSS survey sampling weights, respondent age values, and categorical job satisfaction ratings—fall completely within logically valid numerical bounds and expected operational ranges.

7.  Baseline Model Development: Freeze a benchmark ordinal logistic regression model to establish baseline predictive metrics. Train this initial baseline using strictly essential demographic variables, such as respondent age and educational attainment, to accurately quantify performance lift before introducing complex person-job fit features.

8.  Neural Network Modeling Upgrade: Upgrade the modeling pipeline by designing and training a Multi-Layer Perceptron (MLP) deep learning neural network using Keras or PyTorch. Train this advanced model directly on the merged GSS demographic survey data, engineered person-job fit vectors, and occupational features.

9.  Comprehensive Performance Evaluation: Rigorously evaluate model predictions across all ordinal job satisfaction classes using standard multi-class evaluation metrics. Track macro-F1 classification scores, Cohen's kappa coefficient for inter-rater agreement, and Mean Absolute Error (MAE) to establish precise, balanced operational performance standards across cohorts.

10. Explainability & SHAP Driver Auditing: Audit trained model outputs using SHAP (SHapley Additive exPlanations) global importance maps. Provide clear, interpretable visual reports explaining the primary institutional, demographic, and person-job fit features driving the neural network's underlying job satisfaction predictions for key decision-makers.

11. Sensitivity & Robustness Testing: Perform systematic sensitivity and parameter robustness analyses across the feature engineering pipeline. Test how strategic modifications, index weighting adjustments, and missing value imputations influence downstream feature representations and overall satisfaction category predictions.

12. Hyperparameter Tuning & Regularization: Tune all Multi-Layer Perceptron (MLP) neural network hyperparameters, including layer architectures, dropout rates, L2 regularizations, and learning rate schedules. Execute all optimization experiments strictly within the isolated survey training partition to guarantee unbiased optimization.

13. Out-of-Sample Test Evaluation: Evaluate final model performance exactly once against the frozen, out-of-sample survey test partition set aside during initial data splitting in September. Calculate definitive performance metrics to verify true generalization capabilities without introducing data leakage or overestimation bias.

14. Deliverable Finalization & Reporting: Finalize and deliver a fully reproducible neural regression Jupyter notebook, a comprehensive survey segment analysis matrix, and a formal model validation report outlining performance benchmarks, operational limitations, and deployment guidelines for business stakeholders.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of predicting long-term employee job satisfaction categories based on person-job fit matrices for Swytch. Identify key stakeholders, target users, and HR workflows. Use GSS demographic survey data and O\\*NET occupational fit matrices as primary inputs, targeting SHAP driver m"},{num:2,title:"Data Ingestion & Integration",desc:"Ingest the General Social Survey (GSS) demographic datasets alongside user-reported job satisfaction tables and O\\*NET occupational fit matrices. Ensure all incoming raw files, schemas, and relational links are properly formatted and parsed into structured data frames ready for downstream automated "},{num:3,title:"Critical Data Gate - Survey Crosswalk Gate",desc:"Build an automated data cleaning and crosswalk pipeline to merge GSS respondent identifiers and occupation categories with O\\*NET fit vectors by Week 3. This critical gate ensures foundational cross-dataset alignment across disparate taxonomies before any feature modeling or statistical analysis occ"},{num:4,title:"ID & Occupation Code Alignment Verification",desc:"Programmatically verify that unique respondent IDs and occupation codes are properly aligned across all multi-year survey iterations. Ensure that no data records are dropped, mismatched, or altered by null merges during the automated join operation."},{num:5,title:"Job Satisfaction Distribution Profiling",desc:"Profile the overall statistical distributions of continuous and categorical job satisfaction scores across the entire dataset. Thoroughly document baseline variances, skewness, missingness, and underlying .google.com/drive/folders/1bJpa87n6HCwRR3Pvr5xqocNZrGo7dufT",sep:"Business framing, EDA, and feature engineering.",oct:"Algorithm exploration, model building, and hyperparameter tuning.",nov:"Model finalization, scoring, and Streamlit frontend creation.",bottleneck:"Students may struggle with 'profit-aware' cost modeling and fairness metrics. Transformer-based architectures represent significant technical debt for undergraduate curricula.",recommendation:"Focus on classical ML models (Logistic Regression, Random Forest, Gradient Boosting) first. Treat Transformer/Self-Attention as an optional post-November extension. Prioritize the 'Inclusive Profit Score' calculation early.",summary:"Students may struggle with profit-aware cost modeling, fairness metrics, and the technical complexity of transformer-based architectures. To mitigate this, teams should prioritize classical machine learning models first and define the Inclusive Profit Score early in development. Transformer models should be treated as optional stretch goals to keep the project scope manageable.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of classifying applicant default risk while optimizing profit-aware decision criteria for American Express second-look loan portfolios. Identify key stakeholders, target users, operational workflows, and supported decisions. Specify inputs including transaction histories, bureau profiles, and default logs to produce predicted risk scores and profit-aware lending recommendations within bounded offline auditing scopes.

8.  Gradient Boosted Tree Training: Train class-weighted gradient boosted decision tree models, such as XGBoost or LightGBM, to classify applicant credit default risk. Optimize feature representations, adjust cost-sensitive class weights, and capture complex non-linear relationships within transaction and credit bureau datasets.

:"Transform retrieval pipeline into an intelligent document agent.",nov:"Finalize enterprise-readiness and demonstrate business value.",bottleneck:"Students may face steep learning curves with RAG orchestration frameworks and vector database management, critical for enterprise-grade autonomous agents expected by 2026.",recommendation:"Well-scoped. Focus initial efforts on text-based PDFs before attempting multimodal features. Prioritize the 'Evaluation Framework' stretch goal to provide quantitative metrics on retrieval accuracy.",summary:"Students may face a steep learning curve with RAG orchestration frameworks and vector database management for enterprise-grade autonomous agents. To mitigate this risk, teams should initial efforts on simple text-based PDFs before attempting complex multimodal features. Additionally, prioritizing an evaluation framework stretch goal will help establish quantitative metrics for retrieval accuracy.",checklist_raw:`1.  Understand the Business & Project Problem: Define the core problem of building an enterprise-ready document intelligence solution. Identify target users, workflows, decisions, and risks of false positives. Translate business needs into building a RAG agent grounded in organizational knowledge. Establish learning objectives (RAG pipelines, vector embeddings) and clear success metrics like citation accuracy, answer quality, and trustworthiness.

4.  Perform Exploratory Data Analysis (EDA): Inspect text PDF structure, schemas, missing values, duplicates, document length, and quality issues. Identify potential extraction artifacts, formatting anomalies, and structural patterns. Document findings in an EDA notebook, using diagnostic observations to directly inform text cleaning, parsing, and chunking strategy decisions.

5.  Clean, Parse, Normalize, and Validate Data: Use a robust PDF library to deterministically parse and clean text while preserving stable IDs, section headers, and page provenance. Normalize formatting artifacts and audit source-to-output chunk boundaries manually. Validate missingness and invariants before freezing the clean, modeling-ready corpus table.

6.  Design Annotation & Build Gold Benchmark: Establish annotation standards for Q\\&A relevance, label taxonomies, evidence requirements, and uncertainty policies. Create detailed guidelines with positive, negative, and edge-case examples. Pilot the rubric, evaluate inter-annotator consistency, and assemble a human-reviewed retrieval benchmark. Freeze isolated development and test evaluation sets prior to model tuning.

7.  Build the Transparent Baseline: Implement a simple lexical or semantic retrieval baseline using a local vector database and a lightweight embedding model. Fit preprocessing strictly on training data and evaluate against the gold Q\\&A set using Recall@K. Document baseline failure modes, speed, and predictions to set a clear performance floor.

8.  Upgrade Core Method After Baseline: Introduce generation via LLM integration specifically to resolve identified baseline failure modes. Keep data splits, labels, metrics, and evaluation scripts strictly frozen. Measure uplift in answer quality against added latency, computational cost, and complexity, rejecting extensions that offer negligible measured value.

9.  Implement Project-Specific Advanced Gates: Measure Hit@K, Recall@K, and Precision@K while auditing chunks and Q\\&A relevance annotations. Evaluate semantic retrieval, grounded citations, and generation accuracy. Apply reranking strategies only when candidate recall is strong but precision order is poor, ensuring all answers cite retrieved evidence.

10. Validate, Audit, and Vet End-to-End System: Trace final predictions back to source text chunks and classify pipeline failures (parsing, retrieval, or generation hallucinations). Test system boundaries using invalid inputs, rate limits, and timeouts. Enforce human-in-the-loop validation for high-consequence outputs and document mitigations for all identified residual system risks.

11. Tune on Development Data & Single Final Run: Hyperparameter tuning, prompt engineering, chunk size selection, and retrieval depth adjustments must occur strictly within the development split. Freeze the entire system pipeline before evaluating once against the untouched test set. Report reproducible metrics alongside appropriate confidence intervals.

12. Attempt Stretch Features Post-Core Verification: Implement advanced extensions—such as multi-document reasoning, agentic workflows, access controls, or enterprise integrations—only after the primary pipeline is verified. Isolate orchestration tools, compare performance against the frozen baseline, evaluate added cost and latency, and maintain a functional fallback route.

13. Ensure Reproducibility & Responsible Reporting: Archive raw/processed data manifests, notebook revisions, environment specs, prompts, model seeds, and metric summaries in a clean repository. Document system limitations, failure taxonomies, and deployment readiness explicitly, ensuring another coach or engineer can seamlessly reproduce the entire workflow.`,gates:[{num:1,title:"Understand the Business & Project Problem",desc:"Define the core problem of building an enterprise-ready document intelligence solution. Identify target users, workflows, decisions, and risks of false positives. Translate business needs into building a RAG agent grounded in organizational knowledge. Establish learning objectives (RAG pipelines, ve"},{num:2,title:"Version and Verify Environment & Assets",desc:"Inventory datasets, APIs, compute, credentials, and advisor-provided assets. Confirm accessibility, provenance, and license restrictions while locking versions for Python, packages, and models. Implement preflight checks and fallback plans. Assign clear ownership for every required asset to prevent "},{num:3,title:"Acquire, Sample, and Profile Data",desc:"Define the unit of analysis, features, identifiers, and relationships for text-based PDFs. Confirm the dataset aligns with the intended document universe. Establish a reproducible sampling strategy if data exceeds compute limits, preventing data leakage. Freeze a raw-data manifest before processing "},{num:4,title:"Perform Exploratory Data Analysis (EDA)",desc:"Inspect text PDF structure, schemas, missing values, duplicates, document length, and quality issues. Identify potential extraction artifacts, formatting anomalies, and structural patterns. Document findings in an EDA notebook, using diagnostic observations to directly inform text cleaning, parsing,"},{num:5,title:"Clean, Parse, Normalize, and Validate Data",desc:"Use a robust PDF library to deterministically parse and clean text while preserving stable IDs, section headers, a or"},{num:11,title:"Tune on Development Data & Single Final Run",desc:"Hyperparameter tuning, prompt engineering, chunk size selection, and retrieval depth adjustments must occur strictly within the development split. Freeze the entire system pipeline before evaluating once against the untouched test set. Report reproducible metrics alongside appropriate confidence int"},{num:12,title:"Attempt Stretch Features Post-Core Verification",desc:"Implement advanced extensions—such as multi-document reasoning, agentic workflows, access controls, or enterprise integrations—only after the primary pipeline is verified. Isolate orchestration tools, compare performance against the frozen baseline, evaluate added cost and latency, and maintain a fu"},{num:13,title:"Ensure Reproducibility & Responsible Reporting",desc:"Archive raw/processed data manifests, notebook revisions, environment specs, prompts, model seeds, and metric summaries in a clean repository. Document system limitations, failure taxonomies, and deployment readiness explicitly, ensuring another coach or engineer can seamlessly reproduce the entire "}]},{id:"1058",title:"Contract Review Challenge",org:"Accenture",advisor:"Adarsh Ravikumar, Tate Arevalo, Lipika Mukherjee, Krol Mathias, Gopinath Kolluru, Hetal Jetani, Athina Gerodias, Sebastian Avery",ml_type:"Classification, NLP, Deep Learning, Pre-trained Models",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Build a pipeline to automatically detect key clauses in commercial contracts and generate a triage risk score using the CUAD dataset.",metrics:"Per-category precision/recall/F1 beating TF-IDF baseline; strong Spearman correlation between model risk rankings and advisor rankings, plus bucket agreement with advisor hand-ranked clauses and a sensitivity analysis showing the High/Medium boundary is stable.",data_link:"https://github.com/TheAtticusProject/cuad",sep:"Clean and split the CUAD data, run EDA on class imbalance, define chunking strategy, and establish TF-IDF/keyword baseline.",oct:"Fine-tune transformer encoder (e.g., DistilBERT) for chunk-based multi-label clause classification, address class imbalance, evaluate per-category precision/recall/F1 against TF-IDF baseline, and conduct error analysis.",nov:"Build and calibrate the four-signal risk-scoring layer, assemble end-to-end pipeline, and validate risk rankings against advisor-labeled examples (Spearman correlation, bucket agreement, and sensitivity analysis on High/Medium boundary); produce a working pipeline, a clean documented repo, and a final report summarizing results, limitations, and estimated reviewer time saved.",bottleneck:"Multi-label classification on highly imbalanced text data introduces heavy NLP learning debt and potential GPU timeouts during fine-tuning.",recommendation:"Ensure the team relies on pre-trained, lightweight models (e.g., DistilBERT) within Colab rather than attempting heavy LLM fine-tuning from scratch.",summary:"Executing multi-label classification on highly imbalanced contract data introduces significant technical complexity and risks GPU timeouts during model training. To prevent these bottlenecks, teams should rely on lightweight, pre-trained transformer models like DistilBERT within Google Colab rather than fine-tuning large models from scratch. This ensures efficient clause detection and risk scoring while keeping development on schedule.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of classifying multi-label legal clauses in unstructured contracts to automate risk-scoring and triage for Accenture. Key stakeholders include legal operations, compliance auditors, and contract managers. Inputs consist of CUAD contract databases and annotations, while outputs include predicted clause classifications and risk rankings. Operational scope is restricted to clause identification and risk assessment.

2.  Ingest Data & Setup Pipelines: Import the full Atticus Project CUAD contract document database, unstructured legal text agreements, and associated target clause annotations. Set up secure, reproducible environment configurations within Google Colab to manage raw data assets, verify file integrity, and establish standard data directory structures necessary for supporting downstream parsing, feature engineering, and model evaluation routines.

3.  Critical Data Gate - Contract Chunking Gate: Build an automated, deterministic text parsing and chunking pipeline using Python. Standardize and segment all incoming unstructured contract documents into uniform paragraph sizes with overlapping sentence boundaries to prevent context truncation, ensuring that multi-label legal clauses and critical context spans are fully preserved across all chunk splits.

4.  Template-Based Stratified Split: Enforce a strict stratified validation split based on specific contract templates to prevent structural template leakage between training and testing evaluation splits. This structural isolation ensures that the machine learning models learn generalizable clause patterns rather than memorizing template-specific layouts, maintaining rigorous validation standards throughout the model development lifecycle.

5.  Dataset Inspection & Text Normalization: Inspect the contract text dataset for scanning anomalies, formatting errors, or OCR noise. Implement local regex-based cleanup scripts and data normalization functions to standardize character formatting, remove bad whitespace, and fix structural artifacts before feeding the cleaned text chunks into downstream vectorization pipelines.

6.  Document-Boundary Quality Assertions: Write comprehensive document-boundary assertion tests to programmatically verify that processed chunk lengths, token counts, and label distributions remain strictly within target parameters. Blocking malformed chunks or extreme class imbalances ensures that data quality is validated automatically before baseline model training begins.

7.  Baseline Classical Machine Learning Model: Freeze a classical machine learning baseline model using TF-IDF vectorization paired with Logistic Regression classifiers to predict key legal clauses. Establishing this fast, interpretable benchmark provides a quantitative lower-bound for classification performance, precision, recall, and token-level F1-scores against which deep learning models can be measured.

8.  Transformer Fine-Tuning Pipeline: Upgrade the legal clause classification pipeline by fine-tuning pre-trained deep learning transformer models, such as DistilBERT or RoBERTa, on the standardized contract chunks. Utilizing lightweight context-aware architectures allows the model to capture complex semantic relationships across dense multi-label legal text while optimizing processing speed.

9.  Comprehensive Model Evaluation: Evaluate the multi-label legal clause classification pipeline using rigorous quantitative accuracy metrics, specifically calculating token-level F1-scores, per-category precision, and recall. Compare performance explicitly against the classical TF-IDF baseline to prove that deep learning architectures deliver significant improvements in identifying complex legal clauses.

10. Model Explainability & Triage Risk Audit: Audit model risk scores and predicted risk categories using SHAP (SHapley Additive exPlanations) values. Interpretability analysis identifies the specific contract clauses and key legal phrases that drive automated triage outputs, ensuring transparency and providing explainable evidence for corporate legal teams reviewing high-risk agreements.

11. Compute Resource & Memory Optimization: Verify that the complete model training, fine-tuning, and inference pipelines execute efficiently within Google Colab local GPU runtimes. Enforce strict memory limits to maintain a total memory footprint under 8 GB, preventing out-of-memory (OOM) crashes and ensuring stable execution throughout batch processing.

12. Hyperparameter Tuning & Internal Validation: Perform systematic hyperparameter tuning, optimizing transformer learning rates, batch sizes, and weight decay settings strictly within the dedicated training split. Isolating parameter optimization protects against subtle data leakage and ensures that fine-tuned configurations remain unbiased prior to final testing on held-out evaluation sets.

 GitHub)",sep:"Explore τ-bench, analyze multi-turn interaction schemas, and define 5 quality metrics. Deliverable: metric specification document listing five candidate metrics, identify the two selected for implementation, and document validation plans for each.",oct:"Build evaluation suite and execute comparative benchmarks across both datasets. Implement the two selected metrics and run their validation tests on τ-bench. If Difficulty is chosen, run a simple baseline agent to collect per-task success rates for correlation. Include scoring-consistency checks when running the suite. Deliverable: working evaluation suite and outputs for both datasets.",nov:"Synthesize findings into a formal scoring framework and comparison report. Design a scoring system combining the two chosen metrics with justification for weights, run within-τ-bench comparisons, and produce a side-by-side report (τ-bench vs synthetic) including weaknesses and concrete improvement recommendations. Deliverable: final report and scoring system.",bottleneck:"Evaluating multi-turn agent datasets introduces dense conceptual debt and risks infinite execution cycles if LLM evaluation loops are not capped.",recommendation:"Provide a strict, deterministic rubric for metric definitions early in September to prevent teams from getting stuck in theoretical research loops.",summary:"Evaluating multi-turn agent benchmark datasets introduces significant conceptual debt and risks infinite execution cycles if LLM evaluation loops are uncapped. To prevent teams from stalling in theoretical research loops, early guidance must establish strict, deterministic metric definitions and clear evaluation boundaries.",checklist_raw:`1.  Understand the business and project problem — Define the real-world problem, target users, and bounded technical task of building a scoring system to compare AI agent benchmark datasets (τ-bench and synthetic data). Identify potential risks, limitations, and learning objectives. Select key value metrics like discriminative power and scoring consistency. Advance when stakeholders clearly understand the task, output, and success metrics.

2.  Version and verify the environment, sources, and assets — Inventory all datasets, documents, schemas, APIs, credentials, and compute assets. Verify that JSON and Python files (≤ 1 GB) are accessible and safe. Record Python, library, and runtime versions while setting up explicit preflight checks. Provide practical workarounds for missing documentation. Advance when every required asset has an assigned owner, validation result, and ready environment.

3.  Acquire, sample, and profile the data — Define the unit of analysis, target attributes, identifiers, and group relationships across datasets. Confirm that the data accurately represents the target task. Freeze the exact datasets, unit tests, and benchmarking harness to prevent data leakage during sampling or aggregation. Advance when the team clearly understands what each record represents and how it aligns with the task.

4.  Perform exploratory data analysis — Inspect schemas, missing values, duplicates, and multi-turn interaction patterns in both τ-bench and synthetic datasets. Examine class balance, distributions, outliers, and potential train/test contamination or leakage. Document key observations and risks separate from performance claims. Advance when EDA successfully informs data-quality risks, modeling constraints, and necessary cleaning strategies.

5.  Clean, parse, normalize, and validate the data — Execute deterministic parsing and cleaning before computing metrics. Preserve stable IDs, timestamps, and provenance while normalizing categories without losing critical variation. Audit source-to-output samples manually and validate external or synthetic data for relevance and compliance. Advance when diagnostics and manual checks confirm the trustworthiness of the frozen modeling data.

6.  Design annotation and build the gold benchmark — Define strict, deterministic rubrics for metric definitions to prevent research stalls. Measure inter-annotator agreement, resolve discrepancies, and conduct leakage audits. Produce a formal metric specification document selecting two primary metrics to implement along with validation plans. Advance when gold labels align with prediction units and the metric spec is finalized.

7.  Build the transparent baseline — Implement a simple, deterministic Python metric computation baseline. Execute validation tests on τ-bench and run the suite across both datasets, including scoring-consistency checks and optional baseline agent success rates. Save all baseline configurations, predictions, and limitations. Advance when the baseline runs reproducibly, establishing a clear performance floor for subsequent iterations.

8.  Upgrade the core method only after the baseline — Develop advanced scoring methods only to address specific baseline failure modes. Keep splits, labels, and metrics frozen while combining chosen metrics into a unified scoring framework with justified weights. Generate a side-by-side comparative evaluation report detailing weaknesses and recommendations. Advance when the new method demonstrates measurable improvement over baseline.

9.  Validate, audit, and vet the end-to-end system — Trace system outputs directly back to source records and trace pipeline errors to specific stages. Audit edge cases, subgroup behaviors, out-of-distribution inputs, and failure modes. Test system resilience against timeouts, rate limits, and invalid inputs while ensuring safety and privacy compliance. Advance when the responsible subsystem for major errors is identified with documented mitigations.

10. Tune only on development data and run the final evaluation once — Perform all prompt engineering, hyperparameter tuning, and threshold adjustments strictly on development data. Freeze the finalized pipeline prior to unblinding the test set. Run the final evaluation exactly once, recording artifacts, predictions, and confidence intervals. Advance when final reported metrics are fully reproducible from an untouched test partition.

11. Attempt stretch or agentic extensions only after the core works — Introduce advanced extensions, such as synthetic dataset generation refinement loops, only after the core framework is validated. Compare extension performance against the non-agentic baseline to evaluate latency, cost, and complexity tradeoffs. Maintain a reliable fallback path. Advance when measured performance gains clearly justify added architectural complexity and operational risks.

ool of Public Policy",advisor:"Ibrahim Emara",ml_type:"Classification, NLP, Time Series",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"NLP",objective:"Build an NLP model that classifies user-reported risk themes (e.g., dependence, attachment) in mental health app reviews.",metrics:"Labeled training sample, baseline classifier evaluated on macro F1, per-class precision/recall, and confusion matrices, error analysis, and final presentation.",data_link:"https://github.com/Sensify-Lab/MHARD ; https://zenodo.org/records/18751157",sep:"Data exploration, risk taxonomy schema design, and sample hand-labeling.",oct:"Feature extraction (TF-IDF), baseline modeling (Logistic Regression, Random Forest).",nov:"Final model evaluation (macro F1, per-class precision/recall, confusion matrices) and feature interpretability analysis.",bottleneck:"Manual human-in-the-loop hand-labeling introduces massive operational delays if inter-rater reliability is low or volume is too high.",recommendation:"Cap the hand-labeling requirement at a strict maximum limit (e.g., 500 reviews) to guarantee model prototyping begins by October.",summary:"Manual hand-labeling of mental health app reviews risks significant operational delays if review volume is too high or inter-rater reliability is low. To ensure NLP model development remains on schedule, the project should enforce a strict cap of 500 hand-labeled reviews. Setting this boundary allows the team to validate risk-theme classification pipelines promptly without getting bogged down in data annotation.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of detecting and classifying clinical and safety risk themes within unstructured mental health app reviews for Brooks School. Identify stakeholders, including public health researchers and compliance auditors. Map operational workflows such as review screening and safety auditing to support decision-making, while establishing clear boundaries that strictly prohibit using these outputs for active patient triage or clinical intervention tasks.

2.  Data Ingestion & Setup: Ingest unstructured mental health app reviews, customer feedback text datasets, and initial risk-theme taxonomy tables. Set up data pipelines to efficiently process raw user feedback into readable tabular formats, establishing a reliable data foundation for downstream text extraction, baseline modeling, and safety risk evaluation workflows.

3.  Critical Data Gate - Annotation Volume Gate: Programmatically enforce a strict cap of maximum 500 hand-labeled reviews to ensure active modeling and validation start on schedule, thereby avoiding annotation bottlenecks and resource delays. This hard limit forces early focus on baseline performance and validation metrics before scaling up data collection or model complexity.

4.  Raw Text Preprocessing: Clean and parse raw app reviews by systematically removing extraneous metadata, HTML artifacts, and system codes while preserving critical feedback context. Normalizing textual inputs ensures consistent formatting across the dataset, preventing downstream errors during tokenization, feature extraction, and model training phases.

5.  Text Processing Pipeline: Build a comprehensive text processing pipeline using SpaCy to map unstructured review texts into clean, tokenized keyword features. Standardize linguistic structures through lemmatization, stop-word filtering, and named entity recognition to improve feature representation for downstream topic modeling and classification tasks.

6.  Feature Extraction & Embedding Generation: Calculate TF-IDF matrices and generate dense sentence embeddings across all review texts to capture rich semantic density, contextual nuances, and explicit risk markers. Combining statistical keyword frequencies with contextual vector representations provides a robust foundation for identifying nuanced mental health safety concerns.

7.  Baseline Regex Classifier: Freeze a baseline rule-based regex risk-theme classifier designed to match known clinical and safety risk key terms. Establishing this deterministic modeling floor provides a fast, transparent benchmark against which more sophisticated machine learning and natural language processing architectures can be measured.

8.  Unsupervised Topic Modeling: Train unsupervised topic models, such as Latent Dirichlet Allocation (LDA), to discover hidden thematic patterns and group app reviews into distinct risk cohorts. Analyzing topic distributions helps uncover emerging safety concerns and user-reported feedback themes without relying solely on predefined labels.

9.  Vector Space Clustering: Apply K-Means clustering algorithms to the review embedding vector space to group similar feedback. Calculate Silhouette scores and evaluate elbow curves to determine optimal cluster counts, ensuring distinct vector groupings that accurately reflect underlying risk categories and user sentiment.

10. Topic Classification Metric Evaluation: Evaluate topic classification and clustering performance using topic coherence scores and cluster separation metrics. Rigorously analyzing quantitative separation and qualitative topic interpretability validates that extracted review clusters correspond meaningfully to actual mental health risk themes.

11. Clinical Safety & Sensitivity Audit: Audit model risk classifications specifically to verify that severe clinical risk themes, such as self-harm or crisis indicators, are flagged with 100% sensitivity. Eliminating false negatives in high-severity risk categories guarantees that critical safety signals are reliably caught for downstream review.

12. Hyperparameter Tuning & Model Calibration: Tune clustering hyperparameters, topic counts, and similarity thresholds strictly on the dedicated training partition. Iteratively refining model settings without exposing validation data guards against overfitting and maintains strict separation between training logic and evaluation benchmarks.

13. Final Out-of-Sample Validation: Evaluate overall risk-theme classification accuracy exactly once on the frozen, out-of-sample validation partition. Assessing final generalization performance on unseen data confirms that the NLP pipeline reliably detects user-reported risk themes without empirical bias or data leakage.
