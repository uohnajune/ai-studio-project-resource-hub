embedding similarity threshold optimization, strictly within the dedicated training and validation partitions to prevent data leakage into final evaluation environments."},{num:12,title:"Frozen Test Set Out-of-Sample Evaluation",desc:"Conduct a final, comprehensive evaluation of out-of-sample ticket triage and routing accuracy exactly once using the completely frozen incident test set. Verify system generalization, measure real-world performance metrics, and validate operational readiness against baseline standards."},{num:13,title:"Final Deliverables & Documentation",desc:"Deliver a fully reproducible document classification notebook, a structured ticket prioritization rule ledger, and a comprehensive technical report detailing model architecture, agent evaluation metrics, and deployment guidelines for production integration."}]},{id:"1040",title:"Did that campaign work?: Predicting Pharma Ad Performance",org:"WebMD",advisor:"Kimia Naeiji",ml_type:"Classification, Regression, Clustering",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Predict H2 campaign spend performance, cost efficiency (CPE), and expected engagement volume, broken out by tactic type, client target list segments, and HCP specialty groups.",metrics:"Primary: MAPE on held-out H2 total_spend predictions < 30%; Secondary: R2 > 0.55 on the H2 holdout.",data_link:"Provided via CSV",sep:"Data Foundations & Problem Definition: Complete EDA (clean brand name inconsistencies, handle nulls in country/pillar/profession/specialty, drop/engineer around total_engagements nulls and 2099 end dates); encode categorical variables. Deliverables: Data Quality Report, Cleaned Dataset Artifact (cleaned_df.csv), Cleaning Decision Log, written problem framing document with target/features and baseline statistics.",oct:"Feature Engineering & Core Modeling: Engineer features; train and compare a baseline linear regression and a tree-based model (Random Forest or XGBoost); produce initial validation metrics and a feature importance/coefficient comparison table. Optional stretch: multi-output regression and/or a cluster-then-regress variant if baselines underperform or time permits.",nov:"Evaluation, Business Insights & Refinement: Iterate/tune the best model; evaluate on the held-out H2 set; report primary MAPE on H2 total_spend and secondary R2; conduct error/insight breakdowns by tactic type, client target list segments, and HCP specialty groups. Deliverables: final model and metrics, reproducible notebook, 5–10 slide deck, short written report.",bottleneck:"Single global regression models on heterogeneous campaign types/tactics/audiences may underperform because scaling and cost dynamics differ across groups.",recommendation:"Keep clustering (cluster-then-regress) as an optional enhancement gated on completing the baseline linear and tree-based models; attempt only if time permits or baseline accuracy thresholds are not met.",summary:"Single global regression models may underperform on heterogeneous campaign data because scaling and cost dynamics differ significantly across tactics and audiences. To address this risk, teams should prioritize establishing baseline linear and tree-based models first before attempting advanced techniques. Complex approaches like cluster-then-regress should remain optional enhancements, gated on initial model performance and available time.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting pharmaceutical advertising campaign costs and engagement metrics across distinct medical specialties for WebMD. Identify stakeholders, target users, operational workflows, and decisions like allocating ad inventory slots and setting CPM/CPE targets. Specify inputs including campaign logs and outputs including continuous engagement volumes and cost-per-engagement estimates, while establishing pre-campaign boundaries and operational risks.

2.  Historical Data Ingestion & Source Consolidation: Ingest historical pharmaceutical ad campaign metrics, brand categories, cost-per-engagement tables, and NRx prescription volumes provided by WebMD. Consolidate these multi-source tabular data files into a centralized data pipeline, establishing standardized data schemas, checking variable types, and preparing raw datasets for downstream preprocessing, cleaning, and exploratory data analysis.

3.  Data Joining & Quality Verification: Verify that ad campaign start and end dates, regional brand metrics, and performance logs are joined cleanly without dropped records, synthetic duplicates, or unexpected blank rows. Implement validation checks across critical categorical dimensions and numerical features to guarantee relational integrity before moving forward into feature engineering and split creation.

4.  Chronological Campaign Partitioning: Enforce a strict chronological campaign split by training model baselines on early campaign cohorts and testing on later campaigns to evaluate real temporal drift. Ensure that past campaign performance strictly informs future predictions without leaking future market conditions, seasonality, or campaign dynamics into the historical training set.

5.  Feature Scaling & Data Transformation: Apply log transformations and standard scaling to highly skewed ad cost-per-engagement metrics, engagement targets, and numerical campaign volume variables. Standardize continuous features across different medical specialties to stabilize optimization, eliminate extreme outlier distortions, and improve baseline model convergence during training.

6.  Data Quality & Boundary Assertions: Write strict data quality and boundary assertions validating that all recorded ad costs, impression counts, target volumes, and clinical volume indices are strictly positive, non-zero numerical values. Automatically flag missing values, invalid dates, and invalid cost records before executing downstream feature transformation and baseline modeling steps.

7.  Deterministic Baseline Model Establishment: Freeze a simple, deterministic linear regression baseline model that predicts campaign engagement based solely on brand category metadata. Establish benchmark error metrics and computational baselines to measure performance improvements gained when transitioning to more complex tree-based modeling architectures.

8.  Advanced Gradient Boosting Model Upgrade: Upgrade from the linear baseline to train advanced gradient-boosted decision tree models such as XGBoost and LightGBM. Predict multi-target ad performance and continuous cost-per-engagement outcomes while capturing complex interactions, nonlinear relationships, and categorical feature variances across campaign tactics.

9.  Critical Chronological Data Gate: Evaluate model performance strictly on unseen, post-rollout campaign datasets to establish a rigorous operational data gate. Measure success using PR-AUC for top-performing campaign classification and Root Mean Squared Error (RMSE) for continuous cost-per-engagement predictions prior to finalizing models.

10. Model Explainability & SHAP Feature Auditing: Audit trained model predictions using SHAP global importance maps and local feature attribution values. Verify that predictive feature weights align with domain expectations, historical campaign dynamics, and established media spending behavior across pharmaceutical client segments.

11. Scenario Stress-Testing & Robustness Validation: Stress-test trained regression models by providing hypothetical edge-case scenarios, including low-budget and high-cost campaign parameters. Ensure the models generate logical prediction boundaries, maintain continuous numerical stability, and avoid erratic outputs under simulated market shifts.

12. Hyperparameter Tuning & Validation Partitioning: Tune all gradient-boosted tree hyperparameters, number of estimators, depth constraints, and learning rates strictly within the early campaign training partition. Avoid tuning on validation sets to preserve test set integrity and prevent hyperparameter overfitting on future campaign data.

13. Final Out-of-Sample Model Evaluation: Evaluate ad performance and cost predictions exactly once against the frozen out-of-sample campaign validation partition. Calculate final primary MAPE on total spend and secondary R2 scores to assess real-world generalization before generating business deck recommendations.

ad all CSVs (data setup). Compute basic stats: row counts, null rates, fraud prevalence. Plot no-show rate distributions: fraud vs. legit. Week 2: Deep Exploratory Data Analysis (EDA). Surface the key behavioral differences between fraudsters and legitimate members. Confirm findings match the signal table. Compile EDA deck. Week 3: Feature engineering sprint 1: no_show_rate, no_show_rate_l90d, noshow_points_ratio, avg_days_to_redemption. Document each feature with target signal. Week 4: Feature engineering sprint 2: max_same_day_noshow_bookings, distinct_markets_booked, upscale_reservation_frac, avg_advance_booking_days. Complete feature store.",oct:"Week 5: Baseline logistic regression. XGBoost with class weighting. Compare PR-AUC. Demonstrate why accuracy is the wrong metric. Threshold grid (10 values). Week 6: XGBoost hyperparameter tuning. SMOTE experiment — compare to class weighting. Select operating threshold. Lock model version for explainability layer. Week 7: SHAP TreeExplainer integration. Generate force plots for 3 fraud and 3 legit members. Build dashboard scaffold with placeholder risk queue. Week 8: Dashboard completion: live SHAP explanations, risk tier display, filterable alert queue. Usability review with program manager. Business case draft.",nov:"Week 9: Red Team exercise (full cohort, 2 hrs). Debrief writeup. Final presentation build. Executive summary draft reviewed by program manager. Week 10: Presentation rehearsal. Final 20-minute stakeholder pitch. Q&A. Program retrospective. Meant to build in some flexibility for some tasks to take longer than one week or iterations on dashboard, project, etc.",bottleneck:"Students may face technical debt in handling class imbalance (fraud prevalence) and SHAP explainability. Institutional gaps exist regarding data privacy/compliance, requiring careful anonymization or use of synthetic data.",recommendation:"The project is broad. To align with student skill levels, focus exclusively on Supervised Classification (XGBoost) and SHAP components. De-prioritize 'Recommendation' and 'Clustering' unless the core fraud model is completed early. Ensure synthetic data generation is finalized before September.",summary:"Students may encounter challenges with class imbalance, SHAP explainability, and data privacy constraints when building the fraud detection model. To align with student skill levels and avoid scope creep, the project should focus exclusively on supervised classification using XGBoost and SHAP explainability, de-prioritizing recommendation or clustering features. Additionally, ensuring synthetic data generation is finalized early will help mitigate privacy risks and prevent execution delays.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of detecting no-show reservation fraud and loyalty point abuse for Wyndham Hotels & Resorts. Align stakeholders, fraud analysts, and front-desk workflows. Inputs include synthetic loyalty accounts, histories, and fraud logs; outputs provide fraud-risk scores and SHAP explanations. Scope remains predictive to avoid automatic booking cancellations while mitigating false-positive member churn.

2.  Data Ingestion & Source Consolidation: Ingest synthetic Wyndham-shaped loyalty accounts, detailed loyalty reservation histories, points redemption timing, and historical fraud logs. Standardize disparate data formats into structured tabular data frames for downstream pipeline ingestion, ensuring schema compatibility across all transaction logs and customer historical profile records.

3.  Dataset Integrity & Feature Unification: Verify raw dataset integrity by validating schema structures, resolving missing fields, and mapping reservation dates alongside transaction timestamps into a unified tabular feature table. Ensure accurate temporal alignment across guest loyalty profiles, stay histories, and booking transaction logs.

4.  Account-Based Stratified Partitioning: Enforce a strict stratified validation split based on unique loyalty account IDs to prevent multi-reservation account data leakage. Ensure that all historical reservations belonging to a single loyalty member strictly reside within either the training, validation, or test partition.

5.  Exploratory Feature Profiling & Analysis: Profile key reservation features, such as point-redemption velocity, booking lead times, account age, and cancellation rates. Analyze statistical distributions to identify critical fraud correlation skews, anomalous booking behaviors, and high-risk transactional patterns across different property tiers.

6.  Automated Data Quality Assertions: Implement strict programmatic data validation assertions across all ingested features. Ensure that point values, booking counts, monetary amounts, and lead times are mathematically valid (e.g., point values \\>= 0) to prevent corrupted inputs from reaching model training pipelines.

7.  Baseline Model Benchmarking: Freeze a simple baseline logistic regression classifier that flags fraud based strictly on short booking lead times under 24 hours. Establish baseline performance metrics to measure incremental performance gains from subsequent complex tree-based architectures.

8.  Advanced Classification Model Training: Train class-weighted gradient boosted decision trees, such as XGBoost or LightGBM, to identify complex, non-linear relationships in anomalous loyalty reservations. Optimize tree architectures to distinguish between legitimate guest bookings and fraudulent point-redemption patterns.

9.  Imbalance Calibration & Performance Evaluation: Evaluate fraud classification models using PR-AUC, F1-score, and cost-sensitive precision-recall metrics to address extreme class imbalance (\\~1% fraud rate). Prioritize precision-recall tradeoffs to balance fraud capture against false-positive customer friction.

10. Probability Threshold Calibration: Plot probability calibration curves to verify that model output scores accurately reflect real-world fraud likelihoods. Calibrate output decision boundaries before establishing operational risk thresholds for manual analyst review or automated flagging.

11. Model Explainability Integration: Configure a local explainability module using SHAP (SHapley Additive exPlanations) values to generate real-time feature attribution scores. Provide transparent, human-readable risk factors for analysts reviewing high-risk flagged loyalty accounts.

12. Hyperparameter & Threshold Optimization: Fine-tune model hyperparameters, class weights, and decision thresholds strictly within the validation data partition. Prevent target leakage by keeping test data completely unseen during model selection and parameter adjustments.

13. Out-of-Sample Final Evaluation: Measure out-of-sample fraud detection performance exactly once using the frozen loyalty reservation test partition. Document final metrics, including PR-AUC and false-positive rates, to verify model stability on unseen historical data.

14. Production Deliverables & Documentation: Deliver an automated, end-to-end no-show fraud detection notebook, a localized SHAP explainability user guide, and a comprehensive model validation report summarizing operational risks, performance benchmarks, and deployment recommendations.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of detecting no-show reservation fraud and loyalty point abuse for Wyndham Hotels & Resorts. Align stakeholders, fraud analysts, and front-desk workflows. Inputs include synthetic loyalty accounts, histories, and fraud logs; outputs provide fraud-risk scores and SHAP explanat"},{num:2,title:"Data Ingestion & Source Consolidation",desc:"Ingest synthetic Wyndham-shaped loyalty accounts, detailed loyalty reservation histories, points redemption timing, and historical fraud logs. Standardize disparate data formats into structured tabular data frames for downstream pipeline ingestion, ensuring schema compatibility across all transactio"},{num:3,title:"Dataset Integrity & Feature Unification",desc:"Verify raw dataset integrity by validating schema structures, resolving missing fields, and mapping reservation dates alongside transaction timestamps into a unified tabular feature table. Ensure accurate temporal alignment across guest loyalty profiles, stay histories, and booking transaction logs."},{num:4,title:"Account-Based Stratified Partitioning",desc:"Enforce a strict stratified validation split based on unique loyalty account IDs to prevent multi-reservation account data leakage. Ensure that all historical reservations belonging to a single loyalty member strictly reside within either the training, validation, or test partition."},{num:5,title:"Exploratory Feature Profiling & Analysis",desc:"Profile key reservation features, such as point-redemption velocity, booking lead times, account age, and cancellation rates. Analyze statistical distributions to identify critical fraud correlation skews, anomalous booking behaviors, and high-risk transactional patterns across different property ti"},{num:6,title:"Automated Data Quality Assertions",desc:"Implement strict programmatic data validation assertions across all ingested features. Ensure that point values, booking counts, monetary amounts, and lead times are mathematically valid (e.g., point values \\>= 0) to prevent corrupted inputs from reaching model training pipelines."},{num:7,title:"Baseline Model Benchmarking",desc:"Freeze a simple baseline logistic regression classifier that flags fraud based strictly on short booking lead times under 24 hours. Establish baseline performance metrics to measure incremental performance gains from subsequent complex tree-based architectures."},{num:8,title:"Advanced Classification Model Training",desc:"Train class-weighted gradient boosted decision trees, such as XGBoost or LightGBM, to identify complex, non-linear relationships in anomalous loyalty reservations. Optimize tree architectures to distinguish between legitimate guest bookings and fraudulent point-redemption patterns."},{num:9,title:"Imbalance Calibration & Performance Evaluation",desc:"Evaluate fraud classification models using PR-AUC, F1-score, and cost-sensitive precision-recall metrics to address extreme class imbalance (\\~1% fraud rate). Prioritize precision-recall tradeoffs to balance fraud capture against false-positive customer friction."},{num:10,title:"Probability Threshold Calibration",desc:"Plot probability calibration curves to verify that model output scores accurately reflect real-world fraud likelihoods. Calibrate output decision boundaries before establishing operational risk thresholds for manual analyst review or automated flagging."},{num:11,title:"Model Explainability Integration",desc:"Configure a local explainability module using SHAP (SHapley Additive exPlanations) values to generate real-time feature attribution scores. Provide transparent, human-readable risk factors for analysts reviewing high-risk flagged loyalty accounts."},{num:12,title:"Hyperparameter & Threshold Optimization",desc:"Fine-tune model hyperparameters, class weights, and decision thresholds strictly within the validation data partition. Prevent target leakage by keeping test data completely unseen during model selection and parameter adjustments."},{num:13,title:"Out-of-Sample Final Evaluation",desc:"Measure out-of-sample fraud detection performance exactly once using the frozen loyalty reservation test partition. Document final metrics, including PR-AUC and false-positive rates, to verify model stability on unseen historical data."},{num:14,title:"Production Deliverables & Documentation",desc:"Deliver an automated, end-to-end no-show fraud detection notebook, a localized SHAP explainability user guide, and a comprehensive model validation report summarizing operational risks, performance benchmarks, and deployment recommendations."}]},{id:"1045",title:"Do AI Job-Risk Indices Agree?",org:"Swytch",advisor:"Julie Young",ml_type:"Classification, Regression, Clustering, Deep Learning / Neural Networks",evaluation:"Revise with constraints",urgency:"High",data_readiness:"Significant normalization/ETL required",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Measure how much various AI-risk rankings (Felten-Raj-Seamans, Eloundou, Frey-Osborne) agree and identify which job features drive disagreements to determine the reliability of AI-risk signals for career guidance.",metrics:"A clean, reproducible merged table; rank correlation numbers; occupation groupings by risk profile; a model explaining disagreements; and a plain writeup of findings.",data_link:"https://cps.ipums.org, https://www.onetcenter.org/database.html, https://www.bls.gov/oes, https://www.bls.gov/emp/tables/occupational-separations-and-openings.htm",sep:"Data exploration and preprocessing; standardize index formats; map SOC codes to O*NET/BLS; clean identifiers; by week 3 deliver a 'Merge-First' integrated table combining the three indices with O*NET/BLS.",oct:"Feature engineering and baseline analysis; compute rank correlations/concordance across indices; group occupations by risk profile and validate groupings.",nov:"Train tree-based models (Random Forest/XGBoost) to explain index disagreements using occupational features; report feature importance; Keras neural net optional/stretch for comparison.",bottleneck:"Students must navigate complex crosswalks between occupational coding systems (SOC/O*NET). Learning debt includes understanding automation index construction; prioritize tree-based models for tabular feature importance; Keras on tabular is optional/stretch.",recommendation:"Proceed with constraints: enforce a 'Merge-First' milestone by week 3; use Random Forest/XGBoost as the primary modeling baseline for explainability; reserve Keras as optional stretch. Focus on the three primary indices first; any additional indices or LLM comparisons remain stretch; prioritize the plain writeup.",summary:'Navigating complex SOC and O*NET crosswalks creates significant data integration friction, while learning automation index methodologies adds complexity. To keep the project on track, teams should enforce a "Merge-First" integrated dataset by week 3 and prioritize tree-based models like Random Forest or XGBoost for explainability over complex deep learning approaches. Focusing strictly on the core indices before attempting stretch goals ensures a clear and timely analysis of AI job-risk signals.',checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of measuring statistical agreement across conflicting AI job-risk indices for Swytch. Identify key stakeholders, target users, and workflows like workforce transition planning. Inputs include Felten, Eloundou, and Frey-Osborne scores; outputs are concordance rank statistics and risk-profile clusters. Ensure scope boundaries prevent automating hiring decisions to mitigate operational risks.

2.  Multi-Source Index Ingestion: Systematically ingest the primary AI job-displacement risk indices, specifically loading the complete dataset records for Felten, Eloundou, and Frey-Osborne occupational exposure scores. Establish secure data ingestion pathways and perform initial structure checks to ensure all raw input files are correctly formatted and completely accessible for subsequent crosswalk processing.

3.  🛑 CRITICAL DATA GATE - MERGE-FIRST ETL GATE: Build an automated data cleaning and crosswalk pipeline to map differing occupation taxonomy codes, including ONET, SOC, and Census codes, to a single unified standard by Week 3. Enforce this critical gate to ensure proper schema alignment before proceeding with downstream feature engineering or model training workflows.

4.  Data Integrity & Alignment Verification: Audit and verify that unique occupation codes and index score ranges are aligned across all ingested data sources without dropped records, missing entries, or null merges. Validate that mapping logic correctly preserves cross-walked occupational definitions, ensuring a continuous, unbroken tabular structure suitable for correlation testing and model development.

5.  Exposure Index Distribution Profiling: Thoroughly profile the underlying statistical distributions of the three exposure indices to establish clear analytical baselines. Analyze and document critical differences in scale, variance, skewness, and baseline occupational rankings across the individual datasets to identify potential skew or systemic bias before downstream model training.

6.  Automated Data Validation Assertions: Write and execute robust programmatic data validation assertions ensuring all ingested exposure index scores are properly normalized and constrained within defined numerical boundaries, such as standard scale values between 0 and 1. Automatically flag out-of-range anomalies, unexpected data types, or missing data points during data ingestion.

7.  Baseline Concordance Model Freezing: Freeze an explicit baseline concordance model utilizing a straightforward, unweighted average exposure score across indices to establish a permanent performance comparison floor. Use this simple baseline as a benchmark against which all complex machine learning models, clustering outputs, and correlation frameworks are subsequently evaluated.

8.  Rigorous Statistical Agreement Analysis: Compute comprehensive statistical correlation metrics, including Spearman's rank correlation coefficient and Kendall's tau rank correlation, to quantitatively evaluate concordance rates across indices. Identify specific occupational categories where index rankings diverge significantly, highlighting potential drivers of disagreement in risk assessment.

9.  Vector Space K-Means Risk Clustering: Apply K-Means clustering algorithms to the multi-index exposure vector space to group occupations into distinct high, medium, and low AI-risk profiles. Determine optimal cluster counts using silhouette scores to establish well-separated occupational groupings based on underlying automation exposure patterns.

10. Supervised Random Forest Risk Classification: Train a supervised Random Forest classifier to predict occupational risk cluster assignments using underlying demographic, educational, and occupational covariates. Evaluate feature importance metrics derived from the tree-based ensemble to determine which specific job characteristics drive agreement or disagreement among indices.

11. Weight Sensitivity & Robustness Testing: Conduct thorough sensitivity and robustness analyses to evaluate how varying individual index weights impacts overall occupational risk classifications. Test alternate weighting schemes to determine the stability of cluster assignments and ensure recommendations remain resilient against minor variations in input index reliability.

12. Strict Training Partition Parameter Tuning: Perform all hyperparameter tuning, feature selection, distance metric selection, and model calibration strictly within the designated training data partition. Enforce rigorous data hygiene standards to prevent data leakage and ensure model evaluations remain un-biased prior to final validation testing.

variance, skewness, and baseline occupational rankings across the individual datasets to identify potential skew or s"},{num:6,title:"Automated Data Validation Assertions",desc:"Write and execute robust programmatic data validation assertions ensuring all ingested exposure index scores are properly normalized and constrained within defined numerical boundaries, such as standard scale values between 0 and 1. Automatically flag out-of-range anomalies, unexpected data types, o"},{num:7,title:"Baseline Concordance Model Freezing",desc:"Freeze an explicit baseline concordance model utilizing a straightforward, unweighted average exposure score across indices to establish a permanent performance comparison floor. Use this simple baseline as a benchmark against which all complex machine learning models, clustering outputs, and correl"},{num:8,title:"Rigorous Statistical Agreement Analysis",desc:"Compute comprehensive statistical correlation metrics, including Spearman's rank correlation coefficient and Kendall's tau rank correlation, to quantitatively evaluate concordance rates across indices. Identify specific occupational categories where index rankings diverge significantly, highlighting"},{num:9,title:"Vector Space K-Means Risk Clustering",desc:"Apply K-Means clustering algorithms to the multi-index exposure vector space to group occupations into distinct high, medium, and low AI-risk profiles. Determine optimal cluster counts using silhouette scores to establish well-separated occupational groupings based on underlying automation exposure "},{num:10,title:"Supervised Random Forest Risk Classification",desc:"Train a supervised Random Forest classifier to predict occupational risk cluster assignments using underlying demographic, educational, and occupational covariates. Evaluate feature importance metrics derived from the tree-based ensemble to determine which specific job characteristics drive agreemen"},{num:11,title:"Weight Sensitivity & Robustness Testing",desc:"Conduct thorough sensitivity and robustness analyses to evaluate how varying individual index weights impacts overall occupational risk classifications. Test alternate weighting schemes to determine the stability of cluster assignments and ensure recommendations remain resilient against minor variat"},{num:12,title:"Strict Training Partition Parameter Tuning",desc:"Perform all hyperparameter tuning, feature selection, distance metric selection, and model calibration strictly within the designated training data partition. Enforce rigorous data hygiene standards to prevent data leakage and ensure model evaluations remain un-biased prior to final validation testi"},{num:13,title:"Out-of-Sample Model Validation Evaluation",desc:"Assess out-of-sample index agreement and classification model accuracy exactly once using the frozen, unseen validation partition. Record final performance metrics, ensuring all evaluation procedures faithfully measure model generalizability without iterative retuning or post-hoc adjustments on test"},{num:14,title:"Stakeholder Reporting & Final Deliverables",desc:"Deliver a comprehensive comparative occupation-risk dashboard, a fully documented and repeatable taxonomy crosswalk notebook, and an executive statistical correlation report detailing key findings, model feature importances, and strategic implications for workforce planning."}]},{id:"1046",title:"Classification and fraud detection for sensitive documents",org:"Verizon",advisor:"Dhananjaya Ramachandra",ml_type:"Classification, Natural Language Processing (NLP), Computer Vision, Deep Learning / Neural Networks, Large Language Models (LLMs)/ Generative AI",evaluation:"Approved w/ feedback",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Computer Vision",objective:"To use open source identity document datasets (e.g., passports, driving IDs) to build ML/DNN models for classification and fraud detection to eliminate identity theft in customer onboarding.",metrics:"Successful completion of project milestones leveraging ML/DNN algorithms and large language models by December.",data_link:"https://smartengines.com/wp-content/uploads/2020/04/datasets-of-id-documents-midv-500.pdf",sep:"September 2026: Classification - Business and problem framing - Data collection and preparation - Feature engineering - Model engineering and selection - Model evaluation and reports",oct:"October 2026: Fraud Detection - Data preparation - Model engineering and selection - Model evaluation and reports",nov:"November 2026: Model finalization, validation, documentation, and project wrap-up. (Stretch goal: AI agent creation for autonomous clustering and fraud detection.)",bottleneck:"Combining Computer Vision with LLM/Deep Learning presents high complexity. Students may face a steep learning curve in multi-modal architectures and autonomous agent logic by 2026 standards.",recommendation:'The November "AI agent" milestone is highly ambitious. Prioritize core classification and fraud detection models first. The AI agent component should be a stretch goal to ensure primary deliverables are robust and well-validated.',summary:"Combining computer vision with multi-modal LLM agent logic creates high technical complexity and a steep learning curve for students. To mitigate this risk, teams should prioritize developing core computer vision classification and fraud detection models first. The AI agent features should be shifted to an optional stretch goal to ensure the primary identity document verification deliverables are robust and well-validated.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of classifying and detecting image-level fraud in mobile-uploaded identity documents for Verizon. Identify key stakeholders, target users, and digital onboarding workflows. Inputs comprise raw document images and fraud labels; outputs include category tags and fraud-risk scores. Scope focuses purely on classification and triage, mitigating operational risks like false rejections and fraudulent account creation.

2.  Raw Data Ingestion & Setup: Ingest high-resolution raw document images, mobile-uploaded driver's licenses, state IDs, tax forms, and corresponding fraud annotation labels provided by Verizon. Securely store all artifacts, establish directory structures, and configure data loading routines to ensure seamless downstream batch processing and model compatibility across the image pipeline.

3.  Image Preprocessing & Resolution Gate: Build an automated, deterministic image cleaning and preprocessing pipeline in Python. Standardize and resize all raw input document images to uniform dimensions (e.g., 224x224 pixels) and apply scaling normalization to prevent GPU RAM allocation crashes and execution failures in Google Colab runtimes.

4.  Stratified Data Partitioning: Enforce a strict stratified validation split based on document source types and class labels. This prevents subtle document template leakage across train and test partitions, ensuring realistic out-of-sample evaluation for identity document classification and fraud detection systems.

5.  Image Quality Audit: Inspect the raw dataset for low-lighting, blurry, or extreme-angle mobile document uploads. Compute and log image quality indices to identify, flag, and filter out severely unreadable scans before passing inputs into downstream feature extraction pipelines.

6.  Image Boundary & Format Assertions: Write automated boundary assertions to verify that all preprocessed image dimensions, color channels (RGB), and pixel intensity ranges (0 to 255 or 0.0 to 1.0) strictly match expected uniform schemas across the input batch.

7.  Baseline ML Model Benchmarking: Freeze a classical machine learning baseline, such as a Logistic Regression or Support Vector Machine (SVM) classifier trained on flattened HOG descriptor arrays, to establish a verifiable performance floor for classification accuracy and fraud detection tasks.

8.  Deep Learning CNN Fine-Tuning: Upgrade the classification pipeline by fine-tuning pre-trained deep convolutional neural networks (such as ResNet-50 or MobileNetV2) on the standardized document images using PyTorch or Keras to significantly boost fraud detection capabilities.

9.  Comprehensive Model Metric Evaluation: Thoroughly evaluate document classification and fraud-detection performance across all document types. Measure performance using standardized statistical metrics including ROC-AUC, Precision-Recall AUC (PR-AUC), and macro/micro F1-scores to validate predictive reliability.

10. Post-Classification Model Explainability: Implement an explainability layer using Grad-CAM to generate visual attention heatmaps. These heatmaps highlight the specific visual regions of uploaded document images that influenced the deep learning model's classification and fraud-risk predictions.

11. Environment Memory Optimization: Monitor GPU memory utilization to ensure the complete modeling pipeline operates with a maximum memory footprint under 4 GB on Google Colab free-tier GPU runtimes, effectively preventing out-of-memory (OOM) kernel crashes.

12. Hyperparameter & Optimization Tuning: Perform all hyperparameter optimization, dropout rate adjustments, and optimizer learning rate tuning strictly within the training and validation splits to prevent data snooping and maintain clean model evaluation boundaries.

13. Final Out-of-Sample Test Evaluation: Evaluate document classification accuracy and fraud-detection performance exactly once on the frozen, out-of-sample document test partition to confirm true generalization capability before project wrap-up and model deployment.

14. Project Deliverables & Artifact Archiving: Deliver a fully repeatable deep learning document classification notebook, automated Grad-CAM heatmap visualization scripts, and a comprehensive model card detailing dataset characteristics, architecture choices, performance metrics, and deployment guidelines.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of classifying and detecting image-level fraud in mobile-uploaded identity documents for Verizon. Identify key stakeholders, target users, and digital onboarding workflows. Inputs comprise raw document images and fraud labels; outputs include category tags and fraud-risk scor"},{num:2,title:"Raw Data Ingestion & Setup",desc:"Ingest high-resolution raw document images, mobile-uploaded driver's licenses, state IDs, tax forms, and corresponding fraud annotation labels provided by Verizon. Securely store all artifacts, establish directory structures, and configure data loading routines to ensure seamless downstream batch pr"},{num:3,title:"Image Preprocessing & Resolution Gate",desc:"Build an automated, deterministic image cleaning and preprocessing pipeline in Python. Standardize and resize all raw input document images to uniform dimensions (e.g., 224x224 pixels) and apply scaling normalization to prevent GPU RAM allocation crashes and execution failures in Google Colab runtim"},{num:4,title:"Stratified Data Partitioning",desc:"Enforce a strict stratified validation split based on document source types and class labels. This prevents subtle document template leakage across train and test partitions, ensuring realistic out-of-sample evaluation for identity document classification and fraud detection systems."},{num:5,title:"Image Quality Audit",desc:"Inspect the raw dataset for low-lighting, blurry, or extreme-angle mobile document uploads. Compute and log image quality indices to identify, flag, and filter out severely unreadable scans before passing inputs into downstream feature extraction pipelines."},{num:6,title:"Image Boundary & Format Assertions",desc:"Write automated boundary assertions to verify that all preprocessed image dimensions, color channels (RGB), and pixel intensity ranges (0 to 255 or 0.0 to 1.0) strictly match expected uniform schemas across the input batch."},{num:7,title:"Baseline ML Model Benchmarking",desc:"Freeze a classical machine learning baseline, such as a Logistic Regression or Support Vector Machine (SVM) classifier trained on flattened HOG descriptor arrays, to establish a verifiable performance floor for classification accuracy and fraud detection tasks."},{num:8,title:"Deep Learning CNN Fine-Tuning",desc:"Upgrade the classification pipeline by fine-tuning pre-trained deep convolutional neural networks (such as ResNet-50 or MobileNetV2) on the standardized document images using PyTorch or Keras to significantly boost fraud detection capabilities."},{num:9,title:"Comprehensive Model Metric Evaluation",desc:"Thoroughly evaluate document classification and fraud-detection performance across all document types. Measure performance using standardized statistical metrics including ROC-AUC, Precision-Recall AUC (PR-AUC), and macro/micro F1-scores to validate predictive reliability."},{num:10,title:"Post-Classification Model Explainability",desc:"Implement an explainability layer using Grad-CAM to generate visual attention heatmaps. These heatmaps highlight the specific visual regions of uploaded document images that influenced the deep learning model's classification and fraud-risk predictions."},{num:11,title:"Environment Memory Optimization",desc:"Monitor GPU memory utilization to ensure the complete modeling pipeline operates with a maximum memory footprint under 4 GB on Google Colab free-tier GPU runtimes, effectively preventing out-of-memory (OOM) kernel crashes."},{num:12,title:"Hyperparameter & Optimization Tuning",desc:"Perform all hyperparameter optimization, dropout rate adjustments, and optimizer learning rate tuning strictly within the training and validation splits to prevent data snooping and maintain clean model evaluation boundaries."},{num:13,title:"Final Out-of-Sample Test Evaluation",desc:"Evaluate document classification accuracy and fraud-detection performance exactly once on the frozen, out-of-sample document test partition to confirm true generalization capability before project wrap-up and model deployment."},{num:14,title:"Project Deliverables & Artifact Archiving",desc:"Deliver a fully repeatable deep learning document classification notebook, automated Grad-CAM heatmap visualization scripts, and a comprehensive model card detailing dataset characteristics, architecture choices, performance metrics, and deployment guidelines."}]},{id:"1048",title:"Financial Forecasting & P&L Projection Tool",org:"Arkamark",advisor:"Ram Kumar Kuncha",ml_type:"Time Series Analysis; Regression; Gradient-Boosted Trees (ML); Probabilistic Forecasting (stretch); Natural Language Processing (LLMs)/Generative AI (stretch); Deep Learning / Neural Networks (stretch)",evaluation:"Approved w/ feedback",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Time Series",objective:"To build a model using ten years of historical financial data and time-series/regression techniques to forecast product-line sales and project a full income statement for the next two fiscal years.",metrics:"Primary: MAPE under ~10% at the annual level; beat the seasonal‑naive baseline on rolling/expanding‑window backtests; report MAPE, RMSE, and MAE on held-out/backtest windows per product line. Secondary: coherent, internally consistent two-year P&L; explainability of drivers under at least two macro scenarios; December delivery of a working, documented tool.",data_link:"Not in source",sep:"September — Data foundation & exploration • Load and clean all datasets; agree on a shared data dictionary and project structure. • Exploratory analysis: visualize each product line's trend and seasonality; decompose the series into trend / seasonal / residual. • Quantify how sales relate to the macro drivers (oil price, interest rate, construction index), including lagged effects. • Reconcile the historical P&L to the trial balances to understand how sales flow down to EBIT. • Establish naive and seasonal-naive baseline forecasts as the benchmark to beat.",oct:'October — Modeling • Feature engineering: calendar/seasonal terms, lagged macro variables, rolling statistics. • Build and compare sales-forecasting models per product line: baseline → classical time series (SARIMA/ETS) → ML regression (gradient boosting, regularized linear). • Build the "sales-to-P&L" engine: translate forecasted revenue into COGS, operating expenses, and EBIT using the historical margin structure. • Produce a first end-to-end two-year forecast (sales by product line + projected P&L).',nov:"November — Validation, scenarios & delivery • Backtest with rolling/expanding-window cross-validation; analyze errors and select final models. • Run scenario and sensitivity analysis (e.g., high- vs. low-interest-rate paths, an oil-price shock). • Package the forecasting tool (clean notebook or a simple dashboard) and finalize the two-year forecast P&L with EBIT and product-line sales. • Prepare the final presentation and a written summary of methodology, assumptions, and limitations.",bottleneck:"Complexity is high; students must bridge classical accounting with advanced time-series. Technical debt may arise from reconciling trial balances to P&L statements without finance domain expertise.",recommendation:"Scope is too broad. Prioritize Time Series and Regression components for the core P&L projection. Move LLM and NLP elements to 'stretch goals' to ensure the financial model is robust first. Limit macro variables to avoid overfitting.",summary:"Bridging classical accounting with advanced time-series modeling introduces high complexity and technical debt, especially when reconciling trial balances without deep financial domain expertise. To mitigate this risk and avoid overfitting, teams should prioritize core time-series and regression methods for the central P&L projections while capping macro drivers. Advanced LLM and NLP integrations should be moved to stretch goals to ensure the foundational financial model remains robust.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of projecting continuous sales, EBIT margins, and detailed trial balance entries across multi-year horizons for Arkamark. Key stakeholders and target users include financial planners and auditors. Workflows support budget planning and capital allocations. Inputs comprise ten years of financial logs, sales sheets, and balance statements to output monthly sales and EBIT forecasts, managing risks of over-investment or stockouts.

2.  Ingestion & Data Preparation: Systematically ingest the provided ten years of historical financial logs, monthly product sales sheets, trial balances, and annual income statements into a centralized environment. Ensure all raw data streams are properly formatted, versioned, and stored securely to establish a clean, immutable foundation for downstream feature engineering, exploratory data analysis, and predictive time-series modeling.

3.  Structural Data Mapping & Verification: Verify incoming financial data structures by conducting thorough structural audits across all records. Confirm that all unique trial balance accounts map cleanly to target profit and loss ledger items by Week 3. Resolving account mapping discrepancies early prevents ledger misalignments, stabilizes database schemas, and ensures robust compatibility across historical reporting periods.

4.  Temporal Partitioning & Leakage Prevention: Enforce a strict chronological data split, utilizing historical data up to 2024 for model training while reserving 2025 and 2026 for out-of-sample testing. This temporal isolation guarantees that no future information leaks into training sets, preserving time-series integrity and allowing for realistic evaluation of model generalization on unseen financial periods.

5.  Feature Table Stabilization & Cleaning: Inspect trial balance sheets to identify structural gaps, negative value anomalies, and audit reconciliation inconsistencies. Cleanse dirty records and impute missing values where appropriate to construct stabilized, high-quality feature tables. Resolving data quality issues ensures that downstream forecasting algorithms receive clean, consistent inputs free of noise or statistical distortion.

6.  Financial Rules & Accounting Constraints: Formulate and enforce strict rule-based financial validation checks across all dataset rows. Ensure that fundamental accounting equations hold true, specifically verifying that total assets always equal total liabilities plus equity. Additionally, validate that all monthly product sales balances remain strictly non-negative, rejecting invalid entries that violate real-world business constraints.

7.  Baseline Model Establishment: Freeze a classical baseline forecasting model using a naive seasonal Holt-Winters exponential smoothing approach. This simple benchmark establishes a minimum acceptable performance floor for sales projections. Comparing subsequent complex machine learning architectures against this baseline ensures that added model complexity yields measurable improvements in predictive accuracy.

8.  Advanced Time-Series Modeling: Train classical time-series architectures, including SARIMAX models augmented with product-category exogenous variables. Use these models to forecast granular monthly product demand, track seasonal fluctuations, and project key profit and loss line items. Ensure exogenous predictors are properly lagged to prevent data lookahead during long-term demand planning cycles.

9.  Quarterly Margin & EBIT Forecasting: Implement regularized linear regression models, such as Ridge or Lasso, utilizing lagged financial features and macroeconomic indicators. These models project continuous quarterly EBIT margins and overall operational profitability. Regularization prevents overfitting across collinear financial indicators, yielding robust, interpretable predictions aligned with broader economic trends.

10. Margin Reconciliation Data Gate: Implement a deterministic financial translation module serving as a critical quality gate. This subsystem programmatically links statistical demand forecasts to formal accounting ledger targets. Enforcing explicit double-entry bookkeeping constraints guarantees mathematically reconciled, fully aligned profit and loss reports that balance across all operational sub-accounts.

11. Performance Metrics & Error Evaluation: Quantitative evaluation of model forecasting accuracy relies on standard statistical metrics. Compute Mean Absolute Percentage Error (MAPE) alongside continuous Root Mean Square Error (RMSE) across all forecast horizons. Compare these metrics directly against the baseline to verify that sales and margin projections meet defined precision thresholds.

12. Hyperparameter Optimization & Tuning: Tune all model hyperparameters, seasonal parameters, and regularization penalties strictly within the training data partition. Cross-validation routines must respect temporal ordering to avoid lookahead bi`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of projecting continuous sales, EBIT margins, and detailed trial balance entries across multi-year horizons for Arkamark. Key stakeholders and target users include financial planners and auditors. Workflows support budget planning and capital allocations. Inputs comprise ten "},{num:2,title:"Ingestion & Data Preparation",desc:"Systematically ingest the provided ten years of historical financial logs, monthly product sales sheets, trial balances, and annual income statements into a centralized environment. Ensure all raw data streams are properly formatted, versioned, and stored securely to establish a clean, immutable fou"},{num:3,title:"Structural Data Mapping & Verification",desc:"Verify incoming financial data structures by conducting thorough structural audits across all records. Confirm that all unique trial balance accounts map cleanly to target profit and loss ledger items by Week 3. Resolving account mapping discrepancies early prevents ledger misalignments, stabilizes "},{num:4,title:"Temporal Partitioning & Leakage Prevention",desc:"Enforce a strict chronological data split, utilizing historical data up to 2024 for model training while reserving 2025 and 2026 for out-of-sample testing. This temporal isolation guarantees that no future information leaks into training sets, preserving time-series integrity and allowing for realis"},{num:5,title:"Feature Table Stabilization & Cleaning",desc:"Inspect trial balance sheets to identify structural gaps, negative value anomalies, and audit reconciliation inconsistencies. Cleanse dirty records and impute missing values where appropriate to construct stabilized, high-quality feature tables. Resolving data quality issues ensures that downstream "},{num:6,title:"Financial Rules & Accounting Constraints",desc:"Formulate and enforce strict rule-based financial validation checks across all dataset rows. Ensure that fundamental accounting equations hold true, specifically verifying that total assets always equal total liabilities plus equity. Additionally, validate that all monthly product sales balances rem"},{num:7,title:"Baseline Model Establishment",desc:"Freeze a classical baseline forecasting model using a naive seasonal Holt-Winters exponential smoothing approach. This simple benchmark establishes a minimum acceptable performance floor for sales projections. Comparing subsequent complex machine learning architectures against this baseline ensures "},{num:8,title:"Advanced Time-Series Modeling",desc:"Train classical time-series architectures, including SARIMAX models augmented with product-category exogenous variables. Use these models to forecast granular monthly product demand, track seasonal fluctuations, and project key profit and loss line items. Ensure exogenous predictors are properly lag"},{num:9,title:"Quarterly Margin & EBIT Forecasting",desc:"Implement regularized linear regression models, such as Ridge or Lasso, utilizing lagged financial features and macroeconomic indicators. These models project continuous quarterly EBIT margins and overall operational profitability. Regularization prevents overfitting across collinear financial indic"},{num:10,title:"Margin Reconciliation Data Gate",desc:"Implement a deterministic financial translation module serving as a critical quality gate. This subsystem programmatically links statistical demand forecasts to formal accounting ledger targets. Enforcing explicit double-entry bookkeeping constraints guarantees mathematically reconciled, fully align"},{num:11,title:"Performance Metrics & Error Evaluation",desc:"Quantitative evaluation of model forecasting accuracy relies on standard statistical metrics. Compute Mean Absolute Percentage Error (MAPE) alongside continuous Root Mean Square Error (RMSE) across all forecast horizons. Compare these metrics directly against the baseline to verify that sales and ma"},{num:12,title:"Hyperparameter Optimization & Tuning",desc:"Tune all model hyperparameters, seasonal parameters, and regularization penalties strictly within the training data partition. Cross-validation routines must respect temporal ordering to avoid lookahead bias during parameter selection. Locking final parameters prior to validation ensures unbiased pe"},{num:13,title:"Out-of-Sample Validation & Testing",desc:"Evaluate out-of-sample monthly profit and loss and product sales projections exactly once against the frozen validation years. Conducting a single, final evaluation run prevents iterative overfitting to test data, providing an authentic assessment of how well the financial forecasting pipeline gener"},{num:14,title:"Deliverables & Model Documentation",desc:"Deliver a comprehensive, deterministic profit and loss projection model card alongside a clean, fully repeatable Jupyter forecasting notebook. Include an interactive dashboard displaying forecasted margins, scenario analysis tools, and trial balance reconciliation summaries to support executive deci"}]},{id:"1049",title:"Workforce Pell Opportunity Score: Predicting High-Impact Short-Term Education Programs",org:"Other",advisor:"Beth Davis",ml_type:"Classification, Regression, Clustering, Recommendation Systems, Large Language Models (LLMs)/ Generative AI",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Develop an explainable machine learning model that estimates the likelihood that short-term education programs align with Workforce Pell priorities using publicly available data.",metrics:"Model accuracy, precision, recall, F1 score, ROC-AUC; cross-validation performance to assess generalizability; basic fairness checks across institution types (e.g., community colleges, MSIs, HBCUs, HSIs) where capacity allows; model explainability via SHAP; production of actionable recommendations; and delivery of a reproducible open-source workflow (notebooks and code) and an interactive dashboard.",data_link:"https://nces.ed.gov/ipeds/use-the-data; https://collegescorecard.ed.gov/data/; https://www.bls.gov/oes/; https://www.onetcenter.org/database.html; https://www.census.gov/programs-surveys/acs/data.html",sep:"September – Data Discovery, Integration, and Exploratory Analysis Identify and acquire public datasets (IPEDS, College Scorecard, BLS Occupational Employment Statistics, O*NET, U.S. Census ACS, and CIP code crosswalks). Design a unified data model linking institutions, academic programs, occupations, and regional labor markets. Perform exploratory data analysis to identify missing data, regional trends, and candidate predictive features. Develop an initial feature set and establish baseline models for comparison. Deliverable: Clean, integrated analytical dataset, feature dictionary, exploratory dashboard, and baseline predictive model.",oct:"October – Machine Learning Model Development Engineer features representing institutional quality, labor market demand, demographic characteristics, and regional economic conditions. Develop and compare multiple machine learning models (Random Forest, XGBoost, Gradient Boosting, Logistic Regression). Evaluate model performance using cross-validation. Apply explainability techniques to identify the most influential variables. Deliverable: Candidate prediction models with documented performance metrics and explainability analysis.",nov:"November – Visualization, Validation, and Decision Support Tool Select the best-performing model. Build an interactive dashboard allowing users to explore Workforce Pell Opportunity Scores by institution, region, or program. Validate results against known Workforce Pell criteria and expert review. Prepare technical documentation, reproducible notebooks, and final presentation materials. Deliverable: Final predictive model, interactive dashboard, GitHub repository, technical documentation, and executive presentation.",bottleneck:"Students may struggle with complex cross-agency data joins and the high learning debt associated with SHAP explainability and RAG architecture, which are advanced concepts.",recommendation:"Highly ambitious. Recommend focusing on the core Classification/Regression tasks first. De-prioritize the LLM/RAG conversational assistant and recommendation engine as stretch goals to ensure delivery of the primary predictive dashboard.",summary:"Students may struggle with complex cross-agency data joins and the steep learning curve associated with SHAP explainability and RAG architectures. To ensure successful delivery of the primary predictive dashboard, teams should focus initially on core classification and regression tasks using a curated dataset. Advanced features, such as the conversational RAG assistant and recommendation engine, should be deferred as stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting graduate employment outcomes and wage-to-tuition ratios for short-term programs for Beth Davis. Identify key stakeholders including state Pell Grant administrators and workforce planners. Map operational workflows for funding reviews and program vetting. Inputs comprise IPEDS, BLS indicators, and CIP codes, while outputs generate Pell Opportunity Scores. Scope focuses on policy decision support while mitigating bias risks.

2.  Data Ingestion & Source Aggregation: Acquire and ingest primary data sources including the federal IPEDS database, Bureau of Labor Statistics wage indicators, O\\*NET skills databases, and state academic program registries. Establish structured ingestion pipelines to handle disparate file formats, catalog metadata, and maintain source version control. Ensure all retrieved datasets are properly staged for downstream cross-agency integration and preflight validation checks.

3.  Critical Data Gate - Cross-Agency Merge Gate: Build an automated data cleaning and matching pipeline to join multi-agency spreadsheets using institutional IPEDS IDs, O\\*NET codes, and CIP taxonomy keys by Week 3. Establish strict primary key validation checks to prevent duplicate program records, mismatched entity relationships, or invalid cross-agency joins prior to feature engineering and exploratory data analysis.

4.  Spatial & Geographic Alignment Verification: Verify that spatial coordinates, regional labor market definitions, and state-level wage indices are matched cleanly across all integrated datasets without dropped records or missing state mappings. Address geographic anomalies, fill spatial gaps using validated regional interpolation rules, and confirm that all institutional program locations correctly align with local economic indicators.

5.  Continuous Feature Profiling & Scaling: Profile, transform, and scale continuous numeric program-level features, including median tuition costs, Pell grant enrollment percentages, and average graduate post-completion wages. Analyze feature distributions, detect extreme outliers, handle missing values using domain-appropriate imputation techniques, and normalize metrics to prepare consistent input features for downstream gradient-boosted decision tree algorithms.

6.  Automated Data Validation & Quality Assertions: Write strict, automated data validation assertions ensuring that key performance metrics, such as program graduation rates, total tuition costs, and wage scores, fall strictly within valid theoretical boundaries. Automatically flag and filter out erroneous records, negative tuition values, or implausible percentage ratios before advancing data to the model training phase.

7.  Deterministic Baseline Model Construction: Construct and freeze a simple, deterministic linear regression baseline model that predicts post-graduation wages solely from the CIP program classification category. Establish baseline evaluation metrics across all historical training data to provide a clear benchmark for measuring performance gains achieved by subsequent, more complex machine learning models.

8.  Gradient-Boosted Model Development: Upgrade the modeling strategy by training ensemble gradient-boosted decision trees, such as XGBoost and LightGBM, to predict graduate employment outcomes and calculate composite Pell Opportunity Scores. Engineer non-linear interaction terms between institutional characteristics and local wage trends to significantly enhance predictive performance over the linear baseline.

9.  Model Performance & Generalizability Evaluation: Evaluate overall model performance using R-squared, Root Mean Squared Error (RMSE), and Mean Absolute Error (MAE) across all regional program cohorts. Prioritize out-of-sample cross-validation performance to rigorously assess generalizability, detect potential overfitting, and confirm consistent predictive reliability across diverse educational institution types.

10. Model Explainability & SHAP Feature Auditing: Audit program-level predictions using SHAP (SHapley Additive exPlanations) values to explain and report key institutional, regional, and demographic drivers of student success. Generate transparent feature importance plots and summary reports to provide stakeholders with actionable insights into how specific factors influence predicted workforce outcomes.

11. Scope Boundary Enforcement & Feature Freeze: Verify that secondary elements, such as conversational Retrieval-Augmented Generation (RAG) or interactive LLM chatbot search interfaces, are strictly restricted to stretch goals. Enforce a complete scope boundary check to ensure team focus remains entirely on finalizing and freezing the core predictive scoring pipeline before attempting auxiliary features.

12. Hyperparameter Optimization & Internal Tuning: Tune all gradient-boosted tree hyperparameters, regularization parameters, tree depth constraints, and learning rat`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of predicting graduate employment outcomes and wage-to-tuition ratios for short-term programs for Beth Davis. Identify key stakeholders including state Pell Grant administrators and workforce planners. Map operational workflows for funding reviews and program vetting. Inputs "},{num:2,title:"Data Ingestion & Source Aggregation",desc:"Acquire and ingest primary data sources including the federal IPEDS database, Bureau of Labor Statistics wage indicators, O\\*NET skills databases, and state academic program registries. Establish structured ingestion pipelines to handle disparate file formats, catalog metadata, and maintain source v"},{num:3,title:"Critical Data Gate - Cross-Agency Merge Gate",desc:"Build an automated data cleaning and matching pipeline to join multi-agency spreadsheets using institutional IPEDS IDs, O\\*NET codes, and CIP taxonomy keys by Week 3. Establish strict primary key validation checks to prevent duplicate program records, mismatched entity relationships, or invalid cros"},{num:4,title:"Spatial & Geographic Alignment Verification",desc:"Verify that spatial coordinates, regional labor market definitions, and state-level wage indices are matched cleanly across all integrated datasets without dropped records or missing state mappings. Address geographic anomalies, fill spatial gaps using validated regional interpolation rules, and con"},{num:5,title:"Continuous Feature Profiling & Scaling",desc:"Profile, transform, and scale continuous numeric program-level features, including median tuition costs, Pell grant enrollment percentages, and average graduate post-completion wages. Analyze feature distributions, detect extreme outliers, handle missing values using domain-appropriate imputation te"},{num:6,title:"Automated Data Validation & Quality Assertions",desc:"Write strict, automated data validation assertions ensuring that key performance metrics, such as program graduation rates, total tuition costs, and wage scores, fall strictly within valid theoretical boundaries. Automatically flag and filter out erroneous records, negative tuition values, or implau"},{num:7,title:"Deterministic Baseline Model Construction",desc:"Construct and freeze a simple, deterministic linear regression baseline model that predicts post-graduation wages solely from the CIP program classification category. Establish baseline evaluation metrics across all historical training data to provide a clear benchmark for measuring performance gain"},{num:8,title:"Gradient-Boosted Model Development",desc:"Upgrade the modeling strategy by training ensemble gradient-boosted decision trees, such as XGBoost and LightGBM, to predict graduate employment outcomes and calculate composite Pell Opportunity Scores. Engineer non-linear interaction terms between institutional characteristics and local wage trends"},{num:9,title:"Model Performance & Generalizability Evaluation",desc:"Evaluate overall model performance using R-squared, Root Mean Squared Error (RMSE), and Mean Absolute Error (MAE) across all regional program cohorts. Prioritize out-of-sample cross-validation performance to rigorously assess generalizability, detect potential overfitting, and confirm consistent pre"},{num:10,title:"Model Explainability & SHAP Feature Auditing",desc:"Audit program-level predictions using SHAP (SHapley Additive exPlanations) values to explain and report key institutional, regional, and demographic drivers of student success. Generate transparent feature importance plots and summary reports to provide stakeholders with actionable insights into how"},{num:11,title:"Scope Boundary Enforcement & Feature Freeze",desc:"Verify that secondary elements, such as conversational Retrieval-Augmented Generation (RAG) or interactive LLM chatbot search interfaces, are strictly restricted to stretch goals. Enforce a complete scope boundary check to ensure team focus remains entirely on finalizing and freezing the core predic"},{num:12,title:"Hyperparameter Optimization & Internal Tuning",desc:"Tune all gradient-boosted tree hyperparameters, regularization parameters, tree depth constraints, and learning rates strictly within the multi-agency cross-validation training folds. Prevent data leakage by isolating hyperparameter search procedures entirely from unseen validation sets, ensuring ro"},{num:13,title:"Final Out-of-Sample Model Validation",desc:"Evaluate generated Pell Opportunity Scores and graduate wage predictions exactly once against the fully isolated, frozen out-of-sample institutional test partition. Record final performance metrics, document residual error distributions, and verify that accuracy benchmarks hold without degradation o"},{num:14,title:"Final Deliverables & Stakeholder Reporting",desc:"Deliver a fully documented, repeatable Pell opportunity scoring notebook, an interactive regional program heatmap dashboard for stakeholder exploration, and a comprehensive model validation report detailing methodology, SHAP explainability insights, performance benchmarks, and deployment recommendat"}]},{id:"1050",title:"Cloud Detection in Very-High-Resolution Optical Satellite Imagery",org:"Ursa Space Systems",advisor:"Nicholas LaVigne, Jack Savage",ml_type:"Segmentation (Semantic), Computer Vision, Deep Learning / Neural Networks, Transfer Learning / Pre-trained Models",evaluation:"Approved As Is",urgency:"Medium",data_readiness:"It will require some cleaning / preprocessing",difficulty:"Sweet Spot",domain:"Computer Vision",objective:"To build and benchmark methods (classical signal processing vs. pretrained CV models) that automatically identify and mask cloud-covered regions in high-resolution satellite scenes.",metrics:"Implementation of 2 classical and 1 pretrained model; evaluation using IoU, precision/recall, and F1; and a documented qualitative error analysis.",data_link:"https://radiantearth.github.io/stac-browser/#/external/maxar-opendata.s3.amazonaws.com/events/catalog.json",sep:"Foundations & data. Students get comfortable in Colab and with geospatial Python (rasterio/leafmap), learn to stream and window-read cloud-optimized GeoTIFFs from the Maxar Open Data catalog, and assemble a small working set of VHR scenes deliberately filtered toward higher cloud cover. Deliverable: a notebook that loads, displays, and tiles VHR imagery, plus a short written characterization of what clouds, smoke, and cloud-like surfaces (snow, bright rooftops, sand) look like in these scenes.",oct:"Classical baseline. Implement two or three signal-processing cloud-detection baselines in the RGB/visible domain (e.g., a brightness/saturation threshold, the dark-channel prior, a HOT-style index). Build a small hand-labeled or visually-assessed evaluation set so methods can be compared. Deliverable: a working classical cloud-mask pipeline plus a qualitative and quantitative comparison of the baselines.",nov:"Pretrained models & comparison. Apply one or more off-the-shelf pretrained segmentation models (e.g., SAM in a zero-shot setup, and/or an existing RGB cloud-segmentation checkpoint) to the same scenes, then run a head-to-head comparison against the classical baselines on the same evaluation set, with attention to failure modes (smoke vs. cloud, bright surfaces misclassified as cloud). Deliverable: a final benchmark notebook, results writeup, and a short presentation of findings.",bottleneck:"Geospatial data handling is a niche skill; students may struggle with domain-specific libraries like rasterio and the lack of ground-truth labels for standard supervised training.",recommendation:"Well-structured. Focus early on a small geographical area to avoid data transfer bottlenecks. If time runs short, prioritize the 'SAM' zero-shot model over custom fine-tuning for faster insights.",summary:"Handling geospatial data presents a steep learning curve with specialized libraries like rasterio, while a lack of labeled ground truth makes standard supervised training difficult. To mitigate this, teams should restrict their focus to a small geographic region early on to prevent data transfer issues and prioritize zero-shot models like SAM over custom fine-tuning to accelerate evaluation.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of detecting and masking cloud cover pixels in very-high-resolution optical satellite imagery for Ursa Space. Key stakeholders include engineering teams and geospatial analysts. Inputs consist of optical satellite scenes and multi-spectral datasets, while outputs provide binary cloud masks (IoU) to prevent downstream terrain model errors.
2.  Data Ingestion: Ingest the very-high-resolution optical satellite scenes, multi-spectral band datasets, and ground-truth pixel-level cloud validation masks required for model development. Ensure proper storage, file paths, and indexing across all high-resolution spatial assets to enable seamless downstream image preprocessing and model training.
3.  CRITICAL DATA GATE - STAC WINDOW-READ GATE: Build an automated image processing pipeline utilizing SpatioTemporal Asset Catalog (STAC) spatial queries. Window-stream Cloud Optimized GeoTIFF (COG) image tiles in manageable memory chunks to prevent local RAM and GPU out-of-memory crashes during processing.
4.  Spatial-Block Validation Split: Enforce a strict spatial-block validation split by isolating specific satellite orbit swaths into either training or testing sets. This prevents spatial autocorrelation leakage between adjacent image tiles, ensuring realistic performance assessment.
5.  Image Normalization & Standardization: Standardize image dimensions across all satellite samples and normalize multi-spectral band intensities (including red, green, blue, and near-infrared bands) to uniform numerical ranges to optimize model convergence.
6.  Data Validation Assertions: Implement automated data validation assertions within the ingestion pipeline to explicitly check and ensure that image channel counts, coordinate reference systems (CRS), spatial resolutions, and pixel band ranges remain consistent.
7.  Classical Signal Processing Baseline: Freeze a classical signal processing baseline model using deterministic band-ratio thresholding techniques (such as Normalized Difference Snow Index - NDSI) to establish a minimum performance floor for cloud masking.
8.  Deep Learning Model Training: Train deep learning semantic segmentation architectures, such as U-Net or FCN models equipped with ResNet backbones, using PyTorch or Keras to generate highly accurate pixel-level binary cloud masks.
9.  Pre-trained SAM Evaluation: Apply a pre-trained Segment Anything Model (SAM) in zero-shot mode to segment satellite cloud boundaries, conducting a head-to-head performance comparison against the fully trained U-Net segmentation baseline.
10. Metric Evaluation: Benchmark pixel-level cloud detection performance across all implemented models using standard evaluation metrics, including Intersection over Union (IoU), F1-score (Dice coefficient), precision, recall, and overall pixel accuracy.
11. Memory Footprint Verification: Monitor and verify that the entire model training and evaluation pipeline operates within a total memory footprint of under 8 GB on the Google Colab GPU runtime to avoid out-of-memory crashes.
12. Hyperparameter Tuning Constraints: Perform all hyperparameter tuning, including learning rate adjustments, spatial data augmentations, and decision threshold updates, strictly within the designated training spatial blocks to prevent test set contamination.
