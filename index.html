LMs",objective:"Build a model using NLP text-vectorization and supervised classifiers to detect and flag malicious prompts (injection/jailbreak) before they reach production LLMs to mitigate security risks.",metrics:"A working classifier evaluated with precision/recall/F1 and a confusion matrix, focused on minimizing false negatives, benchmarked against a baseline (e.g., logistic regression).",data_link:"https://ieee-dataport.org/documents/promptgame-dataset-prompt-injection-attack-benchmark-and-defense-evaluation-data",sep:"September: Business understanding (threat model: what is prompt injection vs. jailbreak), data consolidation, EDA, and preprocessing/labeling reconciliation.",oct:"October: Feature engineering (TF-IDF, embeddings), baseline classical models in scikit-learn, evaluation metric selection.",nov:"November: Feedforward neural net in Keras, model selection across candidates, error analysis and bias/fairness review. December: Final evaluation, documentation, GitHub repo cleanup, and presentation.",bottleneck:"Students may face steep learning curves in adversarial NLP and transformer-based embeddings. Technical debt involves reconciling public labeling schemes and managing class imbalance in security-focused datasets.",recommendation:"Well-scoped. Focus initially on binary classification using TF-IDF before attempting multi-class or transformer-based stretch goals. Prioritize the false-negative penalty in the cost function early to reflect real-world security requirements without over-complicating architecture.",summary:"Students face steep learning curves in adversarial NLP along with challenges in managing class imbalance and reconciling varied public labeling schemes. To mitigate this complexity, teams should initially focus on a simple TF-IDF binary classification baseline before attempting transformer-based or multi-class architectures. Additionally, prioritizing a higher false-negative penalty in the loss function early on addresses critical security requirements without over-complicating the model architecture.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of detecting adversarial prompt injections and jailbreak attacks targeting Ripple enterprise LLM APIs. Identify key security stakeholders, gateway engineers, and real-time proxy auditing workflows. Inputs include public injection datasets; outputs are binary safety classifications. Scope focuses on predictive firewall classification while mitigating false-negative risks.

to insurance claim datasets, while outputs provide continuous fraud risk scores and SHAP diagnostic charts. Predictive triage must balance claims processing speed against financial fraud risk while avoiding automated claim rejections.

10. Model Explainability & Model Card Handoff Gate: Generate global and local feature explanations using SHAP values or model feature coefficients. Deliver a fully reproducible notebook, a comprehensive final report, and a detailed model card summarizing predictive performance, risk scoring, and calibration across demographic subgroups.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of detecting and risk-scoring fraudulent vehicle insurance claims for LexisNexis. Identify key stakeholders, target users, and operational workflows. Inputs include historical auto insurance claim datasets, while outputs provide continuous fraud risk scores and SHAP diagnosti"},{num:2,title:"Environment Versioning & API Key Security",desc:"Record and lock the baseline Google Colab environment variables, including core libraries like Python 3.12, pandas, and scikit-learn. Configure secure API key handling for any external model or platform using Colab Secrets, strictly preventing hardcoded API keys or sensitive credentials in shared pr"},{num:3,title:"Ingestion & Schema Validation Gate",desc:"Load the claims dataset and programmatically verify that all column headers, data types, and target variables represent expected values. Write and check in an ingestion verification script to confirm that column mappings, feature encodings, and expected data schemas are locked before initiating mode"},{num:4,title:"Exploratory Data Analysis & Cleaning",desc:"Plot feature distributions, continuous variable correlations, and target class frequencies to document data health. Analyze the dataset for extreme class imbalances between normal and fraudulent claims, identify missing data patterns, and evaluate high cardinality across categorical features to info"},{num:5,title:"Data Cleaning & Imputed Value Validation Gate",desc:"Inspect the dataset for missing values, logical inconsistencies, and erroneous placeholder entries. Programmatically log any missing data imputation strategies, such as mode, median, or k-NN imputation, and freeze the resulting cleaned dataset version to maintain data integrity throughout experiment"},{num:6,title:"Feature Engineering & Preprocessing",desc:"Process continuous features through scaling or normalization and transform categorical variables using one-hot or target encoding methods. Write comprehensive data validation assertions to ensure that all transformed variables remain within expected logical boundaries before entering training pipeli"},{num:7,title:"Partitioning & Data Leakage Prevention Gate",desc:"Establish stratified cross-validation splits across the dataset. Enforce that any oversampling or resampling techniques, such as SMOTE, are strictly applied within individual cross-validation training folds. Applying resampling to the entire dataset prior to splitting constitutes a fatal data leakag"},{num:8,title:"Baseline Modeling & Training",desc:"Train a simple, highly interpretable baseline model, such as a class-weighted Logistic Regression or a single Decision Tree. Evaluate its initial performance to establish a quantitative baseline performance floor for subsequent model iterations."},{num:9,title:"Model Selection & Threshold Calibration Gate",desc:"Train advanced ensemble models, including Random Forest, Gradient Boosting, XGBoost, or LightGBM algorithms. Evaluate performance using PR-AUC and F1-score as primary metrics, prioritizing probability calibration over raw accuracy to demonstrate clear performance gains over baseline models."},{num:10,title:"Model Explainability & Model Card Handoff Gate",desc:"Generate global and local feature explanations using SHAP values or model feature coefficients. Deliver a fully reproducible notebook, a comprehensive final report, and a detailed model card summarizing predictive performance, risk scoring, and calibration across demographic subgroups."}]},{id:"1001",title:"Grounded Financial Document Q&A with Retrieval-Augmented Generation",org:"Other",advisor:"SaiSandeep Kantareddy",ml_type:"NLP, LLMs / Generative AI, Transfer Learning",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Build a system answering financial questions with grounded citations from unstructured SEC documents using RAG.",metrics:"Top-k retrieval accuracy, answer relevance, citation correctness, and groundedness/faithfulness.",data_link:"FinanceBench / SEC",sep:"Define scope, select public datasets, preprocess documents, build a baseline retrieval pipeline, and establish evaluation criteria.",oct:"Implement the full RAG pipeline with chunking, embedding-based retrieval, reranking, answer generation, and source citation.",nov:"Improve answer quality through prompt and retrieval tuning, run comparative evaluations against the baseline, perform error analysis, and prepare final demo and documentation.",bottleneck:"Optimizing retrieval accuracy over dense, unstructured financial PDFs (SEC filings) using standard semantic chunking often leads to significant context loss. Relying on simple vector embeddings can trigger hallucinated answers, requiring students to rapidly master advanced reranking concepts.",recommendation:"Require students to utilize pre-processed, clean textual subsets (like the FinanceBench dataset) before parsing raw EDGAR filings. Treat multi-document synthesis and embedded financial tables as strict December stretch goals to avoid stalling core RAG pipeline development.",summary:"Optimizing retrieval accuracy over dense, unstructured financial PDFs using basic semantic chunking often causes context loss and hallucinated answers. To address this, students should begin with pre-processed, clean textual subsets like FinanceBench before handling raw SEC filings. Complex tasks like multi-document synthesis and parsing embedded financial tables should be deferred to stretch goals to avoid stalling core RAG development.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the real-world problem of answering financial questions from unstructured SEC documents. Translate business needs into a RAG agent providing grounded citations. Establish clear outputs, hallucination risks, learning objectives, and task-aligned metrics like Top-k retrieval accuracy and groundedness. Verify that students and coaches can articulate the scope without model jargon.

2.  Environment Versioning & API Key Security: Inventory all datasets, SEC EDGAR PDFs, labels, models, and credentials. Lock Python versions, runtime environments, and package dependencies. Secure API keys and configure preflight checks with fallbacks. Ensure every asset has an assigned owner, role, access path, and validation record before advancing.

3.  Ingestion & Profiling Gate: Define the unit of analysis, features, identifiers, and group relationships for SEC filings and FinanceBench data. Create a reproducible sampling plan to fit within Colab resource limits while preventing data leakage. Freeze a raw-data manifest before processing to ensure total task alignment.

4.  Exploratory Data Analysis (EDA): Analyze SEC PDF structures, missingness, unique IDs, and embedded financial tables. Identify formatting artifacts and extraction risks while documenting modeling implications. Ensure observations are strictly separated from performance claims to inform the subsequent cleaning and semantic chunking strategy.

5.  Data Cleaning & Normalization Gate: Implement deterministic parsing prior to model inference. Begin with clean textual subsets like FinanceBench before processing raw SEC filings. Preserve stable IDs, page provenance, and semantic chunk boundaries to prevent context loss. Audit processed examples manually to guarantee data trustworthiness.

6.  Gold Benchmark & Annotation Gate: Define Q\\&A relevance taxonomy, evidence requirements, and ambiguity policies. Draft guidelines with positive and boundary examples, pilot the rubric, and measure agreement. Freeze separate development and evaluation sets. Require human-reviewed retrieval benchmarks to isolate prediction units from answer generation.

7.  Transparent Baseline Evaluation: Implement a basic retrieval baseline pipeline using training data only. Compare results against a naive benchmark using Top-k retrieval accuracy. Document errors, limitations, and baseline code reproducibly to establish a measured floor before attempting advanced architectures.

8.  Core RAG Pipeline Upgrade: Build the full RAG architecture featuring semantic chunking, vector retrieval, reranking, and generation. Keep data splits, labels, and metrics frozen. Compare uplift, memory usage, latency, and failure modes against the baseline. Reject added complexity unless it demonstrates measurable value.

9.  Retrieval & Groundedness Gating: Evaluate Top-k accuracy, answer relevance, citation correctness, and groundedness. Enforce strict citation requirements and apply reranking only when candidate recall is sufficient but ordering is weak. Inspect chunk audits and generation gates to complete the project evaluation contract.

10. End-to-End System Audit: Trace generated answers back to source SEC PDFs and retrieved chunks. Categorize pipeline failures into parsing, retrieval, or generation hallucination errors. Test system behavior against rate limits, timeouts, and invalid inputs. Require human oversight for high-consequence output validation.

11. Development Tuning & Final Run: Perform prompt engineering, chunk sizing, and parameter tuning strictly on development data. Freeze the complete pipeline before evaluating the untouched test set exactly once. Report reproducible metrics alongside confidence intervals and error distributions.

12. Stretch & Agentic Extensions: Address specific baseline failures, such as financial table support or UI development, only after core RAG validation. Isolate agentic extensions from the non-agentic core, measuring cost, latency, and performance against frozen baselines while preserving fallback options.

13. Reproducibility & Responsible Reporting: Archive data manifests, environment configurations, seeds, prompts, and evaluation scripts in a clean repository. Document system limitations, failure taxonomies, and deployment readiness clearly. Ensure diagrams, notebooks, and checklists accurately represent the single underlying pipeline.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the real-world problem of answering financial questions from unstructured SEC documents. Translate business needs into a RAG agent providing grounded citations. Establish clear outputs, hallucination risks, learning objectives, and task-aligned metrics like Top-k retrieval accuracy and ground"},{num:2,title:"Environment Versioning & API Key Security",desc:"Inventory all datasets, SEC EDGAR PDFs, labels, models, and credentials. Lock Python versions, runtime environments, and package dependencies. Secure API keys and configure preflight checks with fallbacks. Ensure every asset has an assigned owner, role, access path, and validation record before adva"},{num:3,title:"Ingestion & Profiling Gate",desc:"Define the unit of analysis, features, identifiers, and group relationships for SEC filings and FinanceBench data. Create a reproducible sampling plan to fit within Colab resource limits while preventing data leakage. Freeze a raw-data manifest before processing to ensure total task alignment."},{num:4,title:"Exploratory Data Analysis (EDA)",desc:"Analyze SEC PDF structures, missingness, unique IDs, and embedded financial tables. Identify formatting artifacts and extraction risks while documenting modeling implications. Ensure observations are strictly separated from performance claims to inform the subsequent cleaning and semantic chunking s"},{num:5,title:"Data Cleaning & Normalization Gate",desc:"Implement deterministic parsing prior to model inference. Begin with clean textual subsets like FinanceBench before processing raw SEC filings. Preserve stable IDs, page provenance, and semantic chunk boundaries to prevent context loss. Audit processed examples manually to guarantee data trustworthi"},{num:6,title:"Gold Benchmark & Annotation Gate",desc:"Define Q\\&A relevance taxonomy, evidence requirements, and ambiguity policies. Draft guidelines with positive and boundary examples, pilot the rubric, and measure agreement. Freeze separate development and evaluation sets. Require human-reviewed retrieval benchmarks to isolate prediction units from "},{num:7,title:"Transparent Baseline Evaluation",desc:"Implement a basic retrieval baseline pipeline using training data only. Compare results against a naive benchmark using Top-k retrieval accuracy. Document errors, limitations, and baseline code reproducibly to establish a measured floor before attempting advanced architectures."},{num:8,title:"Core RAG Pipeline Upgrade",desc:"Build the full RAG architecture featuring semantic chunking, vector retrieval, reranking, and generation. Keep data splits, labels, and metrics frozen. Compare uplift, memory usage, latency, and failure modes against the baseline. Reject added complexity unless it demonstrates measurable value."},{num:9,title:"Retrieval & Groundedness Gating",desc:"Evaluate Top-k accuracy, answer relevance, citation correctness, and groundedness. Enforce strict citation requirements and apply reranking only when candidate recall is sufficient but ordering is weak. Inspect chunk audits and generation gates to complete the project evaluation contract."},{num:10,title:"End-to-End System Audit",desc:"Trace generated answers back to source SEC PDFs and retrieved chunks. Categorize pipeline failures into parsing, retrieval, or generation hallucination errors. Test system behavior against rate limits, timeouts, and invalid inputs. Require human oversight for high-consequence output validation."},{num:11,title:"Development Tuning & Final Run",desc:"Perform prompt engineering, chunk sizing, and parameter tuning strictly on development data. Freeze the complete pipeline before evaluating the untouched test set exactly once. Report reproducible metrics alongside confidence intervals and error distributions."},{num:12,title:"Stretch & Agentic Extensions",desc:"Address specific baseline failures, such as financial table support or UI development, only after core RAG validation. Isolate agentic extensions from the non-agentic core, measuring cost, latency, and performance against frozen baselines while preserving fallback options."},{num:13,title:"Reproducibility & Responsible Reporting",desc:"Archive data manifests, environment configurations, seeds, prompts, and evaluation scripts in a clean repository. Document system limitations, failure taxonomies, and deployment readiness clearly. Ensure diagrams, notebooks, and checklists accurately represent the single underlying pipeline."}]},{id:"1002",title:"Adjudicative Guidelines Analyzer: Explainable AI for Security Clearance Decision Support",org:"A3 Consulting LLC",advisor:"Teneika Askew, Bismarck Macauley",ml_type:"Classification, Regression, Clustering, Rec Sys, NLP, LLMs, RL",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires significant cleaning",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Build an explainable system to classify clearance narratives against SEAD-4 guidelines, detect disqualifiers, retrieve precedents, and predict the likely outcome (granted/denied).",metrics:"Accuracy, F1, AUC for outcome prediction; multi-label guideline classification measured by per-label, micro, and macro F1; human evaluation of retrieval quality; qualitative explainability/traceability of extracted disqualifiers/mitigators and precedent grounding.",data_link:"https://github.com/TeneikaAskew/doha",sep:"Onboard team onto the provided DOHA dataset (parsed Parquet, no scraping needed); exploratory data analysis on case outcomes, guideline frequency, and text characteristics; establish baseline classification model (TF-IDF for structured assessments. Define output constraints, error risks, and learning objectives. Select task-aligned metrics including Accuracy, F1, and retrieval quality. Advance when stakeholders clearly understand problems, technical tasks, and limitations without jargon.
2.  Environment Versioning & Asset Verification: Inventory all datasets (DOHA Parquet), schemas, free-tier Gemini APIs, models, credentials, and Colab compute. Record filenames, hashes, licenses, provenance, and access controls. Ensure files are safe and accessible, separating operational data from evaluation labels. Lock Python, package, runtime, and hardware configurations while adding explicit preflight checks and fallback plans. Advance when every asset has a documented owner, role, validation status, and version record.
3.  Data Acquisition & Subsampling: Define units of analysis, targets, features, and source relationships for clearance narratives. Mandate aggressive data sampling, instructing the team to extract a representative subset under 1 GB for initial prototyping to avoid API rate limits and Colab memory crashes. Prevent data leakage during filtering or splitting and freeze raw snapshots before cleaning. Advance when the team understands document representations and extracts the sample.
4.  Exploratory Data Analysis: Inspect DOHA dataset shapes, schemas, missingness, duplicate records, case outcome distributions, guideline frequencies, and text features. Check parsed Parquet files for extraction artifacts and formatting anomalies. Document patterns and core questions visually while separating raw observations from causal claims. Advance when EDA successfully highlights key data-quality risks, modeling implications, and necessary cleaning or chunking strategies for downstream tasks.
5.  Data Cleaning, Parsing, & Validation: Implement deterministic text cleaning and parsing before running model inference, preserving stable IDs, sections, and provenance. Normalize formatting artifacts while validating missing values and boundaries. Manually audit source-to-output chunk samples and vet external or synthetic data for relevance. Freeze the validated feature corpus. Advance when diagnostics and manual checks confirm the integrity and trustworthiness of frozen modeling data.
6.  Annotation Design & Gold Benchmark Setup: Define annotation units, label taxonomies, evidence rules, and uncertainty policies for the evaluation subset. Create detailed guidelines covering positive, negative, and edge cases. Pilot the rubric, measure inter-annotator agreement, and audit class balance before tuning. Freeze isolated development and test sets. Advance when gold labels align with prediction units, disagreements are resolved, and test data is fully isolated.
7.  Baseline Model Construction: Establish a transparent baseline classification model using TF-IDF with logistic regression or a lightweight transformer alongside a simple lexical retrieval baseline. Evaluate against the labeled subset using Accuracy, F1, AUC, and Hit@K. Validate baseline classification locally before depending on external API limits. Save baseline configurations and predictions. Advance when the baseline runs reproducibly, establishing a clear performance floor.
8.  Core Method Upgrade & RAG Integration: Build multi-label guideline classification and Gemini-based disqualifier extraction after establishing the baseline. Deploy a RAG precedent-retrieval pipeline against the vector index. Compare LLM approaches against traditional ML baselines on frozen splits. Evaluate uplift, cost, latency, memory, and failure modes. Advance when advanced methods show meaningful, measured improvement on predefined outcomes that justify their increased system complexity.
9.  Advanced Retrieval & RAG Evaluation Gates: Implement project-specific retrieval metrics including Hit@K, Recall@K, Precision@K, and MRR. Audit text chunks, annotate Q\\&A relevance, evaluate semantic retrieval against lexical baselines, and verify citation groundedness. Apply reranking only when candidate recall is strong but rank ordering is weak. Advance when the full retrieval evaluation contract is completely implemented, audited, and verified by team stakeholders.
10. End-to-End System Validation & Auditing: Integrate components into a complete analyzer providing structured assessments with cited precedents. Trace predictions to source chunks and categorize stage failures. Audit edge cases, rate limits, timeouts, and out-of-distribution inputs while implementing exponential backoff. Require grounded citations and human review for high-consequence outputs. Advance when the team identifies responsible failure subsystems and documents mitigations for all resid`,gates:[{num:1,title:"Understand the Business & Problem Formulation",desc:"Define the real-world problem of classifying clearance narratives against SEAD-4 guidelines, detecting disqualifiers, and predicting outcomes. Translate business needs into a multi-label classification and RAG system for structured assessments. Define output constraints, error risks, and learning ob"},{num:2,title:"Environment Versioning & Asset Verification",desc:"Inventory all datasets (DOHA Parquet), schemas, free-tier Gemini APIs, models, credentials, and Colab compute. Record filenames, hashes, licenses, provenance, and access controls. Ensure files are safe and accessible, separating operational data from evaluation labels. Lock Python, package, runtime,"},{num:3,title:"Data Acquisition & Subsampling",desc:"Define units of analysis, targets, features, and source relationships for clearance narratives. Mandate aggressive data sampling, instructing the team to extract a representative subset under 1 GB for initial prototyping to avoid API rate limits and Colab memory crashes. Prevent data leakage during "},{num:4,title:"Exploratory Data Analysis",desc:"Inspect DOHA dataset shapes, schemas, missingness, duplicate records, case outcome distributions, guideline frequencies, and text features. Check parsed Parquet files for extraction artifacts and formatting anomalies. Document patterns and core questions visually while separating raw observations fr"},{num:5,title:"Data Cleaning, Parsing, & Valida
