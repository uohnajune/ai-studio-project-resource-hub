gainst the untouched 30-item Q\\&A d"},{num:12,title:"Multi-Agent Stretch Extensions",desc:"Introduce an optional LangGraph multi-node architecture (Planner, Retriever, Reasoner, Evaluator) only after the core RAG system functions reliably. Enforce strict Pydantic schemas and bounded iteration limits to prevent infinite execution loops on missing data. Measure the agentic system against th"},{num:13,title:"Reproducible Reporting & Documentation",desc:"Archive all raw data manifests, seeds, prompt templates, model versions, evaluation scripts, and workflow diagrams in a structured repository. Clearly distinguish between execution readiness and instructional deployment. Publish a project failure taxonomy, model limitations, and next steps. Ensure t"}]},{id:"1041",title:"Agentic Internal Knowledge System for R&D",org:"Zayi",advisor:"Jose Ambrosio",ml_type:"NLP, DL, LLMs, Transfer Learning",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Build RAG agent to extract, synthesize, and draft structured summary memos with citations from ArXiv papers.",metrics:"Retrieval accuracy; verification against ground-truth Q&A; Human-in-the-Loop verification pass rate / minimal manual correction rate for the generated structured, cited memos.",data_link:"https://www.kaggle.com/datasets/Cornell-University/arxiv",sep:"September (Data Exploration & Preprocessing): Complete exploratory data analysis (EDA) on the ArXiv dataset. Implement PDF text cleaning, test semantic chunking strategies, and successfully embed and store the data into a local ChromaDB vector database.",oct:"October (Modeling & Orchestration): Build the baseline RAG pipeline using LangChain and the Gemini API to retrieve documents and answer queries. Implement robust API error handling and exponential backoff strategies (e.g., using the tenacity library) to manage rate limits within orchestration loops.",nov:"November (Evaluation & Iteration): Implement advanced agentic routing using LangGraph and integrate the Human-in-Loop review step. Systematically evaluate the agent's output against the provided ground-truth Q&A dataset to measure and minimize hallucinations.",bottleneck:"Core bottlenecks: (1) robust PDF extraction/cleaning and semantic chunking quality; (2) API rate limits and exponential backoff handling; (3) Colab runtime persistence and vector store durability; (4) alignment between retrieved chunks and the provided ground-truth Q&A. Note: FlashRank/local cross-encoder re-ranking risks are stretch-only.",recommendation:"The architecture handles the PDF extraction well. Ensure the team is provided with clear configuration instructions for maintaining local vector databases in Colab across runtime resets to avoid losing indexed ArXiv papers between development sessions.",summary:"Key project bottlenecks include managing semantic chunking quality, API rate limits, and Google Colab vector store persistence across runtime resets. To resolve vector durability issues, clear configuration guidance should be provided so the team can maintain local ChromaDB indexes without losing processed ArXiv papers between sessions.",checklist_raw:`1.  Understand the Business and Project Problem: Define the real-world problem of automating dense ArXiv PDF parsing for R\\&D workflows. Translate this business need into building a RAG agent that drafts structured, cited summary memos while setting clear boundaries, risks, learning objectives, and task-aligned metrics.
2.  Version and Verify Environment, Sources, and Assets: Catalog all datasets, documents, ground-truth Q\\&A labels, Gemini API credentials, models, and compute resources. Record exact versions, file hashes, licenses, and access controls while adding preflight validation scripts and fallback execution mechanisms.
3.  Acquire, Sample, and Profile Data: Define the fundamental unit of analysis, document structure, and metadata fields for the ArXiv corpus. Create a leakage-free, reproducible sampling scheme to keep large PDF datasets within computational limits before freezing raw data snapshots.
4.  Perform Exploratory Data Analysis (EDA): Examine PDF schema distributions, document lengths, extraction artifacts, and mathematical formatting issues. Document visual patterns and data-quality risks to directly inform subsequent text cleaning, normalization, and semantic chunking strategies.
5.  Clean, Parse, Normalize, and Validate Data: Execute deterministic PDF parsing with robust libraries, preserving section boundaries and page provenance. Standardize formatting artifacts, handle missing entries, and manually audit chunk representations before freezing the modeling corpus.
6.  Design Annotation and Build Gold Benchmark: Define clear annotation guidelines, label taxonomies, and evidence rules for the Q\\&A benchmark. Pilot the rubric, measure inter-annotator consistency, audit edge cases, and isolate the final test dataset prior to tuning.
7.  Build Transparent Baseline: Construct a lexical or semantic retrieval baseline using ChromaDB and SentenceTransformers. Evaluate performance with recall metrics against ground-truth Q\\&A pairs to establish a reproducible, lower-bound benchmark for model comparison.
8.  Upgrade Core Method Only After Baseline: Integrate Gemini LLM generation to solve specific baseline retrieval and draft synthesis failures. Keep data splits and metrics frozen while comparing uplift, latency, cost, and complexity against the non-generative baseline.
9.  Add Project-Specific Advanced Gates: Implement task-specific evaluation metrics including Hit@K, Recall@K, Precision@K, and MRR. Conduct chunk audits, groundedness evaluations, and citation validation before introducing re-ranking models like FlashRank.
10. Validate, Audit, and Vet End-to-End System: Trace final memo outputs back to specific PDF source chunks to catch hallucinations. Test pipeline resilience against API rate limits, timeouts, and malformed inputs, enforcing human-in-the-loop validation for critical outputs.
11. Tune Only on Development Data: Optimize prompts, chunk boundaries, and retrieval depths strictly on training partitions. Freeze all system configurations before executing a single final evaluation run against the untouched ground-truth test set.
12. Attempt Stretch Extensions After Core Validation: Introduce advanced features such as LangGraph agentic routing or Gradio interfaces only after the core RAG pipeline meets accuracy goals. Benchmark extensions against the non-agentic baseline to ensure complexity is justified.
13. Close with Reproducibility and Responsible Reporting: Archive raw manifests, notebook versions, environmental seeds, failure taxonomies, and architectural diagrams. Deliver a fully documented repository enabling external reviewers to reproduce all evaluation metrics exactly.`,gates:[{num:1,title:"Understand the Business and Project Problem",desc:"Define the real-world problem of automating dense ArXiv PDF parsing for R\\&D workflows. Translate this business need into building a RAG agent that drafts structured, cited summary memos while setting clear boundaries, risks, learning objectives, and task-aligned metrics."},{num:2,title:"Version and Verify Environment, Sources, and Assets",desc:"Catalog all datasets, documents, ground-truth Q\\&A labels, Gemini API credentials, models, and compute resources. Record exact versions, file hashes, licenses, and access controls while adding preflight validation scripts and fallback execution mechanisms."},{num:3,title:"Acquire, Sample, and Profile Data",desc:"Define the fundamental unit of analysis, document structure, and metadata fields for the ArXiv corpus. Create a leakage-free, reproducible sampling scheme to keep large PDF datasets within computational limits before freezing raw data snapshots."},{num:4,title:"Perform Exploratory Data Analysis (EDA)",desc:"Examine PDF schema distributions, document lengths, extraction artifacts, and mathematical formatting issues. Document visual patterns and data-quality risks to directly inform subsequent text cleaning, normalization, and semantic chunking strategies."},{num:5,title:"Clean, Parse, Normalize, and Validate Data",desc:"Execute deterministic PDF parsing with robust libraries, preserving section boundaries and page provenance. Standardize formatting artifacts, handle missing entries, and manually audit chunk representations before freezing the modeling corpus."},{num:6,title:"Design Annotation and Build Gold Benchmark",desc:"Define clear annotation guidelines, label taxonomies, and evidence rules for the Q\\&A benchmark. Pilot the rubric, measure inter-annotator consistency, audit edge cases, and isolate the final test dataset prior to tuning."},{num:7,title:"Build Transparent Baseline",desc:"Construct a lexical or semantic retrieval baseline using ChromaDB and SentenceTransformers. Evaluate performance with recall metrics against ground-truth Q\\&A pairs to establish a reproducible, lower-bound benchmark for model comparison."},{num:8,title:"Upgrade Core Method Only After Baseline",desc:"Integrate Gemini LLM generation to solve specific baseline retrieval and draft synthesis failures. Keep data splits and metrics frozen while comparing uplift, latency, cost, and complexity against the non-generative baseline."},{num:9,title:"Add Project-Specific Advanced Gates",desc:"Implement task-specific evaluation metrics including Hit@K, Recall@K, Precision@K, and MRR. Conduct chunk audits, groundedness evaluations, and citation validation before introducing re-ranking models like FlashRank."},{num:10,title:"Validate, Audit, and Vet End-to-End System",desc:"Trace final memo outputs back to specific PDF source chunks to catch hallucinations. Test pipeline resilience against API rate limits, timeouts, and malformed inputs, enforcing human-in-the-loop validation for critical outputs."},{num:11,title:"Tune Only on Development Data",desc:"Optimize prompts, chunk boundaries, and retrieval depths strictly on training partitions. Freeze all system configurations before executing a single final evaluation run against the untouched ground-truth test set."},{num:12,title:"Attempt Stretch Extensions After Core Validation",desc:"Introduce advanced features such as LangGraph agentic routing or Gradio interfaces only after the core RAG pipeline meets accuracy goals. Benchmark extensions against the non-agentic baseline to ensure complexity is justified."},{num:13,title:"Close with Reproducibility and Responsible Reporting",desc:"Archive raw manifests, notebook versions, environmental seeds, failure taxonomies, and architectural diagrams. Deliver a fully documented repository enabling external reviewers to reproduce all evaluation metrics exactly."}]},{id:"1043",title:"Legal AI Accuracy Evaluation, Red-Teaming & Improvement Recommendations",org:"ProseAI",advisor:"Benjamin Booker",ml_type:"Natural Language Processing (NLP), Deep Learning / Neural Networks, Large Language Models (LLMs)/ Generative AI, Transfer Learning / Pre-trained Models",evaluation:"Approved w/ feedback",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"To build a system that measures retrieval and generation accuracy of a legal AI, identifies failure conditions through red-teaming, and provides recommendations to reduce hallucinated or inaccurate legal citations.",metrics:"Working evaluation system computing retrieval metrics (MRR, NDCG) with breakdowns, per-document generation-accuracy/hallucination-risk scores; ~20 reproducible high-impact red-team failure cases; and actionable, prioritized improvement recommendations. Overarching criterion: a reusable evaluation and regression suite that ProseAI can re-run unaided after the project ends to obtain trustworthy before/after comparisons; emphasis on rigor and reproducibility of measurement over absolute metric values.",data_link:"Not provided in source submission.",sep:"Monthly Milestones September — Foundation & Retrieval Evaluation • Explore the corpus and the gold set: motion-type distribution, citation patterns, document structure. • Connect to the vector index and build the retrieval evaluation harness. • Compute the baseline retrieval metrics (Hit@K, MRR, NDCG), broken down by motion type and by statute vs case law. • Identify the weakest-retrieving query categories as early red-team targets. Deliverable: Retrieval evaluation harness + baseline retrieval metrics with breakdowns.",oct:"October — Generation Accuracy & Citation Verification • Generate sample documents with fictional names across the common motion types. • Build the citation extractor and verifier. • Produce per-document hallucination-risk scores and analyze where generation accuracy is weakest. • Begin red-teaming the weak spots found in September. Deliverable: Citation verification module + generation-accuracy / hallucination-risk scoring + first batch of documented failures.",nov:"November — Red-Teaming & Failure Analysis • Run the full red-team campaign across edge cases, adversarial phrasing, jurisdiction traps, and hallucination triggers. • Document each failure as a reproducible, categorized test case; assemble the regression suite. • Analyze failure patterns: which conditions most reliably break the system and how badly. Deliverable: Failure-mode taxonomy + reproducible red-team regression suite categorized by severity.",bottleneck:"Students may face steep learning curves in legal domain-specific language and advanced LLM evaluation frameworks (RAGAS/TruLens) while managing API-based infrastructure rather than standard local model training.",recommendation:"Technically ambitious. Prioritize automated retrieval evaluation (Sept/Oct) and limit red-teaming scope to 20 high-impact cases. Ensure ProseAI vector DB API is stable before kickoff. Focus deliverable on a reproducible regression suite to maximize institutional value.",summary:"Students may face steep learning curves with specialized legal terminology and advanced LLM evaluation frameworks while managing API-based infrastructure. To address this, teams should prioritize automated retrieval evaluation early and cap red-teaming to 20 high-impact cases. Focusing the final deliverable on a reproducible regression suite will ensure long-term value and ease execution.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of evaluating legal AI accuracy for ProseAI. Identify users, workflows, and decisions supported. Inputs comprise motion types and citations; outputs include retrieval metrics and hallucination-risk scores. Bounded technical tasks focus on measuring accuracy and conducting red-teaming to mitigate incorrect legal citations.

2.  Environment Versioning & API Key Security: Record environment specifications, APIs, credentials, and compute configurations. Ensure ProseAI vector DB/API stability before deep integration. Implement secure API key management and explicit preflight validation checks with safe fallbacks.

3.  Dataset Acquisition & Sampling Protocol: Define the analysis unit, target features, and relationships across legal corpora. Freeze the exact datasets, CourtListener/Alaska Courts documents, ground-truth labels, and benchmark evaluation harnesses needed for retrieval metrics (Hit@K, MRR, NDCG) and generation accuracy.

4.  Exploratory Data Analysis & Quality Gate: Inspect document structures, motion-type distributions, and citation patterns. Analyze target prevalence, class balance, outliers, and potential leakage. Document data-quality risks to inform cleaning, parsing, and legal annotation strategies.

5.  Data Cleaning & Normalization Pipeline: Implement deterministic parsing and cleaning to preserve stable IDs, citation structures, and provenance. Normalize text fields while preserving domain invariants. Validate missing values and conduct manual audits on source-to-output samples before freezing the dataset.

6.  Gold Standard Annotation & Benchmark Isolation: Establish clear annotation rubrics for citation verification with positive and negative legal examples. Measure inter-annotator agreement, resolve label ambiguities, and calibrate against human references. Audit for data leakage and freeze test sets before model tuning.

7.  Transparent Rule-Based Baseline: Construct a simple heuristic, lexical, or statistical baseline for retrieval evaluation. Measure Hit@K, MRR, and NDCG broken down by motion type and statute versus case law to establish a reproducible performance floor.

8.  Iterative Method Optimization: Upgrade from the baseline by integrating citation verifiers and generation-accuracy scoring. Keep evaluation metrics, data splits, and protocols frozen. Measure uplift, latency, and costs through controlled ablations before accepting added complexity.

9.  Project-Specific Technical Validation Gates: Verify that a frozen, non-agentic RAG baseline operates effectively with grounded citations before evaluating advanced features. Enforce a strict red-teaming scope cap of \\~20 high-impact, reproducible failure cases spanning edge cases and jurisdiction traps.

10. System Auditing & Error Attribution Gate: Trace legal citations and outputs back to source documents. Categorize failures by pipeline stage, evaluating edge cases, out-of-distribution queries, rate limits, and failure modes. Require human oversight for high-consequence legal outputs.

11. Development Tuning & One-Time Final Evaluation: Hyperparameters, prompts, and retrieval depth must be tuned strictly on development partitions. Freeze the final evaluation pipeline prior to unblinding test data, running final benchmarks once to ensure reproducible metrics.

12. Controlled Extension Integration: Evaluate advanced or stretch features only after the core evaluation system is validated. Benchmark extensions directly against the frozen baseline, measuring cost, latency, and incremental accuracy to justify integration.

13. Reproducibility & Model Card Archiving: Document raw/processed data manifests, notebook revisions, prompts, and environmental configurations. Publish a clean GitHub repository containing the evaluation harness, failure-mode taxonomy, reproducible red-team regression suite, and actionable improvement recommendations.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of evaluating legal AI accuracy for ProseAI. Identify users, workflows, and decisions supported. Inputs comprise motion types and citations; outputs include retrieval metrics and hallucination-risk scores. Bounded technical tasks focus on measuring accuracy and conducting red-team"},{num:2,title:"Environment Versioning & API Key Security",desc:"Record environment specifications, APIs, credentials, and compute configurations. Ensure ProseAI vector DB/API stability before deep integration. Implement secure API key management and explicit preflight validation checks with safe fallbacks."},{num:3,title:"Dataset Acquisition & Sampling Protocol",desc:"Define the analysis unit, target features, and relationships across legal corpora. Freeze the exact datasets, CourtListener/Alaska Courts documents, ground-truth labels, and benchmark evaluation harnesses needed for retrieval metrics (Hit@K, MRR, NDCG) and generation accuracy."},{num:4,title:"Exploratory Data Analysis & Quality Gate",desc:"Inspect document structures, motion-type distributions, and citation patterns. Analyze target prevalence, class balance, outliers, and potential leakage. Document data-quality risks to inform cleaning, parsing, and legal annotation strategies."},{num:5,title:"Data Cleaning & Normalization Pipeline",desc:"Implement deterministic parsing and cleaning to preserve stable IDs, citation structures, and provenance. Normalize text fields while preserving domain invariants. Validate missing values and conduct manual audits on source-to-output samples before freezing the dataset."},{num:6,title:"Gold Standard Annotation & Benchmark Isolation",desc:"Establish clear annotation rubrics for citation verification with positive and negative legal examples. Measure inter-annotator agreement, resolve label ambiguities, and calibrate against human references. Audit for data leakage and freeze test sets before model tuning."},{num:7,title:"Transparent Rule-Based Baseline",desc:"Construct a simple heuristic, lexical, or statistical baseline for retrieval evaluation. Measure Hit@K, MRR, and NDCG broken down by motion type and statute versus case law to establish a reproducible performance floor."},{num:8,title:"Iterative Method Optimization",desc:"Upgrade from the baseline by integrating citation verifiers and generation-accuracy scoring. Keep evaluation metrics, data splits, and protocols frozen. Measure uplift, latency, and costs through controlled ablations before accepting added complexity."},{num:9,title:"Project-Specific Technical Validation Gates",desc:"Verify that a frozen, non-agentic RAG baseline operates effectively with grounded citations before evaluating advanced features. Enforce a strict red-teaming scope cap of \\~20 high-impact, reproducible failure cases spanning edge cases and jurisdiction traps."},{num:10,title:"System Auditing & Error Attribution Gate",desc:"Trace legal citations and outputs back to source documents. Categorize failures by pipeline stage, evaluating edge cases, out-of-distribution queries, rate limits, and failure modes. Require human oversight for high-consequence legal outputs."},{num:11,title:"Development Tuning & One-Time Final Evaluation",desc:"Hyperparameters, prompts, and retrieval depth must be tuned strictly on development partitions. Freeze the final evaluation pipeline prior to unblinding test data, running final benchmarks once to ensure reproducible metrics."},{num:12,title:"Controlled Extension Integration",desc:"Evaluate advanced or stretch features only after the core evaluation system is validated. Benchmark extensions directly against the frozen baseline, measuring cost, latency, and incremental accuracy to justify integration."},{num:13,title:"Reproducibility & Model Card Archiving",desc:"Document raw/processed data manifests, notebook revisions, prompts, and environmental configurations. Publish a clean GitHub repository containing the evaluation harness, failure-mode taxonomy, reproducible red-team regression suite, and actionable improvement recommendations."}]},{id:"1047",title:"Hollywood Studios Secure AI and Chain of Title",org:"Chambers Capital Ventures",advisor:"Chris Chambers, Sir Steven Paxton, Maher Hasan",ml_type:"Classification, Regression, Natural Language Processing (NLP), Time Series Analysis, Large Language Models (LLMs)/ Generative AI, Transfer Learning / Pre-trained Models",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"Time Series",objective:"To build components of Vault™ (a secure AI governance engine) and integrate them with CreativeOS™ to protect intellectual property, maintain verifiable chain of title, and predict commercial value.",metrics:"Functional prototype of VaultTM + CreativeOSTM; working proof-of-concept demonstrating secure asset upload; AI-governed interaction logging; demonstrable provenance tracking and verifiable chain-of-title maintenance; functional Streaming Deals Prediction module; successful integration of the HollywoodMindLayer (stretch goal); comprehensive documentation and a clean code repository; live demo evaluated for IP-protection, usability, technical quality, and innovation.",data_link:"Not in source",sep:"September: Complete requirements gathering, system architecture design, and core data modeling. Deliver a detailed technical specification for Vault™ (secure repository with provenance engine) and CreativeOS™ (AI orchestration layer), including the proprietary SQL schema, MSPF audience modeling, and integration points with the HollywoodMindLayer. Set up the development environment and initial Git repository.",oct:"October: Implement core components including the AI governance and provenance tracking engine, basic read-only secure viewing, chain-of-title functionality, and the Streaming Deals Prediction Engine prototype. Integrate the Hollywood collective intelligence layer and conduct initial testing with sample creative assets and public entertainment datasets.",nov:"November: Complete system integration between Vault™ and CreativeOS™, implement dual Secure/Inspire modes, add commercial intelligence features (deal prediction + audience analysis), perform end-to-end testing, and prepare documentation, a working demo, and a final report with stretch goal results.",bottleneck:"Students may struggle with combining NLP, time-series, and LLMs within a secure governance framework. Technical debt exists regarding enterprise-level IP security and complex SQL/graph schemas.",recommendation:"Prioritize either 'Streaming Deals Prediction' OR 'Provenance Tracking Engine'. Reduce scope by making HollywoodMindLayer a secondary stretch goal and providing simplified interaction logs to minimize preprocessing time.",summary:"Combining NLP, time-series analysis, and LLMs within a secure governance framework introduces significant technical debt and complexity around enterprise-level IP security and schemas. To manage this, the project scope should be narrowed to prioritize either the Streaming Deals Prediction module or the Provenance Tracking Engine. Shifting secondary features like the HollywoodMindLayer to stretch goals and using simplified interaction logs will streamline data processing and keep development focused.",checklist_raw:`1.  Business rescope to one track before data work — Freeze project scope to a single track (Provenance/chain-of-title POC or Streaming Deals Prediction) and explicitly exclude out-of-scope elements like HollywoodMindLayer and production security. Inspect written rescope confirmation and updated project\\_metadata.json. Advance only when the team formally commits to one track and acknowledges the notebook-only, non-production boundaries.

2.  Environment and source verification — Inventory all datasets, verify the presence of partner-provided sanitized samples, and confirm system environment constraints. Inspect source\\_inventory.csv, data\\_dictionary\\_and\\_schema.md, and approval for API keys or notebook-only execution. Advance once all required assets are validated, present, and the notebook environment is securely configured.

3.  Data acquisition and sampling — Ingest provenance logs and chain-of-title examples, creating pedagogical synthetic fixtures only if data is missing while clearly marking them as non-representative. Inspect parsed metadata summaries, generated schema templates, and data ingestion blocks. Advance when data or robust fixtures are safely loaded into Colab without executing blind code.

4.  Document and temporal EDA — Analyze the structure of hybrid structured/unstructured IP records, validate adherence to the fixed SQL schema, and check for temporal data leakage in the prediction track. Inspect EDA output summaries, schema compliance reports, and time distributions. Advance after confirming schema alignment and ensuring temporal isolation.

5.  Parsing and cleaning — Implement deterministic parsing logic for provenance logs and chain-of-title records to ensure stable identifiers and temporal markers are accurately preserved. Inspect cleaned DataFrames, JSON schemas, and notebook parsing functions. Advance when all dataset records are correctly normalized and validated against domain-specific invariants without losing structural provenance details.

6.  Data validation, audit, and vetting — Perform thorough legal and security vetting on sanitized datasets while manually auditing representative source-to-output records. Inspect manual audit logs and formal verification confirming the absence of sensitive intellectual property. Advance when multiple diagnostic checks and audit samples confirm the dataset's integrity, safety, and reliability.

7.  Design annotation and build gold benchmark — Define prediction units, annotate document relationships, set prediction horizons, and establish leakage-safe test splits for the chosen track. Pilot annotation rubrics with independent reviewers, measure inter-annotator agreement, and resolve label discrepancies. Inspect annotation guidelines, agreement metrics, and split manifests. Advance when vetted labels and isolated test sets are finalized.

8.  Transparent baseline — Implement a simple, deterministic rule-based validation script for chain-of-title assets or a chronological split baseline model for streaming deal predictions. Inspect baseline configurations, raw predictions, and evaluation code. Advance when the baseline executes reproducibly, establishing a clear, measurable performance floor for subsequent model iterations.

9.  Justified advanced method — Introduce LLMs or complex time-series architectures only after establishing a baseline and demonstrating clear necessity through failure analysis. Inspect advanced model implementations, performance uplift reports, and prerequisite verification gates. Advance once the advanced approach yields verified performance improvements that justify its extra technical complexity.

10. Project-specific evaluation — Execute schema validation rules or chronological time-series evaluation depending on the selected project track. Inspect key evaluation metrics, rule adherence scores, and evaluation pipeline code. Advance when the evaluation contract is fully audited, noting that successful execution of scaffolds alone does not guarantee end-to-end model performance.

11. End-to-end failure analysis — Trace system outputs back to primary source records, categorize pipeline errors by processing stage, and rigorously evaluate edge cases or missing inputs. Inspect error logs, failure classification reports, and exception-handling code blocks. Advance when the team pinpoints root causes for major failures and documents robust technical mitigations.

12. Stretch/agentic work only after core — Attempt external API integrations or multi-agent orchestration strictly after the primary provenance or prediction pipeline is validated and fully functional. Inspect stretch feature implementations, comparative benchmarks, and fallback mechanisms. Advance when measured performance gains clearly justify added architectural complexity while preserving system safety.

13. Reproducibility and responsible reporting — Package all project outputs into an artifacts directory, generate run\\_summary.json, and clearly indicate not`,gates:[{num:1,title:"Business rescope to one track before data work — Freeze project scope to a single track (Provenance/chain-of-title POC o",desc:""},{num:2,title:"Environment and source verification — Inventory all datasets, verify the presence of partner-provided sanitized samples,",desc:""},{num:3,title:"Data acquisition and sampling — Ingest provenance logs and chain-of-title examples, creating pedagogical synthetic fixtu",desc:""},{num:4,title:"Document and temporal EDA — Analyze the structure of hybrid structured/unstructured IP records, validate adherence to th",desc:""},{num:5,title:"Parsing and cleaning — Implement deterministic parsing logic for provenance logs and chain-of-title records to ensure st",desc:""},{num:6,title:"Data validation, audit, and vetting — Perform thorough legal and security vetting on sanitized datasets while manually a",desc:""},{num:7,title:"Design annotation and build gold benchmark — Define prediction units, annotate document relationships, set prediction ho",desc:""},{num:8,title:"Transparent baseline — Implement a simple, deterministic rule-based validation script for chain-of-title assets or a chr",desc:""},{num:9,title:"Justified advanced method — Introduce LLMs or complex time-series architectures only after establishing a baseline and d",desc:""},{num:10,title:"Project-specific evaluation — Execute schema validation rules or chronological time-series evaluation depending on the s",desc:""},{num:11,title:"End-to-end failure analysis — Trace system outputs back to primary source records, categorize pipeline errors by process",desc:""},{num:12,title:"Stretch/agentic work only after core — Attempt external API integrations or multi-agent orchestration strictly after the",desc:""},{num:13,title:"Reproducibility and responsible reporting — Package all project outputs into an artifacts directory, generate run\\_summa",desc:""}]},{id:"1052",title:"Multimodal Document Understanding: Comparing Embeddings for Classification and Extraction",org:"Other",advisor:"Grace Lang",ml_type:"Classification, Clustering, NLP, Computer Vision, Deep Learning, LLMs/Generative AI, Transfer Learning",evaluation:"Approved As Is",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"Computer Vision",objective:"To build a pipeline that sorts documents by type and extracts structured data using multimodal embeddings (ColPali vs. ColQwen2) and LLMs to automate manual processing.",metrics:"Quantitative head-to-head comparison of embeddings; clustering quality (silhouette, ARI, NMI and/or Davies–Bouldin); classification performance (accuracy, macro-F1) plus confusion-matrix analysis; novelty/out-of-distribution detection performance for the held-out document type; field-level extraction accuracy/F1 and JSON validity for LLM extractions; plus an error analysis and final head-to-head report.",data_link:"https://huggingface.co/datasets/getomni-ai/ocr-benchmark",sep:"Embed documents, perform dimensionality reduction, and evaluate clustering.",oct:"Train classifiers and construct out-of-distribution detectors.",nov:"Implement multimodal LLM extraction and evaluate against ground-truth (field-level accuracy/F1, JSON validity); perform error analysis of failure modes; publish public GitHub repo and brief head-to-head report with error analysis.",bottleneck:"Students may face steep learning curves with late-2024 multimodal embedding architectures (ColPali) and handling large image-text datasets in memory-constrained environments.",recommendation:"Ambitious. Focus initially on head-to-head embedding comparison and classification before moving to LLM extraction. Limit document types if GPU memory limits hinder processing. Treat 'Agentic IDP router' as a stretch goal.",summary:"Students may face a steep learning curve with late-2024 multimodal embedding architectures like ColPali and experience GPU memory constraints when processing large image-text datasets. To manage complexity, teams should focus initially on comparing embeddings and document classification before progressing to LLM extraction. Limiting the number of document types and deferring advanced routing features to stretch goals will help ensure baseline objectives are met.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the business need for automated document processing and bounded technical tasks: comparing multimodal embeddings (ColPali vs. ColQwen2) for classification and extracting JSON data via LLMs. Document expected schemas, failure costs, abstention rules, and GPU constraints. Define success using clustering metrics, macro-F1, extraction accuracy, and JSON validity.

2.  Environment & Source Verification: Confirm access to the HuggingFace OCR benchmark dataset (\`getomni-ai/ocr-benchmark\`). Verify dependencies for multimodal models, clustering, classification, and LLM extraction. Assess GPU memory limits for 2024 multimodal architectures and establish fallback strategies, such as restricting document classes, to prevent out-of-memory errors.

3.  Data Acquisition & Sampling: Curate a representative sample from the OCR benchmark dataset that captures visual layout diversity and document types. Clean and structure the raw files to address data quality issues, ensuring a reproducible, memory-safe evaluation split for downstream benchmarking.

4.  Image & Text EDA: Perform exploratory data analysis on document images and extracted text. Analyze structural layout variations, visual complexity, and potential data pipeline challenges across document types. Evaluate class distributions and document quality issues to inform model selection and evaluation design.

5.  Parsing, Cleaning, & Validation Gate: Build a deterministic pipeline to ingest document images and text while preserving source provenance. Validate image resolution, orientation, duplicate records, and text coverage. Manually audit representative samples against the source dataset and freeze the verified document manifest before model evaluation.

6.  Schema & Ground-Truth Annotation: Define a strict JSON schema for target extraction fields across supported document types. Manually annotate or verify ground-truth labels on the frozen evaluation set. Establish clear annotation rubrics, resolve labeling disagreements, and calibrate against human standards to ensure reliable field-level benchmarking.

7.  Baseline Embedding & Clustering: Implement a standard reference baseline using traditional OCR and text embeddings before evaluating advanced multimodal architectures. Cluster documents and evaluate baseline performance using silhouette scores, adjusted rand index (ARI), normalized mutual information (NMI), or Davies–Bouldin index to establish a baseline quality floor.

8.  Advanced Multimodal Embedding Implementation: Implement multimodal embedding architectures (ColPali and ColQwen2) for document representations. Perform dimensionality reduction, evaluate clustering improvements over baseline models, and train classifiers with out-of-distribution detectors for held-out document types while strictly monitoring GPU memory utilization.

9.  Head-to-Head Embedding Evaluation: Conduct a rigorous head-to-head comparison between ColPali and ColQwen2 embeddings. Evaluate clustering quality metrics, classification accuracy, macro-F1, confusion matrices, and out-of-distribution detection capabilities. Audit computational costs, privacy risks, and hallucination rates to select the optimal model.

10. Multimodal LLM Extraction Implementation: Build a multimodal LLM extraction pipeline for target document types. Design structured system prompts and output constraints to guide the model to extract required fields matching the pre-defined JSON schema cleanly without missing key key-value pairs.

11. Extraction Evaluation & Schema Validation: Benchmark LLM extractions against the gold-standard dataset. Calculate field-level precision, recall, and F1 scores across extracted fields. Validate JSON syntax and strict schema adherence to ensure downstream integration readiness and identify extraction inaccuracies.

12. End-to-End Failure Analysis: Systematically analyze pipeline failure modes, including GPU out-of-memory errors, misclassifications, schema violations, omitted fields, and hallucinated values. Trace root causes to specific visual layouts or document types and document mitigations and residual risks across the pipeline.

13. Agentic Routing Extension: Implement an Agentic IDP router as an optional stretch goal only after successfully validating the core embedding comparison, classification, and LLM extraction pipeline. Ensure the agentic module operates independently without introducing execution instability or exceeding GPU memory limits.

14. Artifact Archiving & Reproducibility: Finalize a public GitHub repository containing versioned code, prompt templates, JSON schemas, evaluation scripts, and the head-to-head report. Include a detailed README documenting hardware requirements, memory constraints, error analyses, and instructions to reproduce all classification and extraction benchmarks.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the business need for automated document processing and bounded technical tasks: comparing multimodal embeddings (ColPali vs. ColQwen2) for classification and extracting JSON data via LLMs. Document expected schemas, failure costs, abstention rules, and GPU constraints. Define success using c"},{num:2,title:"Environment & Source Verification",desc:"Confirm access to the HuggingFace OCR benchmark dataset (`getomni-ai/ocr-benchmark`). Verify dependencies for multimodal models, clustering, classification, and LLM extraction. Assess GPU memory limits for 2024 multimodal architectures and establish fallback strategies, such as restricting document "},{num:3,title:"Data Acquisition & Sampling",desc:"Curate a representative sample from the OCR benchmark dataset that captures visual layout diversity and document types. Clean and structure the raw files to address data quality issues, ensuring a reproducible, memory-safe evaluation split for downstream benchmarking."},{num:4,title:"Image & Text EDA",desc:"Perform exploratory data analysis on document images and extracted text. Analyze structural layout variations, visual complexity, and potential data pipeline challenges across document types. Evaluate class distributions and document quality issues to inform model selection and evaluation design."},{num:5,title:"Parsing, Cleaning, & Validation Gate",desc:"Build a deterministic pipeline to ingest document images and text while preserving source provenance. Validate image resolution, orientation, duplicate records, and text coverage. Manually audit representative samples against the source dataset and freeze the verified document manifest before model "},{num:6,title:"Schema & Ground-Truth Annotation",desc:"Define a strict JSON schema for target extraction fields across supported document types. Manually annotate or verify ground-truth labels on the frozen evaluation set. Establish clear annotation rubrics, resolve labeling disagreements, and calibrate against human standards to ensure reliable field-l"},{num:7,title:"Baseline Embedding & Clustering",desc:"Implement a standard reference baseline using traditional OCR and text embeddings before evaluating advanced multimodal architectures. Cluster documents and evaluate baseline performance using silhouette scores, adjusted rand index (ARI), normalized mutual information (NMI), or Davies–Bouldin index "},{num:8,title:"Advanced Multimodal Embedding Implementation",desc:"Implement multimodal embedding architectures (ColPali and ColQwen2) for document representations. Perform dimensionality reduction, evaluate clustering improvements over baseline models, and train classifiers with out-of-distribution detectors for held-out document types while strictly monitoring GP"},{num:9,title:"Head-to-Head Embedding Evaluation",desc:"Conduct a rigorous head-to-head comparison between ColPali and ColQwen2 embeddings. Evaluate clustering quality metrics, classification accuracy, macro-F1, confusion matrices, and out-of-distribution detection capabilities. Audit computational costs, privacy risks, and hallucination rates to select "},{num:10,title:"Multimodal LLM Extraction Implementation",desc:"Build a multimodal LLM extraction pipeline for target document types. Design structured system prompts and output constraints to guide the model to extract required fields matching the pre-defined JSON schema cleanly without missing key key-value pairs."},{num:11,title:"Extraction Evaluation & Schema Validation",desc:"Benchmark LLM extractions against the gold-standard dataset. Calculate field-level precision, recall, and F1 scores across extracted fields. Validate JSON syntax and strict schema adherence to ensure downstream integration readiness and identify extraction inaccuracies."},{num:12,title:"End-to-End Failure Analysis",desc:"Systematically analyze pipeline failure modes, including GPU out-of-memory errors, misclassifications, schema violations, omitted fields, and hallucinated values. Trace root causes to specific visual layouts or document types and document mitigations and residual risks across the pipeline."},{num:13,title:"Agentic Routing Extension",desc:"Implement an Agentic IDP router as an optional stretch goal only after successfully validating the core embedding comparison, classification, and LLM extraction pipeline. Ensure the agentic module operates independently without introducing execution instability or exceeding GPU memory limits."},{num:14,title:"Artifact Archiving & Reproducibility",desc:"Finalize a public GitHub repository containing versioned code, prompt templates, JSON schemas, evaluation scripts, and the head-to-head report. Include a detailed README documenting hardware requirements, memory constraints, error analyses, and instructions to reproduce all classification and extrac"}]},{id:"1057",title:"Domain-Specific Theme Labeling via SLM Distillation",org:"Automation Anywhere",advisor:"Archan Dutta",ml_type:"Natural Language Processing (NLP), Large Language Models (LLMs)/ Generative AI",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Use knowledge distillation (using LLMs to teach SLMs) to label topics in IT/HR/CX datasets to achieve high accuracy at lower cost and latency.",metrics:"SLM achieves ≥ 90% of LLM accuracy (macro F1); ≥ 10× cost reduction; ≥ 5× reduction in inference latency; realtime side-by-side demo.",data_link:"Not in source",sep:"Acquire Bitext & CLINC150 (or supplied IT/HR/CX datasets), design/iterate LLM prompts, generate 20–30K silver labels via LLM, validate silver-label quality on a ~500-example manually reviewed subset, and establish TF‑IDF + logistic regression baseline.",oct:"Fine-tune DistilBERT for multi-class theme classification on silver labels; fine-tune Phi‑2 regression head for automation-potential scoring; evaluate macro F1 and ordinal agreement vs LLM labels; address class imbalance (e.g., weighted loss functions).",nov:"Benchmark fine-tuned SLMs against GPT‑4 on accuracy, cost-per-1,000-labels, and inference latency; build side-by-side Streamlit demo; write final report with quantified ROI analysis; optionally explore few‑shot generalization to the Finance domain.",bottleneck:"Students may face steep learning curves with LLM distillation and fine-tuning SLMs like Phi-2. Institutional bottlenecks include providing timely GPU credits and API keys.",recommendation:"Technically ambitious. Prioritize a single domain (e.g., IT) first. Ensure GPU resources are accessible by week one. If silver-label generation lags, reduce the target dataset size from 30K to 10K examples.",summary:"Students face steep learning curves with LLM-to-SLM distillation and fine-tuning, which can be further hindered by delayed access to GPU credits and API keys. To mitigate these risks, teams should prioritize a single domain, secure GPU resources by week one, and reduce the target dataset size from 30K to 10K examples if silver-label generation lags.",checklist_raw:`1.  Understand the business and project problem — Define the real-world problem, target users, workflows, and decisions supported. Translate business needs into a bounded technical task, such as LLM-to-SLM distillation for topic labeling. Clearly outline output definitions, risks of false predictions, observable learning goals, and stakeholder-aligned evaluation metrics to ensure stakeholders explain objectives without relying on jargon.

2.  Version and verify the environment, sources, and assets — Catalog datasets, documents, schemas, APIs, credentials, compute resources, and advisor-provided assets. Ensure all required files are accessible, safe, and substantive while setting up preflight validation checks and fallbacks. Assign explicit owners, roles, and validation records for every resource before proceeding.

3.  Acquire, sample, and profile the data — Define analysis units, features, targets, identifiers, and relationship structures. Confirm the dataset accurately reflects the core business problem and target population. Build a fully reproducible sampling plan if dataset dimensions exceed memory or compute limits, ensuring the team understands how raw records map to tasks.

4.  Perform exploratory data analysis (Text/Label EDA) — Analyze distributions, schema types, missingness, duplicates, and unique identifiers. Inspect class balance, text lengths, temporal coverage, and quality issues across subgroups. Verify there is no target leakage, duplicate overlap, or train/test contamination to establish necessary data-cleaning and annotation strategies.

5.  Clean, parse, normalize, and validate the data — Implement deterministic preprocessing and parsing routines prior to inference. Preserve stable record identifiers, page provenance, and timestamps while standardizing text formats. Validate missing values, boundary conditions, and domain invariants using systematic assertions to guarantee the integrity of frozen modeling datasets.

6.  Design annotation and build the gold benchmark — Define the unit of annotation, class taxonomies, evidence criteria, and guidelines for ambiguous edge cases. Provide detailed instructions featuring positive, negative, and boundary examples. Establish an isolated 500-sample expert-labeled validation benchmark to align ground truth with evaluation requirements before testing.

7.  Build the transparent baseline — Implement a simple classical baseline, such as TF-IDF combined with Logistic Regression, to set a performance floor. Evaluate the system using task-aligned metrics on the gold benchmark dataset and analyze errors. Document configurations, prediction outputs, and limitations to serve as a comparative standard.

8.  Upgrade the core method only after the baseline — Integrate advanced techniques, such as Small Language Model (SLM) distillation, specifically to address systemic failure modes uncovered during baseline error analysis. Systematically evaluate improvements in performance, cost savings, inference latency, memory footprint, and model interpretability against the baseline.

9.  Add project-specific advanced gates — Audit silver labels generated by teacher LLMs directly against expert gold benchmark data. Rigorously benchmark student models like DistilBERT or Phi-2 against both teacher LLMs and baseline algorithms using identical test partitions to satisfy task-specific validation contracts.

10. Validate, audit, and vet the end-to-end system — Conduct root-cause failure analysis by isolating errors across specific pipeline stages. Perform audits covering edge cases, subgroup fairness, system latency, operational costs, and class imbalances. Ensure team members can identify failing subsystems and document corresponding risk-mitigation strategies.

11. Tune only on development data and run the final evaluation once — Restrict prompt engineering, hyperparameter optimization, threshold tuning, and feature selection entirely to training and development sets. Execute the finalized evaluation suite exactly once against the untouched test set, ensuring all reported metrics are fully reproducible.

12. Attempt stretch or agentic extensions only after the core works — Introduce complex extensions or interactive UI demos only after establishing a fully functional core pipeline. Clearly define the baseline deficiencies the stretch goals aim to solve and validate performance gains against non-agentic baselines to justify added complexity.

13. Close with reproducibility and responsible reporting — Archive data manifests, seeds, split definitions, prompt templates, metrics, and environment configurations. Clearly differentiate between pipeline execution readiness and underlying model accuracy. Ensure external reviewers can independently reproduce the end-to-end workflow and verify remaining operational gates.`,gates:[{num:1,title:"Understand the business and project problem — Define the real-world problem, target users, workflows, and decisions supp",desc:""},{num:2,title:"Version and verify the environment, sources, and assets — Catalog datasets, documents, schemas, APIs, credentials, compu",desc:""},{num:3,title:"Acquire, sample, and profile the data — Define analysis units, features, targets, identifiers, and relationship structur",desc:""},{num:4,title:"Perform exploratory data analysis (Text/Label EDA) — Analyze distributions, schema types, missingness, duplicates, and u",desc:""},{num:5,title:"Clean, parse, normalize, and validate the data — Implement deterministic preprocessing and parsing routines prior to inf",desc:""},{num:6,title:"Design annotation and build the gold benchmark — Define the unit of annotation, class taxonomies, evidence criteria, and",desc:""},{num:7,title:"Build the transparent baseline — Implement a simple classical baseline, such as TF-IDF combined with Logistic Regression",desc:""},{num:8,title:"Upgrade the core method only after the baseline — Integrate advanced techniques, such as Small Language Model (SLM) dist",desc:""},{num:9,title:"Add project-specific advanced gates — Audit silver labels generated by teacher LLMs directly against expert gold benchma",desc:""},{num:10,title:"Validate, audit, and vet the end-to-end system — Conduct root-cause failure analysis by isolating errors across specific",desc:""},{num:11,title:"Tune only on development data and run the final evaluation once — Restrict prompt engineering, hyperparameter optimizati",desc:""},{num:12,title:"Attempt stretch or agentic extensions only after the core works — Introduce complex extensions or interactive UI demos o",desc:""},{num:13,title:"Close with reproducibility and responsible reporting — Archive data manifests, seeds, split definitions, prompt template",desc:""}]},{id:"1065",title:"Compliance Copilot",org:"Aerospace",advisor:"Mark Thiessen",ml_type:"NLP, Large Language Models (LLMs) / Generative AI, Retrieval-Augmented Generation (RAG), Agentic AI",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Build a domain-specific compliance copilot that parses raw Software Requirements Specifications (SRS) and automatically verifies alignment against official NASA aerospace procedural standards, flagging gaps, partial conformances, and missing verification clauses.",metrics:"Report precision and recall (optionally F1) on clause-level gap detection against the hand-labeled benchmark; include a brief error analysis describing common failure modes. Require every verdict to cite the specific standard clause and produce grounded, structured outputs validated by a deterministic JSON/Pydantic schema. Do not include hard numeric citation-faithfulness targets or an absolute 'zero fabricated references' requirement.",data_link:"NPR 7150.2 (worked example); NASA-STD-8739.8 (optional); software requirements (SRS) documents",sep:"Wk 1: Day 1 — create labeled ground-truth evaluation set and access NPR 7150.2 (worked example) and any other chosen standards; Wk 2: Data triage and layout-aware hierarchical chunking / pre-chunking of standard reference files and SRS documents; Wk 3: Ingest documents into vector/document store and build retrieval harness; Wk 4: Implement baseline non-agentic RAG pipeline and run initial retrieval tests.",oct:"Implement clause-level classification logic (Compliant / Partial / Non-Compliant); build deterministic, citation-forcing prompts; implement JSON/Pydantic schema validation for audit outputs; evaluate baseline on the labeled benchmark (precision, recall, optional F1) and produce error analysis.",nov:"Wrap the non-agentic baseline into a single LLM agent with tool calls (retrieve_clause, check_requirement, log_gap); generate Compliance Gap Matrix and export structured JSON and human-readable audit report; run end-to-end evaluation. Optional stretch: add human-in-the-loop review overrides and capture feedback.",bottleneck:"Regulatory aerospace documents feature dense cross-referencing and hierarchical numbering that break naive semantic chunkers, leading to context truncation and hallucinated compliance verdicts.",recommendation:"Validate their boilerplate Pydantic schema models and chunked standard clauses to ensure students focus on retrieval accuracy and compliance verification logic.",summary:"Dense cross-referencing and hierarchical numbering in regulatory aerospace documents can break naive semantic chunkers, resulting in context truncation and hallucinated compliance verdicts. To resolve this issue, advisers should provide pre-chunked standard clauses and validated Pydantic schema models upfront. This allows students to avoid ingestion pitfalls and direct their focus toward retrieval accuracy and compliance verification logic.",checklist_raw:`1.  Define the task, boundary, and metrics: Frame the overall project around standards-first SRS coverage. Focus the team on generating cited MEETS, PARTIAL, or GAP proposals for key stakeholders instead of attempting to deliver absolute, formal legal compliance determinations across the system.

2.  Version and verify the environment and sources: Carefully record baseline package and model versions alongside exact source hashes. Treat NPR 7150.2 as authoritative, utilize the NASA Systems Engineering Handbook for supporting context, and establish the SRS as your active target audit corpus.

3.  Parse and validate the NPR: Systematically extract numbered clauses with associated page references while preserving SWE IDs. Inspect the parsed output for missing IDs, duplicated clauses, Appendix C repetitions, or formatting artifacts before permanently freezing the reference standard corpus.

4.  Curate the Standards Criteria Library: Direct qualified reviewers to evaluate each clause and assign KEEP, REVIEW, or DROP status based on SRS relevance. Mandate clear rationales, explicit verification questions, and persistent traceability back to parent clauses and SWE IDs.

5.  Parse and validate the SRS: Break down the input documents into atomic requirements, retaining all requirement IDs and structural section headers. Run automated data cleaning checks to eliminate duplicates, empty text fields, and malformed samples before locking the evidence corpus.

6.  Build the gold benchmark: Create a high-quality evaluation set by human-labeling criterion-to-requirement relevance, cited evidence IDs, and ground-truth MEETS, PARTIAL, or GAP verdicts. Measure inter-annotator agreement score, resolve discrepancies, and freeze dedicated development and evaluation test partitions.

7.  Build transparent retrieval baselines: Establish a clean baseline pipeline using simple rule-based matching, basic keyword overlap, and TF-IDF scoring algorithms. Evaluate initial retrieval performance across the benchmark dataset using standard IR metrics including Hit@K, Recall@K, Precision@K, and Mean Reciprocal Rank.

8.  Upgrade to semantic retrieval: Enhance candidate search performance by incorporating dense Sentence-BERT vector embeddings into the pipeline. Benchmark semantic search outputs directly against your initial keyword baselines and conduct thorough criterion-level error analyses to pinpoint specific retrieval failure modes.

9.  Rerank only when justified: Introduce a specialized cross-encoder re-ranking step only if relevant requirement evidence successfully enters candidate retrieval sets but ranks too low. Ensure students realize re-ranking cannot compensate for fundamental candidate recall failures during early retrieval stages.

10. Add coverage judgment: Classify coverage alignment by assigning MEETS, PARTIAL, or GAP verdicts directly based on retrieved citations. Benchmark classification accuracy independently from retrieval efficiency using macro-F1, class-level metrics, detailed confusion matrices, and strict citation fidelity checks.

11. Perform end-to-end failure analysis: Perform comprehensive error diagnostics by bucketing overall pipeline failures into distinct categories such as parsing errors, applicability mismatches, retrieval failures, or judgment errors. Conduct all tuning solely on development data before unblinding final test sets.

12. Attempt agentic extensions only after the core works: Explore agentic architectural enhancements like autonomous tool calling, dynamic multi-step generation, or multi-agent communication networks strictly after proving core functionality. Benchmark all agent iterations against the baseline using identical frozen evaluation sets.

13. Close with reproducibility and responsible reporting: Archive all training corpora, human labels, repository hashes, exact model checkpoints, decision thresholds, and output matrices. Document all known operational limitations clearly, ensuring performance metrics are omitted if ground-truth labels remain incomplete or unadjudicated.`,gates:[{num:1,title:"Define the task, boundary, and metrics",desc:"Frame the overall project around standards-first SRS coverage. Focus the team on generating cited MEETS, PARTIAL, or GAP proposals for key stakeholders instead of attempting to deliver absolute, formal legal compliance determinations across the system."},{num:2,title:"Version and verify the environment and sources",desc:"Carefully record baseline package and model versions alongside exact source hashes. Treat NPR 7150.2 as authoritative, utilize the NASA Systems Engineering Handbook for supporting context, and establish the SRS as your active target audit corpus."},{num:3,title:"Parse and validate the NPR",desc:"Systematically extract numbered clauses with associated page references while preserving SWE IDs. Inspect the parsed output for missing IDs, duplicated clauses, Appendix C repetitions, or formatting artifacts before permanently freezing the reference standard corpus."},{num:4,title:"Curate the Standards Criteria Library",desc:"Direct qualified reviewers to evaluate each clause and assign KEEP, REVIEW, or DROP status based on SRS relevance. Mandate clear rationales, explicit verification questions, and persistent traceability back to parent clauses and SWE IDs."},{num:5,title:"Parse and validate the SRS",desc:"Break down the input documents into atomic requirements, retaining all requirement IDs and structural section headers. Run automated data cleaning checks to eliminate duplicates, empty text fields, and malformed samples before locking the evidence corpus."},{num:6,title:"Build the gold benchmark",desc:"Create a high-quality evaluation set by human-labeling criterion-to-requirement relevance, cited evidence IDs, and ground-truth MEETS, PARTIAL, or GAP verdicts. Measure inter-annotator agreement score, resolve discrepancies, and freeze dedicated development and evaluation test partitions."},{num:7,title:"Build transparent retrieval baselines",desc:"Establish a clean baseline pipeline using simple rule-based matching, basic keyword overlap, and TF-IDF scoring algorithms. Evaluate initial retrieval performance across the benchmark dataset using standard IR metrics including Hit@K, Recall@K, Precision@K, and Mean Reciprocal Rank."},{num:8,title:"Upgrade to semantic retrieval",desc:"Enhance candidate search performance by incorporating dense Sentence-BERT vector embeddings into the pipeline. Benchmark semantic search outputs directly against your initial keyword baselines and conduct thorough criterion-level error analyses to pinpoint specific retrieval failure modes."},{num:9,title:"Rerank only when justified",desc:"Introduce a specialized cross-encoder re-ranking step only if relevant requirement evidence successfully enters candidate retrieval sets but ranks too low. Ensure students realize re-ranking cannot compensate for fundamental candidate recall failures during early retrieval stages."},{num:10,title:"Add coverage judgment",desc:"Classify coverage alignment by assigning MEETS, PARTIAL, or GAP verdicts directly based on retrieved citations. Benchmark classification accuracy independently from retrieval efficiency using macro-F1, class-level metrics, detailed confusion matrices, and strict citation fidelity checks."},{num:11,title:"Perform end-to-end failure analysis",desc:"Perform comprehensive error diagnostics by bucketing overall pipeline failures into distinct categories such as parsing errors, applicability mismatches, retrieval failures, or judgment errors. Conduct all tuning solely on development data before unblinding final test sets."},{num:12,title:"Attempt agentic extensions only after the core works",desc:"Explore agentic architectural enhancements like autonomous tool calling, dynamic multi-step generation, or multi-agent communication networks strictly after proving core functionality. Benchmark all agent iterations against the baseline using identical frozen evaluation sets."},{num:13,title:"Close with reproducibility and responsible reporting",desc:"Archive all training corpora, human labels, repository hashes, exact model checkpoints, decision thresholds, and output matrices. Document all known operational limitations clearly, ensuring performance metrics are omitted if ground-truth labels remain incomplete or unadjudicated."}]},{id:"1005",title:"Predicting Heart Disease Risk from Health Survey Indicators",org:"Accenture",advisor:"Joseph Chiasson",ml_type:"Classification",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Low - enforce stretch goals",domain:"Classical ML",objective:"Predict history of coronary heart disease from BRFSS 2022 dataset using supervised ML on highly imbalanced data.",metrics:"PR-AUC, F1, ROC-AUC, precision, recall.",data_link:"https://www.kaggle.com/datasets/kamilpytlak/personal-key-indicators-of-heart-disease",sep:"Predictor variable/feature typing (characterize numerical/categorical, document encodings); missing data handling; examine correlations/interrelationships; EDA (univariate/bivariate distributions); stratified train/val/test split with fixed random seed. Deliverable: EDA notebook.",oct:"Feature engineering (scaling/normalization on train split only); train 3+ classification algorithms (Logistic Regression with L1/L2, Random Forest, KNN, XGBoost/LightGBM) with CV and hyperparameter tuning; experiment tracking comparison table; optional minority oversampling (SMOTE). Deliverable: Modeling notebook with comparison table.",nov:"Comprehensive evaluation on held-out test data (PR-AUC, F1, ROC-AUC, Precision, Recall at multiple thresholds, confusion matrix); SHAP analysis on best model to identify top risk drivers; subgroup fairness analysis (race/ethnicity, sex, age, income, US region). Deliverable: Final model recommendation, evaluation report, and subgroup fairness analysis.",bottleneck:"Relying on a severely imbalanced dataset (5-6% positive prevalence) means standard ML algorithms might plateau or produce misleading high-accuracy metrics. Students will face a steep learning curve mastering advanced resampling (SMOTE) and specialized evaluation metrics (PR-AUC).",recommendation:"Prioritize PR-AUC and F1 as primary metrics; apply class weighting/cost-sensitive learning; perform threshold/operating-point selection and probability calibration; maintain clear experiment tracking; optionally use SMOTE and, as a stretch, try a simple neural network.",summary:"Relying on a severely imbalanced dataset risks producing misleading accuracy metrics and model plateauing. To address this, teams should prioritize PR-AUC and F1 scores over accuracy, applying class weighting and probability calibration. Advanced techniques like SMOTE and simple neural networks should remain optional stretch goals.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of proactively detecting cardiovascular disease risk factors in populations using large-scale public health surveys for Accenture. Identify key stakeholders, target users, and operational workflows like population health risk stratification. Define inputs from 2022 CDC BRFSS survey data and outputs including binary risk scores, while establishing explicit scope boundaries and mitigating demographic bias risks.

2.  Environment Versioning & API Key Security: Record and lock baseline Google Colab environment variables, including Python 3.12, pandas, and scikit-learn. Configure secure API key handling for external platforms using Colab Secrets to prevent exposing credentials in public or shared code repositories.

3.  Ingestion & Schema Validation Gate: Ingest the CDC BRFSS dataset and programmatically verify that all column headers, data types, and target variables match expected specifications. Develop an automated ingestion verification script to lock column mappings and feature encodings before beginning model development.

4.  Exploratory Data Analysis & Cleaning: Analyze variable distributions, continuous feature correlations, and target class frequencies to identify potential issues. Document extreme class imbalances, missing data patterns, and high-cardinality categorical features to guide subsequent preprocessing decisions.

5.  Data Cleaning & Imputed Value Validation Gate: Inspect the raw survey dataset for missing values, logical inconsistencies, and erroneous placeholders. Programmatically log any chosen missing data imputation strategy (such as mode, median, or k-NN imputation) and freeze the resulting cleaned dataset version.

6.  Feature Engineering & Preprocessing: Apply appropriate continuous feature scaling and categorical variable encodings (such as one-hot or target encoding). Write data validation assertions to ensure transformed features remain strictly within expected logical boundaries across training subsets.

7.  Partitioning & Data Leakage Prevention Gate: Establish stratified cross-validation splits to handle severe target class imbalance properly. Guarantee that any resampling techniques like SMOTE are strictly executed within individual cross-validation training folds to prevent catastrophic data leakage into validation sets.

8.  Baseline Modeling & Training: Train a simple, highly interpretable baseline classifier, such as a class-weighted Logistic Regression or Decision Tree model. Use this baseline to establish a quantitative benchmark performance floor for all subsequent complex iterations.

9.  Model Selection & Threshold Calibration Gate: Train advanced ensemble architectures, including Random Forest, XGBoost, and LightGBM models. Evaluate performance primarily using PR-AUC and F1-score while prioritizing probability calibration over raw accuracy to surpass baseline benchmarks cleanly.

10. Model Explainability & Model Card Handoff Gate: Generate global and local feature explanations using SHAP values or feature coefficients. Deliver a fully reproducible notebook, a final summary report, and a detailed model card detailing performance and fairness across key demographic subgroups.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of proactively detecting cardiovascular disease risk factors in populations using large-scale public health surveys for Accenture. Identify key stakeholders, target users, and operational workflows like population health risk stratification. Define inputs from 2022 CDC BRFSS "},{num:2,title:"Environment Versioning & API Key Security",desc:"Record and lock baseline Google Colab environment variables, including Python 3.12, pandas, and scikit-learn. Configure secure API key handling for external platforms using Colab Secrets to prevent exposing credentials in public or shared code repositories."},{num:3,title:"Ingestion & Schema Validation Gate",desc:"Ingest the CDC BRFSS dataset and programmatically verify that all column headers, data types, and target variables match expected specifications. Develop an automated ingestion verification script to lock column mappings and feature encodings before beginning model development."},{num:4,title:"Exploratory Data Analysis & Cleaning",desc:"Analyze variable distributions, continuous feature correlations, and target class frequencies to identify potential issues. Document extreme class imbalances, missing data patterns, and high-cardinality categorical features to guide subsequent preprocessing decisions."},{num:5,title:"Data Cleaning & Imputed Value Validation Gate",desc:"Inspect the raw survey dataset for missing values, logical inconsistencies, and erroneous placeholders. Programmatically log any chosen missing data imputation strategy (such as mode, median, or k-NN imputation) and freeze the resulting cleaned dataset version."},{num:6,title:"Feature Engineering & Preprocessing",desc:"Apply appropriate continuous feature scaling and categorical variable encodings (such as one-hot or target encoding). Write data validation assertions to ensure transformed features remain strictly within expected logical boundaries across training subsets."},{num:7,title:"Partitioning & Data Leakage Prevention Gate",desc:"Establish stratified cross-validation splits to handle severe target class imbalance properly. Guarantee that any resampling techniques like SMOTE are strictly executed within individual cross-validation training folds to prevent catastrophic data leakage into validation sets."},{num:8,title:"Baseline Modeling & Training",desc:"Train a simple, highly interpretable baseline classifier, such as a class-weighted Logistic Regression or Decision Tree model. Use this baseline to establish a quantitative benchmark performance floor for all subsequent complex iterations."},{num:9,title:"Model Selection & Threshold Calibration Gate",desc:"Train advanced ensemble architectures, including Random Forest, XGBoost, and LightGBM models. Evaluate performance primarily using PR-AUC and F1-score while prioritizing probability calibration over raw accuracy to surpass baseline benchmarks cleanly."},{num:10,title:"Model Explainability & Model Card Handoff Gate",desc:"Generate global and local feature explanations using SHAP values or feature coefficients. Deliver a fully reproducible notebook, a final summary report, and a detailed model card detailing performance and fairness across key demographic subgroups."}]},{id:"1006",title:"Mortgage Approval & Denial Prediction",org:"AI4All",advisor:"David Taiwo Balogun",ml_type:"Classification, Time Series",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"It will require some cleaning / preprocessing",difficulty:"Low - enforce stretch goals",domain:"Classical ML",objective:"Predict mortgage approval/denial using HMDA data and identify key drivers and potential bias.",metrics:"AUC-ROC >= 0.80, F1 Score, Fairness Metrics.",data_link:"HMDA Data / Kaggle",sep:"Data & Exploration — Download and understand HMDA public dataset; perform EDA (distributions, missing values, class imbalance); clean and preprocess data (encoding, normalization, handling nulls); define target variable and finalize feature set; establish simple baseline model (e.g., Logistic Regression); identify protected attributes (race, gender, income) and set up evaluation splits and metrics for later fairness analysis.",oct:"Modeling & Iteration — Train and compare multiple ML models (Decision Trees, Random Forest, Gradient Boosting); tune hyperparameters and evaluate using AUC-ROC, F1, precision/recall; conduct fairness/bias analysis across demographic groups (race, gender, income); implement and compare one basic bias-mitigation technique (e.g., reweighing or a post-processing method) and measure its impact; identify predictive features via feature importance.",nov:"Insights & Delivery — Finalize the best-performing model and validate on held-out test data; generate explainability outputs using one method (SHAP or LIME) to produce both global and local explanations; present results of the chosen bias-mitigation approach with fairness metrics and discuss tradeoffs; create visualizations and a stakeholder-friendly dashboard/report; deliver the final presentation and document the full pipeline for reproducibility.",bottleneck:"Risk of being under-challenging after an initial baseline unless explainability and fairness analyses are emphasized; dataset will require cleaning and preprocessing (not already 'clean'); students may need additional support to implement bias-mitigation and explainability tooling.",recommendation:"Require students to integrate one explainability method (SHAP or LIME) and one basic bias-mitigation technique (reweighing in training or a post-processing method such as equalized odds postprocessing) into core deliverables. Suggested first-year implementation path: compute fairness metrics for protected groups; try a baseline model and measure disparities; implement reweighing by adjusting training sample weights or apply a simple post-processing repair; use SHAP or LIME to produce global and local explanations for the final model; document results, tradeoffs, and business implications. Leave adversarial debiasing as an optional stretch for teams with extra capacity.",summary:"Building a basic mortgage prediction model risks being under-challenging unless fairness and interpretability are actively emphasized. To ensure sufficient technical rigor, teams should integrate at least one bias-mitigation technique and one explainability method, such as SHAP or LIME, into their core deliverables. This structured approach helps students systematically evaluate demographic disparities, apply reweighing or post-processing, and interpret feature drivers effectively.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of detecting and mitigating systemic bias in credit and mortgage approval pipelines for AI4All. Identify key stakeholders, target users, operational workflows, and supported decisions. Inputs include federal HMDA public applicant demographics and financial ratios; outputs are predicted approvals, parity indicators, and SHAP explanations. Scope is limited to a simulation auditing model without live underwriting.

2.  Environment Versioning & API Key Security: Record and lock baseline Google Colab environment variables, including Python 3.12, pandas, and scikit-learn. Configure secure API key handling for external models or platforms using Colab Secrets to prevent exposing credentials in public or shared project notebooks.

3.  Ingestion & Schema Validation Gate: Load the dataset and programmatically verify that all column headers, data types, and target variables match expected values. Write and commit an ingestion verification script to confirm column mappings and feature encodings are locked prior to modeling.

4.  Exploratory Data Analysis & Cleaning: Plot continuous feature correlations, variable distributions, and target class frequencies to identify and document extreme class imbalances, missing data patterns, or high cardinality in categorical features across the dataset.

5.  Data Cleaning & Imputed Value Validation Gate: Inspect the dataset for missing values, logical inconsistencies, and erroneous placeholders. Programmatically log any missing data imputation strategy, such as mode, median, or k-NN imputation, and freeze the cleaned dataset version for modeling.

6.  Feature Engineering & Preprocessing: Scale continuous features, encode categorical variables using one-hot or target encoding, and implement data validation assertions to ensure all transformed variables remain within strict logical boundaries before training.
