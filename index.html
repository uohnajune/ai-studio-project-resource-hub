r coach required",domain:"NLP / LLMs",objective:"Translate legacy SAS code to Python, validate outputs, and generate workflow documentation using agentic AI.",metrics:"Accuracy, completeness, and usability of the functional end-to-end migration system.",data_link:"https://qualitynet.cms.gov/inpatient/public-reporting/overall-ratings/software",sep:"Data Exploration & Setup — Understand SAS code structures (DATA step, PROC SQL), explore sample datasets, build initial SAS-to-Python translation prototypes, and set up environment for executing Python scripts and loading SAS data.",oct:"Core System Development — Develop main translation module, implement execution pipelines, build validation logic (row counts, column checks, aggregates), and generate basic comparison outputs between SAS and Python results.",nov:"End-to-End Pipeline Migration — Apply the system to a real SAS pipeline consisting of four dependent programs (translate, execute, validate, document) from start to finish using the provided input dataset; finalize outputs and prepare a demonstration of the full migration workflow.",bottleneck:"Utilizing Agentic AI to translate legacy SAS pipelines into Python poses a high risk of LLM syntax hallucinations. Creating automated row and column validation logic to prove mathematical parity between systems requires robust software testing frameworks that students typically lack.",recommendation:"Provide a strict, narrow subset of the legacy SAS code initially. Instruct the team to focus intensely on deterministic validation scripts (row counts, aggregates) early in the pipeline, ensuring they can definitively prove translation accuracy before expanding agentic workflow logic.",summary:"Using agentic AI for SAS-to-Python translation carries a high risk of syntax hallucinations, while building complex output validation logic can overwhelm students lacking robust software testing experience. To mitigate this, teams should start with a narrow, manageable subset of legacy SAS code and prioritize simple, deterministic validation scripts like row counts and aggregates. Proving translation parity on a restricted scope ensures baseline accuracy before scaling up complex agentic workflows.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the problem of migrating legacy SAS programs into Python for Abt Global. Identify key stakeholders, target users, and workflows. Inputs include SAS source code and CMS QualityNet datasets; outputs are translated Python scripts and parity reports. Scope is limited to a narrow development subset to manage hallucination risks.
2.  Environment Versioning & API Key Security: Record and lock baseline Google Colab environment variables (Python 3.12, pandas, scikit-learn). Configure secure API key management for the LLM using Colab Secrets to prevent exposing credentials in public or shared notebooks.
3.  Ingestion & Preflight Validation Gate: Ingest raw SAS scripts and programmatically verify that the parser captures all discrete SAS keywords, library references, and table definitions, loading them into a traversable schema without truncation.
4.  Schema & Data Type Inspection Gate: Run an automated audit mapping SAS data types to Pandas equivalents in a 2D matrix. Flag high-risk discrepancies, such as SAS dot missing values mapping to Pandas NaNs, which alter aggregation and sorting behavior.
5.  Code Normalization & Formatting Gate: Build a rule-based normalizer to strip comments and proprietary headers, producing clean tokenized functional inputs. Block the pipeline if key terms or variable declarations are dropped during normalization.
6.  Ingestion & Truth Benchmarking Gate: Establish a gold-standard reference dataset by running original SAS scripts to export CSV/Parquet files. Store schemas, row-by-row hashes, and variable distributions to serve as ground truth.
7.  Simple Keyword Lookup Baseline: Construct a simple rule-based Python translator using lookup dictionaries or regex patterns for elementary operations like PROC SQL and simple DATA steps to set a performance benchmark.
8.  Baseline Comparison Evaluation: Run the rule-based baseline against the initial development SAS script. Document translation failures, syntax errors, and data discrepancies to establish a quantitative baseline parity score.
9.  Core LLM Translation Integration: Upgrade to single-prompt LLM translation using context-rich system prompts. Supply the raw SAS code, target Pandas schema, and explicit translation mapping rules for complex procedures.
10. Deterministic Parity Vetting Gate: Implement an automated script (validate\\_parity.py) following code generation. Require 100% mathematical data parity within a 1e-5 tolerance on development data before allowing advanced multi-step logic.
11. Pipeline Failure Analysis & Attribution: Systematically categorize errors into Syntax Errors, Schema Mismatches, and Value Discrepancies. Trace root causes back to specific subsystems such as prompt truncation or model hallucination.
12. Isolation Tuning Constraints: Perform all prompt engineering, calibration, and hyperparameter tuning strictly on the development partition. Run the finalized translation suite exactly once against the isolated, unseen validation SAS programs.
13. Multi-Agent Debugging Extension: Implement an optional multi-agent correction loop (e.g., LangGraph) only after achieving deterministic baseline execution. Enforce a strict cap of 3 refinement cycles per block to manage API token costs.
14. Reproducibility & Model Card Archiving: Publish a clean GitHub repository with runnable migration notebooks, the parity validation module, and a detailed Model Card documenting supported SAS syntax, migration costs, and known limitations.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the problem of migrating legacy SAS programs into Python for Abt Global. Identify key stakeholders, target users, and workflows. Inputs include SAS source code and CMS QualityNet datasets; outputs are translated Python scripts and parity reports. Scope is limited to a narrow development subse"},{num:2,title:"Environment Versioning & API Key Security",desc:"Record and lock baseline Google Colab environment variables (Python 3.12, pandas, scikit-learn). Configure secure API key management for the LLM using Colab Secrets to prevent exposing credentials in public or shared notebooks."},{num:3,title:"Ingestion & Preflight Validation Gate",desc:"Ingest raw SAS scripts and programmatically verify that the parser captures all discrete SAS keywords, library references, and table definitions, loading them into a traversable schema without truncation."},{num:4,title:"Schema & Data Type Inspection Gate",desc:"Run an automated audit mapping SAS data types to Pandas equivalents in a 2D matrix. Flag high-risk discrepancies, such as SAS dot missing values mapping to Pandas NaNs, which alter aggregation and sorting behavior."},{num:5,title:"Code Normalization & Formatting Gate",desc:"Build a rule-based normalizer to strip comments and proprietary headers, producing clean tokenized functional inputs. Block the pipeline if key terms or variable declarations are dropped during normalization."},{num:6,title:"Ingestion & Truth Benchmarking Gate",desc:"Establish a gold-standard reference dataset by running original SAS scripts to export CSV/Parquet files. Store schemas, row-by-row hashes, and variable distributions to serve as ground truth."},{num:7,title:"Simple Keyword Lookup Baseline",desc:"Construct a simple rule-based Python translator using lookup dictionaries or regex patterns for elementary operations like PROC SQL and simple DATA steps to set a performance benchmark."},{num:8,title:"Baseline Comparison Evaluation",desc:"Run the rule-based baseline against the initial development SAS script. Document translation failures, syntax errors, and data discrepancies to establish a quantitative baseline parity score."},{num:9,title:"Core LLM Translation Integration",desc:"Upgrade to single-prompt LLM translation using context-rich system prompts. Supply the raw SAS code, target Pandas schema, and explicit translation mapping rules for complex procedures."},{num:10,title:"Deterministic Parity Vetting Gate",desc:"Implement an automated script (validate\\_parity.py) following code generation. Require 100% mathematical data parity within a 1e-5 tolerance on development data before allowing advanced multi-step logic."},{num:11,title:"Pipeline Failure Analysis & Attribution",desc:"Systematically categorize errors into Syntax Errors, Schema Mismatches, and Value Discrepancies. Trace root causes back to specific subsystems such as prompt truncation or model hallucination."},{num:12,title:"Isolation Tuning Constraints",desc:"Perform all prompt engineering, calibration, and hyperparameter tuning strictly on the development partition. Run the finalized translation suite exactly once against the isolated, unseen validation SAS programs."},{num:13,title:"Multi-Agent Debugging Extension",desc:"Implement an optional multi-agent correction loop (e.g., LangGraph) only after achieving deterministic baseline execution. Enforce a strict cap of 3 refinement cycles per block to manage API token costs."},{num:14,title:"Reproducibility & Model Card Archiving",desc:"Publish a clean GitHub repository with runnable migration notebooks, the parity validation module, and a detailed Model Card documenting supported SAS syntax, migration costs, and known limitations."}]},{id:"1010",title:"Building High-Quality Datasets and Evaluation Frameworks for AI Coding Assistants",org:"Anote",advisor:"Natan Vidra",ml_type:"NLP, LLMs / Generative AI, Transfer Learning",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Cleaned and ready",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Improve code generation, debugging, and code understanding performance of AI models.",metrics:"Pass@k, functional correctness, code readability.",data_link:"Terminal-Bench",sep:"Define project scope (code generation, bug fixing, or explanation); curate/construct dataset (code snippets, prompts, ground truth outputs); data preprocessing and formatting; establish baseline LLMs (GPT/Claude or open-source); define evaluation metrics (accuracy, pass@k).",oct:"Fine-tune/adapt models on curated datasets (if feasible); build evaluation pipelines (functional correctness via unit tests, code similarity/semantic correctness scoring); run experiments comparing zero-shot vs. fine-tuned models; analyze performance gaps/failure cases.",nov:"Improve dataset quality (add edge cases, error cases, difficult prompts); iterate on the model and evaluation pipeline; integrate outputs into a CLI tool, notebook, or lightweight UI; produce a final benchmarking report and demo.",bottleneck:"Evaluating LLM-generated code for functional correctness fundamentally requires executing untrusted, generated code snippets through unit tests. Attempting to run this on local student machines or standard Colab instances introduces significant security risks and environment execution instability.",recommendation:"Clearly define and provide a secure, isolated sandbox environment or virtual machine setup specifically for executing and benchmarking the generated code. Ensure students do not manually run generated scripts on their local hardware without strict containerization.",summary:"Evaluating LLM-generated code requires executing untrusted scripts, which creates security risks and execution instability when run on local machines or standard notebooks. To address this, students should be provided with a secure, isolated sandbox or containerized environment dedicated to safe code execution and benchmarking. This ensures functional correctness can be evaluated reliably without risking local hardware safety.",checklist_raw:`1.  Understand the Business Problem: Translate real-world user needs into a single bounded code generation task. Clearly define outputs, negative consequences of errors, learning objectives, and value-aligned metrics. Advance when stakeholders can articulate the problem, task scope, risks, limitations, and success metrics without using technical jargon.

2.  Environment Versioning & Security Gate: Inventory all datasets, schemas, credentials, and models with full provenance and access details. Set up and verify an isolated containerized sandbox to execute generated code safely, strictly prohibiting local execution. Record all runtime versions and fallbacks. Advance when assets are fully documented and the sandbox is operational.

3.  Data Acquisition & Profiling: Define the unit of analysis, target attributes, and source relationships. Freeze the ground-truth unit tests, dataset splits, and benchmark harness needed for pass@k evaluations while preventing data leakage during sampling. Advance when the team clearly understands how the raw records map to the target technical task.

4.  Exploratory Data Analysis: Analyze data shapes, missingness, code length, language distributions, and class balance to identify potential quality risks or train/test contamination. Separate observational trends from performance claims. Advance when EDA provides clear guidance for data cleaning, annotation requirements, and modeling strategies.

5.  Data Cleaning & Validation: Implement deterministic cleaning pipelines that preserve critical identifiers and provenance while normalizing variations. Audit missing values, anomalies, and synthetic data sources to ensure high quality. Freeze the clean corpus. Advance when diagnostic checks and manual sampling verify that the frozen dataset is completely reliable.

6.  Annotation & Benchmark Creation: Define unambiguous annotation guidelines and vet unit tests for thorough coverage. Annotate code tasks with expected behaviors, measure annotator agreement, and resolve discrepancies to build a gold benchmark. Advance when gold labels align with prediction targets and test sets are fully isolated from training data.

7.  Baseline Implementation: Create a transparent, simple rule-based or zero-shot baseline evaluated on static code datasets using semantic and structural metrics rather than live execution. Document error patterns and baseline limitations. Advance when the baseline operates reproducibly and establishes a clear performance floor for future iterative comparisons.

8.  Core Method Iteration: Introduce targeted algorithmic enhancements specifically to address failure modes identified in baseline error analysis. Keep datasets, evaluation protocols, and metrics strictly frozen while evaluating cost, latency, and performance improvements. Advance when advanced techniques provide clear, measurable value that justifies their additional complexity.

9.  Project-Specific Advanced Gates: Enforce strict execution constraints by evaluating generated code exclusively inside secure, isolated sandboxes. Assess functional correctness and pass@k metrics while blocking all local script execution. Advance when project-specific evaluation contracts are fully integrated, tested, and verified for safe execution.

10. End-to-End System Audit: Trace pipeline outputs back to source records and systematically categorize failures across pipeline stages. Audit edge cases, security requirements, rate limits, and fallback behavior, enforcing human review for critical outputs. Advance when subsystem error origins are clearly understood and residual risks are fully documented.

11. Rigorous Final Evaluation: Perform hyperparameter tuning, prompt engineering, and feature selection exclusively on training and development partitions. Keep test sets completely untouched until running the final evaluation once to generate reproducible metrics. Advance when evaluation results originate from a pristine test set with verified reproducibility.

12. Controlled Extension Development: Introduce agentic frameworks, fine-tuning, or multi-step orchestration only after the core system meets baseline goals. Benchmark stretch features against frozen non-agentic baselines to evaluate added cost, latency, and failure modes. Advance when measured improvements outweigh operational risks and fallback options remain available.

13. Reproducibility & Final Reporting: Archive all raw data manifests, seeds, environment versions, prompt templates, and evaluation notebooks. Clearly document system limitations, known failures, and deployment readiness to ensure complete workflow transparency. Advance when an external reviewer can independently reproduce all results and verify the operational pipeline.`,gates:[{num:1,title:"Understand the Business Problem",desc:"Translate real-world user needs into a single bounded code generation task. Clearly define outputs, negative consequences of errors, learning objectives, and value-aligned metrics. Advance when stakeholders can articulate the problem, task scope, risks, limitations, and success metrics without using"},{num:2,title:"Environment Versioning & Security Gate",desc:"Inventory all datasets, schemas, credentials, and models with full provenance and access details. Set up and verify an isolated containerized sandbox to execute generated code safely, strictly prohibiting local execution. Record all runtime versions and fallbacks. Advance when assets are fully docum"},{num:3,title:"Data Acquisition & Profiling",desc:"Define the unit of analysis, target attributes, and source relationships. Freeze the ground-truth unit tests, dataset splits, and benchmark harness needed for pass@k evaluations while preventing data leakage during sampling. Advance when the team clearly understands how the raw records map to the ta"},{num:4,title:"Exploratory Data Analysis",desc:"Analyze data shapes, missingness, code length, language distributions, and class balance to identify potential quality risks or train/test contamination. Separate observational trends from performance claims. Advance when EDA provides clear guidance for data cleaning, annotation requirements, and mo"},{num:5,title:"Data Cleaning & Validation",desc:"Implement deterministic cleaning pipelines that preserve critical identifiers and provenance while normalizing variations. Audit missing values, anomalies, and synthetic data sources to ensure high quality. Freeze the clean corpus. Advance when diagnostic checks and manual sampling verify that the f"},{num:6,title:"Annotation & Benchmark Creation",desc:"Define unambiguous annotation guidelines and vet unit tests for thorough coverage. Annotate code tasks with expected behaviors, measure annotator agreement, and resolve discrepancies to build a gold benchmark. Advance when gold labels align with prediction targets and test sets are fully isolated fr"},{num:7,title:"Baseline Implementation",desc:"Create a transparent, simple rule-based or zero-shot baseline evaluated on static code datasets using semantic and structural metrics rather than live execution. Document error patterns and baseline limitations. Advance when the baseline operates reproducibly and establishes a clear performance floo"},{num:8,title:"Core Method Iteration",desc:"Introduce targeted algorithmic enhancements specifically to address failure modes identified in baseline error analysis. Keep datasets, evaluation protocols, and metrics strictly frozen while evaluating cost, latency, and performance improvements. Advance when advanced techniques provide clear, meas"},{num:9,title:"Project-Specific Advanced Gates",desc:"Enforce strict execution constraints by evaluating generated code exclusively inside secure, isolated sandboxes. Assess functional correctness and pass@k metrics while blocking all local script execution. Advance when project-specific evaluation contracts are fully integrated, tested, and verified f"},{num:10,title:"End-to-End System Audit",desc:"Trace pipeline outputs back to source records and systematically categorize failures across pipeline stages. Audit edge cases, security requirements, rate limits, and fallback behavior, enforcing human review for critical outputs. Advance when subsystem error origins are clearly understood and resid"},{num:11,title:"Rigorous Final Evaluation",desc:"Perform hyperparameter tuning, prompt engineering, and feature selection exclusively on training and development partitions. Keep test sets completely untouched until running the final evaluation once to generate reproducible metrics. Advance when evaluation results originate from a pristine test se"},{num:12,title:"Controlled Extension Development",desc:"Introduce agentic frameworks, fine-tuning, or multi-step orchestration only after the core system meets baseline goals. Benchmark stretch features against frozen non-agentic baselines to evaluate added cost, latency, and failure modes. Advance when measured improvements outweigh operational risks an"},{num:13,title:"Reproducibility & Final Reporting",desc:"Archive all raw data manifests, seeds, environment versions, prompt templates, and evaluation notebooks. Clearly document system limitations, known failures, and deployment readiness to ensure complete workflow transparency. Advance when an external reviewer can independently reproduce all results a"}]},{id:"1020",title:"FaithfulMed: A Multi-Agent System for Faithful, Patient-Friendly Medical Explanations",org:"Google",advisor:"Sarita Anand Joshi",ml_type:"NLP, LLMs / Generative AI",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Cleaned and ready",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Build a multi-agent LLM architecture to produce patient-friendly medical explanations that are faithful to the source and address health-literacy gaps.",metrics:"≥80% of outputs at ≤8th-grade reading level; ≥85% faithfulness; hallucination rate <10%; ≥15% absolute improvement in faithfulness vs single-agent; Verifier agreement ≥80% with human labels (Cohen’s κ ≥ 0.6).",data_link:"MTSamples / Synthea / MedQuAD / PLABA",sep:"Foundations & Single-Agent Baseline: Onboard team (GitHub, Colab, free-tier Groq/Hugging Face APIs); EDA on MTSamples, MedQuAD, PLABA, and Synthea sample; define task spec, success rubric, and shared evaluation harness (Flesch-Kincaid, SMOG, jargon density, refusal rate); build single-LLM baseline on ~50 curated examples; each fellow selects one of the 5 agents to own end-to-end.",oct:"Multi-Agent Pipeline & Verifier Calibration: Implement Extractor Agent (structured clinical atoms); implement Simplifier Agent with RAG over MedlinePlus glossary; implement Verifier Agent (LLM-as-judge scoring faithfulness, omissions, additions, reading level); build 100-example human-annotated test set for calibration (target ≥80% agreement, Cohen's κ≥0.6); wire Refiner and Readability agents with bounded iteration limits; run multi-agent vs. baseline comparison across 3+ open models.",nov:"Ablations, Demo, & Deliverables: Conduct ablation studies (drop one agent at a time to measure metric impact); error analysis across clinical content types (lab values, drug names, procedures); build Hugging Face Spaces app demo showing per-agent traces and faithfulness scores; finalize GitHub repo, technical report (~10 pages), FaithfulMed leaderboard, ablation table, and presentation (optional arXiv paper draft).",bottleneck:"Orchestrating a cyclic 5-agent LLM state machine (Extractor, Simplifier, Verifier, Refiner, Readability) introduces severe risks of infinite execution loops and rapid API quota exhaustion. Bounded iteration limits are difficult to enforce and can crash the Colab runtime.",recommendation:"Scope the project down to a strictly linear, 3-agent Proof of Concept (Extractor -> Simplifier -> Verifier). Enforce reading-level constraints directly via RAG/prompting in the Simplifier to eliminate cyclic Refiner/Readability loops, ensuring a deterministic, forward-passing pipeline.",summary:"Orchestrating a complex cyclic 5-agent system risks infinite execution loops, API quota depletion, and environment crashes. To mitigate this, simplify the architecture into a linear, 3-agent pipeline consisting of an Extractor, Simplifier, and Verifier. Reading-level constraints should be handled directly within the Simplifier via prompt engineering to ensure a stable, deterministic flow without cyclic dependency risks.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of translating complex clinical transcripts into plain-English patient summaries for Google. Identify key stakeholders, workflows, and target users. Inputs include medical transcripts and MedlinePlus definitions; outputs are patient-friendly summaries at an 8th-grade reading level. Scope is restricted to translation support, excluding direct clinical diagnosis or triage.

2.  Environment Versioning & API Key Security: Record and lock baseline model versions, API rate limits, and secure secret-key management configurations for all selected LLM provider endpoints. Establish robust fallback procedures and mock API strategies to prevent pipeline disruption if primary service access is unexpectedly interrupted or restricted during development.

3.  PHI Masking & Ingestion Gate: Ingest the raw clinical text datasets and implement automated regex and NER de-identification pipelines. Verify that 100% of Protected Health Information (PHI) is completely stripped or masked before any source data is stored locally or transmitted to external LLM API service endpoints.

4.  Linguistic & Jargon Exploration Gate: Generate a comprehensive medical jargon-density profile across the raw patient transcript corpus. Validate that the MedlinePlus RAG retrieval index contains accurate, accessible plain-English definitions for at least 90% of the complex multi-syllabic medical terms identified throughout the target training datasets.

5.  Atom Extraction Validation Gate: Parse and extract key clinical facts, including primary diagnoses, active medications, dosages, and administration frequencies, into structured JSON formats. Enforce a strict Pydantic schema validation step to verify that the Extractor agent captures all essential medical information with 100% structural fidelity.

6.  Annotation Calibration Gate: Construct a human-annotated validation dataset consisting of 100 clinical examples. Have team members independently evaluate a shared subset of 20 simplified summaries to compute inter-annotator agreement via Cohen's kappa, targeting a score of 0.6 or higher to ensure statistical alignment.

7.  Single-Prompt Translation Baseline: Establish a minimal, single-prompt LLM simplification baseline without retrieval-augmented generation or secondary validation agents. Generate basic patient-friendly medical summaries using standardized baseline prompts to set the quantitative floor for subsequent multi-agent pipeline evaluation and benchmarking.

8.  Baseline Reading Grade Evaluation: Run the single-prompt baseline across the evaluation dataset to quantify initial performance metrics. Measure average Flesch-Kincaid reading levels, factual faithfulness, and critical clinical omission rates to formalize the quantitative performance baseline for the project.

9.  Core 3-Agent Upgrade: Upgrade the system architecture to a modular, three-agent sequential execution pipeline. Integrate an Extractor agent to parse clinical atoms, a Simplifier agent utilizing MedlinePlus RAG to construct plain-English narrative text, and a Verifier agent to evaluate factual precision.

10. Clinical Faithfulness Audit Gate: Deploy an automated evaluation harness to audit output quality on the development dataset. Require outputs to maintain an average reading level at or below the 8th grade, reach at least 85% clinical faithfulness, and present zero critical omissions of medication names or dosages.

11. Pipeline Stage Auditing & Error Breakdown: Perform a systematic error audit across all generated summaries to diagnose failures. Categorize errors into distinct operational failure modes, including entity extraction mistakes, simplification grammatical errors, context loss during RAG retrieval, or inaccurate Verifier quality ratings.

12. Out-of-Sample Evaluation Pass: Conduct all prompt engineering, parameter tuning, and pipeline modifications exclusively on the training partition. Once configuration is finalized, execute the evaluation suite exactly once against the isolated, untouched test dataset reserved during initial data partitioning.

13. Cyclic Readability Refiner Loop: Following successful linear pipeline execution, optionally implement a cyclic Refiner-Verifier loop to iteratively revise simplified text. Enforce a strict execution limit of two iterations per block to prevent infinite execution loops, Google Colab runtime crashes, and unnecessary API quota usage.

14. Reproducibility & Limitation Disclaimers: Publish a clean, reproducible GitHub repository containing runnable notebooks, user interface code, and technical documentation. Incorporate explicit disclaimers across the UI dashboard clarifying that the tool is an educational research prototype and must not replace clinical evaluation.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of translating complex clinical transcripts into plain-English patient summaries for Google. Identify key stakeholders, workflows, and target users. Inputs include medical transcripts and MedlinePlus definitions; outputs are patient-friendly summaries at an 8th-grade reading "},{num:2,title:"Environment Versioning & API Key Security",desc:"Record and lock baseline model versions, API rate limits, and secure secret-key management configurations for all selected LLM provider endpoints. Establish robust fallback procedures and mock API strategies to prevent pipeline disruption if primary service access is unexpectedly interrupted or rest"},{num:3,title:"PHI Masking & Ingestion Gate",desc:"Ingest the raw clinical text datasets and implement automated regex and NER de-identification pipelines. Verify that 100% of Protected Health Information (PHI) is completely stripped or masked before any source data is stored locally or transmitted to external LLM API service endpoints."},{num:4,title:"Linguistic & Jargon Exploration Gate",desc:"Generate a comprehensive medical jargon-density profile across the raw patient transcript corpus. Validate that the MedlinePlus RAG retrieval index contains accurate, accessible plain-English definitions for at least 90% of the complex multi-syllabic medical terms identified throughout the target tr"},{num:5,title:"Atom Extraction Validation Gate",desc:"Parse and extract key clinical facts, including primary diagnoses, active medications, dosages, and administration frequencies, into structured JSON formats. Enforce a strict Pydantic schema validation step to verify that the Extractor agent captures all essential medical information with 100% struc"},{num:6,title:"Annotation Calibration Gate",desc:"Construct a human-annotated validation dataset consisting of 100 clinical examples. Have team members independently evaluate a shared subset of 20 simplified summaries to compute inter-annotator agreement via Cohen's kappa, targeting a score of 0.6 or higher to ensure statistical alignment."},{num:7,title:"Single-Prompt Translation Baseline",desc:"Establish a minimal, single-prompt LLM simplification baseline without retrieval-augmented generation or secondary validation agents. Generate basic patient-friendly medical summaries using standardized baseline prompts to set the quantitative floor for subsequent multi-agent pipeline evaluation and"},{num:8,title:"Baseline Reading Grade Evaluation",desc:"Run the single-prompt baseline across the evaluation dataset to quantify initial performance metrics. Measure average Flesch-Kincaid reading levels, factual faithfulness, and critical clinical omission rates to formalize the quantitative performance baseline for the project."},{num:9,title:"Core 3-Agent Upgrade",desc:"Upgrade the system architecture to a modular, three-agent sequential execution pipeline. Integrate an Extractor agent to parse clinical atoms, a Simplifier agent utilizing MedlinePlus RAG to construct plain-English narrative text, and a Verifier agent to evaluate factual precision."},{num:10,title:"Clinical Faithfulness Audit Gate",desc:"Deploy an automated evaluation harness to audit output quality on the development dataset. Require outputs to maintain an average reading level at or below the 8th grade, reach at least 85% clinical faithfulness, and present zero critical omissions of medication names or dosages."},{num:11,title:"Pipeline Stage Auditing & Error Breakdown",desc:"Perform a systematic error audit across all generated summaries to diagnose failures. Categorize errors into distinct operational failure modes, including entity extraction mistakes, simplification grammatical errors, context loss during RAG retrieval, or inaccurate Verifier quality ratings."},{num:12,title:"Out-of-Sample Evaluation Pass",desc:"Conduct all prompt engineering, parameter tuning, and pipeline modifications exclusively on the training partition. Once configuration is finalized, execute the evaluation suite exactly once against the isolated, untouched test dataset reserved during initial data partitioning."},{num:13,title:"Cyclic Readability Refiner Loop",desc:"Following successful linear pipeline execution, optionally implement a cyclic Refiner-Verifier loop to iteratively revise simplified text. Enforce a strict execution limit of two iterations per block to prevent infinite execution loops, Google Colab runtime crashes, and unnecessary API quota usage."},{num:14,title:"Reproducibility & Limitation Disclaimers",desc:"Publish a clean, reproducible GitHub repository containing runnable notebooks, user interface code, and technical documentation. Incorporate explicit disclaimers across the UI dashboard clarifying that the tool is an educational research prototype and must not replace clinical evaluation."}]},{id:"1021",title:"Dynamic Nutrition Orchestrator",org:"Nutrition",advisor:"FNU Sakshi",ml_type:"NLP, Agentic AI; Multi-modal (vision) — December stretch only",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Tool-Augmented GenAI system to optimize meal plans with strict macro constraints by scaling ingredients.",metrics:"MAE < 2% across a full 7-day generation cycle; Entity Resolution F1 >90% on an unseen validation set; 100% compliance with zero-repeat ingredient logic across any consecutive 48-hour block; Zero arithmetic hallucinations (all nutrient math executed via deterministic Python helper scripts / enforced Pydantic contracts).",data_link:"USDA FoodData Central API",sep:'Data Pipelines, API Architecture, & Entity Resolution: Ingest unstructured recipe JSON/CSV "Cookbook"; write Pydantic schemas to validate data structures and isolate ingredient strings; implement asynchronous REST API wrappers for USDA FoodData Central database (rate-limiting, auth, error-handling); build baseline Entity Resolution module (tokenization, TF-IDF / sentence-transformers) to match recipe ingredients to federal FDC IDs.',oct:"Deterministic Calculation Engines & Multi-Agent Orchestration: Implement core multi-agent framework (LangGraph / CrewAI) with state management between Planner Agent (recipe selection) and Auditor Agent (API lookup); develop Python-native deterministic math solver parsing 100g nutrient vectors from USDA to solve exact gram quantities (e.g., paneer, soya); build internal evaluation logging scripts computing MAE between LLM initial guess and USDA-computed requirements.",nov:'Contextual Guardrails, Multi-Variable Optimization, & MVP Deployment: Program LLM "Culinary Safe Envelopes" to prevent unpalatable volume recommendations (e.g., stopping solver from suggesting 150g dry soya granules in one meal); fine-tune dynamic instructional rewriting merging calculated weights into cooking steps; run integration tests maintaining <2% MAE across 7-day generation cycle with zero-repeat ingredient rules; deploy Streamlit/Gradio web prototype.',bottleneck:"Relying on probabilistic LLMs to perform strict nutritional arithmetic consistently leads to severe mathematical hallucinations. Furthermore, building asynchronous REST API wrappers for the live USDA database introduces significant software engineering friction for early-career students.",recommendation:"Firewall the Vision LLM (image-to-text) component as a strict December stretch goal. Mandate the use of deterministic Python math solvers (enforced by Pydantic schemas) to override the LLM's arithmetic, and provide pre-built USDA API wrapper scripts to eliminate backend engineering debt.",summary:"Relying on LLMs for nutritional arithmetic causes severe mathematical hallucinations, while building live API wrappers creates heavy engineering friction. To address these issues, developers should enforce deterministic Python math solvers via Pydantic schemas to override LLM calculations. Additionally, providing pre-built USDA API wrappers and shifting Vision LLM features to stretch goals will keep the focus on core meal optimization.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of optimizing multi-variable meal plans and scaling recipe weights under strict dietary constraints without arithmetic hallucinations or unpalatable volume suggestions. Identify key stakeholders, target users, operational workflows, inputs, outputs, scope boundaries, and major operational risks.
2.  Environment Versioning & API Key Security: Verify the Google Colab environment and ensure Python optimization libraries (scipy or pulp) are installed and fully functional. Securely configure USDA API keys using Colab Secrets to prevent unauthorized credential exposure.
3.  Dataset Splitting Gate: Divide the Cookbook recipe database, reserving exactly 10 recipe templates as an isolated evaluation partition. This tests the generalizability of ingredient-resolution and scaling models without exposing training data or cached lookups.
4.  Ingredient String Inspection Gate: Extract a unique list of ingredients from training recipe templates to generate an audit report detailing spelling variations, non-standard volumetric shorthand, and a conversion table mapping volumetric placeholders to deterministic baseline gram weights.
5.  Caching & Offline Resolution Gate: Build a local SQLite or JSON cache to store nutrient vectors per 100g of mapped ingredients. Enforce a strict zero-live-network-request policy during cross-validation loops to prevent USDA API rate limiting.
6.  Ingestion & Pydantic Schema Enforcement: Write and enforce strict Pydantic models to clean and validate incoming raw recipe data. Ensure malformed JSON records or recipes lacking structured ingredient strings are programmatically caught and normalized.
7.  Naive LLM Guessing Baseline: Construct a simple RAG baseline where a single LLM prompt receives the recipe and target macros to estimate scaled weights directly in text, establishing a quantitative performance floor for comparison.
8.  Baseline Arithmetic MAE Evaluation: Benchmark the naive baseline against the Arithmetic MAE Test Suite. Calculate the Mean Absolute Error between LLM estimations and mathematically correct weights to document the frequency of LLM arithmetic hallucinations.
9.  Core Hybrid Multi-Agent + Solver Upgrade: Build the hybrid system containing a Planner Agent for recipe selection, an Auditor Agent to map ingredient strings to USDA FDC IDs, and a Nutrient Solver using SciPy or PuLP linear programming.
10. Culinary Safe Envelope Vetting Gate: Implement a deterministic Pydantic validator to inspect and flag scaled ingredient outputs violating palatability constraints, preventing mathematically correct but culinary unfeasible combinations like excessive spice or salt quantities.
11. Pipeline Stage Auditing & Error Breakdown: Perform a systematic audit across all pipeline stages to determine whether system failures stem from entity resolution errors, mathematical optimization unfeasibility, or instructional merge issues.
12. Out-of-Sample Evaluation Pass: Conduct all hyperparameter tuning, similarity thresholding, and boundary constraint adjustments strictly on the training partition. Run final end-to-end evaluation exactly once against the 10 isolated evaluation recipe templates.
13. Vision-Based Pantry Extraction: Once the core math solver and RAG pipeline achieve full stability, explore Vision LLMs (such as GPT-4o-mini) to parse ingredient inventories from user-uploaded fridge or pantry images as a stretch goal.
14. Reproducibility & Limitation Disclaimers: Deliver a complete GitHub repository containing notebooks, the Streamlit interface, and a technical report. Prominently display a disclaimer stating the system is educational and not a replacement for clinical review.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of optimizing multi-variable meal plans and scaling recipe weights under strict dietary constraints without arithmetic hallucinations or unpalatable volume suggestions. Identify key stakeholders, target users, operational workflows, inputs, outputs, scope boundaries, and majo"},{num:2,title:"Environment Versioning & API Key Security",desc:"Verify the Google Colab environment and ensure Python optimization libraries (scipy or pulp) are installed and fully functional. Securely configure USDA API keys using Colab Secrets to prevent unauthorized credential exposure."},{num:3,title:"Dataset Splitting Gate",desc:"Divide the Cookbook recipe database, reserving exactly 10 recipe templates as an isolated evaluation partition. This tests the generalizability of ingredient-resolution and scaling models without exposing training data or cached lookups."},{num:4,title:"Ingredient String Inspection Gate",desc:"Extract a unique list of ingredients from training recipe templates to generate an audit report detailing spelling variations, non-standard volumetric shorthand, and a conversion table mapping volumetric placeholders to deterministic baseline gram weights."},{num:5,title:"Caching & Offline Resolution Gate",desc:"Build a local SQLite or JSON cache to store nutrient vectors per 100g of mapped ingredients. Enforce a strict zero-live-network-request policy during cross-validation loops to prevent USDA API rate limiting."},{num:6,title:"Ingestion & Pydantic Schema Enforcement",desc:"Write and enforce strict Pydantic models to clean and validate incoming raw recipe data. Ensure malformed JSON records or recipes lacking structured ingredient strings are programmatically caught and normalized."},{num:7,title:"Naive LLM Guessing Baseline",desc:"Construct a simple RAG baseline where a single LLM prompt receives the recipe and target macros to estimate scaled weights directly in text, establishing a quantitative performance floor for comparison."},{num:8,title:"Baseline Arithmetic MAE Evaluation",desc:"Benchmark the naive baseline against the Arithmetic MAE Test Suite. Calculate the Mean Absolute Error between LLM estimations and mathematically correct weights to document the frequency of LLM arithmetic hallucinations."},{num:9,title:"Core Hybrid Multi-Agent + Solver Upgrade",desc:"Build the hybrid system containing a Planner Agent for recipe selection, an Auditor Agent to map ingredient strings to USDA FDC IDs, and a Nutrient Solver using SciPy or PuLP linear programming."},{num:10,title:"Culinary Safe Envelope Vetting Gate",desc:"Implement a deterministic Pydantic validator to inspect and flag scaled ingredient outputs violating palatability constraints, preventing mathematically correct but culinary unfeasible combinations like excessive spice or salt quantities."},{num:11,title:"Pipeline Stage Auditing & Error Breakdown",desc:"Perform a systematic audit across all pipeline stages to determine whether system failures stem from entity resolution errors, mathematical optimization unfeasibility, or instructional merge issues."},{num:12,title:"Out-of-Sample Evaluation Pass",desc:"Conduct all hyperparameter tuning, similarity thresholding, and boundary constraint adjustments strictly on the training partition. Run final end-to-end evaluation exactly once against the 10 isolated evaluation recipe templates."},{num:13,title:"Vision-Based Pantry Extraction",desc:"Once the core math solver and RAG pipeline achieve full stability, explore Vision LLMs (such as GPT-4o-mini) to parse ingredient inventories from user-uploaded fridge or pantry images as a stretch goal."},{num:14,title:"Reproducibility & Limitation Disclaimers",desc:"Deliver a complete GitHub repository containing notebooks, the Streamlit interface, and a technical report. Prominently display a disclaimer stating the system is educational and not a replacement for clinical review."}]},{id:"1022",title:"AI Research Intelligence Agent for Business Insight Translation",org:"KPMG",advisor:"Abhinav Raghunathan, Allison Tatterson, AJ Jeter, Christopher Jambor, Lauren Fang, Kevin Koss",ml_type:"NLP, LLMs / Generative AI, Transfer Learning",evaluation:"Minor edits needed",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Build RAG agent that retrieves AI research, summarizes, and translates findings into business insights.",metrics:"Retrieval relevance, summary quality, business usefulness/actionability of insights as judged by stakeholders, human-in-the-loop validation.",data_link:"https://arxiv.org/",sep:"Data exploration and preprocessing; define evaluation framework and benchmark queries; develop baseline retrieval pipeline (RAG setup).",oct:"Implement the retrieval + summarization pipeline; develop a prompt-engineering approach for business translation; begin evaluation (relevance and accuracy testing).",nov:"Refine model outputs and improve ranking/relevance; build a lightweight user interface or interaction layer; document the solution and prepare the final presentation.",bottleneck:"Extracting data from complex, dense academic PDFs (ArXiv) using standard Retrieval-Augmented Generation (RAG) often results in poor semantic chunking, leading to lost context and degraded summary quality when synthesizing technical AI research.",recommendation:"The project is highly rigorous and well-scoped. Advise the students to research and implement advanced semantic chunking strategies (e.g., recursive character splitting or layout-aware parsing) to optimize the PDF extraction phase before building the human-in-the-loop evaluation checkpoint.",summary:"Extracting dense technical content from ArXiv PDFs using basic RAG chunking often leads to context loss and degraded summary quality. To mitigate this issue, students should implement advanced semantic chunking strategies, such as recursive character splitting or layout-aware parsing, during the PDF extraction phase. Refining this ingestion pipeline early ensures higher accuracy before establishing the human-in-the-loop evaluation process.",checklist_raw:`1.  Understand the Business Problem: Define the core task of extracting dense AI research from ArXiv PDFs to generate actionable business insights. Identify users, workflows, decisions, and risks like hallucinations or missing evidence. Establish metrics for retrieval relevance, summary quality, and business usefulness.

2.  Environment & Asset Verification: Inventory all ArXiv PDFs, API keys, credentials, models, and runtime environments. Log file versions, licenses, and access paths while locking dependencies. Ensure secure API key management and set up preflight checks with fallbacks for robust processing.

3.  Data Acquisition & Profiling: Define the target units, identifiers, and metadata for ArXiv papers. Establish a leakage-free, reproducible sampling plan that respects environment limits. Freeze an uncleaned snapshot of the raw data manifest to serve as a reliable baseline before processing.

4.  Exploratory Data Analysis: Analyze PDF structural layout, text lengths, mathematical notation, missing values, and potential extraction artifacts. Use EDA findings to evaluate data-quality risks, understand document boundaries, and design an effective cleaning and semantic chunking strategy for complex technical content.

5.  Data Parsing & Chunking: Implement deterministic PDF parsing to extract clean text while preserving document provenance and structural formatting. Apply advanced semantic chunking strategies like recursive character splitting. Manually audit representative chunk boundaries to ensure quality before freezing the processed dataset.

6.  Gold Benchmark Design: Formulate benchmark queries and establish human-reviewed annotation rubrics for retrieval relevance, summary quality, and business utility. Define clear guidelines for positive, negative, and edge cases. Pilot the rubric, resolve label ambiguities, and isolate the final test set.

7.  Transparent Baseline Setup: Build a lightweight lexical or semantic retrieval baseline (e.g., standard RAG) without complex tuning. Evaluate baseline performance using task-aligned metrics like Recall@K against the benchmark queries, establishing a quantitative performance floor and documenting initial system limitations.

8.  Core Method Enhancement: Develop the full retrieval and summarization pipeline with business-focused prompt engineering to fix baseline failure modes. Keep evaluation metrics, data splits, and test labels strictly frozen. Compare latency, output quality, and computational cost directly against the baseline model.

9.  Project-Specific Advanced Gates: Implement rigorous evaluation gates measuring summary groundedness, retrieval precision, and business actionability as assessed by stakeholders. Require independent evaluation of the retrieval step from generation quality and maintain logs of human-in-the-loop feedback for continuous auditing.

10. End-to-End System Validation: Trace generated insights directly back to source PDF chunks to verify factual accuracy. Categorize pipeline failures into parsing, retrieval, or summarization errors. Test system resilience against API rate limits and invalid inputs, enforcing human review for critical outputs.

11. Isolated Final Evaluation: Perform all hyperparameter, prompt, and chunk-size tuning exclusively on development data. Freeze the finalized RAG pipeline before running a single, non-iterative evaluation against the isolated benchmark dataset to generate reproducible, uncompromised test metrics.

12. Controlled Extension Integration: Gate advanced stretch features—such as multi-source synthesis, newsletter generation, or custom user interfaces—until the core RAG system is fully validated. Measure any added complexity, API costs, or latency against the frozen core baseline before adoption.

13. Reproducibility & Final Reporting: Archive data manifests, environment configurations, prompt versions, evaluation scripts, and workflow diagrams. Document known system limitations, failure taxonomies, and operational risks clearly to ensure another coach can reproduce all findings and verify readiness.`,gates:[{num:1,title:"Understand the Business Problem",desc:"Define the core task of extracting dense AI research from ArXiv PDFs to generate actionable business insights. Identify users, workflows, decisions, and risks like hallucinations or missing evidence. Establish metrics for retrieval relevance, summary quality, and business usefulness."},{num:2,title:"Environment & Asset Verification",desc:"Inventory all ArXiv PDFs, API keys, credentials, models, and runtime environments. Log file versions, licenses, and access paths while locking dependencies. Ensure secure API key management and set up preflight checks with fallbacks for robust processing."},{num:3,title:"Data Acquisition & Profiling",desc:"Define the target units, identifiers, and metadata for ArXiv papers. Establish a leakage-free, reproducible sampling plan that respects environment limits. Freeze an uncleaned snapshot of the raw data manifest to serve as a reliable baseline before processing."},{num:4,title:"Exploratory Data Analysis",desc:"Analyze PDF structural layout, text lengths, mathematical notation, missing values, and potential extraction artifacts. Use EDA findings to evaluate data-quality risks, understand document boundaries, and design an effective cleaning and semantic chunking strategy for complex technical content."},{num:5,title:"Data Parsing & Chunking",desc:"Implement deterministic PDF parsing to extract clean text while preserving document provenance and structural formatting. Apply advanced semantic chunking strategies like recursive character splitting. Manually audit representative chunk boundaries to ensure quality before freezing the processed dat"},{num:6,title:"Gold Benchmark Design",desc:"Formulate benchmark queries and establish human-reviewed annotation rubrics for retrieval relevance, summary quality, and business utility. Define clear guidelines for positive, negative, and edge cases. Pilot the rubric, resolve label ambiguities, and isolate the final test set."},{num:7,title:"Transparent Baseline Setup",desc:"Build a lightweight lexical or semantic retrieval baseline (e.g., standard RAG) without complex tuning. Evaluate baseline performance using task-aligned metrics like Recall@K against the benchmark queries, establishing a quantitative performance floor and documenting initial system limitations."},{num:8,title:"Core Method Enhancement",desc:"Develop the full retrieval and summarization pipeline with business-focused prompt engineering to fix baseline failure modes. Keep evaluation metrics, data splits, and test labels strictly frozen. Compare latency, output quality, and computational cost directly against the baseline model."},{num:9,title:"Project-Specific Advanced Gates",desc:"Implement rigorous evaluation gates measuring summary groundedness, retrieval precision, and business actionability as assessed by stakeholders. Require independent evaluation of the retrieval step from generation quality and maintain logs of human-in-the-loop feedback for continuous auditing."},{num:10,title:"End-to-End System Validation",desc:"Trace generated insights directly back to source PDF chunks to verify factual accuracy. Categorize pipeline failures into parsing, retrieval, or summarization errors. Test system resilience against API rate limits and invalid inputs, enforcing human review for critical outputs."},{num:11,title:"Isolated Final Evaluation",desc:"Perform all hyperparameter, prompt, and chunk-size tuning exclusively on development data. Freeze the finalized RAG pipeline before running a single, non-iterative evaluation against the isolated benchmark dataset to generate reproducible, uncompromised test metrics."},{num:12,title:"Controlled Extension Integration",desc:"Gate advanced stretch features—such as multi-source synthesis, newsletter generation, or custom user interfaces—until the core RAG system is fully validated. Measure any added complexity, API costs, or latency against the frozen core baseline before adoption."},{num:13,title:"Reproducibility & Final Reporting",desc:"Archive data manifests, environment configurations, prompt versions, evaluation scripts, and workflow diagrams. Document known system limitations, failure taxonomies, and operational risks clearly to ensure another coach can reproduce all findings and verify readiness."}]},{id:"1033",title:"Vision LLM-Powered PDF Extraction Pipeline",org:"PIMCO",advisor:"Simon Fan",ml_type:"Vision LLM, NLP",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"Computer Vision",objective:"Extract data from complex financial PDFs using Vision LLMs and benchmark vs enterprise tools.",metrics:"Benchmark extraction accuracy, cost, and speed versus Azure Document Intelligence and Docling using ground-truth comparisons on a down-sampled evaluation set.",data_link:"SEC EDGAR",sep:"Build the document triage module to classify incoming PDF page complexity (simple text vs. complex multi-column tables/charts).",oct:"Develop the core Vision-Language Model (VLM) extraction pipeline to parse page images directly into structured JSON schemas.",nov:"Build an automated benchmark evaluation suite comparing extraction fidelity and cost against commercial engines (Azure Document Intelligence, Docling); deploy an interactive Streamlit demo UI.",bottleneck:"Multi-modal Vision LLM parsing of complex financial PDFs (stitching cross-page tables and charts) consumes massive token volumes and requires highly complex parsing logic. API costs and rate limits will severely bottleneck development if entire prospectuses are processed at once.",recommendation:"Aggressively down-sample the PDF evaluation sets. Instruct the team to focus entirely on localized, single-page extractions to validate the pipeline before attempting complex cross-page DataFrame stitching logic, thereby preserving token quotas.",summary:"Parsing complex financial PDFs with multi-modal Vision LLMs risks severe API cost and rate-limit bottlenecks due to high token consumption from multi-page documents. To address this, the team should aggressively down-sample evaluation sets and focus on localized, single-page extractions first. Validating the baseline pipeline on single pages before attempting complex cross-page table stitching preserves token quotas and ensures steady progress.",checklist_raw:`1.  Business and Project Understanding: Define the core extraction decision and rescope project boundaries strictly to single-page financial PDFs. Identify target business users, workflows, JSON schema outputs, and abstention rules. Establish clear success metrics, including field-level precision, recall, F1-score, processing latency, and per-page API costs.

2.  Environment and Source Verification: Confirm access to source PDF files, environment dependencies, and necessary optical character recognition libraries. Securely configure Vision LLM API access alongside Azure Document Intelligence credentials with active rate limits, budget caps, and secret management to prevent quota exhaustion.

3.  Data Acquisition and Sampling: Curate a diverse evaluation sample of single-page PDFs containing complex financial layouts, multi-column text, dense numerical tables, and embedded charts. Ensure the sampled dataset adequately covers structural variability to benchmark downstream extraction performance reliably.

4.  PDF and Image EDA: Conduct exploratory data analysis on rendered document page images. Evaluate visual complexity, rendering resolution, structural layout variations, alignment issues, and potential visual artifacts that could impact downstream Vision LLM parsing and OCR accuracy.

5.  Input Parsing and Standardized Validation: Build a deterministic pipeline to render PDF pages into images while preserving strict document provenance. Validate image rendering quality, orientation, duplicate pages, and text coverage. Manually audit sample outputs to ensure inputs are clean, traceable, and frozen for evaluation.

6.  Field Schema and Gold Label Annotation: Define a strict, standardized JSON target schema for extracted financial data. Manually annotate the curated single-page evaluation set to establish a gold-standard ground truth dataset for objective model benchmarking and field-level validation.

7.  Baseline OCR and Text Extraction Setup: Build a transparent baseline using traditional OCR and text extraction techniques like PyMuPDF or Tesseract. Map raw extracted text directly to the target JSON schema to measure baseline accuracy and quantify structural layout failure modes.

8.  Vision LLM Extraction Implementation: Implement the advanced Vision-Language Model extraction pipeline using multi-modal prompts. Guide the VLM to interpret visual layouts, parse key-value pairs, and extract complex tabular structures directly into the defined JSON schema format.

9.  Project-Specific Evaluation and Comparison: Benchmarking the Vision LLM outputs against the gold-standard ground truth. Calculate field-level accuracy, precision, recall, and invalid JSON output rates. Compare extraction performance, per-page cost, and speed against traditional OCR baselines and Azure Document Intelligence.

10. End-to-End Failure Mode Analysis: Categorize pipeline failures, including OCR rendering loss, hallucinated values, schema formatting errors, and model refusals. Trace root causes across visual layout types, audit extracted values against source regions, and establish human-in-the-loop fallback procedures for low-confidence fields.

11. User Interface and Automated Benchmarking: Develop a lightweight interactive Streamlit demo interface to display extracted PDF fields alongside document page previews. Implement automated testing scripts to continuously evaluate model extraction performance against the benchmark suite.

12. Reproducibility and Responsible Project Finalization: Publish a fully reproducible GitHub repository containing modular extraction scripts, evaluation pipelines, versioned schemas, and a comprehensive README. Document clear operational constraints, API costs, latency tradeoffs, and hallucination risks associated with Vision LLM extraction.`,gates:[{num:1,title:"Business and Project Understanding",desc:"Define the core extraction decision and rescope project boundaries strictly to single-page financial PDFs. Identify target business users, workflows, JSON schema outputs, and abstention rules. Establish clear success metrics, including field-level precision, recall, F1-score, processing latency, and"},{num:2,title:"Environment and Source Verification",desc:"Confirm access to source PDF files, environment dependencies, and necessary optical character recognition libraries. Securely configure Vision LLM API access alongside Azure Document Intelligence credentials with active rate limits, budget caps, and secret management to prevent quota exhaustion."},{num:3,title:"Data Acquisition and Sampling",desc:"Curate a diverse evaluation sample of single-page PDFs containing complex financial layouts, multi-column text, dense numerical tables, and embedded charts. Ensure the sampled dataset adequately covers structural variability to benchmark downstream extraction performance reliably."},{num:4,title:"PDF and Image EDA",desc:"Conduct exploratory data analysis on rendered document page images. Evaluate visual complexity, rendering resolution, structural layout variations, alignment issues, and potential visual artifacts that could impact downstream Vision LLM parsing and OCR accuracy."},{num:5,title:"Input Parsing and Standardized Validation",desc:"Build a deterministic pipeline to render PDF pages into images while preserving strict document provenance. Validate image rendering quality, orientation, duplicate pages, and text coverage. Manually audit sample outputs to ensure inputs are clean, traceable, and frozen for evaluation."},{num:6,title:"Field Schema and Gold Label Annotation",desc:"Define a strict, standardized JSON target schema for extracted financial data. Manually annotate the curated single-page evaluation set to establish a gold-standard ground truth dataset for objective model benchmarking and field-level validation."},{num:7,title:"Baseline OCR and Text Extraction Setup",desc:"Build a transparent baseline using traditional OCR and text extraction techniques like PyMuPDF or Tesseract. Map raw extracted text directly to the target JSON schema to measure baseline accuracy and quantify structural layout failure modes."},{num:8,title:"Vision LLM Extraction Implementation",desc:"Implement the advanced Vision-Language Model extraction pipeline using multi-modal prompts. Guide the VLM to interpret visual layouts, parse key-value pairs, and extract complex tabular structures directly into the defined JSON schema format."},{num:9,title:"Project-Specific Evaluation and Comparison",desc:"Benchmarking the Vision LLM outputs against the gold-standard ground truth. Calculate field-level accuracy, precision, recall, and invalid JSON output rates. Compare extraction performance, per-page cost, and speed against traditional OCR baselines and Azure Document Intelligence."},{num:10,title:"End-to-End Failure Mode Analysis",desc:"Categorize pipeline failures, including OCR rendering loss, hallucinated values, schema formatting errors, and model refusals. Trace root causes across visual layout types, audit extracted values against source regions, and establish human-in-the-loop fallback procedures for low-confidence fields."},{num:11,title:"User Interface and Automated Benchmarking",desc:"Develop a lightweight interactive Streamlit demo interface to display extracted PDF fields alongside document page previews. Implement automated testing scripts to continuously evaluate model extraction performance against the benchmark suite."},{num:12,title:"Reproducibility and Responsible Project Finalization",desc:"Publish a fully reproducible GitHub repository containing modular extraction scripts, evaluation pipelines, versioned schemas, and a comprehensive README. Document clear operational constraints, API costs, latency tradeoffs, and hallucination risks associated with Vision LLM extraction."}]},{id:"1034",title:"AI Due Diligence Agent for ABS Prospectuses",org:"PIMCO",advisor:"Simon Fan, Ji Zhang",ml_type:"Agentic AI, RAG, LLMs",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"High - senior coach required",domain:"NLP / LLMs",objective:"Autonomous agent that conducts DD on ABS prospectuses via planning, retrieval, and reasoning.",metrics:"Coverage and answer accuracy measured on the 30 hand‑crafted Q&A evaluation set; distribution of self‑evaluation labels (Complete / Partial / Not Found) and associated confidence scores; citation accuracy in auto‑generated PDF (correct quoted evidence + page citation) and overall report completeness.",data_link:"SEC EDGAR",sep:"Define structured Due Diligence (DD) question schema in YAML/JSON; construct document ingestion and semantic chunking pipelines for SEC EDGAR 424B filings; draft the 30 hand‑crafted Q&A evaluation set against the chosen prospectus.",oct:"Implement a non‑agentic RAG baseline (retriever + LLM prompt templates) to answer the DD schema questions with citation snippets; build a deterministic PDF report generator and tests; iterate using the 30‑Q&A set. Optionally begin designing the LangGraph Planner→Retriever→Reasoner topology for Phase 2.",nov:"Finalize automated structured PDF report generation summarizing deal findings; wrap the system in a Streamlit demo interface; run end‑to‑end evaluation using the 30 hand‑crafted Q&A set, recording answer accuracy and evaluator outputs (Complete / Partial / Not Found with confidence). Optionally implement the LangGraph multi‑node agent and re‑run evaluations as a stretch.",bottleneck:"Developing a multi-node state machine (Planner -> Retriever -> Reasoner -> Evaluator) using LangGraph introduces advanced orchestration complexities. Students must rigorously handle state passing and self-evaluation confidence scoring to prevent the agent from infinitely looping on missing data.",recommendation:"Start with a non‑agentic RAG + deterministic reporter baseline before attempting LangGraph. Define Pydantic schemas for structured outputs early so Reasoner/Evaluator have deterministic completion criteria. Create the 30 hand‑crafted Q&A evaluation set early and use it for iterative testing and acceptance criteria.",summary:"Developing a multi-node LangGraph state machine introduces significant orchestration complexity, requiring careful state management and self-evaluation scoring to avoid infinite loops on missing data. To mitigate this risk, teams should start with a non-agentic RAG baseline and define structured Pydantic schemas early. Additionally, establishing the 30-item Q&A evaluation dataset upfront will enable consistent iterative testing and clear acceptance criteria.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the real-world problem of conducting due diligence on ABS prospectuses for PIMCO. Translate business needs into a non-agentic RAG baseline that answers the DD schema using citation snippets and generates deterministic PDF reports. Establish project parameters, target users, and risk mitigations for bad recommendations. Evaluate performance using coverage, answer accuracy, citation accuracy, and report completeness without relying on model jargon.

2.  Environment & Asset Verification: Inventory all datasets, SEC EDGAR 424B PDFs, YAML/JSON DD schemas, and the 30-item Q\\&A evaluation set. Log file names, versions, hashes, credentials, and access restrictions to ensure asset provenance and security. Establish baseline Python packages and model runtimes while implementing safe fallback checks. Advance when every technical dependency, computational resource, and data asset has an assigned owner, clear validation result, and detailed version record.

3.  Data Profiling & Sampling: Define the fundamental unit of analysis, features, and source relationships for SEC EDGAR 424B filings. Ensure the dataset accurately reflects the broader prospectus document universe. Implement a reproducible sampling strategy to prevent data leakage during aggregation and filtering. Freeze a raw snapshot manifest before preprocessing so the project team clearly understands how document chunks map directly to target tasks.

4.  Exploratory Data Analysis (EDA): Examine SEC EDGAR 424B document structures, text lengths, page quality, and unique identifiers. Identify parsing artifacts, duplicate entries, and missing values across representative filings. Document key visual patterns while strictly separating factual observations from causal claims. Use initial exploratory findings to uncover critical data-quality risks, guide clean text extraction, and establish an effective document semantic chunking strategy.

5.  Data Parsing & Normalization: Build robust document ingestion and semantic chunking pipelines tailored to SEC EDGAR filings while preserving section metadata and page provenance. Normalize unstructured text to eliminate extraction artifacts and resolve boundary errors. Audit representative output samples manually to verify content integrity. Freeze the validated text corpus once diagnostic checks confirm the dataset is clean, properly formatted, and fully reliable for modeling.

6.  Gold Benchmark Construction: Construct the 30 hand-crafted Q\\&A evaluation set against selected prospectuses. Establish clear label taxonomies (Complete, Partial, Not Found) alongside confidence scoring rubrics and evidence requirements. Pilot the rubric on sample questions, resolve ambiguity, and audit class balance across difficult edge cases. Freeze isolated training and testing splits prior to model tuning to ensure unbiased evaluation across all developmental iterations.

7.  Transparent Baseline Implementation: Develop a non-agentic RAG baseline combining document retrieval with prompt templates to answer the DD schema. Build automated unit tests and a deterministic PDF report generator. Benchmark performance against simple keyword search using task-aligned metrics on the 30-Q\\&A test set. Document baseline errors, system limitations, and runtime configurations to establish a solid performance floor before introducing complex architectures.

8.  Methodical Core Upgrades: Evaluate advanced modeling techniques only when baseline error analysis demonstrates specific failure modes. Keep evaluation datasets, labels, and metrics completely frozen while testing potential upgrades. Compare model uplift, system latency, execution cost, and failure modes against the baseline through rigorous ablation studies. Reject added architectural complexity unless it delivers a measurable, meaningful improvement in key evaluation metrics.

9.  Project-Specific Advanced Gates: Implement rigorous evaluation criteria measuring answer accuracy, coverage, citation fidelity, and report completeness across the 30-Q\\&A dataset. Audit self-evaluation confidence scores and verify that generated PDF reports cite exact source evidence with page numbers. Separate retrieval evaluation from generator assessment, requiring grounded citations and human-reviewed benchmarks. Ensure the specialized evaluation pipeline is fully functional before deploying downstream features.

10. End-to-End System Auditing: Trace generated PDF reports back to source SEC EDGAR filings and retrieved chunks to verify factual alignment. Categorize pipeline failures into parsing, retrieval, or hallucination errors while evaluating edge cases, rate limits, and service timeouts. Implement safe fallbacks, require human oversight for critical outputs, and document residual risks to ensure the complete system remains robust under adverse conditions.
