tream topic modeli"},{num:6,title:"Feature Extraction & Embedding Generation",desc:"Calculate TF-IDF matrices and generate dense sentence embeddings across all review texts to capture rich semantic density, contextual nuances, and explicit risk markers. Combining statistical keyword frequencies with contextual vector representations provides a robust foundation for identifying nuan"},{num:7,title:"Baseline Regex Classifier",desc:"Freeze a baseline rule-based regex risk-theme classifier designed to match known clinical and safety risk key terms. Establishing this deterministic modeling floor provides a fast, transparent benchmark against which more sophisticated machine learning and natural language processing architectures c"},{num:8,title:"Unsupervised Topic Modeling",desc:"Train unsupervised topic models, such as Latent Dirichlet Allocation (LDA), to discover hidden thematic patterns and group app reviews into distinct risk cohorts. Analyzing topic distributions helps uncover emerging safety concerns and user-reported feedback themes without relying solely on predefin"},{num:9,title:"Vector Space Clustering",desc:"Apply K-Means clustering algorithms to the review embedding vector space to group similar feedback. Calculate Silhouette scores and evaluate elbow curves to determine optimal cluster counts, ensuring distinct vector groupings that accurately reflect underlying risk categories and user sentiment."},{num:10,title:"Topic Classification Metric Evaluation",desc:"Evaluate topic classification and clustering performance using topic coherence scores and cluster separation metrics. Rigorously analyzing quantitative separation and qualitative topic interpretability validates that extracted review clusters correspond meaningfully to actual mental health risk them"},{num:11,title:"Clinical Safety & Sensitivity Audit",desc:"Audit model risk classifications specifically to verify that severe clinical risk themes, such as self-harm or crisis indicators, are flagged with 100% sensitivity. Eliminating false negatives in high-severity risk categories guarantees that critical safety signals are reliably caught for downstream"},{num:12,title:"Hyperparameter Tuning & Model Calibration",desc:"Tune clustering hyperparameters, topic counts, and similarity thresholds strictly on the dedicated training partition. Iteratively refining model settings without exposing validation data guards against overfitting and maintains strict separation between training logic and evaluation benchmarks."},{num:13,title:"Final Out-of-Sample Validation",desc:"Evaluate overall risk-theme classification accuracy exactly once on the frozen, out-of-sample validation partition. Assessing final generalization performance on unseen data confirms that the NLP pipeline reliably detects user-reported risk themes without empirical bias or data leakage."},{num:14,title:"Deliverables & Documentation",desc:"Deliver a complete app-review sentiment mapping notebook, a repeatable topic modeling pipeline, and a fully documented risk taxonomy. Present clear operational guidelines and visual dashboards to enable public health policy researchers and compliance teams to effectively audit app review data."}]},{id:"1063",title:"Speech Background Noise Suppression with Deep Learning",org:"MathWorks",advisor:"Neha Sardesai",ml_type:"Deep Learning (CNN/RNN) for speech denoising; Audio signal processing",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Deep Learning",objective:"Build a model using signal processing and feature extraction (CNN/RNN) to suppress background noise from speech signals offline over static audio files.",metrics:"PESQ (Perceptual Evaluation of Speech Quality) and STOI (Short-Time Objective Intelligibility); subjective listening tests.",data_link:"https://github.com/microsoft/DNS-Challenge",sep:"Domain literature review, download DNS data subset, and extract spectrograms.",oct:"Train CNN/RNN architectures on static audio spectrograms.",nov:"Evaluate via PESQ/STOI and produce an offline before/after audio demonstration.",bottleneck:"Dataset exceeds 10 GB (guaranteed Colab environment crash), and heavy audio signal processing introduces severe mathematical and environment memory debt.",recommendation:"Mandate strict offline sampling. The team must subsample the dataset to ≤ 1 GB and use pre-compiled Python DSP libraries (like librosa) for spectrogram extraction.",summary:"A dataset exceeding 10 GB combined with heavy audio signal processing risks severe environment memory crashes and high technical debt in Google Colab. To prevent runtime failures, teams should mandate strict offline sampling by subsampling the dataset to 1 GB or less and leveraging pre-compiled Python DSP libraries like librosa for spectrogram extraction.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of reconstructing clean speech waveforms by suppressing complex environmental background noises on edge runtimes for MathWorks. Identify key stakeholders, target audio developers, and operational workflows like file editing. Inputs include raw DNS audio stream datasets, speech signals, and background noise waveforms; outputs are reconstructed clean speech files and PESQ/SDR metrics. Scope is strictly offline processing to mitigate frequency suppression risks.
2.  Data Ingestion & Preprocessing Setup: Ingest the raw Deep Noise Suppression (DNS) Challenge audio stream datasets provided by MathWorks, which include speech signals, clean reference audio, and diverse background noise waveforms. Validate file formats, paths, and metadata to ensure seamless integration into downstream feature extraction pipelines while establishing standard data loading procedures for audio batch processing.
3.  Critical Data Gate - Audio Subsampling Gate: Build an automated audio processing pipeline in Python. Programmatically subsample the raw audio files down to 1 GB or less of WAV files. This strict data constraint guarantees that dataset memory consumption stays within system bounds, preventing environment memory crashes and execution instability while running comfortably within free Google Colab RAM runtime limits.
4.  Audio Properties Standardization Gate: Verify that audio sample rates, bit depths, and channel durations are completely uniform across all speech, noise, and combined audio channels. Detect and resample mismatched files to a standardized sampling rate (such as 16 kHz) to prevent tensor shape mismatches and digital signal processing errors during feature extraction and deep learning training.
5.  Stratified Validation Partitioning: Enforce a strict stratified validation split based on unique speaker IDs across training, validation, and testing sets. This isolated partition strategy prevents speaker template leakage during evaluation, ensuring that speech suppression performance metrics accurately reflect model generalization to unseen speakers and novel acoustic environments rather than memorized speaker characteristics.
6.  Time-Frequency Feature Extraction: Convert raw one-dimensional audio waveform sequences into two-dimensional spectrogram representations using Short-Time Fourier Transforms (STFT). Extract log-power magnitude spectrograms and phase information, providing structured matrix representations suitable for convolutional deep learning architectures to differentiate speech signals from complex background audio noise.
7.  Raw Audio Data Assertions: Write raw-audio assertions and data quality validation checks to verify that sample frame sizes, channel configurations (mono versus stereo), and frequency bands remain uniform across all processed audio arrays. Automatically flag or isolate corrupted, truncated, or silent audio segments prior to model training to guarantee pipeline stability.
8.  Signal Processing Baseline Creation: Freeze a classical signal processing baseline using spectral subtraction techniques to denoise audio streams. Establish quantitative benchmark scores for speech enhancement, creating a mandatory performance floor that any subsequent deep learning architecture must outperform in order to justify increased computational complexity.
9.  Deep Learning Architecture Training: Upgrade the pipeline to train deep learning autoencoders, such as a two-dimensional U-Net CNN or recurrent neural network, to reconstruct clean spectrogram targets from noisy spectral input arrays. Implement mask estimation techniques to isolate target speech frequencies from background noise signals effectively.
10. Denoised Output Metric Evaluation: Evaluate denoised audio output quality using standardized Perceptual Evaluation of Speech Quality (PESQ), Short-Time Objective Intelligibility (STOI), and Signal-to-Distortion Ratio (SDR) metrics. Conduct objective acoustic comparisons against ground truth clean speech audio to measure noise reduction and signal preservation accurately.
11. Compute Resource Memory Audit: Verify that deep learning model training, gradient tracking, and batch processing operate within a strict memory footprint of less than 8 GB on the Colab GPU runtime. Profile CUDA memory allocation and apply gradient accumulation or smaller mini-batch sizes if necessary to prevent out-of-memory runtime crashes.
12. Hyperparameter & Architecture Tuning: Tune all deep learning hyperparameters, autoencoder layer structures, loss function weights, and learning rate schedules strictly within the isolated training audio folds. Ensure model optimization remains isolated from validation partitions to eliminate hyperparameter snooping and evaluation bias.
13. Out-of-Sample Performance Testing: Evaluate out-of-sample audio noise suppression capabilities, PESQ scores, and STOI values exactly once on the frozen test partition reserved d`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of reconstructing clean speech waveforms by suppressing complex environmental background noises on edge runtimes for MathWorks. Identify key stakeholders, target audio developers, and operational workflows like file editing. Inputs include raw DNS audio stream datasets, speec"},{num:2,title:"Data Ingestion & Preprocessing Setup",desc:"Ingest the raw Deep Noise Suppression (DNS) Challenge audio stream datasets provided by MathWorks, which include speech signals, clean reference audio, and diverse background noise waveforms. Validate file formats, paths, and metadata to ensure seamless integration into downstream feature extraction"},{num:3,title:"Critical Data Gate - Audio Subsampling Gate",desc:"Build an automated audio processing pipeline in Python. Programmatically subsample the raw audio files down to 1 GB or less of WAV files. This strict data constraint guarantees that dataset memory consumption stays within system bounds, preventing environment memory crashes and execution instability"},{num:4,title:"Audio Properties Standardization Gate",desc:"Verify that audio sample rates, bit depths, and channel durations are completely uniform across all speech, noise, and combined audio channels. Detect and resample mismatched files to a standardized sampling rate (such as 16 kHz) to prevent tensor shape mismatches and digital signal processing error"},{num:5,title:"Stratified Validation Partitioning",desc:"Enforce a strict stratified validation split based on unique speaker IDs across training, validation, and testing sets. This isolated partition strategy prevents speaker template leakage during evaluation, ensuring that speech suppression performance metrics accurately reflect model generalization t"},{num:6,title:"Time-Frequency Feature Extraction",desc:"Convert raw one-dimensional audio waveform sequences into two-dimensional spectrogram representations using Short-Time Fourier Transforms (STFT). Extract log-power magnitude spectrograms and phase information, providing structured matrix representations suitable for convolutional deep learning archi"},{num:7,title:"Raw Audio Data Assertions",desc:"Write raw-audio assertions and data quality validation checks to verify that sample frame sizes, channel configurations (mono versus stereo), and frequency bands remain uniform across all processed audio arrays. Automatically flag or isolate corrupted, truncated, or silent audio segments prior to mo"},{num:8,title:"Signal Processing Baseline Creation",desc:"Freeze a classical signal processing baseline using spectral subtraction techniques to denoise audio streams. Establish quantitative benchmark scores for speech enhancement, creating a mandatory performance floor that any subsequent deep learning architecture must outperform in order to justify incr"},{num:9,title:"Deep Learning Architecture Training",desc:"Upgrade the pipeline to train deep learning autoencoders, such as a two-dimensional U-Net CNN or recurrent neural network, to reconstruct clean spectrogram targets from noisy spectral input arrays. Implement mask estimation techniques to isolate target speech frequencies from background noise signal"},{num:10,title:"Denoised Output Metric Evaluation",desc:"Evaluate denoised audio output quality using standardized Perceptual Evaluation of Speech Quality (PESQ), Short-Time Objective Intelligibility (STOI), and Signal-to-Distortion Ratio (SDR) metrics. Conduct objective acoustic comparisons against ground truth clean speech audio to measure noise reducti"},{num:11,title:"Compute Resource Memory Audit",desc:"Verify that deep learning model training, gradient tracking, and batch processing operate within a strict memory footprint of less than 8 GB on the Colab GPU runtime. Profile CUDA memory allocation and apply gradient accumulation or smaller mini-batch sizes if necessary to prevent out-of-memory runt"},{num:12,title:"Hyperparameter & Architecture Tuning",desc:"Tune all deep learning hyperparameters, autoencoder layer structures, loss function weights, and learning rate schedules strictly within the isolated training audio folds. Ensure model optimization remains isolated from validation partitions to eliminate hyperparameter snooping and evaluation bias."},{num:13,title:"Out-of-Sample Performance Testing",desc:"Evaluate out-of-sample audio noise suppression capabilities, PESQ scores, and STOI values exactly once on the frozen test partition reserved during initial project scoping. Analyze performance across varied noise types to quantify true model generalization on unseen speech signals."},{num:14,title:"Deliverable Package & Validation Archiving",desc:"Deliver a fully functional, exportable PyTorch speech denoising pipeline accompanied by output cleaned audio samples, comparative spectrogram visualizations, before-and-after listening demonstrations, and a detailed model validation report documenting overall performance and deployment constraints."}]},{id:"1064",title:"Assessing Football Stadium Attendance and Experience During the Regular Season",org:"Other",advisor:"Christina Coleman",ml_type:"NLP, Supervised Classification, Regression",evaluation:"Approved w/ feedback",urgency:"Medium",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Build an NLP + predictive scoring model that determines whether a regular season game is 'worth attending' using stadium/venue review data (fan reviews and ratings) with ticket price, seat quality, and fan-experience/sentiment signals; treat weather/transit data as optional enhancements if time permits.",metrics:"Suggested evaluation: if framed as classification, use Macro-F1 or ROC-AUC; if framed as regression, use RMSE or MAE. Optionally include simple explainability (e.g., feature importance or SHAP). Final rubric to be drafted by the team.",data_link:"nflverse, Open-Meteo, GTFS, Kaggle Reviews",sep:"Complete EDA and cleaning on the stadium/venue review dataset; engineer features for price, seat quality, and sentiment; present initial data insights.",oct:"Develop a baseline classification or regression model; begin iterating with sentiment components from review text; define and document the evaluation plan.",nov:"Refine and validate the model; build a simple user-facing output (dashboard/score/interface); optionally explore late-stage weather/transit enrichment if time permits; finalize deliverables.",bottleneck:"Aligning heterogeneous public APIs (spatial, meteorological, and sentiment data) across distinct timestamps and stadium geolocations introduces high data engineering overhead and risk of chronological leakage.",recommendation:"Mandate strict offline dataset caching early in September. Guide the team to establish baseline tabular models before layering external weather and transit APIs.",summary:"Integrating disparate public APIs across varied timestamps and locations creates substantial data engineering overhead and increases the risk of chronological data leakage. To mitigate this, the team should enforce offline dataset caching early and establish a baseline tabular model using review and pricing data before attempting to layer in external weather or transit APIs.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting game value and attendance satisfaction using multi-source spatial-temporal and weather telemetry data for Christina Coleman. Identify key stakeholders including NFL franchise operations and ticketing platforms, target operational workflows, and supported pricing or staffing decisions. Inputs encompass reviews, seating layouts, and weather sensors to output satisfaction ratings while avoiding live operational execution risks.
2.  Multi-Source Telemetry Data Ingestion: Systematically ingest multi-source stadium review datasets, historical ticket cost logs, stadium seating layouts, spatial metrics, and regional weather sensor tables into unified data pipelines. Establish structured schema definitions and data storage formats to ensure seamless downstream accessibility, data traceability, and clean preprocessing capabilities across all continuous and categorical telemetry variables.
3.  Critical Data Gate - Heuristic Sentiment Gate: Freeze review-text sentiment features using standard pre-trained NLP sentiment scoring frameworks by Week 3. Ensure this step completes strictly prior to executing complex spatial-temporal joins with live weather or spatial APIs to prevent downstream feature contamination, inconsistent NLP representations, or runtime execution failures.
4.  Spatial-Temporal Coordinate Alignment Verification: Verify and align spatial coordinates and temporal timestamps rigorously across separate fan review logs and meteorological sensor grids. Ensure precise matching across geographical stadium locations and game timeframes to eliminate temporal mismatching, maintain data integrity, and prevent chronological leakage during feature engineering.
5.  Outlier Detection & Continuous Feature Profiling: Profile continuous ticket costs, seat pricing distributions, and regional temperature readings to identify extreme weather events, missing telemetry records, or abnormal scheduling outliers. Establish robust statistical summary profiles to ensure downstream modeling pipelines receive clean, well-bounded continuous data inputs across all training instances.
6.  Boundary Assertion & Data Validation Gate: Write explicit programmatic boundary assertions validating that ticket prices, seating coordinates, and regional temperature indices remain within realistic, feasible bounds. Automatically flag or filter non-compliant records to maintain continuous dataset quality and prevent corrupted data points from reaching downstream ML algorithms.
7.  Baseline Model Freezing & Benchmark Ranking: Freeze an initial baseline recommendation model that ranks game value solely based on historical ticket costs, explicitly ignoring weather data and text sentiment metrics. Use this straightforward benchmark to establish baseline prediction metrics against which subsequent complex modeling iterations can be objectively evaluated.
8.  Gradient Boosted Decision Tree Training: Train gradient boosted decision trees, utilizing algorithms such as XGBoost or LightGBM, to predict continuous stadium attendance rates and generate fan experience "worth attending" risk scores. Incorporate engineered tabular features alongside frozen sentiment scores to capture non-linear feature interactions accurately.
9.  Empirical Value Rubric Model Evaluation: Compare model recommendation results head-to-head against a structured empirical stadium-value rubric to evaluate prediction consistency and operational validity. Benchmark generated scores against actual fan satisfaction outcomes to ensure the algorithm delivers reliable, actionable recommendations for stadium planning.
10. Model Bias & Weather Anomaly Auditing: Perform systematic audits on model outputs to verify that extreme regional weather anomalies do not induce systematic bias into overall stadium worthiness recommendations. Ensure the predictive model evaluates core game factors fairly without over-penatizing venue locations during transient, adverse weather events.
11. System Stress-Testing & Fault Tolerance Verification: Stress-test the full machine learning system by introducing synthetic delayed records and missing temperature readings. Ensure the pipeline handles telemetry stream interruptions, missing sensor data, and unexpected formatting variations through robust, graceful failure mechanisms without crashing core evaluation routines.
12. Hyperparameter Tuning & Threshold Optimization Constraints: Perform all gradient boosted decision tree hyperparameter tuning, feature selection, and decision threshold optimization strictly within the designated early game training data partition. Prevent data leakage by isolating hyperparameter search spaces completely from holdout evaluation metrics and downstream testing datasets.
13. Out-of-Sample Partition Validation: Evaluate out-of-sample game-attendance recommendations exactly once using the frozen validation partition. Document final performance metrics, `,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of predicting game value and attendance satisfaction using multi-source spatial-temporal and weather telemetry data for Christina Coleman. Identify key stakeholders including NFL franchise operations and ticketing platforms, target operational workflows, and supported pricing"},{num:2,title:"Multi-Source Telemetry Data Ingestion",desc:"Systematically ingest multi-source stadium review datasets, historical ticket cost logs, stadium seating layouts, spatial metrics, and regional weather sensor tables into unified data pipelines. Establish structured schema definitions and data storage formats to ensure seamless downstream accessibil"},{num:3,title:"Critical Data Gate - Heuristic Sentiment Gate",desc:"Freeze review-text sentiment features using standard pre-trained NLP sentiment scoring frameworks by Week 3. Ensure this step completes strictly prior to executing complex spatial-temporal joins with live weather or spatial APIs to prevent downstream feature contamination, inconsistent NLP represent"},{num:4,title:"Spatial-Temporal Coordinate Alignment Verification",desc:"Verify and align spatial coordinates and temporal timestamps rigorously across separate fan review logs and meteorological sensor grids. Ensure precise matching across geographical stadium locations and game timeframes to eliminate temporal mismatching, maintain data integrity, and prevent chronolog"},{num:5,title:"Outlier Detection & Continuous Feature Profiling",desc:"Profile continuous ticket costs, seat pricing distributions, and regional temperature readings to identify extreme weather events, missing telemetry records, or abnormal scheduling outliers. Establish robust statistical summary profiles to ensure downstream modeling pipelines receive clean, well-bou"},{num:6,title:"Boundary Assertion & Data Validation Gate",desc:"Write explicit programmatic boundary assertions validating that ticket prices, seating coordinates, and regional temperature indices remain within realistic, feasible bounds. Automatically flag or filter non-compliant records to maintain continuous dataset quality and prevent corrupted data points f"},{num:7,title:"Baseline Model Freezing & Benchmark Ranking",desc:"Freeze an initial baseline recommendation model that ranks game value solely based on historical ticket costs, explicitly ignoring weather data and text sentiment metrics. Use this straightforward benchmark to establish baseline prediction metrics against which subsequent complex modeling iterations"},{num:8,title:"Gradient Boosted Decision Tree Training",desc:'Train gradient boosted decision trees, utilizing algorithms such as XGBoost or LightGBM, to predict continuous stadium attendance rates and generate fan experience "worth attending" risk scores. Incorporate engineered tabular features alongside frozen sentiment scores to capture non-linear feature i'},{num:9,title:"Empirical Value Rubric Model Evaluation",desc:"Compare model recommendation results head-to-head against a structured empirical stadium-value rubric to evaluate prediction consistency and operational validity. Benchmark generated scores against actual fan satisfaction outcomes to ensure the algorithm delivers reliable, actionable recommendations"},{num:10,title:"Model Bias & Weather Anomaly Auditing",desc:"Perform systematic audits on model outputs to verify that extreme regional weather anomalies do not induce systematic bias into overall stadium worthiness recommendations. Ensure the predictive model evaluates core game factors fairly without over-penatizing venue locations during transient, adverse"},{num:11,title:"System Stress-Testing & Fault Tolerance Verification",desc:"Stress-test the full machine learning system by introducing synthetic delayed records and missing temperature readings. Ensure the pipeline handles telemetry stream interruptions, missing sensor data, and unexpected formatting variations through robust, graceful failure mechanisms without crashing c"},{num:12,title:"Hyperparameter Tuning & Threshold Optimization Constraints",desc:"Perform all gradient boosted decision tree hyperparameter tuning, feature selection, and decision threshold optimization strictly within the designated early game training data partition. Prevent data leakage by isolating hyperparameter search spaces completely from holdout evaluation metrics and do"},{num:13,title:"Out-of-Sample Partition Validation",desc:"Evaluate out-of-sample game-attendance recommendations exactly once using the frozen validation partition. Document final performance metrics, generalization accuracy, and prediction error margins strictly against unseen historical test data to verify model reliability before final deployment."},{num:14,title:"Deliverable Packaging & Google Colab Pipeline Deployment",desc:"Deliver a fully runnable Google Colab recommendation pipeline accompanied by interactive stadium risk maps and a detailed model validation report. Document system architecture, feature dependencies, evaluation metrics, and practical user guidance for operational decision-making."}]},{id:"1066",title:"Delivery Performance & Smart Carrier Selection for Multi-Carrier Shipping",org:"WWEX",advisor:"Arjun Srinivasan",ml_type:"Supervised Regression, Classification, Recommendation Systems",evaluation:"Approved As Is",urgency:"Low",data_readiness:"Requires some cleaning",difficulty:"Sweet Spot",domain:"Classical ML",objective:"Predict realized transit times (Track A: regression) and delivery on-time risk (Track B: classification on ~73/27 class balance), and build a counterfactual recommendation engine that selects the optimal carrier balancing cost vs. speed constraints.",metrics:"MAE (days) beating the naive promised-date baseline (~0.84) by a meaningful margin; also report RMSE and share within ±1 day. For on-time risk: ROC-AUC and PR-AUC. For carrier selection: use the provided evaluate.py counterfactual scoring on held-out evaluation lanes (do not use 'accuracy' wording).",data_link:"Synthetic multi-carrier shipment records provided via CSV",sep:"Onboard to the shipping domain and dataset; complete EDA; find and fix deliberate data-quality issues (duplicate rows, missing and unit-error weights, categorical/whitespace noise, malformed ZIPs); establish a clean train/validation protocol and a first transit-time baseline that beats the naive promised-date carrier baseline (MAE ≈ 0.84 days).",oct:"Feature engineering and model comparison for transit-time prediction (Track A) — e.g., lane congestion, carrier performance index; build the on-time-risk classifier (Track B) and evaluate with ROC-AUC/PR-AUC; train LightGBM/XGBoost models and begin error analysis to identify weaknesses by lane, mode, and carrier.",nov:"Build carrier recommendation via cost/speed counterfactual scoring and/or quantile 'delivery-window' prediction (P50–P90); run calibration and fairness checks across lanes, modes, and carriers; finalize technical report and stakeholder presentation.",bottleneck:"Managing simultaneous dual-track targets (continuous transit time vs. binary on-time risk) while implementing counterfactual decision scoring without introducing target leakage.",recommendation:"Provide the students with the supplied evaluate.py harness on Day 1 to ensure standardized benchmarking throughout the semester.",summary:"Managing simultaneous dual-track targets while implementing counterfactual decision scoring creates a risk of target leakage during carrier selection optimization. To address this challenge and streamline validation, students should be provided with the pre-built evaluate.py harness on Day 1. Establishing this evaluation framework early ensures standardized benchmarking across both regression and classification tracks throughout the project.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of predicting shipping transit times and on-time risks for WWEX to optimize cost-speed tradeoffs. Key stakeholders include logistics analysts and dispatchers, utilizing shipment history and rate cards to produce offline carrier recommendations while mitigating delay penalties and cost overruns.
2.  Synthetic Data Ingestion: Efficiently ingest and consolidate synthetic parcel shipment history logs, freight shipment tracking sheets, carrier rate cards, and regional transit lanes into a unified data processing environment to establish a reliable data foundation for downstream modeling tasks.
3.  Critical Data Gate - Evaluate.py Integration: Integrate the pre-provided evaluate.py counterfactual carrier selection scoring script into the local modeling pipeline on Day 1, establishing the mandatory evaluation harness required to standardize benchmarking across regression, classification, and carrier selection optimization routines.
4.  Schema Alignment & Key Verification: Verify that shipping lane codes, tracking IDs, and carrier identifiers are joined cleanly and validated across all freight logs and rate sheets by Week 3 to prevent data loss or mismatched relational records during model feature extraction.
5.  Feature Profiling & Outlier Analysis: Profile continuous transit times, delivery windows, and shipping cost distributions to identify high-variance outliers, anomalous shipping route delays, data entry errors, and extreme scheduling bottlenecks across all historical shipping lanes.
6.  Data Integrity & Assertion Testing: Write strict programmatic data validation assertions within the ingestion pipeline to ensure critical features—such as package shipping weights, lane distances, carrier transit fees, and unit rates—are strictly positive, non-zero numeric values.
7.  Baseline Model Benchmarking: Freeze a naive seasonal carrier benchmark assuming all shipments utilize the historical median-cost carrier for a given lane. Establish clear baseline performance metrics across transit time, cost, and reliability to anchor subsequent model iterations.
8.  Supervised Model Training: Train supervised gradient-boosted decision tree models (XGBoost and LightGBM) to concurrently predict continuous transit duration and binary on-time risk flags, capturing non-linear relationships across carriers, lanes, and historical shipping metrics.
9.  Counterfactual Recommendation Evaluation: Evaluate smart carrier selection decisions using the integrated evaluate.py counterfactual evaluation script. Quantify total cost savings and delivery speed improvements against established naive baselines under realistic operational constraints and SLA thresholds.
10. Model Interpretability & SHAP Audit: Audit trained gradient-boosting model predictions using global and local SHAP feature importance maps to verify that predictive drivers align logically with real-world shipping logistics, route lengths, and historical carrier performance data.
11. Robustness & Constraint Stress-Testing: Stress-test the carrier recommendation engine by introducing highly restrictive lane conditions, emergency speed requirements, and heavy freight constraints to evaluate system stability and ensure graceful, deterministic fallbacks under edge-case logistics scenarios.
12. Hyperparameter Tuning & Cross-Validation: Tune all gradient-boosted decision tree hyperparameters, risk penalty weights, and carrier selection decision thresholds strictly within cross-validation training folds to ensure robust generalization and prevent data leakage into validation sets.
13. Out-of-Sample Evaluation Gate: Evaluate smart carrier selection models exactly once on the frozen, out-of-sample transit test set reserved in September to measure final generalization performance, cost efficiency, and time accuracy without risk of metric inflation.
14. Final Deliverables & Documentation: Deliver a fully automated carrier-selection notebook, a probability calibration report, and a detailed model card summarizing methodology, evaluation metrics, fairness checks across carriers, operational boundaries, and deployment guidance.`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of predicting shipping transit times and on-time risks for WWEX to optimize cost-speed tradeoffs. Key stakeholders include logistics analysts and dispatchers, utilizing shipment history and rate cards to produce offline carrier recommendations while mitigating delay penalties"},{num:2,title:"Synthetic Data Ingestion",desc:"Efficiently ingest and consolidate synthetic parcel shipment history logs, freight shipment tracking sheets, carrier rate cards, and regional transit lanes into a unified data processing environment to establish a reliable data foundation for downstream modeling tasks."},{num:3,title:"Critical Data Gate - Evaluate.py Integration",desc:"Integrate the pre-provided evaluate.py counterfactual carrier selection scoring script into the local modeling pipeline on Day 1, establishing the mandatory evaluation harness required to standardize benchmarking across regression, classification, and carrier selection optimization routines."},{num:4,title:"Schema Alignment & Key Verification",desc:"Verify that shipping lane codes, tracking IDs, and carrier identifiers are joined cleanly and validated across all freight logs and rate sheets by Week 3 to prevent data loss or mismatched relational records during model feature extraction."},{num:5,title:"Feature Profiling & Outlier Analysis",desc:"Profile continuous transit times, delivery windows, and shipping cost distributions to identify high-variance outliers, anomalous shipping route delays, data entry errors, and extreme scheduling bottlenecks across all historical shipping lanes."},{num:6,title:"Data Integrity & Assertion Testing",desc:"Write strict programmatic data validation assertions within the ingestion pipeline to ensure critical features—such as package shipping weights, lane distances, carrier transit fees, and unit rates—are strictly positive, non-zero numeric values."},{num:7,title:"Baseline Model Benchmarking",desc:"Freeze a naive seasonal carrier benchmark assuming all shipments utilize the historical median-cost carrier for a given lane. Establish clear baseline performance metrics across transit time, cost, and reliability to anchor subsequent model iterations."},{num:8,title:"Supervised Model Training",desc:"Train supervised gradient-boosted decision tree models (XGBoost and LightGBM) to concurrently predict continuous transit duration and binary on-time risk flags, capturing non-linear relationships across carriers, lanes, and historical shipping metrics."},{num:9,title:"Counterfactual Recommendation Evaluation",desc:"Evaluate smart carrier selection decisions using the integrated evaluate.py counterfactual evaluation script. Quantify total cost savings and delivery speed improvements against established naive baselines under realistic operational constraints and SLA thresholds."},{num:10,title:"Model Interpretability & SHAP Audit",desc:"Audit trained gradient-boosting model predictions using global and local SHAP feature importance maps to verify that predictive drivers align logically with real-world shipping logistics, route lengths, and historical carrier performance data."},{num:11,title:"Robustness & Constraint Stress-Testing",desc:"Stress-test the carrier recommendation engine by introducing highly restrictive lane conditions, emergency speed requirements, and heavy freight constraints to evaluate system stability and ensure graceful, deterministic fallbacks under edge-case logistics scenarios."},{num:12,title:"Hyperparameter Tuning & Cross-Validation",desc:"Tune all gradient-boosted decision tree hyperparameters, risk penalty weights, and carrier selection decision thresholds strictly within cross-validation training folds to ensure robust generalization and prevent data leakage into validation sets."},{num:13,title:"Out-of-Sample Evaluation Gate",desc:"Evaluate smart carrier selection models exactly once on the frozen, out-of-sample transit test set reserved in September to measure final generalization performance, cost efficiency, and time accuracy without risk of metric inflation."},{num:14,title:"Final Deliverables & Documentation",desc:"Deliver a fully automated carrier-selection notebook, a probability calibration report, and a detailed model card summarizing methodology, evaluation metrics, fairness checks across carriers, operational boundaries, and deployment guidance."}]},{id:"1067",title:"Governed Prompt Gateway: Token Efficient and safety aware LLM routing for regulated customer",org:"Other",advisor:"Hari Kishan, Bhavana Unnam",ml_type:"Classification, NLP, Semantic Similarity, RAG, LLM Evaluation",evaluation:"Needs Revision (app status, 2026-08-22)",urgency:"",data_readiness:"It will require some cleaning / preprocessing",difficulty:"Sweet Spot",domain:"NLP / LLMs",objective:"Build a governed prompt gateway that screens user queries, detects unsafe requests, reduces token usage, estimates cost, and recommends the best LLM model tier before a prompt is executed.",metrics:"Safety/governance accuracy (80%+ F1 on prompt-risk classification); 30–50% input-token reduction for eligible prompts; cache effectiveness (cache-hit rate); estimated cost-savings across a simulated workload.",data_link:"https://huggingface.co/datasets/lmsys/toxic-chat; https://huggingface.co/datasets/JailbreakBench/JBB-Behaviors",sep:"Sept: Problem definition, data setup, and baseline design (define prompt-risk categories, load HF datasets, create baseline prompt-risk classifier and baseline token-usage measurements).",oct:"Oct: Build governance layer, implement prompt optimization methods, and develop a caching prototype (semantic-similarity or embedding-based cache simulation; integrate basic model-recommendation logic).",nov:"Nov: Complete evaluation dashboard, run end-to-end evaluation (F1 on prompt-risk, token reduction, cache-hit rate, cost-savings simulation), and prepare final demo materials.",bottleneck:"App red-team: (High) API cost / rate-limit dependency from multiple LLM calls; (High) scope creep - gateway with caching, routing and safety classification is over-scoped for 12 weeks; (Medium) governance metrics for RAG/LLM routing are ambiguous to validate.",recommendation:"By week 2, pick one tractable track to freeze scope: (A) Safety/Governance Classifier track — focus on building a prompt-risk classifier using the provided HF datasets, target 80%+ F1, implement simple configurable governance rules, and run offline evaluations and cost-estimate simulations; or (B) RAG/Caching & Routing track — implement an embedding-based cache simulation and lightweight routing policy, measure cache-hit rate, token reduction, and cost estimates. Use local smaller Hugging Face models for baselines to limit API cost and iterate quickly. Finalize the feature set by week 8, produce an evaluation dashboard, architecture diagram, demo script, and documentation. Treat jurisdictional policy templates and an automated prompt-testing harness as explicit stretch (optional) items to implement only if core milestones stay on schedule.",summary:"Building a full-featured gateway with caching, routing, and safety classification risks scope creep, ambiguous validation metrics, and high API costs. To address these issues, teams should narrow their scope early by selecting either the Safety/Governance Classifier track or the RAG/Caching & Routing track. Utilizing smaller local Hugging Face models for baseline evaluations and freezing features by week 8 will ensure project feasibility within the timeline.",checklist_raw:`1.  Business Understanding & Problem Formulation: Define the core problem of automating security classification and token-efficient prompt routing across regulated gateways for Other (Hari Kishan). Key stakeholders include compliance teams and security engineers. The workflow routes prompts to secure LLMs and blocks malicious requests. Primary inputs are prompt history sheets and security taxonomies, while outputs provide risk categories and routing latency metrics.

2.  Raw Data Ingestion & Preflight Validation: Securely ingest raw enterprise prompt history logs, regulatory compliance guidelines, semantic cache indexes, and standardized security risk taxonomies into the processing environment. Implement preliminary validation checks to ensure all incoming data structures, text fields, and class metadata meet baseline formatting standards, establishing a clean foundation for subsequent preprocessing and model execution workflows.

3.  🛑 CRITICAL DATA GATE - TRACK SCISSORING GATE: Enforce a strict scope pivot by Week 2 to lock project focus exclusively onto either Track A (security classification) or Track B (semantic caching). This crucial boundary prevents dual-pipeline complexity bloat, keeps engineering timelines manageable, and ensures dedicated development resources remain aligned with primary enterprise objectives without introducing architectural overhead.

4.  Label Alignment & Sequence Verification: Programmatically inspect and verify that all raw input prompt sequences directly align with corresponding target security classifications across every provided training dataset. Flag missing labels, repair formatting inconsistencies, and filter ambiguous prompt-category pairs to maintain data integrity, ensuring downstream machine learning models train on consistently formatted and accurately annotated data.

5.  Prompt Length Profiling & Token Distribution Analysis: Profile incoming prompt sequences to analyze token length distributions across all data partitions. Identify potential context-window exhaustion thresholds, token count skews, and outliers that could impact model processing times or API costs. Use these insights to optimize vectorization strategies, establish dynamic token chunking bounds, and prevent unexpected runtime errors.

6.  Sanitization & Input Data Validation Assertions: Construct rigorous data validation assertions to ensure incoming employee prompt strings are thoroughly sanitized, stripped of dangerous characters, and verified against defined minimum and maximum length bounds. Automatically flag or drop malformed inputs before model consumption, mitigating security risks and preventing ingestion pipeline failures caused by unexpected formatting issues.

7.  Regex Baseline Model Implementation: Construct and freeze an initial rule-based baseline model utilizing regular expressions and exact keyword lookup tables. Use this baseline to flag known sensitive enterprise keywords, restricted system operations, and standard prompt injection patterns, providing an immediate, computationally efficient benchmark against which complex machine learning models can be measured.

8.  Embedding Upgrade & Classifier Development: Advance beyond rule-based baselines by engineering local TF-IDF feature matrices and contextual sentence embedding models. Train supervised classification algorithms on these rich vector representations to accurately detect subtle, context-dependent security risks, policy violations, and sophisticated jailbreak attempts across diverse employee prompt inputs within the regulated environment.

9.  Multi-Class Model Performance Evaluation: Comprehensive evaluation of the security classification pipeline using macro F1-score, Precision, and Recall metrics across all defined risk categories. Analyze confusion matrices to identify specific class overlaps, false positive spikes, or misclassifications, driving targeted iterative improvements to model hyper-parameters, vector representations, and risk thresholding logic.

10. Latency & Cache Performance Auditing: Measure semantic cache hit rates, cost reduction metrics, and end-to-end prompt routing latency in milliseconds to ensure the gateway operates within operational tolerances. Verify that security filtering and embedding lookup procedures do not introduce excessive overhead or degrade user experience when forwarding approved requests to primary LLM endpoints.

11. Adversarial Robustness & Jailbreak Stress-Testing: Systematically stress-test the active prompt gateway using a comprehensive battery of synthetic adversarial prompts, obfuscated injection vectors, and complex jailbreak patterns. Assess system stability and classification resilience under edge-case attacks to identify potential security loopholes before deploying the governance framework to live enterprise environments.

12. In-Fold Parameter Tuning & Regularization: Perform all hyperparameter optimization, vector similarity threshold adjustments, and model regul`,gates:[{num:1,title:"Business Understanding & Problem Formulation",desc:"Define the core problem of automating security classification and token-efficient prompt routing across regulated gateways for Other (Hari Kishan). Key stakeholders include compliance teams and security engineers. The workflow routes prompts to secure LLMs and blocks malicious requests. Primary inpu"},{num:2,title:"Raw Data Ingestion & Preflight Validation",desc:"Securely ingest raw enterprise prompt history logs, regulatory compliance guidelines, semantic cache indexes, and standardized security risk taxonomies into the processing environment. Implement preliminary validation checks to ensure all incoming data structures, text fields, and class metadata mee"},{num:3,title:"🛑 CRITICAL DATA GATE - TRACK SCISSORING GATE",desc:"Enforce a strict scope pivot by Week 2 to lock project focus exclusively onto either Track A (security classification) or Track B (semantic caching). This crucial boundary prevents dual-pipeline complexity bloat, keeps engineering timelines manageable, and ensures dedicated development resources rem"},{num:4,title:"Label Alignment & Sequence Verification",desc:"Programmatically inspect and verify that all raw input prompt sequences directly align with corresponding target security classifications across every provided training dataset. Flag missing labels, repair formatting inconsistencies, and filter ambiguous prompt-category pairs to maintain data integr"},{num:5,title:"Prompt Length Profiling & Token Distribution Analysis",desc:"Profile incoming prompt sequences to analyze token length distributions across all data partitions. Identify potential context-window exhaustion thresholds, token count skews, and outliers that could impact model processing times or API costs. Use these insights to optimize vectorization strategies,"},{ rial prompts, obfuscated injection vectors, and complex jailbreak patterns. Assess system stability and classification resilience under edge-case attacks to identify potential security loopholes be"},{num:12,title:"In-Fold Parameter Tuning & Regularization",desc:"Perform all hyperparameter optimization, vector similarity threshold adjustments, and model regularization experiments strictly within designated cross-validation training folds. Enforce tight data hygiene protocols to prevent information leakage, ensuring that decision boundaries, embedding scaling"},{num:13,title:"Out-of-Sample Final Evaluation",desc:"Execute a single, final evaluation run of the fully tuned prompt routing and security classification pipeline against the frozen, unseen out-of-sample test dataset. Record final metrics for accuracy, F1-score, token reduction, and latency to definitively validate the system's operational effectivene"},{num:14,title:"Deliverable Archiving & Model Card Documentation",desc:"Package the complete solution into a well-documented, highly reproducible GitHub repository containing runnable Jupyter notebooks, an exportable semantic cache index, and automated validation scripts. Publish a detailed Model Card documenting supported security schemas, system architecture, performa"}]},{id:"1018",title:"Founder Intelligence Platform - Combined 2025 (CFRM)",org:"G&M",advisor:"Sam Ogah, John Cook",ml_type:"Classification, Clustering, Rec Sys, NLP, CV, DL, LLMs, Geo",evaluation:"Minor Edits Needed",urgency:"Critical",data_readiness:"Requires cleaning / preprocessing",difficulty:"Unscored",domain:"NLP / LLMs",objective:"Identify under-capitalized founders using Tech Hub datasets and behavioral frameworks.",metrics:"Working web application, risk scoring engine, opportunity heatmaps, founder assessment prototype, searchable intelligence platform, plus executive presentation and documentation. (No quantitative targets were specified in the source.)",data_link:'"All links provided"',sep:"Month 1 (Data Foundation): Project setup, data ingestion, data acquisition, data cleaning, feature engineering, and exploratory data analysis.",oct:"Month 2 (AI & Machine Learning): Risk prediction models, clustering and segmentation, explainability and feature importance.",nov:"Month 3 (MVP Development): Dashboard development, heatmaps and visualizations, testing, documentation, and final executive presentation.",bottleneck:"Scope spans many ML tasks and heterogeneous sources without concrete, static datasets. This breadth and lack of explicit dataset links is a key bottleneck. Provide a single, static, downloadable CSV of pre-extracted founder features and narrow the project to one ML pipeline (e.g., supervised risk scoring or NLP-based clustering). Remove any expectation of live social-media scraping for the core 12-week plan; do not require CV or LLM components.",recommendation:"Rescope to one well-defined task using a single static dataset (CSV). Example paths: (a) build a supervised risk-scoring baseline using tabular founder features, or (b) perform NLP-based clustering of founder profiles using provided text features. Deliverables: a reproducible Google Colab notebook with EDA and preprocessing, a trained model baseline with simple evaluation, a basic explainability pass (feature importance or keyword drivers), and a lightweight dashboard (e.g., Streamlit) showing scores and heatmaps. No live API/social-media scraping; no CV/LLM components. Provide explicit download links to the CSV and a data dictionary before kickoff.",summary:"The project's broad scope across multiple ML modalities and live web scraping without static datasets creates a major bottleneck for execution. To mitigate this, the project should be rescoped to focus on a single ML task, such as supervised risk scoring or NLP clustering, utilizing a single pre-extracted CSV dataset. Removing requirements for live scraping, computer vision, and LLMs will allow the team to successfully deliver a functional model baseline and simple dashboard.",checklist_raw:"",gates:[]},{id:"1019",title:"AI-Automated Business System Tasks",org:"Google",advisor:"Khushboo Bhatia",ml_type:"LLMs, Transfer Learning, RL",evaluation:"Conditionally Approved",urgency:"High",data_readiness:"Requires some cleaning",difficulty:"Unscored",domain:"NLP / LLMs",objective:"Build AI Agents (Scope undefined).",metrics:"TBD",data_link:"TBD",sep:"",oct:"",nov:"",bottleneck:'The submission is entirely undefined. With no specified dataset, no concrete deliverables, and milestones listed as "TBD depending upon project," it is impossible for students to execute. Vague agentic frameworks rapidly spiral into infinite loops and API exhaustion.',recommendation:"The Challenge Advisor must immediately select a specific project repository, confirm that the 5-10 GB dataset possesses full documentation, explicitly define the monthly machine learning milestones, and outline a concrete, usable technical artifact for December.",summary:"The project submission is currently undefined, lacking a specified dataset, deliverables, and milestones, which risks infinite execution loops and API exhaustion. To resolve this, the Challenge Advisor must immediately select a specific project repository and verify that the 5-10 GB dataset is fully documented. Additionally, defining explicit monthly machine learning milestones and a concrete technical artifact will provide students with a structured, executable roadmap.",checklist_raw:"",gates:[]},{id:"1061",title:"Meeting Intelligence",org:"Google",advisor:"Vitalii Fedorenko",ml_type:"NLP, LLMs / Generative AI",evaluation:"Conditionally Approved",urgency:"Critical",data_readiness:"Ready",difficulty:"Unscored",domain:"NLP / LLMs",objective:"Build an offline Python pipeline (Colab) that processes pre-recorded meeting audio with Gemini to produce grounded transcripts and summaries. Stretch goals: action item automation and speaker diarization.",metrics:"Offline Python pipeline that summarizes pre-recorded audio via Gemini API.",data_link:"https://ai.google.dev/gemini-api",sep:"Pilot offline audio ingestion and transcript grounding pipeline.",oct:"Build summary generation from transcripts and prompt customization.",nov:"Python summary generation pipeline and structured output reporting.",bottleneck:"Real-time audio streaming, API wrappers, and Chrome extension UI development entirely bypass the core ML curriculum and introduce fatal DevOps debt.",recommendation:"Mandate an offline payload alternative. The team must build a Python pipeline that takes pre-recorded static audio files and outputs a text-based summary via Gemini API.",summary:"Building real-time audio streaming and Chrome extension UIs introduces significant DevOps overhead that detracts from core machine learning learning goals. To resolve this, the project must pivot to an offline payload model using static audio files. The team should focus on developing a Python pipeline that processes pre-recorded audio to generate text summaries using the Gemini API.",checklist_raw:"",gates:[]}];var wo="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIbGNtcwIQAABtbnRyUkdCIFhZWiAH4gADABQACQAOAB1hY3NwTVNGVAAAAABzYXdzY3RybAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWhhbmSdkQA9QICwPUB0LIGepSKOAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAABxjcHJ0AAABDAAAAAx3dHB0AAABGAAAABRyWFlaAAABLAAAABRnWFlaAAABQAAAABRiWFlaAAABVAAAABRyVFJDAAABaAAAAGBnVFJDAAABaAAAAGBiVFJDAAABaAAAAGBkZXNjAAAAAAAAAAV1UkdCAAAAAAAAAAAAAAAAdGV4dAAAAABDQzAAWFlaIAAAAAAAAPNUAAEAAAABFslYWVogAAAAAAAAb6AAADjyAAADj1hZWiAAAAAAAABilgAAt4kAABjaWFlaIAAAAAAAACSgAAAPhQAAtsRjdXJ2AAAAAAAAACoAAAB8APgBnAJ1A4MEyQZOCBIKGAxiDvQRzxT2GGocLiBDJKwpai5+M+s5sz/WRldNNlR2XBdkHWyGdVZ+jYgskjacq6eMstu+mcrH12Xkd/H5////2wBDAAkGBwgHBgkICAgKCgkLDhcPDg0NDhwUFREXIh4jIyEeICAlKjUtJScyKCAgLj8vMjc5PDw8JC1CRkE6RjU7PDn/2wBDAQoKCg4MDhsPDxs5JiAmOTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTk5OTn/wAARCAEsASwDASIAAhEBAxEB/8QAHAABA
